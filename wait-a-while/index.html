    const ffHaloMat = new THREE.SpriteNodeMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });
    ffHaloMat.fog = false;
    ffHaloMat.positionNode = ffAttr.xyz;
    ffHaloMat.scaleNode = vec2(1, 1).mul(max(ffAttr.w.mul(0.05).add(0.16), ffDist.mul(0.009)));
    ffHaloMat.colorNode = ffCol.mul(ffAttr.w.mul(0.34).add(0.03));
    ffHaloMat.opacityNode = texture(ctx.glowTexture).a.mul(0.5);
    const ffCore = new THREE.Sprite(ffCoreMat);
    const ffHalo = new THREE.Sprite(ffHaloMat);
    for (const s of [ffHalo, ffCore]) { s.count = ff.length; s.frustumCulled = false; }
    fireflyGroup = new THREE.Group();
    fireflyGroup.name = 'fireflies';
    fireflyGroup.add(ffHalo, ffCore);
    scene.add(fireflyGroup);
    ctx.objects.fireflies = fireflyGroup;
    let ffClock = 0, cloudClock = 0;
    function updateFireflies(dt) {
      const rm = ctx.reducedMotion;
      ffClock += dt * (rm ? 0.4 : 1);
      const T = ffClock;
      for (let i = 0; i < ff.length; i++) {
        const f = ff[i], w = f.w, p = f.p;
        const x = f.hx + f.A * (0.68 * Math.sin(w[0] * T + p[0]) + 0.32 * Math.sin(w[1] * T + p[1]));
        const z = f.hz + f.A * (0.68 * Math.sin(w[2] * T + p[2]) + 0.32 * Math.sin(w[3] * T + p[3]));
        const y = f.hy + f.Ay * (0.75 * Math.sin(w[4] * T + p[4]) + 0.25 * Math.sin(w[5] * T + p[5]));
        // 一閃一閃：慢慢亮起、慢慢暗下，中間有一段暗暗的
        let glow;
        if (rm) glow = 0.62;
        else {
          const b = 0.5 + 0.5 * Math.sin((ctx.time / f.per) * TAU + f.pph);
          glow = f.base + (1 - f.base) * Math.pow(b, f.sharp);
        }
        const o = i * 4;
        ffData[o] = x; ffData[o + 1] = y; ffData[o + 2] = z; ffData[o + 3] = glow;
      }
      ffBuf.needsUpdate = true;
    }
    updateFireflies(0);

    // =====================================================================
    //  錨點
    // =====================================================================
    ctx.anchors.moon = moonDir.clone().multiplyScalar(MOON_D).add(camera.position);
    ctx.anchors.skyHigh = new THREE.Vector3(0, 30, -40);

    // 減少動態效果：即時切換
    ctx.events.on('reducedmotion', (v) => { uTwinkle.value = v ? 0 : 1; });

    // =====================================================================
    //  每幀
    // =====================================================================
    ctx.onUpdate((t, dt) => {
      const rm = ctx.reducedMotion;
      uTime.value += dt * (rm ? 0.3 : 1);
      // 無限遠的那一層跟著鏡頭
      far.position.copy(camera.position);
      ctx.anchors.moon.copy(moon.position).add(far.position);

      // 雲：整圈非常慢地轉，各自輕輕上下
      cloudClock += dt * (rm ? 0.45 : 1);
      clouds.rotation.y = cloudClock * 0.006;
      for (const c of cloudList) c.mesh.position.y = c.y + Math.sin(cloudClock * c.sp + c.ph) * c.bob;

      // 流星
      if (t >= nextMeteor) {
        const m = launch(false);
        if (m) {
          nextMeteor = t + interval();
          // 偶爾緊跟著第二顆，像流星雨
          if (!rm && mr() < 0.16) pairAt = t + 0.3 + mr() * 0.45;
        } else nextMeteor = t + 1.3 + mr() * 0.8;                     // 這個角度看不到天空，等一下再試
      }
      if (pairAt > 0 && t >= pairAt) { pairAt = -1; launch(false); }
      for (const m of pool) if (m.active) updateMeteor(m, t);

      updateFireflies(dt);
    });
  },
});

// ---------------------------------------------------------------- parts/50-farm.js
// ---- 院子一角：剖面蜂箱（8 隻胖蜜蜂，其中一隻櫻粉色）＋ 雞窩（小章魚・小狐狸 窩在稻草裡睡覺）----
PARTS.push({
  name: 'farm',
  order: 50,
  build(ctx) {
    const { THREE, LAYOUT, PALETTE, toon, glow, shadow, roundedBox, scene } = ctx;
    const TAU = Math.PI * 2;
    const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
    const Z_AXIS = V3(0, 0, 1);

    // ---------------------------------------------------------------------
    //  小工具
    // ---------------------------------------------------------------------
    const ellipsoid = (rx, ry, rz, ws = 20, hs = 14) => new THREE.SphereGeometry(1, ws, hs).scale(rx, ry, rz);
    const add = (parent, geo, mat, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0) => {
      const m = new THREE.Mesh(geo, mat);
      m.position.set(x, y, z);
      m.rotation.set(rx, ry, rz);
      parent.add(m);
      return m;
    };
    // 橢球（半徑 r=[a,b,c]）表面上、方向 d 的點與法線；inset > 0 往裡面陷一點
    const onEllipsoid = (r, d, inset = 0) => {
      const v = V3(...d).normalize();
      const k = 1 / Math.sqrt((v.x / r[0]) ** 2 + (v.y / r[1]) ** 2 + (v.z / r[2]) ** 2);
      const n = V3(v.x / r[0] ** 2, v.y / r[1] ** 2, v.z / r[2] ** 2).normalize();
      return { p: v.multiplyScalar(k).addScaledVector(n, -inset), n };
    };
    // 把幾何體烘進某個位置/朝向（+z 對齊法線 n），之後可以 merge
    const bake = (geo, p, n = null, extraRotZ = 0) => {
      const m = new THREE.Matrix4();
      const q = new THREE.Quaternion();
      if (n) q.setFromUnitVectors(Z_AXIS, n);
      if (extraRotZ) q.multiply(new THREE.Quaternion().setFromAxisAngle(Z_AXIS, extraRotZ));
      m.compose(p, q, V3(1, 1, 1));
      return geo.applyMatrix4(m);
    };
    const merge = (geos) => ctx.BufferGeometryUtils.mergeGeometries(geos, false);
    // 依照前方向與上方向擺正物件（物件的 +z 是頭、+y 是背）
    const _bx = V3(), _by = V3(), _bz = V3(), _bm = new THREE.Matrix4();
    const orient = (obj, fwd, up) => {
      _bz.copy(fwd).normalize();
      _bx.crossVectors(up, _bz).normalize();
      _by.crossVectors(_bz, _bx);
      _bm.makeBasis(_bx, _by, _bz);
      obj.quaternion.setFromRotationMatrix(_bm);
    };
    const smoothstep = (a, b, x) => { const t = ctx.clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };
    // 魚鱗瓦屋頂材質：一列一列的圓瓦，瓦片的圓邊朝 +u（屋簷方向）
    const shingleMat = (bg, c0, c1, c2, rep, emissiveK = 0.1) => {
      const tex = ctx.makeCanvasTexture(256, (g, s) => {
        g.translate(0, s); g.rotate(-Math.PI / 2);   // 先畫「往下排」的瓦，再轉 90°
        g.fillStyle = bg; g.fillRect(0, 0, s, s);
        const rows = 4, cols = 4, rh = s / rows, cw = s / cols;
        for (let r = 0; r < rows; r++) {
          for (let c = -1; c <= cols; c++) {
            const x = c * cw + (r % 2 ? cw / 2 : 0), y = r * rh;
            g.beginPath();
            g.moveTo(x + 3, y);
            g.lineTo(x + cw - 3, y);
            g.lineTo(x + cw - 3, y + rh - cw / 2);
            g.arc(x + cw / 2, y + rh - cw / 2, cw / 2 - 3, 0, Math.PI);
            g.closePath();
            const gr = g.createLinearGradient(0, y, 0, y + rh);
            gr.addColorStop(0, c0); gr.addColorStop(0.75, c1); gr.addColorStop(1, c2);
            g.fillStyle = gr; g.fill();
          }
        }
      });
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(rep[0], rep[1]);
      return new THREE.MeshToonNodeMaterial({
        map: tex, gradientMap: ctx.toonGradient,
        emissive: new THREE.Color(0xffffff), emissiveMap: tex, emissiveIntensity: emissiveK,
      });
    };

    // 夜裡月光偏藍，奶油色會變灰：給一點點自己的顏色當自發光，保住暖色調
    const warm = (c, k = 0.12, e = c) => toon(c, { emissive: e, emissiveIntensity: k });
    // 共用材質
    const M = {
      cream: warm(0xf8e4bb, 0.2),
      honeyPaint: warm(0xf7cd74, 0.16),
      cut: warm(0xf3d09a, 0.18),             // 剖面露出的原木切口
      inner: warm(0xa8744a, 0.16, 0xff9a3a), // 箱子內壁：被蜂巢的光照得暖暖的
      frame: warm(0xdcaa72, 0.16, 0xffa848), // 巢框
      wood: toon(PALETTE.wood),
      woodDark: toon(PALETTE.woodDark),
      woodLight: toon(PALETTE.woodLight),
      trim: warm(0xfbeccc, 0.14),
      dark: toon(0x3a2619),
      eyeHi: glow(0xffffff, 1.0),
      blush: warm(PALETTE.blush, 0.3),
      leaf: toon(0x5d9c5a),
      stem: toon(0x4f8a52),
    };

    // =====================================================================
    //  A. 蜂箱
    // =====================================================================
    const hive = new THREE.Group();
    hive.name = 'hive';
    hive.position.set(LAYOUT.hive.center[0], 0, LAYOUT.hive.center[1]);
    hive.rotation.y = LAYOUT.hive.rotationY;
    scene.add(hive);
    ctx.objects.hive = hive;

    const HV = {
      W: 0.84, D: 0.6, T: 0.045,      // 外寬、外深、板厚
      standTop: 0.30,                 // 木架頂
      floorTop: 0.35,                 // 底板頂（也是伸出去的起降板）
      box1: [0.35, 0.67],             // 下層箱
      box2: [0.67, 0.94],             // 上層箱（淡蜂蜜色）
      frameZ: [0.15, -0.02, -0.19],   // 巢框的 z（最前面那片最靠近剖面）
      combT: 0.024,                   // 巢脾厚度
    };
    const hiveStruct = new THREE.Group();
    hive.add(hiveStruct);

    // ---- 木架（短短四隻腳）----
    {
      const legGeo = roundedBox(0.075, HV.standTop, 0.075, 0.02);
      for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
        add(hiveStruct, legGeo, M.wood, sx * 0.34, HV.standTop / 2, sz * 0.23);
      }
      const railGeo = roundedBox(0.8, 0.05, 0.06, 0.018);
      for (const sz of [-1, 1]) add(hiveStruct, railGeo, M.wood, 0, HV.standTop - 0.025, sz * 0.24);
      const sideGeo = roundedBox(0.06, 0.05, 0.54, 0.018);
      for (const sx of [-1, 1]) add(hiveStruct, sideGeo, M.wood, sx * 0.34, HV.standTop - 0.025, 0);
      // 腳之間的小橫撐
      const braceGeo = roundedBox(0.62, 0.035, 0.04, 0.012);
      add(hiveStruct, braceGeo, M.woodDark, 0, 0.09, 0.23);
    }

    // ---- 底板＋往前伸出的起降板 ----
    {
      const len = HV.D + 0.22;
      const g = new THREE.BoxGeometry(HV.W + 0.02, HV.floorTop - HV.standTop, len);
      const b = new THREE.Mesh(g, [M.cream, M.cream, M.frame, M.cream, M.cream, M.cream]);
      b.position.set(0, (HV.floorTop + HV.standTop) / 2, (len - HV.D) / 2);
      hiveStruct.add(b);
      // 起降板前緣一條蜂蜜色的漆
      add(hiveStruct, new THREE.BoxGeometry(HV.W + 0.03, 0.022, 0.03), M.honeyPaint, 0, HV.floorTop - 0.014, HV.D / 2 + 0.22 - 0.012);
    }

    // ---- 兩層箱子：三面牆（+z 那面被切掉，看得到板子的厚度）----
    const boxWalls = (y0, y1, paint) => {
      const h = y1 - y0, yc = (y0 + y1) / 2;
      const { W, D, T } = HV;
      // BoxGeometry 材質順序：+x, -x, +y, -y, +z, -z
      const sideGeo = new THREE.BoxGeometry(T, h, D);
      const L = new THREE.Mesh(sideGeo, [M.inner, paint, M.cut, M.cut, M.cut, paint]);
      L.position.set(-W / 2 + T / 2, yc, 0);
      const R = new THREE.Mesh(sideGeo, [paint, M.inner, M.cut, M.cut, M.cut, paint]);
      R.position.set(W / 2 - T / 2, yc, 0);
      const backGeo = new THREE.BoxGeometry(W - 2 * T, h, T);
      const B = new THREE.Mesh(backGeo, [paint, paint, M.cut, M.cut, M.inner, paint]);
      B.position.set(0, yc, -D / 2 + T / 2);
      hiveStruct.add(L, R, B);
      // 兩側的提手凹槽
      const handGeo = roundedBox(0.014, 0.04, 0.16, 0.006);
      for (const sx of [-1, 1]) add(hiveStruct, handGeo, M.woodDark, sx * (W / 2 + 0.002), yc + h * 0.12, -0.03);
    };
    boxWalls(HV.box1[0], HV.box1[1], M.cream);
    boxWalls(HV.box2[0], HV.box2[1], M.honeyPaint);

    // ---- 蓋板＋人字屋頂（屋脊沿著 z，正面看得到三角形山牆）----
    {
      const top = HV.box2[1];
      add(hiveStruct, roundedBox(HV.W + 0.08, 0.04, HV.D + 0.1, 0.014), M.cream, 0, top + 0.02, 0.02);
      const run = HV.W / 2 + 0.07, rise = 0.15;
      const slope = Math.atan2(rise, run);
      const slabLen = Math.hypot(run, rise) + 0.02;
      const slabGeo = roundedBox(slabLen, 0.04, HV.D + 0.16, 0.015);
      const baseY = top + 0.04;
      const hiveRoofMat = shingleMat('#7a4428', '#a8603a', '#c47a48', '#d8955c', [1, 2], 0.08);
      for (const s of [-1, 1]) {
        const cx = s * run / 2, cy = baseY + rise / 2;
        add(hiveStruct, slabGeo, hiveRoofMat, cx + s * Math.sin(slope) * 0.02, cy + Math.cos(slope) * 0.02, 0.02, 0, s > 0 ? 0 : Math.PI, -slope);
      }
      // 山牆三角（擠出）
      const tri = new THREE.Shape();
      tri.moveTo(-run + 0.04, 0); tri.lineTo(run - 0.04, 0); tri.lineTo(0, rise - 0.012); tri.closePath();
      const triGeo = new THREE.ExtrudeGeometry(tri, { depth: HV.D + 0.02, bevelEnabled: false });
      triGeo.translate(0, baseY, -HV.D / 2 - 0.01 + 0.02);
      add(hiveStruct, triGeo, M.cream);
      // 屋脊小圓木
      add(hiveStruct, new THREE.CylinderGeometry(0.026, 0.026, HV.D + 0.15, 10).rotateX(Math.PI / 2), M.trim, 0, baseY + rise + 0.028, 0.02);
      // 山牆上的小六角形徽章（微微發光的蜂蜜色）
      const hexGeo = new THREE.CylinderGeometry(0.045, 0.045, 0.012, 6).rotateX(Math.PI / 2).rotateZ(Math.PI / 6);
      add(hiveStruct, hexGeo, toon(0xffc24a, { emissive: 0xffa21a, emissiveIntensity: 0.55 }), 0, baseY + 0.055, HV.D / 2 + 0.04);
      add(hiveStruct, new THREE.CylinderGeometry(0.056, 0.056, 0.008, 6).rotateX(Math.PI / 2).rotateZ(Math.PI / 6), M.woodDark, 0, baseY + 0.055, HV.D / 2 + 0.034);
    }

    // ---- 蜂巢貼圖：金黃色六角格、一些封蓋的格子 ----
    const HT = { w: 1.0, h: 0.5 };                 // 貼圖覆蓋的實際大小（場景單位）
    const honeyTex = (() => {
      const cv = document.createElement('canvas');
      cv.width = 1024; cv.height = 512;
      const g = cv.getContext('2d');
      const rr = ctx.rand(808);
      const R = 19, hw = Math.sqrt(3) * R;          // 尖頂朝上的六角格
      g.fillStyle = '#f9df98';                    // 蠟做的格壁
      g.fillRect(0, 0, cv.width, cv.height);
      const hexPath = (cx, cy, r) => {
        g.beginPath();
        for (let i = 0; i < 6; i++) {
          const a = Math.PI / 6 + (i * Math.PI) / 3;
          const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
          if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
        }
        g.closePath();
      };
      for (let row = -1; row * 1.5 * R < cv.height + R; row++) {
        const cy = row * 1.5 * R;
        const off = (row & 1) ? hw / 2 : 0;
        for (let col = -1; col * hw < cv.width + hw; col++) {
          const cx = col * hw + off;
          // 低頻的「封蓋區」：一塊一塊的
          const n = Math.sin(cx * 0.012 + 1.3) * Math.sin(cy * 0.019 + 0.4) + 0.55 * Math.sin(cx * 0.027 - cy * 0.015 + 2.0);
          const capped = n > 0.62 || rr() < 0.035;
          const empty = !capped && rr() < 0.05;
          hexPath(cx, cy, R - 2.8);
          if (capped) {
            const gr = g.createRadialGradient(cx - 4, cy - 5, 1, cx, cy, R);
            gr.addColorStop(0, '#fff6d6'); gr.addColorStop(0.6, '#fbe3a0'); gr.addColorStop(1, '#eec46a');
            g.fillStyle = gr; g.fill();
          } else if (empty) {
            g.fillStyle = '#b8771f'; g.fill();
          } else {
            const gr = g.createRadialGradient(cx, cy, 1, cx, cy, R);
            gr.addColorStop(0, '#ffbf3c'); gr.addColorStop(0.7, '#f39a1c'); gr.addColorStop(1, '#d97f12');
            g.fillStyle = gr; g.fill();
            // 小小的反光
            g.beginPath(); g.ellipse(cx - 5, cy - 6, 4.2, 2.6, -0.5, 0, TAU);
            g.fillStyle = 'rgba(255,240,190,0.85)'; g.fill();
          }
        }
      }
      const tex = new THREE.CanvasTexture(cv);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 4;
      return tex;
    })();
    const combMat = new THREE.MeshToonNodeMaterial({
      map: honeyTex, gradientMap: ctx.toonGradient,
      emissive: new THREE.Color(0xffffff), emissiveMap: honeyTex, emissiveIntensity: 0.48,
    });

    // 一片巢脾：上緣平、下緣可以是自然垂下的圓弧（看得到後面的巢框）
    const combGeo = (x0, x1, y0, y1, z, lobe, ox, oy) => {
      const s = new THREE.Shape();
      if (lobe) {
        const xm = (x0 + x1) / 2, ya = y0 + (y1 - y0) * lobe;
        s.moveTo(x0, y1); s.lineTo(x1, y1); s.lineTo(x1, ya);
        s.bezierCurveTo(x1, y0 + (ya - y0) * 0.25, xm + (x1 - xm) * 0.6, y0, xm + 0.03, y0);
        s.bezierCurveTo(xm - (xm - x0) * 0.5, y0, x0, y0 + (ya - y0) * 0.35, x0, ya);
        s.closePath();
      } else {
        s.moveTo(x0, y0); s.lineTo(x1, y0); s.lineTo(x1, y1); s.lineTo(x0, y1); s.closePath();
      }
      const geo = new THREE.ExtrudeGeometry(s, { depth: HV.combT, bevelEnabled: false, curveSegments: 12 });
      geo.translate(0, 0, z - HV.combT / 2);
      // 自己算 UV：所有巢脾用同一個比例，六角格大小一致；各片取貼圖的不同區域
      const pos = geo.attributes.position, uv = geo.attributes.uv;
      for (let i = 0; i < pos.count; i++) {
        uv.setXY(i, (pos.getX(i) + 0.36 + ox) / HT.w, (pos.getY(i) - y0 + oy) / HT.h);
      }
      uv.needsUpdate = true;
      return geo;
    };

    // ---- 巢框：上樑、兩側邊條、下樑＋巢脾 ----
    const frameTopGeo = new THREE.BoxGeometry(HV.W - 2 * HV.T - 0.01, 0.024, 0.05);
    const combFront = [];  // 最前面兩片巢脾的表面 z（給蜜蜂爬）
    const combRange = [];  // 每層巢脾的 y 範圍
    [HV.box1, HV.box2].forEach(([yb, yt], bi) => {
      const xIn = HV.W / 2 - HV.T;              // 內壁 x
      const sideX = xIn - 0.016;
      const y0 = yb + 0.038, y1 = yt - 0.028;
      combRange.push([y0, y1]);
      const sideGeo = new THREE.BoxGeometry(0.022, y1 - (yb + 0.022), 0.032);
      const botGeo = new THREE.BoxGeometry(2 * sideX, 0.016, 0.024);
      HV.frameZ.forEach((z, fi) => {
        add(hiveStruct, frameTopGeo, M.frame, 0, yt - 0.016, z);
        for (const sx of [-1, 1]) add(hiveStruct, sideGeo, M.frame, sx * sideX, (y1 + yb + 0.022) / 2, z);
        // 最前面那片下層巢脾是「自然垂下」的圓弧形，所以下樑也省掉（看得到後面）
        const lobe = bi === 0 && fi === 0 ? 0.58 : 0;
        if (!lobe) add(hiveStruct, botGeo, M.frame, 0, yb + 0.03, z);
        const geo = combGeo(-sideX + 0.011, sideX - 0.011, lobe ? y0 - 0.012 : y0, y1, z, lobe, fi * 0.11 + bi * 0.05, bi * 0.2 + fi * 0.02);
        const comb = new THREE.Mesh(geo, combMat);
        hiveStruct.add(comb);
        if (fi === 0) combFront.push(z + HV.combT / 2);
      });
    });
    // 圓弧巢脾下緣垂著的一滴蜂蜜
    {
      const y0 = combRange[0][0] - 0.012;
      const dropMat = glow(0xffa62a, 1.25);
      const drop = add(hive, ellipsoid(0.016, 0.026, 0.014, 12, 10), dropMat, 0.03, y0 - 0.018, HV.frameZ[0] + 0.004);
      add(hive, ellipsoid(0.01, 0.01, 0.01, 8, 6), dropMat, -0.12, y0 + 0.02, HV.frameZ[0] + 0.006);
      drop.userData.baseY = drop.position.y;
      ctx.onUpdate((t) => {
        // 很慢地拉長一點又縮回去
        const k = ctx.reducedMotion ? 0 : 0.5 + 0.5 * Math.sin(t * 0.7);
        drop.scale.set(1, 1 + 0.25 * k, 1);
        drop.position.y = drop.userData.baseY - 0.006 * k;
      });
    }

    // ---- 蜂箱旁邊的小花與一罐蜂蜜 ----
    {
      const flowerSpots = [[0.66, 0.3, 0xffb6c8, 0.24], [0.74, 0.02, 0xfff1c9, 0.3], [-0.66, 0.32, 0xc9b6ff, 0.26], [-0.76, 0.02, 0xffb6c8, 0.2], [0.6, -0.34, 0xc9b6ff, 0.22]];
      const stemGeo = new THREE.CylinderGeometry(0.011, 0.013, 1, 6).translate(0, 0.5, 0);
      const petalGeo = ellipsoid(0.036, 0.013, 0.022, 10, 6).translate(0.034, 0, 0);
      const centerGeo = ellipsoid(0.026, 0.018, 0.026, 10, 8);
      const leafGeo = ellipsoid(0.05, 0.012, 0.022, 10, 6).translate(0.045, 0, 0);
      const centerMat = toon(0xffd34a);
      const fr = ctx.rand(51);
      flowerSpots.forEach(([x, z, col, h]) => {
        const f = new THREE.Group();
        f.position.set(x, 0, z);
        f.rotation.y = fr() * TAU;
        const stem = add(f, stemGeo, M.stem);
        stem.scale.y = h;
        stem.rotation.z = (fr() - 0.5) * 0.15;
        const head = new THREE.Group();
        head.position.set(-Math.sin(stem.rotation.z) * h, h, 0);
        head.rotation.x = 0.35;
        f.add(head);
        add(head, centerGeo, centerMat);
        const pm = toon(col);
        for (let i = 0; i < 5; i++) add(head, petalGeo, pm, 0, -0.004, 0, 0, (i / 5) * TAU, 0.12);
        for (let i = 0; i < 2; i++) add(f, leafGeo, M.leaf, 0, 0.03 + i * 0.03, 0, 0, i * Math.PI + 0.4, 0.4);
        hive.add(f);
        shadow(f);
      });
      // 蜂蜜罐：玻璃罐裡的蜂蜜微微發光，蓋著格子布
      const jar = new THREE.Group();
      jar.position.set(0.56, 0, 0.5);
      jar.rotation.y = -0.4;
      add(jar, new THREE.CylinderGeometry(0.062, 0.058, 0.11, 18), toon(0xf7a93a, { emissive: 0xf08a12, emissiveIntensity: 0.45 }), 0, 0.055, 0);
      add(jar, new THREE.CylinderGeometry(0.066, 0.066, 0.02, 18), toon(0xfff2dc), 0, 0.117, 0);
      add(jar, ellipsoid(0.078, 0.03, 0.078, 16, 8), toon(0xe8685c), 0, 0.128, 0);
      add(jar, new THREE.TorusGeometry(0.066, 0.008, 6, 20).rotateX(Math.PI / 2), toon(0xfff2dc), 0, 0.112, 0);
      // 小標籤
      add(jar, new THREE.CylinderGeometry(0.0635, 0.0635, 0.04, 18, 1, true, -0.7, 1.4), toon(0xfff6e4, { side: THREE.DoubleSide }), 0, 0.055, 0);
      shadow(jar);
      hive.add(jar);
    }
    shadow(hiveStruct);

    // ---------------------------------------------------------------------
    //  蜜蜂：圓滾滾的身體（單位大小，之後縮放），黃色＋深棕條紋，櫻粉色那隻換色
    // ---------------------------------------------------------------------
    const BR = [1, 0.92, 1.15];                     // 身體橢球半徑（頭在 +z）
    const stripeTex = (base, band) => ctx.makeCanvasTexture(128, (g, s) => {
      g.fillStyle = base; g.fillRect(0, 0, s, s);
      g.fillStyle = band;                           // 貼圖上方 = 頭（v = 1），下方 = 尾巴
      for (const [a, b] of [[0.38, 0.5], [0.62, 0.74], [0.87, 1.0]]) g.fillRect(0, a * s, s, (b - a) * s);
    });
    const beeBodyGeo = new THREE.SphereGeometry(1, 28, 20).rotateX(Math.PI / 2).scale(...BR);
    const beeMats = {
      yellow: stripeTex('#ffd23f', '#4a2e1c'),
      pink: stripeTex('#f7a8c4', '#c4577f'),
    };
    // 條紋貼圖同時當自發光貼圖：夜裡也看得出黃色／櫻粉色
    for (const k of ['yellow', 'pink']) {
      const map = beeMats[k];
      beeMats[k] = new THREE.MeshToonNodeMaterial({
        map, gradientMap: ctx.toonGradient,
        emissive: new THREE.Color(0xffffff), emissiveMap: map, emissiveIntensity: k === 'pink' ? 0.36 : 0.34,
      });
    }
    // 深色的小零件（眼睛、觸角、針、嘴）合成一個幾何體
    const beeDarkGeo = (() => {
      const parts = [];
      const eyes = [];
      for (const s of [-1, 1]) {
        const e = onEllipsoid(BR, [s * 0.36, 0.2, 0.91], 0.03);
        eyes.push(e);
        parts.push(bake(ellipsoid(0.13, 0.17, 0.08, 12, 10), e.p, e.n));
        // 觸角
        const base = onEllipsoid(BR, [s * 0.3, 0.8, 0.5], 0.04).p;
        const curve = new THREE.CatmullRomCurve3([
          base.clone(),
          base.clone().add(V3(s * 0.05, 0.3, 0.12)),
          base.clone().add(V3(s * 0.2, 0.5, 0.32)),
        ]);
        parts.push(new THREE.TubeGeometry(curve, 8, 0.045, 6, false));
        parts.push(new THREE.SphereGeometry(0.11, 10, 8).translate(base.x + s * 0.2, base.y + 0.5, base.z + 0.32));
      }
      // 小針
      parts.push(new THREE.ConeGeometry(0.13, 0.3, 10).rotateX(-Math.PI / 2).translate(0, 0.02, -BR[2] - 0.1));
      // 微笑
      const m = onEllipsoid(BR, [0, -0.08, 1], 0.01);
      parts.push(bake(new THREE.TorusGeometry(0.1, 0.026, 6, 12, Math.PI), m.p, m.n, Math.PI));
      return { geo: merge(parts), eyes };
    })();
    const beeHiGeo = merge(beeDarkGeo.eyes.map((e, i) => {
      const p = e.p.clone().addScaledVector(e.n, 0.05).add(V3((i ? 1 : -1) * -0.03, 0.06, 0));
      return new THREE.SphereGeometry(0.045, 8, 6).translate(p.x, p.y, p.z);
    }));
    const beeBlushGeo = merge([-1, 1].map((s) => {
      const b = onEllipsoid(BR, [s * 0.62, -0.1, 0.78], 0.015);
      return bake(ellipsoid(0.16, 0.1, 0.04, 12, 8), b.p, b.n);
    }));
    const wingGeo = [-1, 1].map((s) => ellipsoid(0.62, 0.04, 0.36, 14, 8).translate(s * 0.58, 0, 0));
    const wingMat = toon(0xf4f8ff, { transparent: true, opacity: 0.62, depthWrite: false, emissive: 0xd8e6ff, emissiveIntensity: 0.4 });
    const blushPinkMat = warm(0xf0789f, 0.3);

    const makeBee = (pink, size) => {
      const bee = new THREE.Group();
      const inner = new THREE.Group();
      inner.scale.setScalar(size);
      bee.add(inner);
      const body = add(inner, beeBodyGeo, pink ? beeMats.pink : beeMats.yellow);
      body.castShadow = true; body.receiveShadow = true;
      add(inner, beeDarkGeo.geo, M.dark);
      add(inner, beeHiGeo, M.eyeHi);
      add(inner, beeBlushGeo, pink ? blushPinkMat : M.blush);
      const wings = [-1, 1].map((s, i) => {
        const pivot = new THREE.Group();
        pivot.position.copy(onEllipsoid(BR, [s * 0.28, 0.9, -0.22], 0.02).p);
        const w = add(pivot, wingGeo[i], wingMat);
        w.renderOrder = 2;
        inner.add(pivot);
        return { pivot, s };
      });
      bee.userData = { wings, size, inner };
      hive.add(bee);
      return bee;
    };
    // 翅膀姿勢：raise 抬起、sweep 往後收
    const setWings = (bee, raise, sweep) => {
      for (const { pivot, s } of bee.userData.wings) pivot.rotation.set(0, s * sweep, s * raise);
    };

    // ---- 8 隻蜜蜂的劇本（蜂箱座標）----
    //  comb：在最前面的巢脾上慢慢爬；board：在起降板上踱步；hover：在剖面裡面一點點懸停
    const zc1 = combFront[0], zc2 = combFront[1];
    const [cr1, cr2] = combRange;
    const beeDefs = [
      { kind: 'hover', pink: true, size: 0.086, base: V3(0.0, 0.53, 0.3), yaw: 0.12, ph: 0.0 },          // 櫻粉色：正中間、最前面
      { kind: 'comb', base: V3(-0.23, (cr1[0] + cr1[1]) / 2 + 0.02, zc1), amp: [0.05, 0.035], w: 0.21, ph: 0.5 },
      { kind: 'comb', base: V3(0.22, (cr1[0] + cr1[1]) / 2 + 0.03, zc1), amp: [0.045, 0.03], w: 0.17, ph: 2.1 },
      { kind: 'comb', base: V3(-0.2, (cr2[0] + cr2[1]) / 2, zc2), amp: [0.055, 0.022], w: 0.19, ph: 4.0 },
      { kind: 'comb', base: V3(0.03, (cr2[0] + cr2[1]) / 2 + 0.005, zc2), amp: [0.04, 0.02], w: 0.15, ph: 1.2 },
      { kind: 'hover', base: V3(0.25, 0.84, 0.29), yaw: -0.5, ph: 1.7 },
      { kind: 'board', base: V3(-0.2, HV.floorTop, 0.4), yaw: 0.35, ph: 0.3 },
      { kind: 'board', base: V3(0.2, HV.floorTop, 0.38), yaw: -0.7, ph: 2.6 },
    ];
    const bees = beeDefs.map((d) => {
      const bee = makeBee(!!d.pink, d.size ?? 0.072);
      bee.userData.def = d;
      return bee;
    });
    const pinkBee = bees[0];
    ctx.objects.bees = bees;
    ctx.objects.pinkBee = pinkBee;
    ctx.anchors.pinkBee = V3();

    const _f = V3(), _u = V3(), _tmp = V3();
    const UP = V3(0, 1, 0), OUT = V3(0, 0, 1);
    const updateBees = (t) => {
      const rm = ctx.reducedMotion;
      const speed = rm ? 0.45 : 1;
      for (const bee of bees) {
        const d = bee.userData.def;
        const sz = bee.userData.size;
        const half = BR[1] * sz;               // 身體半高
        if (d.kind === 'comb') {
          // 走走停停：τ 的導數 = w(1 + cos)，會週期性地停下來
          const w = d.w * speed, w2 = w * 1.7;
          const tau = w * t + (w / w2) * Math.sin(w2 * t + d.ph) + d.ph;
          const px = d.amp[0] * Math.sin(tau), py = d.amp[1] * Math.sin(2 * tau + d.ph);
          const dx = d.amp[0] * Math.cos(tau), dy = 2 * d.amp[1] * Math.cos(2 * tau + d.ph);
          const moving = 0.5 + 0.5 * Math.cos(w2 * t + d.ph);
          bee.position.set(d.base.x + px, d.base.y + py, d.base.z + half * 0.82);
          _f.set(dx, dy, 0);
          if (_f.lengthSq() < 1e-8) _f.set(1, 0, 0);
          orient(bee, _f, OUT);
          bee.rotateX(-0.42);                  // 頭抬起來看鏡頭
          bee.rotateZ(Math.sin(t * 9 + d.ph) * 0.07 * moving * (rm ? 0.3 : 1));
          // 偶爾抖一下翅膀
          const buzz = smoothstep(0.86, 0.9, Math.sin(t * 0.55 + d.ph * 3)) * (rm ? 0.3 : 1);
          setWings(bee, 0.18 + buzz * 0.35 * Math.sin(t * (rm ? 6 : 70)), 0.55 - buzz * 0.25);
        } else if (d.kind === 'board') {
          const sway = Math.sin(t * 0.35 * speed + d.ph);
          const yaw = d.yaw + sway * 0.55;
          const step = Math.sin(t * 0.23 * speed + d.ph * 1.3) * 0.035;
          _f.set(Math.sin(yaw), 0, Math.cos(yaw));
          bee.position.set(d.base.x + _f.x * step, d.base.y + half * 0.8, d.base.z + _f.z * step);
          orient(bee, _f, UP);
          const walk = Math.abs(Math.cos(t * 0.23 * speed + d.ph * 1.3));
          bee.rotateZ(Math.sin(t * 7 + d.ph) * 0.06 * walk * (rm ? 0.3 : 1));
          bee.rotateX(-0.1);
          const buzz = smoothstep(0.88, 0.92, Math.sin(t * 0.47 + d.ph * 2)) * (rm ? 0.3 : 1);
          setWings(bee, 0.2 + buzz * 0.4 * Math.sin(t * (rm ? 6 : 70)), 0.5 - buzz * 0.3);
        } else {
          // 懸停：小小的上下浮動＋左右晃
          const a = rm ? 0.35 : 1;
          bee.position.set(
            d.base.x + Math.sin(t * 0.9 + d.ph) * 0.014 * a,
            d.base.y + Math.sin(t * 2.1 + d.ph) * 0.013 * a,
            d.base.z + Math.sin(t * 0.7 + d.ph * 2) * 0.01 * a,
          );
          const yaw = d.yaw + Math.sin(t * 0.6 + d.ph) * 0.3 * a;
          _f.set(Math.sin(yaw), 0, Math.cos(yaw));
          orient(bee, _f, UP);
          bee.rotateX(-0.18 + Math.sin(t * 2.1 + d.ph + 0.8) * 0.05 * a);
          // 翅膀一直快速拍
          const flap = rm ? Math.sin(t * TAU * 1.5 + d.ph) * 0.18 : Math.sin(t * TAU * 17 + d.ph) * 0.55;
          setWings(bee, 0.35 + flap, 0.25);
        }
      }
      pinkBee.getWorldPosition(ctx.anchors.pinkBee);
    };

    // =====================================================================
    //  B. 雞窩
    // =====================================================================
    const coop = new THREE.Group();
    coop.name = 'coop';
    coop.position.set(LAYOUT.coop.center[0], 0, LAYOUT.coop.center[1]);
    coop.rotation.y = LAYOUT.coop.rotationY;
    scene.add(coop);
    ctx.objects.coop = coop;

    const CP = { W: 1.3, D: 0.95, FY: 0.32, WY: 0.92, slope: 0.62 };
    CP.RY = CP.WY + (CP.W / 2) * Math.tan(CP.slope);   // 屋脊高
    const coopStruct = new THREE.Group();
    coop.add(coopStruct);
    const plankMats = [toon(0xb98153), toon(0xa97247), toon(0xc28b5b)];
    const innerDark = toon(0x6b4630);

    // ---- 腳、地板 ----
    {
      const legGeo = roundedBox(0.09, CP.FY - 0.05, 0.09, 0.025);
      for (const sx of [-1, 1]) for (const sz of [-1, 1]) add(coopStruct, legGeo, M.woodDark, sx * 0.57, (CP.FY - 0.05) / 2, sz * 0.39);
      add(coopStruct, roundedBox(CP.W, 0.07, CP.D, 0.02), M.woodDark, 0, CP.FY - 0.035, 0);
    }
    // ---- 牆：直條木板，裡面一層深色的內襯 ----
    {
      const h = CP.WY - CP.FY;
      const n = 5, pw = CP.W / n;
      const backGeo = roundedBox(pw - 0.008, h, 0.05, 0.016);
      for (let i = 0; i < n; i++) add(coopStruct, backGeo, plankMats[i % 3], -CP.W / 2 + pw * (i + 0.5), CP.FY + h / 2, -CP.D / 2 + 0.025);
      const m = 4, sd = (CP.D - 0.06) / m;
      const sideGeo = roundedBox(0.05, h, sd - 0.008, 0.016);
      for (const sx of [-1, 1]) for (let i = 0; i < m; i++) {
        add(coopStruct, sideGeo, plankMats[(i + (sx > 0 ? 1 : 0)) % 3], sx * (CP.W / 2 - 0.025), CP.FY + h / 2, -CP.D / 2 + 0.03 + sd * (i + 0.5));
      }
      // 內襯（深色，讓雞跳出來）
      add(coopStruct, new THREE.BoxGeometry(CP.W - 0.1, h, 0.01), innerDark, 0, CP.FY + h / 2, -CP.D / 2 + 0.056);
      for (const sx of [-1, 1]) add(coopStruct, new THREE.BoxGeometry(0.01, h, CP.D - 0.12), innerDark, sx * (CP.W / 2 - 0.056), CP.FY + h / 2, 0);
      // 內部的「天花板」（山牆底下的橫板），從開口往上看不會看到屋頂裡面
      add(coopStruct, new THREE.BoxGeometry(CP.W - 0.1, 0.02, CP.D - 0.1), innerDark, 0, CP.WY - 0.01, 0);
      // 側牆上的小窗（奶油色窗框＋十字）
      for (const sx of [-1, 1]) {
        const wg = new THREE.Group();
        wg.position.set(sx * (CP.W / 2 + 0.006), CP.FY + h * 0.6, -0.05);
        wg.rotation.y = sx * Math.PI / 2;
        add(wg, roundedBox(0.24, 0.24, 0.025, 0.01), M.trim);
        add(wg, new THREE.BoxGeometry(0.18, 0.18, 0.02), innerDark, 0, 0, 0.006);
        add(wg, new THREE.BoxGeometry(0.02, 0.18, 0.02), M.trim, 0, 0, 0.012);
        add(wg, new THREE.BoxGeometry(0.18, 0.02, 0.02), M.trim, 0, 0, 0.012);
        coopStruct.add(wg);
      }
    }
    // ---- 正面：角柱、門楣、擋稻草的矮板、山牆 ----
    const frontZ = CP.D / 2;
    {
      const h = CP.WY - CP.FY;
      const postGeo = roundedBox(0.09, h + 0.02, 0.09, 0.022);
      for (const sx of [-1, 1]) add(coopStruct, postGeo, M.trim, sx * (CP.W / 2 - 0.045), CP.FY + h / 2, frontZ - 0.045);
      add(coopStruct, roundedBox(CP.W + 0.02, 0.09, 0.09, 0.022), M.trim, 0, CP.WY - 0.01, frontZ - 0.045);
      add(coopStruct, roundedBox(CP.W - 0.16, 0.1, 0.05, 0.018), plankMats[0], 0, CP.FY + 0.05, frontZ - 0.03);
      // 山牆（前後）
      const tri = new THREE.Shape();
      const hw = CP.W / 2;
      tri.moveTo(-hw, 0); tri.lineTo(hw, 0); tri.lineTo(0, CP.RY - CP.WY); tri.closePath();
      const front = new THREE.ExtrudeGeometry(tri, { depth: 0.05, bevelEnabled: false });
      add(coopStruct, front, warm(0xf3dcb0, 0.2), 0, CP.WY + 0.03, frontZ - 0.07);
      add(coopStruct, front, plankMats[1], 0, CP.WY, -CP.D / 2);
    }
    // ---- 屋頂：魚鱗瓦貼圖（磚紅色），白色封簷板，屋脊 ----
    {
      const roofMat = shingleMat('#8f3b33', '#b44c3f', '#c95d4c', '#d9735f', [2, 2], 0.06);
      const over = 0.14, run = CP.W / 2 + over;
      const L = run / Math.cos(CP.slope);
      const depth = CP.D + 0.26;
      const slabGeo = roundedBox(L, 0.06, depth, 0.02);
      for (const s of [-1, 1]) {
        const cx = s * run / 2, cy = CP.RY - (run / 2) * Math.tan(CP.slope);
        const nx = s * Math.sin(CP.slope) * 0.03, ny = Math.cos(CP.slope) * 0.03;
        add(coopStruct, slabGeo, roofMat, cx + nx, cy + ny, 0.03, 0, s > 0 ? 0 : Math.PI, -CP.slope);
        // 封簷板（正面那條白邊）
        add(coopStruct, roundedBox(L, 0.075, 0.04, 0.015), M.trim, cx + nx * 1.6, cy + ny * 1.6 - 0.012, 0.03 + depth / 2 - 0.01, 0, s > 0 ? 0 : Math.PI, -CP.slope);
      }
      add(coopStruct, new THREE.CylinderGeometry(0.05, 0.05, depth + 0.04, 12).rotateX(Math.PI / 2), M.trim, 0, CP.RY + 0.05, 0.03);
    }
    // ---- 斜坡：從門口斜到地上，上面釘著小橫條 ----
    {
      const ramp = new THREE.Group();
      const topY = CP.FY + 0.1, runZ = 0.78;
      const len = Math.hypot(topY, runZ), ang = Math.atan2(topY, runZ);
      ramp.position.set(0.3, topY / 2 + 0.012, frontZ + runZ / 2 - 0.01);
      ramp.rotation.x = ang;
      add(ramp, roundedBox(0.3, 0.03, len, 0.012), plankMats[2]);
      const cleat = roundedBox(0.28, 0.022, 0.03, 0.008);
      for (let i = 0; i < 5; i++) add(ramp, cleat, M.woodDark, 0, 0.022, -len / 2 + 0.1 + i * (len - 0.2) / 4);
      coopStruct.add(ramp);
    }
    // ---- 名牌「小章魚・小狐狸」----
    {
      const NAME = '小章魚・小狐狸';
      const cv = document.createElement('canvas');
      cv.width = 768; cv.height = 176;
      const g = cv.getContext('2d');
      const draw = () => {
        const W = cv.width, H = cv.height;
        g.clearRect(0, 0, W, H);
        const gr = g.createLinearGradient(0, 0, 0, H);
        gr.addColorStop(0, '#ecc28b'); gr.addColorStop(1, '#d9a56b');
        g.fillStyle = gr; g.fillRect(0, 0, W, H);
        // 木紋
        const rr = ctx.rand(77);
        g.strokeStyle = 'rgba(140,85,40,0.22)'; g.lineWidth = 2;
        for (let i = 0; i < 9; i++) {
          const y0 = 12 + rr() * (H - 24);
          g.beginPath(); g.moveTo(0, y0);
          for (let x = 0; x <= W; x += 48) g.lineTo(x, y0 + Math.sin(x * 0.012 + i) * 4);
          g.stroke();
        }
        g.strokeStyle = '#9b6438'; g.lineWidth = 8;
        g.strokeRect(10, 10, W - 20, H - 20);
        // 字：霞鶩文楷，量一下寬度自動縮放
        const family = '"LXGW WenKai TC", "Klee One", "Noto Serif TC", "Songti TC", "WenQuanYi Zen Hei", serif';
        let fs = 104;
        g.font = `400 ${fs}px ${family}`;
        const tw = g.measureText(NAME).width;
        if (tw > W * 0.86) { fs = Math.floor(fs * (W * 0.86) / tw); g.font = `400 ${fs}px ${family}`; }
        g.textAlign = 'center'; g.textBaseline = 'middle';
        g.lineJoin = 'round';
        g.strokeStyle = '#4a2a17'; g.lineWidth = 3;
        g.fillStyle = '#4a2a17';
        g.strokeText(NAME, W / 2, H / 2 + 4);
        g.fillText(NAME, W / 2, H / 2 + 4);
        // 兩顆小釘子
        for (const x of [30, W - 30]) {
          g.beginPath(); g.arc(x, H / 2, 7, 0, TAU); g.fillStyle = '#6d5a4c'; g.fill();
          g.beginPath(); g.arc(x - 2, H / 2 - 2, 2.5, 0, TAU); g.fillStyle = '#cfc2b4'; g.fill();
        }
      };
      draw();
      const tex = new THREE.CanvasTexture(cv);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 4;
      const redraw = () => { draw(); tex.needsUpdate = true; };
      try {
        const fonts = document.fonts;
        if (fonts) {
          fonts.ready?.then(redraw, () => {});
          fonts.load?.('104px "LXGW WenKai TC"', NAME).then(redraw, () => {});
          fonts.addEventListener?.('loadingdone', redraw);
        }
      } catch (e) { /* 沒有 FontFace API 就用後備字型 */ }
      setTimeout(redraw, 1500);
      setTimeout(redraw, 5000);
      const plateW = 0.6, plateH = plateW * cv.height / cv.width;
      const plateMat = new THREE.MeshToonNodeMaterial({
        map: tex, gradientMap: ctx.toonGradient,
        emissive: new THREE.Color(0xffffff), emissiveMap: tex, emissiveIntensity: 0.16,
      });
      const py = CP.WY + 0.14;
      add(coopStruct, roundedBox(plateW + 0.04, plateH + 0.04, 0.03, 0.012), M.woodDark, 0, py, frontZ - 0.008);
      const plate = add(coopStruct, new THREE.PlaneGeometry(plateW, plateH), plateMat, 0, py, frontZ + 0.0085);
      plate.receiveShadow = true;
      ctx.objects.coopPlate = plate;
    }
    shadow(coopStruct);

    // ---- 稻草：鋪在窩裡的一團＋很多根細草（InstancedMesh）----
    const nest = { x: 0, z: -0.02, rx: 0.56, rz: 0.37, h: 0.09 };
    {
      const moundGeo = new THREE.SphereGeometry(1, 18, 10);
      const mr = ctx.rand(31);
      const p = moundGeo.attributes.position;
      for (let i = 0; i < p.count; i++) {
        const k = 1 + (mr() - 0.5) * 0.16;
        p.setXYZ(i, p.getX(i) * k, p.getY(i) * (1 + (mr() - 0.5) * 0.3), p.getZ(i) * k);
      }
      moundGeo.computeVertexNormals();
      moundGeo.scale(nest.rx, nest.h, nest.rz);
      const mound = add(coop, moundGeo, toon(0xe0b95a), nest.x, CP.FY, nest.z);
      mound.receiveShadow = true;

      const strawGeo = new THREE.CylinderGeometry(0.0075, 0.0075, 0.17, 4);
      const N = 340;
      const straw = new THREE.InstancedMesh(strawGeo, toon(0xffffff), N);
      const cols = [0xeac25e, 0xd9ac48, 0xf2d47c, 0xc99a3e].map((c) => new THREE.Color(c));
      const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), pos = V3(), sc = V3(1, 1, 1), dir = V3();
      const sr = ctx.rand(99);
      let i = 0;
      const put = (x, y, z, flat) => {
        const a = sr() * TAU, e = (sr() - 0.5) * (flat ? 0.15 : 0.7);
        dir.set(Math.cos(a) * Math.cos(e), Math.sin(e), Math.sin(a) * Math.cos(e));
        q.setFromUnitVectors(UP, dir);
        pos.set(x, y, z);
        sc.set(1, 0.7 + sr() * 0.6, 1);
        m4.compose(pos, q, sc);
        straw.setMatrixAt(i, m4);
        straw.setColorAt(i, cols[Math.floor(sr() * cols.length)]);
        i++;
      };
      // 窩裡
      while (i < 270) {
        const r = Math.sqrt(sr()), a = sr() * TAU;
        const x = nest.x + Math.cos(a) * r * nest.rx * 1.02, z = nest.z + Math.sin(a) * r * nest.rz * 1.02;
        const k = 1 - ((x - nest.x) / nest.rx) ** 2 - ((z - nest.z) / nest.rz) ** 2;
        const y = CP.FY + nest.h * Math.sqrt(Math.max(0, k)) + 0.004 + sr() * 0.02;
        put(x, y, z, false);
      }
      // 掛在擋板上、掉到地上的
      while (i < 300) put((sr() - 0.5) * 1.0, CP.FY + 0.1 + sr() * 0.01, frontZ - 0.03 + (sr() - 0.5) * 0.06, true);
      while (i < N) {
        const x = (sr() - 0.5) * 1.3, z = frontZ + 0.1 + sr() * 0.75;
        put(x, 0.01, z, true);
      }
      straw.count = i;
      straw.receiveShadow = true;
      coop.add(straw);
    }

    // ---- 小飼料盆 ----
    {
      const bowl = new THREE.Group();
      bowl.position.set(-0.42, 0, frontZ + 0.42);
      add(bowl, new THREE.CylinderGeometry(0.13, 0.1, 0.07, 18), toon(0x9aa7c2), 0, 0.035, 0);
      add(bowl, new THREE.TorusGeometry(0.128, 0.012, 6, 22).rotateX(Math.PI / 2), toon(0xbfc8dc), 0, 0.07, 0);
      const grainGeo = new THREE.CylinderGeometry(0.115, 0.115, 0.02, 18);
      add(bowl, grainGeo, toon(0xe8c45a), 0, 0.062, 0);
      const gr = ctx.rand(12);
      const seedGeo = ellipsoid(0.014, 0.01, 0.014, 6, 4);
      const seedMat = toon(0xd9a63a);
      for (let k = 0; k < 9; k++) {
        const a = gr() * TAU, r = gr() * 0.09;
        add(bowl, seedGeo, seedMat, Math.cos(a) * r, 0.074, Math.sin(a) * r);
      }
      shadow(bowl);
      coop.add(bowl);
    }

    // ---------------------------------------------------------------------
    //  母雞（睡著了）：圓胖的身體、紅雞冠、橘色小嘴、閉著的弧形眼睛
    // ---------------------------------------------------------------------
    const HEN_BODY = [0.21, 0.18, 0.245];
    const HEAD_R = 0.112;
    const eyeArcGeo = new THREE.TorusGeometry(0.024, 0.0068, 6, 14, Math.PI);
    const henRed = toon(0xe0473c);
    const beakMat = toon(0xf6a23a);
    const eyeLineMat = toon(0x3a2620);
    const makeHen = (cols, side) => {
      const hm = (c) => warm(c, cols.warmK);
      const hen = new THREE.Group();
      const torso = new THREE.Group();          // 呼吸的時候縮放這層
      hen.add(torso);
      const body = add(torso, ellipsoid(...HEN_BODY, 28, 20), hm(cols.body), 0, 0.16, 0, 0.1, 0, 0);
      // 胸口一團比較淺的毛
      add(torso, ellipsoid(0.15, 0.12, 0.1, 18, 12), hm(cols.chest), 0, 0.14, 0.17, 0.2, 0, 0);
      // 翅膀
      for (const s of [-1, 1]) {
        add(torso, ellipsoid(0.06, 0.12, 0.17, 16, 12), hm(cols.wing), s * 0.178, 0.17, -0.03, 0.18, s * 0.12, -s * 0.16);
      }
      // 尾巴：三片圓圓的羽毛往後翹
      const tailMat = hm(cols.tail);
      [[-0.06, 0.29, -0.2, 0.35, 0.1], [0.0, 0.32, -0.215, 0, 0.125], [0.06, 0.29, -0.2, -0.35, 0.1]].forEach(([x, y, z, rz, h]) => {
        add(torso, ellipsoid(0.042, h, 0.05, 12, 10), tailMat, x, y, z, -0.55, 0, rz);
      });
      // 頭：從脖子那裡轉（點頭）
      const neck = new THREE.Group();
      neck.position.set(0, 0.22, 0.14);
      torso.add(neck);
      const head = new THREE.Group();
      head.position.set(0, 0.045, 0.07);
      neck.add(head);
      add(head, new THREE.SphereGeometry(HEAD_R, 24, 18), hm(cols.head));
      // 雞冠：三顆圓球排成一排
      [[0.05, 0.098, 0.026], [0.005, 0.118, 0.034], [-0.04, 0.1, 0.027]].forEach(([z, y, r]) => add(head, new THREE.SphereGeometry(r, 12, 10), henRed, 0, y, z));
      // 嘴（往下垂一點）
      add(head, new THREE.ConeGeometry(0.027, 0.06, 10).rotateX(Math.PI / 2), beakMat, 0, -0.012, HEAD_R + 0.018, 0.25, 0, 0);
      // 肉垂
      for (const s of [-1, 1]) add(head, ellipsoid(0.016, 0.026, 0.014, 10, 8), henRed, s * 0.013, -0.06, HEAD_R - 0.02);
      // 閉著的眼睛（往下彎的弧）＋腮紅
      for (const s of [-1, 1]) {
        const e = onEllipsoid([HEAD_R, HEAD_R, HEAD_R], [s * 0.52, 0.2, 0.83], -0.002);
        const eye = new THREE.Mesh(eyeArcGeo, eyeLineMat);
        eye.position.copy(e.p);
        eye.quaternion.setFromUnitVectors(Z_AXIS, e.n);
        eye.rotateZ(Math.PI);
        head.add(eye);
        const b = onEllipsoid([HEAD_R, HEAD_R, HEAD_R], [s * 0.62, -0.12, 0.76], 0.004);
        const bl = new THREE.Mesh(ellipsoid(0.026, 0.016, 0.007, 12, 8), M.blush);
        bl.position.copy(b.p);
        bl.quaternion.setFromUnitVectors(Z_AXIS, b.n);
        head.add(bl);
      }
      // 頭往旁邊那隻歪一點（依偎在一起）
      neck.rotation.z = side * 0.2;
      shadow(hen);
      hen.userData = { torso, neck, body };
      return hen;
    };
    const chickA = makeHen({ body: 0xfff0d4, chest: 0xfff8ea, wing: 0xf2dcb4, tail: 0xf6e2bc, head: 0xfff3dc, warmK: 0.22 }, -1); // 小章魚：奶油白
    const chickB = makeHen({ body: 0xcc6a38, chest: 0xe0905a, wing: 0xa8532b, tail: 0x86401f, head: 0xd47643, warmK: 0.1 }, 1);    // 小狐狸：狐狸橘棕
    chickA.position.set(-0.2, CP.FY + 0.015, 0.03);
    chickA.rotation.y = 0.24;
    chickB.position.set(0.2, CP.FY + 0.015, 0.03);
    chickB.rotation.y = -0.24;
    coop.add(chickA, chickB);
    chickA.name = '小章魚'; chickB.name = '小狐狸';
    ctx.objects.chickens = { 小章魚: chickA, 小狐狸: chickB };

    coop.updateMatrixWorld(true);
    hive.updateMatrixWorld(true);
    ctx.anchors.hive = hive.localToWorld(V3(0, 0.65, 0.1));
    ctx.anchors.coop = coop.localToWorld(V3(0, 0.7, 0));
    ctx.anchors.chickens = coop.localToWorld(V3(0, CP.FY + 0.26, 0.1));

    const hens = [
      { hen: chickA, ph: 0.0, nodAt: 0.0 },
      { hen: chickB, ph: 1.9, nodAt: 4.6 },
    ];
    const NOD_CYCLE = 9.2, NOD_LEN = 2.6;
    const updateHens = (t) => {
      const rm = ctx.reducedMotion;
      for (const h of hens) {
        const { torso, neck } = h.hen.userData;
        // 呼吸：慢慢鼓起來又消下去
        const s = Math.sin((t / (rm ? 4.6 : 3.4)) * TAU + h.ph);
        const a = rm ? 0.5 : 1;
        torso.scale.set(1 + 0.014 * s * a, 1 + 0.03 * s * a, 1 + 0.014 * s * a);
        // 打瞌睡點頭：輪流，一次一隻
        const u = ((t - h.nodAt) % NOD_CYCLE + NOD_CYCLE) % NOD_CYCLE;
        let nod = 0;
        if (u < NOD_LEN) {
          const k = u / NOD_LEN;
          nod = k < 0.35 ? EASEo(k / 0.35) : 1 - ctx.EASE.inOutSine((k - 0.35) / 0.65);
        }
        neck.rotation.x = nod * (rm ? 0.12 : 0.3) + 0.02 * s;
      }
    };
    function EASEo(k) { return ctx.EASE.outCubic(k); }

    ctx.onUpdate((t) => {
      updateBees(t);
      updateHens(t);
    });
    updateBees(0);
    updateHens(0);
  },
});

// ---------------------------------------------------------------- parts/60-tapir.js
// ---- 霧脊貘「膽小純情男大」：趴在草地上的圓滾滾小貘 ----
//  局部座標：原點 = 身體正下方的地面，+z = 臉朝的方向，+x = 牠的左手邊（導演的 3/4 鏡頭從這一側拍），+y 向上。
//  層級：root → 身體（呼吸）、脖子 → neck 樞紐（轉頭／低頭）→ head → 臉、耳朵、鼻子；root → 腳、尾巴、接觸陰影
//  背上的霧帶畫在毛的材質裡（attribute mist + TSL），會沿著背脊慢慢流動。可以發 'tapir:shy' 事件讓牠害羞一次。
//  尾巴繞到左後方、平放在草地上，尾巴尖是白色的（從 3/4 正面鏡頭也看得到）。
//  被鏡頭靠近時：先抬頭看一眼，然後害羞地低頭、把臉轉開、臉頰更紅，過一會兒又偷偷轉回來。
PARTS.push({
  name: 'tapir',
  order: 60,
  build(ctx) {
    const { THREE, TSL, LAYOUT, EASE, clamp01, toon, shadow, scene, camera } = ctx;
    const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
    const UP = V3(0, 1, 0);
    const rnd = ctx.rand(6060);
    const lerp = (a, b, k) => a + (b - a) * k;

    // ---- 顏色：深灰棕的身體、背上一道淡淡的霧、白色的尾巴尖 ----
    const COL = {
      body: 0x86705f, belly: 0x5f4f49, leg: 0x806a5d, nail: 0xd2c4b8,
      mist: 0xe4e6ee, nose: 0x5e4b45, earRim: 0xe2e4ec, earIn: 0xb08e8c,
      eye: 0x17121a, brow: 0xd4d8e2, blush: 0xff9aa6, tip: 0xffffff,
    };
    const C = (hex) => new THREE.Color(hex);
    const cBody = C(COL.body), cBelly = C(COL.belly), cMist = C(COL.mist);
    const cNose = C(COL.nose), cTip = C(COL.tip);

    // 夜裡深色的毛會糊成一團：加一圈淡淡的藍色邊光（菲涅耳），輪廓才讀得出來
    const { float, vec3, vec4, dot, max, mix, sin, normalView, positionViewDirection, positionLocal, vertexColor, smoothstep, attribute, uniform } = TSL;
    const fres = float(1).sub(max(dot(normalView, positionViewDirection), 0)).pow(3.0);
    const rim = vec3(0.035, 0.045, 0.095).mul(fres);
    // 霧帶：每個頂點帶一個「離背脊多近」的值（attribute mist），在著色器裡用會慢慢移動的波去切邊，
    // 霧的邊緣就會像真的霧一樣，沿著背脊慢慢地流動
    const mistTime = uniform(0);
    const mc = new THREE.Color(COL.mist);
    const mistRaw = attribute('mist', 'float');
    const pl = positionLocal;
    const drift = sin(pl.z.mul(7.0).sub(mistTime.mul(0.8)).add(pl.x.mul(3.0)).add(sin(pl.z.mul(15.0).add(mistTime.mul(0.45))).mul(0.7)));
    const mistMask = smoothstep(0.28, 0.95, mistRaw.add(drift.mul(0.12))).mul(0.82);

    const M = {
      // 身體、頭、腳都用頂點色（霧帶、肚子深淺都畫在頂點上）
      fur: toon(0xffffff, { cache: false }),
      tail: toon(0xffffff, { cache: false }),
      nail: toon(COL.nail),
      earRim: toon(COL.earRim),
      earIn: toon(COL.earIn),
      eye: toon(COL.eye),
      shine: ctx.glow(0xffffff, 0.95),
      brow: toon(COL.brow),
      blush: toon(COL.blush, { emissive: COL.blush, emissiveIntensity: 0.22, cache: false }),
      shadow: new THREE.MeshBasicNodeMaterial({ color: 0x080a18, map: ctx.glowTexture, transparent: true, opacity: 0.42, depthWrite: false }),
    };
    M.fur.colorNode = vec4(mix(vertexColor().rgb, vec3(mc.r, mc.g, mc.b), mistMask), 1);
    M.fur.emissiveNode = rim.add(vec3(0.05, 0.055, 0.075).mul(mistMask));   // 霧自己帶一點點微光
    M.tail.vertexColors = true;
    // 尾巴尖（頂點色接近白色的地方）自己亮一點點，夜裡一眼就看得到，但不會過曝
    M.tail.emissiveNode = rim.add(vec3(0.62, 0.66, 0.78).mul(smoothstep(0.45, 0.9, vertexColor().r)).mul(0.2));
    M.shadow.polygonOffset = true; M.shadow.polygonOffsetFactor = -2; M.shadow.polygonOffsetUnits = -2;

    // ---------------------------------------------------------------------
    //  幾何小工具
    // ---------------------------------------------------------------------
    // 給幾何體加上頂點色與霧值：fn(ux, uy, uz, color) 用「變形前的單位球座標」決定顏色，回傳霧值（0..1，可省略）
    function paint(geo, unit, fn) {
      const n = geo.attributes.position.count;
      const col = new Float32Array(n * 3), mist = new Float32Array(n);
      const c = new THREE.Color();
      for (let i = 0; i < n; i++) {
        mist[i] = fn(unit[i * 3], unit[i * 3 + 1], unit[i * 3 + 2], c) || 0;
        col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
      }
      geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
      geo.setAttribute('mist', new THREE.BufferAttribute(mist, 1));
    }
    const flat = (hex) => { const c0 = C(hex); return (ux, uy, uz, c) => { c.copy(c0); return 0; }; };

    // 從單位球變形出一個圓滾滾的形狀；回傳焊好接縫、算好法線的幾何體
    function blob(def, colorFn, ws = 48, hs = 32) {
      const g = new THREE.SphereGeometry(1, ws, hs);
      g.deleteAttribute('normal'); g.deleteAttribute('uv');
      const pos = g.attributes.position;
      const unit = new Float32Array(pos.array);
      const p = new THREE.Vector3();
      for (let i = 0; i < pos.count; i++) {
        def(unit[i * 3], unit[i * 3 + 1], unit[i * 3 + 2], p);
        pos.setXYZ(i, p.x, p.y, p.z);
      }
      paint(g, unit, colorFn);
      const merged = ctx.BufferGeometryUtils.mergeVertices(g, 1e-4);
      merged.computeVertexNormals();
      return merged;
    }

    // 變形後表面上的一點與法線（臉上的五官、耳朵用）
    function surf(def, dx, dy, dz) {
      const d = V3(dx, dy, dz).normalize();
      const p = new THREE.Vector3(); def(d.x, d.y, d.z, p);
      const t1 = new THREE.Vector3().crossVectors(d, Math.abs(d.y) < 0.9 ? UP : V3(1, 0, 0)).normalize();
      const t2 = new THREE.Vector3().crossVectors(d, t1);
      const a = new THREE.Vector3(), b = new THREE.Vector3();
      const e = 0.01;
      const d1 = d.clone().addScaledVector(t1, e).normalize(); def(d1.x, d1.y, d1.z, a);
      const d2 = d.clone().addScaledVector(t2, e).normalize(); def(d2.x, d2.y, d2.z, b);
      const n = new THREE.Vector3().crossVectors(a.sub(p), b.sub(p)).normalize();
      if (n.dot(p) < 0) n.negate();
      return { p, n };
    }

    // 把扁扁的小東西（眼睛、腮紅、眉毛）貼在表面上：局部 z = 法線，局部 x = 水平切線
    const _m4 = new THREE.Matrix4();
    function placeOn(obj, p, n, roll = 0, embed = 0) {
      const z = n.clone().normalize();
      const x = new THREE.Vector3().crossVectors(UP, z);
      if (x.lengthSq() < 1e-5) x.set(1, 0, 0);
      x.normalize();
      const y = new THREE.Vector3().crossVectors(z, x);
      obj.quaternion.setFromRotationMatrix(_m4.makeBasis(x, y, z));
      if (roll) obj.rotateZ(roll);
      obj.position.copy(p).addScaledVector(z, embed);
      return obj;
    }

    /**
     * 沿著曲線掃出的圓管，半徑可變，尾端收成圓頭（capLen > 1 是有點尖的毛筆頭）。
     * 頂點直接寫進既有的陣列，可以每幀更新（尾巴擺動、鼻子嗅一嗅）。
     */
    function makeTube({ points, segs, radial, capSegs, capLen = 1, radius, color }) {
      const rings = segs + 1 + capSegs, vpr = radial + 1, count = rings * vpr;
      const pos = new Float32Array(count * 3), nor = new Float32Array(count * 3), col = new Float32Array(count * 3);
      const index = [];
      for (let i = 0; i < rings - 1; i++) {
        for (let j = 0; j < radial; j++) {
          const a = i * vpr + j, b = a + vpr, c = b + 1, d = a + 1;
          index.push(a, d, b, b, d, c);
        }
      }
      const geo = new THREE.BufferGeometry();
      geo.setIndex(index);
      const pa = new THREE.BufferAttribute(pos, 3).setUsage(THREE.DynamicDrawUsage);
      const na = new THREE.BufferAttribute(nor, 3).setUsage(THREE.DynamicDrawUsage);
      geo.setAttribute('position', pa);
      geo.setAttribute('normal', na);
      const tc = new THREE.Color();
      for (let i = 0; i < rings; i++) {
        color(i <= segs ? i / segs : 1, tc);
        for (let j = 0; j <= radial; j++) { const k = (i * vpr + j) * 3; col[k] = tc.r; col[k + 1] = tc.g; col[k + 2] = tc.b; }
      }
      geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
      geo.setAttribute('mist', new THREE.BufferAttribute(new Float32Array(count), 1));
      const curve = new THREE.CatmullRomCurve3(points.map((p) => p.clone()), false, 'centripetal');
      const P = new THREE.Vector3(), T = new THREE.Vector3(), N = new THREE.Vector3(), B = new THREE.Vector3(), R = new THREE.Vector3();
      function update() {
        curve.updateArcLengths();
        curve.getTangentAt(0, T);
        N.copy(Math.abs(T.y) > 0.9 ? V3(1, 0, 0) : UP);
        N.crossVectors(T, N).normalize();
        let endR = 0;
        for (let i = 0; i < rings; i++) {
          let r, ca = 1, sa = 0;
          if (i <= segs) {
            const s = i / segs;
            curve.getPointAt(s, P); curve.getTangentAt(s, T);
            N.addScaledVector(T, -N.dot(T)).normalize();  // 近似平行移動，管子不會扭
            r = radius(s); endR = r;
          } else {
            const a = ((i - segs) / capSegs) * Math.PI / 2;
            ca = Math.cos(a); sa = Math.sin(a);
            r = endR * ca;
          }
          B.crossVectors(T, N);
          const off = i > segs ? endR * capLen * sa : 0;
          for (let j = 0; j <= radial; j++) {
            const th = (j / radial) * Math.PI * 2;
            const c = Math.cos(th), s = Math.sin(th);
            R.set(N.x * c + B.x * s, N.y * c + B.y * s, N.z * c + B.z * s);
            const k = (i * vpr + j) * 3;
            pos[k] = P.x + T.x * off + R.x * r;
            pos[k + 1] = P.y + T.y * off + R.y * r;
            pos[k + 2] = P.z + T.z * off + R.z * r;
            let nx = R.x, ny = R.y, nz = R.z;
            if (i > segs) {
              nx = R.x * ca + (T.x * sa) / capLen; ny = R.y * ca + (T.y * sa) / capLen; nz = R.z * ca + (T.z * sa) / capLen;
              const l = Math.hypot(nx, ny, nz) || 1; nx /= l; ny /= l; nz /= l;
            }
            nor[k] = nx; nor[k + 1] = ny; nor[k + 2] = nz;
          }
        }
        pa.needsUpdate = true; na.needsUpdate = true;
      }
      update();
      geo.computeBoundingSphere();
      geo.boundingSphere.radius += 0.35;  // 之後會擺動，包圍球放大一點
      return { geo, curve, update };
    }

    // ---------------------------------------------------------------------
    //  整體
    // ---------------------------------------------------------------------
    const T0 = LAYOUT.tapir;
    const root = new THREE.Group();
    root.name = 'tapir';
    root.position.set(T0.center[0], 0, T0.center[1]);
    root.rotation.y = T0.rotationY;
    scene.add(root);

    // 背上的霧帶：截面上越靠近背脊值越大（0..1），邊緣用幾個正弦波弄得像飄過山脊的霧
    function ridge(ux, uy, uz, seed, e0 = 0.5) {
      const c = uy / Math.sqrt(ux * ux + uy * uy + 1e-6);
      const wob = 0.06 * Math.sin(uz * 8.5 + seed) + 0.035 * Math.sin(uz * 19 + seed * 2.1) + 0.02 * Math.sin(ux * 11 + uz * 6 + seed);
      return smoothNum(e0, 1.02, c + wob);
    }
    function smoothNum(a, b, x) { const k = clamp01((x - a) / (b - a)); return k * k * (3 - 2 * k); }

    // ---- 身體：圓桶形，屁股比肩膀寬也高一點，兩側後下方鼓出大腿肉，底下壓扁貼地 ----
    const BODY = { cy: 0.38, cz: -0.12, rx: 0.44, ry: 0.37, rz: 0.68 };
    function bodyDef(ux, uy, uz, out) {
      const back = Math.max(0, -uz), front = Math.max(0, uz);
      const rx = BODY.rx * (1 + 0.12 * back - 0.14 * front * front) * (1 + 0.10 * Math.max(0, -uy));
      const ry = BODY.ry * (1 + 0.10 * back - 0.06 * front);
      let x = ux * rx, y = uy * ry;
      const z = uz * BODY.rz;
      y += 0.06 * back * Math.max(0, uy);                  // 貘的背線：屁股圓圓地翹高一點
      const hw = Math.exp(-(((uz + 0.40) / 0.30) ** 2) - (((uy + 0.18) / 0.40) ** 2)) * ux * ux;
      x += Math.sign(ux) * 0.13 * hw; y += 0.02 * hw;      // 後腿收在身側的大腿肉
      y += BODY.cy;
      if (y < 0.15) y = 0.15 - (0.15 - y) * 0.22;           // 趴著：肚子壓扁在草地上
      out.set(x, y, z + BODY.cz);
    }
    const bodyGeo = blob(bodyDef, (ux, uy, uz, c) => {
      c.copy(cBody).lerp(cBelly, smoothNum(0.0, -0.75, uy) * 0.75);
      return ridge(ux, uy, uz, 0.6, 0.6) * smoothNum(0.98, 0.84, Math.abs(uz));
    }, 56, 40);
    bodyGeo.computeBoundingBox();
    const lift = -bodyGeo.boundingBox.min.y - 0.012;       // 讓肚子剛好貼地（稍微陷進草裡一點點）
    bodyGeo.translate(0, lift, 0);
    const body = new THREE.Mesh(bodyGeo, M.fur);
    root.add(body);

    // ---- 脖子：把頭和身體接起來的一團 ----
    const neckGeo = blob((ux, uy, uz, out) => out.set(ux * 0.26, uy * 0.2 + 0.4, uz * 0.25 + 0.42), (ux, uy, uz, c) => {
      c.copy(cBody).lerp(cBelly, smoothNum(0.0, -0.8, uy) * 0.6);
      return ridge(ux, uy, uz, 1.7, 0.6);
    }, 32, 20);
    const neckBlob = new THREE.Mesh(neckGeo, M.fur);
    root.add(neckBlob);

    // ---- 頭：大大圓圓的（動森比例），前面收窄往下垂，接一個短短的、會動的鼻子 ----
    const HEAD = { rx: 0.33, ry: 0.31, rz: 0.37 };
    function headDef(ux, uy, uz, out) {
      const front = Math.max(0, uz), f2 = front * front;
      const rx = HEAD.rx * (1 - 0.30 * f2) * (1 + 0.07 * Math.max(0, -uy));
      const ry = HEAD.ry * (1 - 0.17 * f2);
      out.set(ux * rx, uy * ry - 0.06 * f2, uz * HEAD.rz);   // 臉往前收窄、往下斜，接到鼻子
    }
    const neck = new THREE.Group();           // 轉頭／低頭的樞紐
    neck.position.set(0, 0.43, 0.36);
    neck.rotation.order = 'YXZ';
    root.add(neck);
    const head = new THREE.Group();
    head.position.set(0, 0.19, 0.30);         // 頭的中心大約在 (0, 0.62, 0.66)
    neck.add(head);
    const headGeo = blob(headDef, (ux, uy, uz, c) => {
      c.copy(cBody).lerp(cBelly, smoothNum(0.1, -0.8, uy) * 0.55);
      c.lerp(cNose, smoothNum(0.55, 0.95, uz) * smoothNum(0.2, -0.3, uy) * 0.6);     // 嘴鼻那一塊深一點
      // 霧帶從背上延伸到頭頂（兩隻耳朵中間），往臉的方向淡掉
      return ridge(ux, uy, uz, 2.9, 0.62) * smoothNum(0.3, -0.4, uz);
    }, 44, 30);
    head.add(new THREE.Mesh(headGeo, M.fur));

    // 鼻子（貘的短象鼻）：從臉的前下方稍微往前、再往下垂，末端圓圓的、顏色深一點
    const TRUNK_REST = [V3(0, -0.07, 0.25), V3(0, -0.08, 0.35), V3(0, -0.12, 0.425), V3(0, -0.19, 0.455)];
    const trunk = makeTube({
      points: TRUNK_REST, segs: 14, radial: 16, capSegs: 5, capLen: 0.6,
      radius: (s) => lerp(0.1, 0.076, smoothNum(0, 0.8, s)) + 0.008 * smoothNum(0.75, 1, s),
      color: (s, c) => c.copy(cBody).lerp(cNose, 0.35 + 0.65 * smoothNum(0.5, 0.95, s)),
    });
    const trunkMesh = new THREE.Mesh(trunk.geo, M.fur);
    head.add(trunkMesh);
    // 鼻孔：鼻尖上兩個小點
    const nostrilGeo = new THREE.SphereGeometry(1, 10, 8).scale(0.013, 0.017, 0.008);
    const nostrils = [-1, 1].map(() => { const m = new THREE.Mesh(nostrilGeo, M.eye); head.add(m); return m; });

    // 眼睛：小小的豆豆眼，放得低一點、靠前一點（比較可愛）
    const eyeGeo = new THREE.SphereGeometry(1, 16, 12).scale(0.041, 0.053, 0.022);
    const shineGeo = new THREE.SphereGeometry(0.012, 8, 6);
    const browGeo = new THREE.CapsuleGeometry(0.009, 0.03, 3, 6).rotateZ(Math.PI / 2);
    const eyes = [];
    for (const sx of [1, -1]) {
      const { p, n } = surf(headDef, 0.42 * sx, 0.24, 0.87);
      const eye = placeOn(new THREE.Group(), p, n, 0, -0.004);
      eye.add(new THREE.Mesh(eyeGeo, M.eye));
      const sh = new THREE.Mesh(shineGeo, M.shine);
      sh.position.set(0.011 * sx, 0.019, 0.018);
      eye.add(sh);
      head.add(eye);
      eyes.push(eye);
      // 八字眉：內側高一點，看起來有點不安（膽小）
      const b = surf(headDef, 0.38 * sx, 0.5, 0.78);
      head.add(placeOn(new THREE.Mesh(browGeo, M.brow), b.p, b.n, -sx * 0.42, 0.003));
    }
    // 腮紅（純情）：害羞的時候會更紅、更大一點
    const blushGeo = new THREE.SphereGeometry(1, 16, 10).scale(0.066, 0.04, 0.014);
    const blushes = [];
    for (const sx of [1, -1]) {
      const { p, n } = surf(headDef, 0.7 * sx, -0.08, 0.68);
      const bl = placeOn(new THREE.Mesh(blushGeo, M.blush), p, n, -sx * 0.12, 0.0);
      head.add(bl);
      blushes.push(bl);
    }

    // 耳朵：小小的橢圓形、直直立著，外圈淡灰色（像貘耳朵的白邊），內側帶一點粉
    const earRimGeo = new THREE.SphereGeometry(1, 18, 12).scale(0.068, 0.105, 0.03).translate(0, 0.08, 0);
    const earInGeo = new THREE.SphereGeometry(1, 16, 10).scale(0.043, 0.072, 0.018).translate(0, 0.078, 0.017);
    const ears = [];
    for (const sx of [1, -1]) {
      const { p, n } = surf(headDef, 0.5 * sx, 0.8, -0.2);
      const base = new THREE.Group();
      // 耳朵的「上」= 頭的表面法線，「前」= 往前、往外一點
      const yAx = n.clone().normalize();
      const face = V3(0.45 * sx, 0, 1).normalize();
      const zAx = face.addScaledVector(yAx, -face.dot(yAx)).normalize();
      const xAx = new THREE.Vector3().crossVectors(yAx, zAx);
      base.quaternion.setFromRotationMatrix(_m4.makeBasis(xAx, yAx, zAx));
      base.position.copy(p).addScaledVector(yAx, -0.02);
      const flap = new THREE.Group();
      flap.rotation.z = -sx * 0.18;                           // 微微往外打開
      flap.add(new THREE.Mesh(earRimGeo, M.earRim), new THREE.Mesh(earInGeo, M.earIn));
      base.add(flap);
      head.add(base);
      ears.push({ flap, sx, rest: flap.rotation.z, twitch: -99 });
    }

    // ---- 腳：短短胖胖的。前腳收在胸口下面只露出腳掌，後腳收在大腿肉旁邊；腳尖有三顆淡色的小蹄甲 ----
    const fur = (geo, hex) => { paint(geo, new Float32Array(geo.attributes.position.count * 3), flat(hex)); return new THREE.Mesh(geo, M.fur); };
    const nailGeo = new THREE.SphereGeometry(1, 10, 8).scale(0.3, 0.24, 0.26);
    const legs = [];
    function leg(x, y, z, r, len, yaw) {
      const g = new THREE.Group();
      const m = fur(new THREE.CapsuleGeometry(r, len, 5, 14).rotateX(Math.PI / 2), COL.leg);
      g.add(m);
      for (const k of [-1, 0, 1]) {
        const a = k * 0.55;
        const n = new THREE.Mesh(nailGeo, M.nail);
        n.scale.setScalar(r);
        n.position.set(Math.sin(a) * r * 0.82, -r * 0.42, len / 2 + Math.cos(a) * r * 0.82);
        n.rotation.y = a;
        g.add(n);
      }
      g.position.set(x, y, z);
      g.rotation.y = yaw;
      root.add(g);
      legs.push(g);
      return g;
    }
    leg(0.17, 0.095, 0.62, 0.1, 0.1, 0.1);
    leg(-0.17, 0.095, 0.62, 0.1, 0.1, -0.1);
    leg(0.455, 0.075, -0.06, 0.078, 0.05, 0.28);
    leg(-0.455, 0.075, -0.06, 0.078, 0.05, -0.28);

    // ---- 尾巴：比真的貘長一點，從屁股垂下來、彎到左後方平放在草地上，尾巴尖是一撮白毛 ----
    const TAIL_REST = [V3(0.05, 0.3, -0.74), V3(0.16, 0.13, -0.9), V3(0.38, 0.078, -0.98), V3(0.66, 0.076, -0.92), V3(0.84, 0.08, -0.72), V3(0.87, 0.086, -0.52)];
    const TAIL_W = [0, 0, 0, 0.45, 0.8, 1.0];  // 擺動時每個控制點跟著轉的比例（尾巴根不動）
    const tail = makeTube({
      points: TAIL_REST, segs: 32, radial: 14, capSegs: 6, capLen: 1.5,
      radius: (s) => (s < 0.66 ? lerp(0.098, 0.068, smoothNum(0, 0.66, s)) : 0.068 + 0.016 * Math.sin(((s - 0.66) / 0.34) * Math.PI * 0.5)),
      color: (s, c) => c.copy(cBody).lerp(cTip, smoothNum(0.68, 0.73, s)),
    });
    const tailMesh = new THREE.Mesh(tail.geo, M.tail);
    root.add(tailMesh);

    shadow(root);
    // 臉上的小東西和耳朵不投影（不然月光從後面照過來，耳朵的影子會在臉上畫出黑條）
    head.traverse((o) => { if (o.isMesh && o.geometry !== headGeo) o.castShadow = false; });
    // 腳掌縮在身體的影子裡會黑成一團：腳不接收陰影，保留一點月光
    for (const g of legs) g.traverse((o) => { if (o.isMesh) o.receiveShadow = false; });
    neckBlob.receiveShadow = false;   // 頭下面的脖子也是，不然像戴了一圈黑項圈

    // ---- 地上的柔和接觸陰影 ----
    const contact = new THREE.Mesh(new THREE.CircleGeometry(1, 40).rotateX(-Math.PI / 2), M.shadow);
    contact.scale.set(0.95, 1, 1.35);
    contact.position.set(0.12, 0.006, -0.08);
    contact.castShadow = false; contact.receiveShadow = false;
    contact.renderOrder = -1;
    root.add(contact);

    ctx.objects.tapir = root;
    root.updateMatrixWorld(true);
    ctx.anchors.tapir = root.localToWorld(V3(0.12, 0.48, 0.1));
    ctx.anchors.tapirFace = root.localToWorld(V3(0, 0.55, 0.95));
    const tipLocal = new THREE.Vector3();
    ctx.anchors.tapirTail = new THREE.Vector3();
    const updateTipAnchor = () => { tail.curve.getPointAt(1, tipLocal); ctx.anchors.tapirTail.copy(root.localToWorld(tipLocal)); };
    updateTipAnchor();

    // ---------------------------------------------------------------------
    //  動畫
    // ---------------------------------------------------------------------
    // 害羞：一次「低頭、轉開、臉紅」的包絡（上升 0.7 秒、停 1.9 秒、慢慢回來 1.5 秒）
    const SHY = { rise: 0.7, hold: 1.9, fall: 1.5 };
    const SHY_DUR = SHY.rise + SHY.hold + SHY.fall;
    let shyT0 = -99, nextShy = 7 + rnd() * 5, shySide = -1;
    let watched = false, att = 0, nextBlink = 2 + rnd() * 3, blinkT0 = -99, nextTwitch = 3 + rnd() * 4, nextSniff = 4 + rnd() * 4, sniffT0 = -99;
    const shyEnv = (t) => {
      const u = t - shyT0;
      if (u < 0 || u > SHY_DUR) return 0;
      if (u < SHY.rise) return EASE.inOutSine(u / SHY.rise);
      if (u < SHY.rise + SHY.hold) return 1;
      return 1 - EASE.inOutSine((u - SHY.rise - SHY.hold) / SHY.fall);
    };
    const startShy = (t) => { if (t - shyT0 > SHY_DUR * 0.8) shyT0 = t; };
    ctx.events.on('tapir:shy', () => startShy(ctx.time));

    const camLocal = new THREE.Vector3();
    const anchorLocal = V3(0.12, 0.48, 0.1);
    const tmp = new THREE.Vector3();
    const tailPts = tail.curve.points, trunkPts = trunk.curve.points;
    const pivot = TAIL_REST[2];
    const nP = new THREE.Vector3(), nT = new THREE.Vector3(), nQ = new THREE.Quaternion(), Z1 = V3(0, 0, 1);

    ctx.onUpdate((t, dt) => {
      const rm = ctx.reducedMotion;
      const k = rm ? 0.55 : 1;   // 減少動態：幅度變小、動作變慢

      // 呼吸：很慢地一鼓一縮
      const br = Math.sin(t * (rm ? 1.15 : 1.45));
      body.scale.set(1 + 0.016 * br * k, 1 + 0.024 * br * k, 1 + 0.005 * br * k);
      neckBlob.scale.copy(body.scale);

      // 鏡頭靠近了嗎？（被看著的時候會注意到，然後害羞）
      camLocal.copy(camera.position); root.worldToLocal(camLocal);
      const dist = camLocal.distanceTo(anchorLocal);
      const camAng = Math.atan2(camLocal.x, camLocal.z);
      const nowWatched = dist < 5.4;
      if (nowWatched && !watched) nextShy = t + 1.6;          // 先看一眼，1.6 秒後才不好意思地轉開
      watched = nowWatched;
      if (t >= nextShy) {
        startShy(t);
        shySide = watched ? -Math.sign(camAng || 1) : (rnd() < 0.5 ? -1 : 1);
        nextShy = t + (watched ? 5.4 + rnd() * 1.6 : 10 + rnd() * 7);
      }
      att += ((watched ? 1 : 0) - att) * (1 - Math.exp(-dt * 2.4));
      const s = shyEnv(t) * (rm ? 0.65 : 1);

      // 頭：平常慢慢地東張西望；被看著時轉向鏡頭一點；害羞時低頭轉開、歪一下
      const idleYaw = 0.14 * Math.sin(t * 0.17) + 0.06 * Math.sin(t * 0.41 + 1.0);
      const lookYaw = THREE.MathUtils.clamp(camAng, -1.1, 1.1) * 0.42;
      let yaw = lerp(idleYaw * k, lookYaw, att);
      yaw = lerp(yaw, shySide * 0.3, s * 0.85);
      neck.rotation.y = yaw;
      neck.rotation.x = 0.07 + 0.02 * br * k - 0.07 * att * (1 - s) + 0.27 * s;
      neck.rotation.z = -shySide * 0.11 * s;
      neck.position.y = 0.43 + 0.008 * br * k - 0.02 * s;

      // 腮紅：害羞時更紅、更大
      M.blush.emissiveIntensity = 0.22 + 0.55 * s;
      const bs = 1 + 0.28 * s;
      for (const bl of blushes) bl.scale.set(bs, bs, 1);

      // 眨眼（害羞時瞇起來）
      if (t > nextBlink) { blinkT0 = t; nextBlink = t + (rm ? 4.5 : 2.6) + rnd() * 3.2; }
      const bu = (t - blinkT0) / 0.16;
      const blink = bu >= 0 && bu <= 1 ? 1 - 0.88 * Math.sin(bu * Math.PI) : 1;
      for (const e of eyes) e.scale.y = blink * (1 - 0.5 * s);

      // 耳朵：偶爾抖一下；害羞時往後貼
      if (t > nextTwitch) {
        const e = ears[rnd() < 0.5 ? 0 : 1];
        e.twitch = t;
        nextTwitch = t + (rm ? 7 : 3.5) + rnd() * 4.5;
      }
      for (const e of ears) {
        const u = t - e.twitch;
        const tw = u >= 0 && u < 0.7 ? Math.sin(u * 26) * Math.exp(-u * 6.5) * (rm ? 0.12 : 0.42) : 0;
        e.flap.rotation.z = e.rest - e.sx * tw;
        e.flap.rotation.x = -0.45 * s - 0.08 * att * (1 - s);
      }

      // 鼻子：偶爾嗅一嗅（尖端微微捲起來、左右晃），害羞時往裡收
      if (t > nextSniff) { sniffT0 = t; nextSniff = t + 4 + rnd() * 5; }
      const su = t - sniffT0;
      const sniff = su >= 0 && su < 1.6 ? Math.sin((su / 1.6) * Math.PI) : 0;
      const wig = Math.sin(t * 11) * sniff * (rm ? 0.2 : 1);
      for (let i = 1; i < trunkPts.length; i++) {
        const w = i / (trunkPts.length - 1);
        const r0 = TRUNK_REST[i];
        trunkPts[i].set(
          r0.x + 0.022 * wig * w * w,
          r0.y + (0.05 * sniff * k + 0.006 * br) * w * w,
          r0.z + (0.03 * sniff * k - 0.035 * s) * w * w,
        );
      }
      trunk.update();
      trunk.curve.getPointAt(1, nP); trunk.curve.getTangentAt(1, nT);
      nQ.setFromUnitVectors(Z1, nT);
      for (let i = 0; i < 2; i++) {
        nostrils[i].position.copy(nP).addScaledVector(nT, 0.047).add(tmp.set((i ? 1 : -1) * 0.027, 0, 0));
        nostrils[i].quaternion.copy(nQ);
      }

      // 尾巴：在草地上懶懶地掃來掃去，尖端偶爾翹起來；害羞時往身體這邊捲
      // （往外掃得多、往裡收得少，尾巴尖不會戳進大腿）
      const swing = (0.06 + 0.12 * Math.sin(t * 0.55) + 0.04 * Math.sin(t * 1.37 + 1.0)) * k;
      const curl = -0.12 * s;
      for (let i = 0; i < tailPts.length; i++) {
        const r0 = TAIL_REST[i];
        const a = (swing + curl) * TAIL_W[i];
        tmp.set(r0.x - pivot.x, 0, r0.z - pivot.z);
        const ca = Math.cos(a), sa = Math.sin(a);
        tailPts[i].set(pivot.x + tmp.x * ca + tmp.z * sa, r0.y, pivot.z - tmp.x * sa + tmp.z * ca);
      }
      tailPts[5].y = TAIL_REST[5].y + 0.05 * Math.max(0, Math.sin(t * 0.55 + 0.9)) ** 2 * k;
      tailPts[1].y = TAIL_REST[1].y + 0.006 * br;
      tail.update();
      updateTipAnchor();

      // 霧：背上的霧帶沿著背脊慢慢流動
      mistTime.value += dt * (rm ? 0.45 : 1);
    });
  },
});

// ---------------------------------------------------------------- parts/80-audio.js
// ============================================================================
//  聲音：深夜的八音盒 + 一點風 + 蟲鳴（全部用 Web Audio 即時合成，沒有任何音檔）
//  D 大調五聲音階（D E F# A B），3/4 拍，約 70 BPM，四句 × 四小節，一直循環，每一輪都有一點不一樣。
//  所有合成函式都只吃 BaseAudioContext → 也能丟給 OfflineAudioContext 離線算出來測試
//  （ctx.objects.audioLab.renderOffline）。
// ============================================================================
PARTS.push({
  name: 'audio',
  order: 80,
  build(ctx) {
    const { THREE, LAYOUT } = ctx;
    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

    // ---------------------------------------------------------------- 音高
    const PC = { C: 0, 'C#': 1, D: 2, 'D#': 3, E: 4, F: 5, 'F#': 6, G: 7, 'G#': 8, A: 9, 'A#': 10, B: 11 };
    const PC_NAME = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
    const midiOf = (s) => { const m = /^([A-G]#?)(\d)$/.exec(s); return 12 * (Number(m[2]) + 1) + PC[m[1]]; };
    const nameOf = (m) => PC_NAME[((m % 12) + 12) % 12] + (Math.floor(m / 12) - 1);
    const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);
    const SCALE = [2, 4, 6, 9, 11];                                   // D E F# A B
    const inScale = (m) => SCALE.includes(((m % 12) + 12) % 12);
    // 沿著五聲音階走 n 步（正 = 往上）
    const step = (m, n) => { let x = m; const d = Math.sign(n); for (let k = Math.abs(n); k > 0;) { x += d; if (inScale(x)) k--; } return x; };
    // 兩個音之間隔了幾個音階步
    const stepsBetween = (a, b) => { let n = 0; const d = Math.sign(b - a); for (let x = a; x !== b; x += d) if (inScale(x + d)) n++; return n; };

    // ---------------------------------------------------------------- 曲子
    // 每小節三拍。記法「音名:拍數」。alt = 這一句最後兩小節的其他結尾。
    const BPB = 3, PH = 4 * BPB;                                      // 每句 12 拍
    const TUNE = [
      { // A：問句，停在 A
        bars: ['F#5:1 A5:1 D6:1', 'B5:2 A5:1', 'F#5:1 E5:1 F#5:1', 'A5:3'], chords: 'D B E A',
        alt: [['F#5:1 E5:1 D5:1', 'E5:3'], ['F#5:1 A5:1 B5:1', 'A5:3']] },
      { // A'：答句，回到 D
        bars: ['F#5:1 A5:1 D6:1', 'E6:2 D6:1', 'B5:1 A5:1 F#5:1', 'E5:1 D5:2'], chords: 'D A B D',
        alt: [['B5:1 A5:1 F#5:1', 'A5:1 D5:2'], ['D6:1 B5:1 A5:1', 'F#5:1 E5:0.5 F#5:0.5 D5:1']] },
      { // B：往上走一點，比較亮
        bars: ['D6:2 E6:1', 'F#6:1 E6:1 D6:1', 'B5:2 D6:1', 'A5:3'], chords: 'B D E A',
        alt: [['B5:1 D6:1 E6:1', 'A5:3'], ['B5:2 A5:0.5 B5:0.5', 'E5:3']] },
      { // A''：慢慢回家
        bars: ['F#5:1 A5:1 D6:1', 'B5:1 A5:1 F#5:1', 'A5:1 F#5:1 E5:1', 'D5:3'], chords: 'D B A D',
        alt: [['E5:1 F#5:1 E5:1', 'D5:3'], ['A5:1 B5:0.5 A5:0.5 E5:1', 'D5:3']] },
    ];
    // 伴奏（八音盒的低音齒）與偶爾的柔軟低音，都只用五聲音階裡的音
    const CHORD = {
      D: { acc: ['D4', 'A4', 'D5'], low: 'D3' },
      B: { acc: ['B3', 'F#4', 'B4'], low: 'B2' },
      E: { acc: ['E4', 'B4', 'E5'], low: 'E3' },
      A: { acc: ['A3', 'E4', 'A4'], low: 'A2' },
    };

    /**
     * 排出第 loop 輪的所有音。第 0 輪照譜；之後每輪都有小變化：
     * 換結尾、倚音、經過音、長音裡的小迴音、附點、偶爾跳八度、偶爾空一拍、和聲、伴奏型、速度與力度。
     * 回傳 { notes: [{ t(秒,相對這輪開頭), midi, vel, kind }], length, pause, bpm }
     */
    function composeLoop(loop, seed = 1) {
      const rnd = ctx.rand((seed * 7919 + loop * 104729 + 17) >>> 0);
      const plain = loop === 0;
      const chance = (p) => !plain && rnd() < p;
      const pick = (arr) => arr[Math.floor(rnd() * arr.length)];
      const notes = [];
      const quiet = !plain && loop % 4 === 3;                         // 每四輪有一輪比較安靜、慢一點

      // 這一輪的結尾：第一輪照譜，之後至少換一句
      const endings = TUNE.map(() => -1);
      if (!plain) {
        const forced = rnd() < 0.5 ? 1 : 3;
        TUNE.forEach((ph, i) => { if (ph.alt && (i === forced || rnd() < 0.3)) endings[i] = Math.floor(rnd() * ph.alt.length); });
      }

      TUNE.forEach((ph, p) => {
        const bars = ph.bars.slice();
        if (endings[p] >= 0) { bars[2] = ph.alt[endings[p]][0]; bars[3] = ph.alt[endings[p]][1]; }
        const mel = [];
        bars.forEach((bs, b) => {
          let beat = p * PH + b * BPB;
          for (const tok of bs.trim().split(/\s+/)) {
            const [n, d] = tok.split(':'); const dur = Number(d);
            if (n !== 'r') mel.push({ beat, dur, midi: midiOf(n), bar: b });
            beat += dur;
          }
        });

        // ---- 旋律的小變化 ----
        const out = [];
        const add = (beat, dur, midi, velMul = 1, kind = 'mel', dt = 0) => out.push({ beat, dur, midi, velMul, kind, dt });
        for (let i = 0; i < mel.length; i++) {
          const n = mel[i], next = mel[i + 1];
          const last = i === mel.length - 1;
          const onDown = Math.abs(n.beat % BPB) < 1e-6;
          if (!onDown && !last && i > 0 && chance(0.035)) continue;  // 偶爾空一拍
          let m = n.midi;
          if (!last && chance(0.045)) m = m + 12 <= 98 ? m + 12 : m - 12; // 偶爾跳八度
          if (n.dur >= 2.99 && !(last && p === TUNE.length - 1) && chance(0.28)) {
            // 長音 → 長音 + 上鄰音的小迴音
            add(n.beat, 2, m); add(n.beat + 2, 0.5, step(m, 1), 0.7); add(n.beat + 2.5, 0.5, m, 0.62);
          } else if (next && n.dur >= 1 && n.dur < 2.99 && stepsBetween(m, next.midi) >= 2 && chance(0.17)) {
            // 經過音：這個音切一半，後半走向下一個音
            add(n.beat, n.dur - 0.5, m); add(n.beat + n.dur - 0.5, 0.5, step(m, Math.sign(next.midi - m)), 0.74);
          } else if (next && n.dur === 1 && next.dur === 1 && next.bar === n.bar && chance(0.06)) {
            // 附點：這個音拖長一點，下一個音晚半拍
            add(n.beat, 1.5, m); next.beat += 0.5; next.dur = 0.5;
          } else if (n.dur === 2 && chance(0.12)) {
            add(n.beat, 1.5, m); add(n.beat + 1.5, 0.5, m, 0.6);      // 長音再輕輕撥一下
          } else add(n.beat, n.dur, m);
        }
        // 倚音、和聲
        for (const n of out.slice()) {
          if (n.kind !== 'mel') continue;
          if (!(p === 0 && n.beat === 0) && n.dur >= 0.99 && chance(0.11)) add(n.beat, 0, step(n.midi, rnd() < 0.7 ? 1 : -1), 0.42, 'grace', -0.085);
          if (n.dur >= 1.99 && chance(0.22)) add(n.beat, n.dur, step(n.midi, -3), 0.5, 'harm', 0.012);
        }
        // 力度：句子中間稍微大聲、小節頭一點重音、B 句亮一點
        for (const n of out) {
          const j = n.beat - p * PH;
          const arch = 0.88 + 0.14 * Math.sin(Math.PI * Math.min(1, j / 10));
          const down = Math.abs(n.beat % BPB) < 1e-6 ? 0.05 : 0;
          n.vel = clamp((0.74 + down) * arch * (p === 2 ? 1.05 : 1) * (quiet ? 0.88 : 1) * n.velMul * (0.94 + rnd() * 0.12), 0.12, 1);
          notes.push(n);
        }

        // ---- 伴奏 ----
        const pat = plain ? (p === 0 ? 'sparse' : 'arp') : quiet ? 'sparse' : pick(['arp', 'arp', 'arp', 'waltz', 'sparse']);
        ph.chords.split(' ').forEach((c, b) => {
          const ch = CHORD[c], b0 = p * PH + b * BPB;
          const acc = ch.acc.map(midiOf);
          // 伴奏音如果撞到同時在響的旋律音（同音或差一點點），就降八度，免得把旋律蓋糊
          const clash = (beat, m) => out.some((n) => beat >= n.beat - 1e-6 && beat < n.beat + Math.max(n.dur, 0.5) - 1e-6 && Math.abs(n.midi - m) < 3);
          const A = (beat, m, v) => {
            if (clash(beat, m)) { if (m - 12 < 55) return; m -= 12; }
            notes.push({ beat, midi: m, vel: v * (0.88 + rnd() * 0.24), kind: 'acc', dur: 1 });
          };
          // 柔軟的低音：每兩小節一次
          if (b % 2 === 0) notes.push({ beat: b0, midi: midiOf(ch.low), vel: (quiet ? 0.7 : 0.85) * (0.9 + rnd() * 0.2), kind: 'low', dur: 3 });
          if (b > 0 && chance(0.07)) return;                          // 偶爾整小節不伴奏
          A(b0, acc[0], 0.32);
          if (pat === 'arp') { A(b0 + 1, acc[1], 0.22); A(b0 + 2, acc[2], 0.2); }
          else if (pat === 'waltz') { A(b0 + 1, acc[1], 0.16); A(b0 + 1, acc[2], 0.14); A(b0 + 2, acc[1], 0.14); A(b0 + 2, acc[2], 0.12); }
          else if (b % 2 === 1) A(b0 + 2, acc[1], 0.18);
        });
      });

      // 最後一個旋律音輕一點，像發條快轉完
      for (let i = notes.length - 1; i >= 0; i--) if (notes[i].kind === 'mel') { notes[i].vel *= 0.86; break; }

      // ---- 速度：句子中間稍微往前走、句尾放慢（最後一句放得最慢）----
      const TOTAL = TUNE.length * PH;
      const bpm = plain ? 70 : 70 + (rnd() - 0.5) * 4 - (quiet ? 3 : 0);
      const base = 60 / bpm;
      const dur = [], start = [0];
      for (let k = 0; k < TOTAL; k++) {
        const p = Math.floor(k / PH), j = k % PH;
        let f = 1 - 0.03 * Math.sin((Math.PI * j) / PH) + (rnd() - 0.5) * 0.025;
        if (j >= 9) f += (p === TUNE.length - 1 ? [0.08, 0.18, 0.32] : [0.025, 0.06, 0.11])[j - 9];
        dur.push(base * f); start.push(start[k] + base * f);
      }
      const tAt = (beat) => { const k = Math.min(TOTAL - 1, Math.floor(beat)); return start[k] + (beat - k) * dur[k]; };
      for (const n of notes) {
        const jit = (rnd() - 0.5) * (n.kind === 'acc' ? 0.022 : n.kind === 'low' ? 0.03 : 0.014);
        n.t = Math.max(0, tAt(n.beat) + (n.dt || 0) + jit);
      }
      notes.sort((a, b) => a.t - b.t);
      const pause = loop % 3 === 2 ? 9 + rnd() * 5 : 2.6 + rnd() * 1.6;  // 每三輪停久一點，只剩風和蟲
      return { notes, length: start[TOTAL], pause, bpm };
    }

    // ---------------------------------------------------------------- 生成的緩衝區
    // 都是純資料（Float32Array），不需要 AudioContext → 進門前就能在空閒時間先算好，點下去的那一刻不會卡。
    // 寫成產生器：每算一小段就 yield 一次，可以拆成很多小塊做完。
    const GEN_SR = 48000;                                             // 預先產生時用的取樣率
    const WIND_SEC = 8;                                               // 風的雜訊長度

    // 循環用的雜訊（頭尾交叉淡化，接縫聽不出來）。pink = 粉紅雜訊（比較柔）
    function* noiseJob(sr, sec, R, pink, out) {
      const len = Math.floor(sec * sr), X = Math.floor(Math.min(0.4, sec / 4) * sr);
      for (let c = 0; c < 2; c++) {
        const tmp = new Float32Array(len + X);
        let b0 = 0, b1 = 0, b2 = 0, s = 0;
        for (let i = 0; i < tmp.length; i++) {
          const w = R() * 2 - 1;
          if (pink) { b0 = 0.99765 * b0 + w * 0.099046; b1 = 0.963 * b1 + w * 0.2965164; b2 = 0.57 * b2 + w * 1.0526913; tmp[i] = b0 + b1 + b2 + w * 0.1848; }
          else tmp[i] = w;
          s += tmp[i] * tmp[i];
          if ((i & 16383) === 16383) yield;
        }
        const k = 0.25 / Math.sqrt(s / tmp.length);
        const d = new Float32Array(len);
        for (let i = 0; i < len; i++) {
          let v = tmp[i];
          if (i < X) { const a = i / X; v = tmp[i] * Math.sqrt(a) + tmp[len + i] * Math.sqrt(1 - a); }
          d[i] = v * k;
          if ((i & 65535) === 65535) yield;
        }
        out.push(d);
      }
    }

    // 殘響：立體聲雜訊 × 指數衰減，越後面越暗（約 3 秒）
    function* impulseJob(sr, sec, R, out) {
      const len = Math.floor(sec * sr), pre = Math.floor(0.014 * sr);
      const decay = Math.exp(-6.9 / (sec * 0.9) / sr), ramp = 1 / (0.025 * sr);
      for (let c = 0; c < 2; c++) {
        const d = new Float32Array(len);
        let lp = 0, env = 1, a = 0;
        for (let i = pre; i < len; i++) {
          const k = i - pre;
          if ((k & 63) === 0) {                                         // 濾波係數每 64 個取樣更新一次就夠了
            const cutoff = 6500 * Math.exp((-k / sr) * 1.6) + 700;      // Hz：亮 → 暗
            a = 1 - Math.exp((-2 * Math.PI * cutoff) / sr);
          }
          lp += a * (R() * 2 - 1 - lp);
          d[i] = lp * env * Math.min(1, k * ramp);
          env *= decay;
          if ((k & 16383) === 16383) yield;
        }
        // 幾個早期反射
        for (let k = 0; k < 7; k++) { const idx = pre + Math.floor((0.006 + R() * 0.07) * sr); d[idx] += (R() < 0.5 ? -1 : 1) * (0.15 + R() * 0.2); }
        out.push(d);
      }
    }
    const drain = (job) => { while (!job.next().done) { /* 一口氣做完 */ } };
    function toBuffer(ac, ch, rate) {
      const b = ac.createBuffer(ch.length, ch[0].length, rate);
      ch.forEach((d, c) => (b.copyToChannel ? b.copyToChannel(d, c) : b.getChannelData(c).set(d)));
      return b;
    }
    const makeNoise = (ac, sec, R, pink) => { const ch = []; drain(noiseJob(ac.sampleRate, sec, R, pink, ch)); return toBuffer(ac, ch, ac.sampleRate); };
