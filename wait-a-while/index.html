<style>
  :root {
    --night-0: #070b1e;
    --night-1: #0f1736;
    --night-2: #1c2752;
    --warm: #ffd89a;
    --warm-soft: #f6e3bf;
    --ink: #f3ead8;
    --ink-dim: rgba(243, 234, 216, 0.62);
    --font: "LXGW WenKai TC", "Klee One", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif TC", "Songti TC", serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: radial-gradient(120% 90% at 50% 20%, var(--night-2) 0%, var(--night-1) 45%, var(--night-0) 100%);
    color: var(--ink);
    font-family: var(--font);
  }
  canvas#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }

  /* ---------- entry ---------- */
  #entry {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.2rem;
    background: radial-gradient(80% 70% at 50% 45%, rgba(15, 23, 54, 0.55) 0%, rgba(7, 11, 30, 0.85) 100%);
    transition: opacity 2.4s ease, visibility 0s linear 2.4s;
    cursor: pointer; user-select: none; -webkit-user-select: none;
    padding: 16px; text-align: center;
  }
  #entry.gone { opacity: 0; visibility: hidden; pointer-events: none; }
  #entry h1 {
    margin: 0; font-weight: 400; letter-spacing: 0.42em; padding-left: 0.42em;
    font-size: clamp(2.4rem, 6vw, 4.4rem);
    color: var(--warm-soft);
    text-shadow: 0 0 18px rgba(255, 210, 140, 0.35), 0 0 46px rgba(255, 190, 110, 0.18);
  }
  #entry .sub { margin: 0; font-size: clamp(0.9rem, 1.6vw, 1.05rem); color: var(--ink-dim); letter-spacing: 0.18em; }
  #entry button {
    margin-top: 1.6rem; font: inherit; font-size: clamp(1rem, 1.8vw, 1.15rem); letter-spacing: 0.3em; padding: 0.7em 1.6em 0.7em 1.9em;
    color: #2b1d0e; background: linear-gradient(180deg, #ffe2a8, #f3c27a);
    border: 0; border-radius: 999px; cursor: pointer;
    box-shadow: 0 0 0 6px rgba(255, 214, 150, 0.08), 0 0 30px rgba(255, 196, 120, 0.35);
    transition: transform 0.4s ease, box-shadow 0.4s ease, opacity 0.6s ease;
  }
  #entry button:hover { transform: translateY(-1px); box-shadow: 0 0 0 8px rgba(255, 214, 150, 0.12), 0 0 40px rgba(255, 196, 120, 0.45); }
  #entry button:focus-visible { outline: 2px solid var(--warm); outline-offset: 4px; }
  #entry button[disabled] { opacity: 0.45; cursor: default; }
  #entry .hint { margin: 0; font-size: 0.82rem; color: var(--ink-dim); letter-spacing: 0.12em; min-height: 1.2em; }

  /* ---------- caption ---------- */
  #caption {
    position: fixed; left: 50%; bottom: 7vh; transform: translateX(-50%); z-index: 5;
    max-width: min(88vw, 760px); text-align: center;
    font-size: clamp(1.02rem, 1.9vw, 1.32rem); letter-spacing: 0.16em; line-height: 1.7;
    color: var(--ink);
    text-shadow: 0 1px 2px rgba(5, 8, 22, 0.9), 0 0 18px rgba(5, 8, 22, 0.8);
    opacity: 0; transition: opacity 1.4s ease;
    pointer-events: none;
  }
  #caption.show { opacity: 0.92; }

  /* ---------- fallback ---------- */
  #fallback {
    position: fixed; inset: 0; z-index: 20; display: none;
    align-items: center; justify-content: center; padding: 16px;
  }
  #fallback.show { display: flex; }
  #fallback .card {
    max-width: 440px; padding: 2rem 2.2rem; border-radius: 22px; text-align: center;
    background: rgba(20, 28, 62, 0.86); border: 1px solid rgba(255, 220, 160, 0.18);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4); line-height: 1.8; letter-spacing: 0.08em;
  }
  #fallback .lamp { font-size: 2.2rem; color: var(--warm); }
  #fallback h2 { font-weight: 400; margin: 0.4rem 0 0.6rem; font-size: 1.3rem; color: var(--warm-soft); }
  #fallback p { margin: 0.3rem 0; color: var(--ink-dim); font-size: 0.95rem; }
  #fallback code { font-size: 0.8rem; color: rgba(243, 234, 216, 0.45); word-break: break-all; }

  @media (prefers-reduced-motion: reduce) {
    #entry, #caption { transition-duration: 0.8s; }
  }
</style>

    rose: [-2.8, 0.31, -0.95],                                        // 台階頂層上，橫放

    sill: { y: 1.0, z: -1.5, items: { cabbage: -1.55, moonPillow: -1.2, frog: -0.86 } }, // 室內窗台（窗洞後面）

    pondEdgeAngle: Math.atan2(2.3 - 3.9, 2.3 - 6.0),

  person: { seat: [5.11, 0.64, 3.51], facing: [2.3, 2.3] },          // 坐在朝池塘的長凳上，臉朝池塘
  coop: { center: [-5.7, 2.2], rotationY: 0.9 },                     // 雞窩，門口大致朝 +x+z（朝島心）

  tapir: { center: [3.9, -3.4], rotationY: -0.6 },                   // 霧脊貘，趴在草地上
  trees: [[6.4, -1.4, 1.15], [-6.7, -2.4, 1.3], [0.9, -6.6, 1.0], [-1.0, 7.3, 0.8]], // [x, z, scale]

// 色票：深藍夜空、暖黃窗光、紅燈籠、一點橙色的章魚。
const PALETTE = {
  skyTop: 0x060a24, skyMid: 0x10204f, skyHorizon: 0x2a3b7a,
  grass: 0x5f9a5a, grassDark: 0x467a49, grassLight: 0x86b86c,
  dirt: 0x8a5f43, dirtDark: 0x5e3f2e, rock: 0x6f6a7e,
  wood: 0xb07a4f, woodDark: 0x7d5236, woodLight: 0xd3a173, roof: 0x7a4a6a, roofDark: 0x5b3550,
  windowWarm: 0xffc977, lanternRed: 0xe0473c, lanternGlow: 0xff7a4a,
  water: 0x2f6f9a, waterDeep: 0x1b3f66,
  octopus: 0xff8c3a, rose: 0xd9324a, shovel: 0xd9776f,
  moon: 0xfff3d6, firefly: 0xd9ff8a, star: 0xdfe6ff,
  hair: 0x1b1720, skin: 0xffdcc4, blush: 0xff9aa2,
};

// ---------------------------------------------------------------------------
//  小工具
// ---------------------------------------------------------------------------
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const EASE = {
  linear: (t) => t,
  inOutSine: (t) => -(Math.cos(Math.PI * t) - 1) / 2,
  inOutCubic: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
  outCubic: (t) => 1 - Math.pow(1 - t, 3),
  inOutQuint: (t) => (t < 0.5 ? 16 * t ** 5 : 1 - Math.pow(-2 * t + 2, 5) / 2),
  smooth: (t) => t * t * (3 - 2 * t),
};
const clamp01 = (v) => Math.min(1, Math.max(0, v));

function createEvents() {
  const map = new Map();
  return {
    on(name, fn) { if (!map.has(name)) map.set(name, []); map.get(name).push(fn); return () => this.off(name, fn); },
    off(name, fn) { const a = map.get(name); if (a) { const i = a.indexOf(fn); if (i >= 0) a.splice(i, 1); } },
    emit(name, data) { const a = map.get(name); if (a) for (const fn of a.slice()) { try { fn(data); } catch (e) { console.error(`[event ${name}]`, e); } } },
  };
}

// 建立共用的 ctx。所有部件都只透過 ctx 取得 THREE / TSL 與其他共用物件。
function createContext(mods) {
  const { THREE, TSL, RoundedBoxGeometry, BufferGeometryUtils } = mods;

  // ---- 卡通漸層（4 階、柔和），toon 材質共用 ----
  const gradientData = new Uint8Array([70, 140, 205, 255]);
  const toonGradient = new THREE.DataTexture(gradientData, gradientData.length, 1, THREE.RedFormat);
  toonGradient.minFilter = THREE.NearestFilter;
  toonGradient.magFilter = THREE.NearestFilter;
  toonGradient.generateMipmaps = false;
  toonGradient.needsUpdate = true;

  const matCache = new Map();

  /**
   * 卡通材質。color 用 sRGB 十六進位。
   * opts: { emissive, emissiveIntensity, transparent, opacity, side, flat, depthWrite, cache=true }
   */
  function toon(color, opts = {}) {
    const key = opts.cache === false ? null : 'toon:' + color + ':' + JSON.stringify(opts);
    if (key && matCache.has(key)) return matCache.get(key);
    const m = new THREE.MeshToonNodeMaterial({ color, gradientMap: toonGradient });
    if (opts.emissive !== undefined) { m.emissive = new THREE.Color(opts.emissive); m.emissiveIntensity = opts.emissiveIntensity ?? 1; }
    if (opts.transparent) { m.transparent = true; m.opacity = opts.opacity ?? 1; }
    if (opts.depthWrite === false) m.depthWrite = false;
    if (opts.side !== undefined) m.side = opts.side;
    if (opts.flat) m.flatShading = true;
    if (key) matCache.set(key, m);
    return m;
  }

  /**
   * 會發光的無光照材質（可以大於 1，給 bloom 用）。
   * opts: { transparent, opacity, side, depthWrite, blending, cache=true }
   */
  function glow(color, intensity = 1.5, opts = {}) {
    const key = opts.cache === false ? null : 'glow:' + color + ':' + intensity + ':' + JSON.stringify(opts);
    if (key && matCache.has(key)) return matCache.get(key);
    const m = new THREE.MeshBasicNodeMaterial();
    const c = new THREE.Color(color);
    m.colorNode = TSL.vec3(c.r, c.g, c.b).mul(intensity);
    if (opts.transparent) { m.transparent = true; m.opacity = opts.opacity ?? 1; }
    if (opts.depthWrite === false) m.depthWrite = false;
    if (opts.side !== undefined) m.side = opts.side;
    if (opts.blending !== undefined) m.blending = opts.blending;
    m.fog = opts.fog ?? true;
    if (key) matCache.set(key, m);
    return m;
  }

  // ---- 柔光貼圖（徑向漸層），給螢火蟲、星星、光暈、泡泡高光用 ----
  function makeCanvasTexture(size, draw) {
    const cv = document.createElement('canvas');
    cv.width = cv.height = size;
    const g = cv.getContext('2d');
    draw(g, size);
    const tex = new THREE.CanvasTexture(cv);
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
  }
  const glowTexture = makeCanvasTexture(128, (g, s) => {
    const gr = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    gr.addColorStop(0, 'rgba(255,255,255,1)');
    gr.addColorStop(0.18, 'rgba(255,255,255,0.85)');
    gr.addColorStop(0.45, 'rgba(255,255,255,0.25)');
    gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, s, s);
  });

  function shadow(obj, cast = true, receive = true) {
    obj.traverse((o) => { if (o.isMesh) { o.castShadow = cast; o.receiveShadow = receive; } });
    return obj;
  }

  function roundedBox(w, h, d, r = 0.08, seg = 3) {
    return new RoundedBoxGeometry(w, h, d, seg, Math.min(r, Math.min(w, h, d) / 2 - 1e-3));
  }

  const ctx = {
    THREE, TSL, RoundedBoxGeometry, BufferGeometryUtils,
    LAYOUT, PALETTE, EASE, clamp01, PARAMS,
    rand: mulberry32,
    events: createEvents(),
    updaters: [],
    /** 每幀呼叫 fn(t, dt, ctx)。t = 開機以來秒數（一直走），ctx.storyTime = 進門以來秒數（未進門為 -1）。 */
    onUpdate(fn) { this.updaters.push(fn); return fn; },
    objects: {},   // 部件互相找東西用：ctx.objects.lantern 等
    anchors: {},   // 鏡頭看的重點（THREE.Vector3），部件可以覆寫成精確位置
    toon, glow, glowTexture, makeCanvasTexture, shadow, roundedBox, toonGradient,
    reducedMotion: matchMedia('(prefers-reduced-motion: reduce)').matches || PARAMS.has('rm'),
    time: 0,
    storyTime: -1,
    entered: false,
    audio: null,   // 由 audio 部件填入
    caption: null, // 由 main 填入：caption.show(text) / caption.hide()
  };
  return ctx;
}

// ---------------------------------------------------------------- parts/00-island.js
// ---- 島：漂浮的小圓島（草面、池塘的坑、下面的土和石頭、小路、樹叢）----
PARTS.push({
  name: 'island',
  order: 0,
  build(ctx) {
    const { THREE, LAYOUT, PALETTE, toon, shadow, scene } = ctx;
    const R = LAYOUT.island.radius;
    const P = LAYOUT.pond;
    const rnd = ctx.rand(7);
    const island = new THREE.Group();
    island.name = 'island';
    scene.add(island);
    ctx.objects.island = island;

    // 草面：圓形，挖掉池塘的橢圓，往下擠出一點厚度，帶圓角
    const shape = new THREE.Shape();
    shape.absarc(0, 0, R, 0, Math.PI * 2, false);
    const hole = new THREE.Path();
    // Shape 在 xy 平面，之後轉到 xz：shape 的 y = -z
    hole.absellipse(P.center[0], -P.center[1], P.rx, P.rz, 0, Math.PI * 2, true);
    shape.holes.push(hole);
    const topGeo = new THREE.ExtrudeGeometry(shape, {
      depth: LAYOUT.island.thickness, bevelEnabled: true, bevelThickness: 0.18, bevelSize: 0.22, bevelSegments: 3, curveSegments: 72,
    });
    topGeo.rotateX(-Math.PI / 2);                 // 擠出方向變成 +y
    topGeo.translate(0, -LAYOUT.island.thickness - 0.18, 0); // 頂面落在 y = 0
    const grassMat = toon(PALETTE.grass);
    const sideMat = toon(PALETTE.dirt);
    const top = new THREE.Mesh(topGeo, [grassMat, sideMat]);
    top.receiveShadow = true;
    island.add(top);

    // 草邊上一圈稍微深一點的草，讓邊緣有層次
    const rimGeo = new THREE.TorusGeometry(R + 0.02, 0.2, 6, 96);
    rimGeo.rotateX(Math.PI / 2);
    const rim = new THREE.Mesh(rimGeo, toon(PALETTE.grassDark));
    rim.position.y = -0.12;
    rim.scale.y = 0.6;
    rim.receiveShadow = true;
    island.add(rim);

    // 底下：倒錐形的土，帶一點起伏的低多邊形
    const lathePts = [];
    const depth = 5.6;
    const steps = 9;
    for (let i = 0; i <= steps; i++) {
      const k = i / steps;
      const r = (R + 0.15) * Math.pow(1 - k, 0.85) * (1 - 0.06 * Math.sin(k * 9)) + 0.05;
      lathePts.push(new THREE.Vector2(Math.max(0.05, r), -0.72 - k * depth));
    }
    const underGeo = new THREE.LatheGeometry(lathePts, 28);
    const pos = underGeo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const y = pos.getY(i);
      if (y < -0.9) {
        const a = Math.atan2(pos.getZ(i), pos.getX(i));
        const n = 1 + 0.09 * Math.sin(a * 5 + y * 1.3) + 0.06 * Math.sin(a * 11 - y * 2.1);
        pos.setX(i, pos.getX(i) * n); pos.setZ(i, pos.getZ(i) * n);
      }
    }
    underGeo.computeVertexNormals();
    const under = new THREE.Mesh(underGeo, toon(PALETTE.dirtDark, { flat: true }));
    island.add(under);

    // 土裡露出的石頭與垂下來的小根
    const rockMat = toon(PALETTE.rock, { flat: true });
    for (let i = 0; i < 22; i++) {
      const a = rnd() * Math.PI * 2;
      const k = 0.15 + rnd() * 0.7;
      const r = (R + 0.15) * Math.pow(1 - k, 0.85) + 0.1;
      const g = new THREE.DodecahedronGeometry(0.25 + rnd() * 0.45, 0);
      const m = new THREE.Mesh(g, rockMat);
      m.position.set(Math.cos(a) * r, -0.72 - k * depth, Math.sin(a) * r);
      m.rotation.set(rnd() * 3, rnd() * 3, rnd() * 3);
      m.scale.set(1, 0.7 + rnd() * 0.4, 1);
      island.add(m);
    }
    const rootMat = toon(0x6b4a35);
    for (let i = 0; i < 7; i++) {
      const a = rnd() * Math.PI * 2;
      const r = R * (0.45 + rnd() * 0.35);
      const len = 1 + rnd() * 1.6;
      const curve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(Math.cos(a) * r, -1.2, Math.sin(a) * r),
        new THREE.Vector3(Math.cos(a) * r * 0.92 + 0.2, -1.2 - len * 0.5, Math.sin(a) * r * 0.92),
        new THREE.Vector3(Math.cos(a) * r * 0.85, -1.2 - len, Math.sin(a) * r * 0.86 + 0.15),
      ]);
      island.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 8, 0.05, 5), rootMat));
    }
    // 底尖下一顆小小的水晶，當作島的「心」
    const crystal = new THREE.Mesh(new THREE.OctahedronGeometry(0.45, 0), ctx.glow(0x9fd0ff, 1.25));
    crystal.position.set(0.1, -0.72 - depth - 0.35, 0.05);
    crystal.scale.set(0.8, 1.5, 0.8);
    island.add(crystal);
    ctx.onUpdate((t) => { crystal.rotation.y = t * 0.3; });

    // ---- 小路：從台階到池邊、再到亭子的踏腳石 ----
    const stoneMat = toon(0xc9bfae);
    const stoneGeo = new THREE.CylinderGeometry(0.3, 0.33, 0.08, 9);
    const pathPts = [
      [-3.0, -0.2], [-2.6, 0.45], [-2.0, 1.0], [-1.3, 1.45], [-0.55, 1.8],
      [0.4, 4.6], [1.4, 4.8], [2.5, 4.95], [3.5, 5.05], [4.45, 5.3],
    ];
    for (const [x, z] of pathPts) {
      const s = new THREE.Mesh(stoneGeo, stoneMat);
      s.position.set(x + (rnd() - 0.5) * 0.08, 0.02, z + (rnd() - 0.5) * 0.08);
      s.rotation.y = rnd() * Math.PI;
      s.scale.set(0.85 + rnd() * 0.3, 1, 0.75 + rnd() * 0.3);
      s.receiveShadow = true;
      island.add(s);
    }

    // ---- 樹：圓滾滾的樹冠 ----
    const trunkMat = toon(PALETTE.woodDark);
    const leafMats = [toon(0x4f8a52), toon(0x5d9c5a), toon(0x3f7449)];
    for (const [x, z, s] of LAYOUT.trees) {
      const tree = new THREE.Group();
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.24, 1.6, 7), trunkMat);
      trunk.position.y = 0.8;
      tree.add(trunk);
      const blobs = [[0, 2.15, 0, 1.0], [0.55, 1.85, 0.2, 0.7], [-0.5, 1.9, -0.15, 0.72], [0.1, 2.75, -0.1, 0.62]];
      blobs.forEach(([bx, by, bz, br], i) => {
        const b = new THREE.Mesh(new THREE.IcosahedronGeometry(br, 1), leafMats[i % 3]);
        b.position.set(bx, by, bz);
        tree.add(b);
      });
      tree.position.set(x, 0, z);
      tree.scale.setScalar(s);
      tree.rotation.y = rnd() * Math.PI * 2;
      shadow(tree);
      island.add(tree);
    }

    // ---- 灌木叢沿著島邊 ----
    const bushMat = [toon(0x4c8650), toon(0x5a9a58)];
    const avoid = (x, z) => {
      const near = (cx, cz, r) => (x - cx) ** 2 + (z - cz) ** 2 < r * r;
      return near(LAYOUT.pavilion.center[0], LAYOUT.pavilion.center[1], 2.0) ||
        near(LAYOUT.coop.center[0], LAYOUT.coop.center[1], 1.8) ||
        near(LAYOUT.hive.center[0], LAYOUT.hive.center[1], 1.5) ||
        near(LAYOUT.tapir.center[0], LAYOUT.tapir.center[1], 1.9) ||
        near(LAYOUT.house.center[0], LAYOUT.house.center[1], 3.0);
    };
    for (let i = 0; i < 26; i++) {
      const a = (i / 26) * Math.PI * 2 + rnd() * 0.15;
      const r = R - 0.75 - rnd() * 0.5;
      const x = Math.cos(a) * r, z = Math.sin(a) * r;
      if (avoid(x, z)) continue;
      const g = new THREE.Group();
      const n = 2 + Math.floor(rnd() * 2);
      for (let j = 0; j < n; j++) {
        const b = new THREE.Mesh(new THREE.IcosahedronGeometry(0.32 + rnd() * 0.18, 1), bushMat[j % 2]);
        b.position.set((rnd() - 0.5) * 0.5, 0.22 + rnd() * 0.1, (rnd() - 0.5) * 0.4);
        g.add(b);
      }
      g.position.set(x, 0, z);
      shadow(g);
      island.add(g);
    }

    // ---- 草叢與小花（InstancedMesh）----
    const tuftGeo = new THREE.ConeGeometry(0.06, 0.28, 4);
    tuftGeo.translate(0, 0.14, 0);
    const tufts = new THREE.InstancedMesh(tuftGeo, toon(PALETTE.grassLight), 420);
    const flowerGeo = new THREE.IcosahedronGeometry(0.06, 0);
    flowerGeo.translate(0, 0.17, 0);
    const flowerColors = [0xfff1c9, 0xffb6c8, 0xc9b6ff, 0xfff6a0];
    const flowers = new THREE.InstancedMesh(flowerGeo, toon(0xffffff), 90);
    const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), v = new THREE.Vector3(), sc = new THREE.Vector3();
    const inPond = (x, z) => ((x - P.center[0]) / (P.rx + 0.25)) ** 2 + ((z - P.center[1]) / (P.rz + 0.25)) ** 2 < 1;
    let ti = 0, fi = 0, guard = 0;
    while ((ti < tufts.count || fi < flowers.count) && guard++ < 6000) {
      const a = rnd() * Math.PI * 2, r = Math.sqrt(rnd()) * (R - 0.5);
      const x = Math.cos(a) * r, z = Math.sin(a) * r;
      if (inPond(x, z) || avoid(x, z)) continue;
      if (x > -4.9 && x < 0.0 && z > -4.9 && z < -0.3) continue; // 小屋與門口
      const cluster = 1 + Math.floor(rnd() * 3);
      for (let k = 0; k < cluster; k++) {
        v.set(x + (rnd() - 0.5) * 0.25, 0, z + (rnd() - 0.5) * 0.25);
        e.set((rnd() - 0.5) * 0.4, rnd() * 3, (rnd() - 0.5) * 0.4);
        q.setFromEuler(e);
        const s = 0.7 + rnd() * 0.7;
        sc.set(s, s, s);
        m4.compose(v, q, sc);
        if (rnd() < 0.82 && ti < tufts.count) tufts.setMatrixAt(ti++, m4);
        else if (fi < flowers.count) { flowers.setMatrixAt(fi, m4); flowers.setColorAt(fi, new THREE.Color(flowerColors[fi % 4])); fi++; }
      }
    }
    tufts.count = ti; flowers.count = fi;
    tufts.receiveShadow = true;
    island.add(tufts, flowers);

    // ---- 島整體的漂浮（非常輕）----
    // 注意：島本身不動，避免其他部件的世界座標失準；只讓底下的水晶轉。
    ctx.anchors.island = new THREE.Vector3(0, 0.5, 0);
  },
});

// ---------------------------------------------------------------- parts/10-house.js
// ---- 小屋：圓木小屋、暖暖的窗、窗後的小房間、窗台上的三個小東西、石頭煙囪與煙 ----
// 座標直接用世界座標（群組在原點）。正面在 z = -1.3 朝 +z。
// 室內的光只照室內：室內材質用自己的 lightsNode（屋裡的燈不放進場景，免得從牆外透出來）。
PARTS.push({
  name: 'house',
  order: 10,
  build(ctx) {
    const { THREE, TSL, LAYOUT, PALETTE, EASE, toon, shadow, roundedBox, scene } = ctx;
    const BGU = ctx.BufferGeometryUtils;
    const HL = LAYOUT.house;
    const rnd = ctx.rand(1010);

    const house = new THREE.Group();
    house.name = 'house';
    scene.add(house);
    const exterior = new THREE.Group();   // 會投影、受月光的外殼
    const interior = new THREE.Group();   // 屋裡（只吃室內燈）
    const glows = new THREE.Group();      // 發光面（不投影）
    house.add(exterior, interior, glows);

    // ------------------------------------------------------------------
    //  尺寸
    // ------------------------------------------------------------------
    const X0 = HL.center[0] - HL.width / 2;   // -4.5 西
    const X1 = HL.center[0] + HL.width / 2;   // -0.3 東
    const Z0 = HL.center[1] - HL.depth / 2;   // -4.7 後
    const Z1 = HL.frontZ;                     // -1.3 前
    const FLOOR = 0.3;                        // 石頭地基高度 = 室內地板 = 門檻
    const TOP = HL.eave.y;                    // 2.62 牆頂 / 屋簷底
    const R = 0.135;                          // 圓木半徑
    const ROWS = 10;
    const LOG_Y0 = 0.395, LOG_Y1 = TOP - R;
    const STEP = (LOG_Y1 - LOG_Y0) / (ROWS - 1);
    const rowsY = Array.from({ length: ROWS }, (_, i) => LOG_Y0 + i * STEP);
    const EXT = 0.16;                         // 圓木在牆角伸出去的長度（西南角離燈籠很近，別伸太長）

    // 屋頂
    const RIDGE_Z = HL.center[1];             // -3.0
    const EAVE_F = HL.eave.frontZ;            // -0.7
    const EAVE_B = 2 * RIDGE_Z - EAVE_F;      // -5.3
    const ROOF_X0 = HL.eave.x0, ROOF_X1 = HL.eave.x1;
    const Y_EAVE_TOP = 2.86;                  // 屋頂板上緣在簷口的高度
    const Y_RIDGE_TOP = 4.47;
    const TAN = (Y_RIDGE_TOP - Y_EAVE_TOP) / (RIDGE_Z - EAVE_B);
    const THETA = Math.atan(TAN);
    const TV = 0.2;                           // 屋頂板垂直厚度
    const yTop = (z) => Y_RIDGE_TOP - Math.abs(z - RIDGE_Z) * TAN;
    const yUnder = (z) => yTop(z) - TV;

    // 開口（沿牆方向的世界座標）
    const door = { a0: HL.door.x - HL.door.width / 2, a1: HL.door.x + HL.door.width / 2, y0: FLOOR, y1: FLOOR + HL.door.height };
    const win = { a0: HL.window.x - HL.window.width / 2, a1: HL.window.x + HL.window.width / 2, y0: HL.window.sill, y1: HL.window.top };
    const sideWin = { a0: HL.sideWindow.z - HL.sideWindow.width / 2, a1: HL.sideWindow.z + HL.sideWindow.width / 2, y0: HL.sideWindow.sill, y1: HL.sideWindow.top };
    const backWin = { a0: -3.75, a1: -3.05, y0: 1.15, y1: 1.85 };

    // ------------------------------------------------------------------
    //  暖光：三段溫度（window:warm 事件輪流切換），用 uniform 推給所有發光面
    // ------------------------------------------------------------------
    const LEVELS = [
      { c: new THREE.Color(0xffd98c), k: 1.0 },   // 柔和的黃
      { c: new THREE.Color(0xffb862), k: 1.2 },   // 暖一點、亮一點
      { c: new THREE.Color(0xff9a48), k: 1.36 },  // 深深的琥珀
    ];
    const warmU = TSL.uniform(LEVELS[0].c.clone());
    const warmK = TSL.uniform(1.0);
    const warm = warmU.mul(warmK);

    // 屋裡的燈（不加進場景，只給室內材質用）
    const innerLight = new THREE.PointLight(LEVELS[0].c, 4.2, 6.5, 1.4);
    innerLight.position.set(-1.35, 1.98, -2.55);
    innerLight.updateMatrixWorld(true);
    const roomFill = new THREE.AmbientLight(0xffc89a, 0.75);
    // 窗外一盞（在場景裡）：把暖光灑在花壇、台階和窗台小東西的正面
    const outLight = new THREE.PointLight(LEVELS[0].c, 1.8, 5.0, 1.8);
    outLight.position.set(-1.2, 1.28, -0.5);
    house.add(outLight);
    // 窗台小東西的正面補光（不在場景裡，只照它們）
    const itemKey = new THREE.PointLight(LEVELS[0].c, 1.15, 3.0, 1.5);
    itemKey.position.set(-1.05, 1.62, -0.55);
    itemKey.updateMatrixWorld(true);
    const itemFill = new THREE.AmbientLight(0xffe2c0, 0.42);

    const roomLights = TSL.lights([innerLight, roomFill]);
    const itemLights = TSL.lights([innerLight, itemKey, itemFill]);

    // ---- 材質 ----
    const myMats = new Map();
    /** 室內 / 小東西用的卡通材質：自訂 lightsNode，emi = 一點點自發光（跟著暖光走） */
    function litMat(color, o = {}) {
      const key = [color, o.lights === itemLights ? 'i' : 'r', o.emi || 0, o.vc ? 1 : 0, o.map ? o.map.id : '', o.side || 0].join('|');
      if (myMats.has(key)) return myMats.get(key);
      const m = new THREE.MeshToonNodeMaterial({ color, gradientMap: ctx.toonGradient });
      if (o.map) m.map = o.map;
      if (o.vc) m.vertexColors = true;
      if (o.side !== undefined) m.side = o.side;
      m.lightsNode = o.lights || roomLights;
      if (o.emi) m.emissiveNode = TSL.diffuseColor.rgb.mul(warm).mul(o.emi);
      myMats.set(key, m);
      return m;
    }
    const roomMat = (c, o = {}) => litMat(c, { ...o, lights: roomLights });
    const itemMat = (c, o = {}) => litMat(c, { ...o, lights: itemLights });
    /** 暖光發光面（> 1 的部分會有 bloom） */
    function warmGlow(mult, o = {}) {
      const m = new THREE.MeshBasicNodeMaterial();
      let c = warm.mul(mult);
      if (o.tint) { const t = new THREE.Color(o.tint); c = c.mul(TSL.vec3(t.r, t.g, t.b)); }
      if (o.vgrad) c = c.mul(TSL.uv().y.mul(o.vgrad).add(1 - o.vgrad * 0.6));
      m.colorNode = c;
      if (o.side !== undefined) m.side = o.side;
      if (o.transparent) { m.transparent = true; m.opacity = o.opacity ?? 1; m.depthWrite = false; }
      if (o.blending !== undefined) m.blending = o.blending;
      return m;
    }
    const vcToon = (o = {}) => {
      const m = new THREE.MeshToonNodeMaterial({ color: 0xffffff, vertexColors: true, gradientMap: ctx.toonGradient });
      if (o.lights) m.lightsNode = o.lights;
      return m;
    };

    // 外殼色
    const C = {
      log: new THREE.Color(PALETTE.wood), logLight: new THREE.Color(PALETTE.woodLight), logDark: new THREE.Color(PALETTE.woodDark),
      trim: 0xf6e6c8, trimShade: 0xe6d0ad,
      roof: PALETTE.roof, roofDark: PALETTE.roofDark,
      door: 0x9c5b3b, doorDark: 0x7a4430, brass: 0xe8b85a, iron: 0x4a3b45,
      stone: 0x8e889c, stoneBand: 0x5e5552,
    };
    const trimMat = toon(C.trim);
    const roofTrimMat = toon(0x80553a);
    const roofDarkMat = toon(C.roofDark);

    // ------------------------------------------------------------------
    //  幾何小工具
    // ------------------------------------------------------------------
    // 沿 x 的半圓木（或整圈），外側法向 = phi 0 → +z，phi π/2 → +y
    function logPiece(len, r, phi0, phi1, segs, color) {
      const pos = [], nor = [], col = [], uvs = [], idx = [];
      for (let i = 0; i <= segs; i++) {
        const ph = phi0 + (phi1 - phi0) * (i / segs);
        const ny = Math.sin(ph), nz = Math.cos(ph);
        for (let j = 0; j < 2; j++) {
          const x = (j - 0.5) * len;
          pos.push(x, r * ny, r * nz); nor.push(0, ny, nz);
          col.push(color.r, color.g, color.b); uvs.push(j, i / segs);
        }
      }
      for (let i = 0; i < segs; i++) {
        const a = i * 2, b = (i + 1) * 2, c = b + 1, d = a + 1;
        idx.push(a, d, c, a, c, b);
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
      g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
      g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      g.setIndex(idx);
      return g;
    }
    const _q = new THREE.Quaternion(), _m = new THREE.Matrix4(), _v = new THREE.Vector3(), _s = new THREE.Vector3(1, 1, 1);
    const Z_AXIS = new THREE.Vector3(0, 0, 1);
    const _qc = new THREE.Quaternion();
    function endCap(r, center, normal) {
      const g = new THREE.CircleGeometry(r * 0.985, 14);
      _qc.setFromUnitVectors(Z_AXIS, normal);
      g.applyQuaternion(_qc);
      g.translate(center.x, center.y, center.z);
      return g;
    }
    function mesh(geo, mat, parent = exterior) { const m = new THREE.Mesh(geo, mat); parent.add(m); return m; }
    function box(w, h, d, r, mat, x, y, z, parent = exterior) {
      const m = new THREE.Mesh(r > 0 ? roundedBox(w, h, d, r, 2) : new THREE.BoxGeometry(w, h, d), mat);
      m.position.set(x, y, z); parent.add(m); return m;
    }
    function shapeFrom(pts) { return new THREE.Shape(pts.map(([x, y]) => new THREE.Vector2(x, y))); }

    // ------------------------------------------------------------------
    //  1) 圓木牆
    // ------------------------------------------------------------------
    const walls = [
      { rotY: 0, line: Z1 - R, alongX: true, a0: X0, a1: X1, openings: [door, win] },
      { rotY: Math.PI, line: Z0 + R, alongX: true, a0: X0, a1: X1, openings: [backWin] },
      { rotY: Math.PI / 2, line: X1 - R, alongX: false, a0: Z0, a1: Z1, openings: [sideWin] },
      { rotY: -Math.PI / 2, line: X0 + R, alongX: false, a0: Z0, a1: Z1, openings: [] },
    ];
    const outerGeos = [], innerGeos = [], capGeos = [];
    const cutsTop = new Map(), cutsBottom = new Map();  // 每個開口被切到的圓木範圍（讓窗框剛好蓋住）
    for (const w of walls) {
      _q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), w.rotY);
      const worldAt = (s, y) => (w.alongX ? _v.set(s, y, w.line) : _v.set(w.line, y, s));
      const axis = w.alongX ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(0, 0, 1);
      const inA = w.a0 + R, inB = w.a1 - R;             // 室內那一面的範圍
      rowsY.forEach((y, ri) => {
        // 這一排要閃開哪些開口
        let segs = [[w.a0 - EXT, w.a1 + EXT]];
        for (const o of w.openings) {
          const overlap = Math.min(y + R, o.y1) - Math.max(y - R, o.y0);
          if (overlap <= 0.03) continue;
          cutsTop.set(o, Math.max(cutsTop.get(o) ?? -9, y + R));
          cutsBottom.set(o, Math.min(cutsBottom.get(o) ?? 9, y - R));
          const next = [];
          for (const [s0, s1] of segs) {
            if (o.a1 <= s0 || o.a0 >= s1) { next.push([s0, s1]); continue; }
            if (o.a0 > s0) next.push([s0, o.a0]);
            if (o.a1 < s1) next.push([o.a1, s1]);
          }
          segs = next;
        }
        // 每根木頭顏色有一點點不同
        const k = rnd();
        const color = C.log.clone().lerp(k < 0.5 ? C.logLight : C.logDark, (k < 0.5 ? k : 1 - k) * 0.55);
        const rr = R * (0.97 + rnd() * 0.06);
        for (const [s0, s1] of segs) {
          const place = (g, a, b) => {
            const mid = (a + b) / 2;
            worldAt(mid, y);
            _m.compose(_v, _q, _s);
            g.applyMatrix4(_m);
            return g;
          };
          // 外半圈：整段
          outerGeos.push(place(logPiece(s1 - s0, rr, -Math.PI / 2, Math.PI / 2, 8, color), s0, s1));
          // 內半圈：在牆角伸出去的部分屬於外觀，屋裡那段給室內材質
          const a = Math.max(s0, inA), b = Math.min(s1, inB);
          if (b > a) innerGeos.push(place(logPiece(b - a, rr, Math.PI / 2, Math.PI * 1.5, 8, color), a, b));
          if (s0 < inA) outerGeos.push(place(logPiece(Math.min(s1, inA) - s0, rr, Math.PI / 2, Math.PI * 1.5, 8, color), s0, Math.min(s1, inA)));
          if (s1 > inB) outerGeos.push(place(logPiece(s1 - Math.max(s0, inB), rr, Math.PI / 2, Math.PI * 1.5, 8, color), Math.max(s0, inB), s1));
          // 牆角的木頭截面
          if (s0 <= w.a0 - EXT + 1e-6) capGeos.push(endCap(rr, worldAt(s0, y).clone(), axis.clone().negate()));
          if (s1 >= w.a1 + EXT - 1e-6) capGeos.push(endCap(rr, worldAt(s1, y).clone(), axis.clone()));
        }
      });
    }
    const endGrainTex = ctx.makeCanvasTexture(128, (g, s) => {
      g.fillStyle = '#e9c08e'; g.fillRect(0, 0, s, s);
      const cx = s / 2;
      g.fillStyle = '#8a5a3a'; g.beginPath(); g.arc(cx, cx, s * 0.5, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#e8bd8a'; g.beginPath(); g.arc(cx, cx, s * 0.43, 0, Math.PI * 2); g.fill();
      g.strokeStyle = 'rgba(176,122,79,0.75)'; g.lineWidth = s * 0.03;
      for (const rr of [0.31, 0.2, 0.1]) { g.beginPath(); g.arc(cx + s * 0.01, cx - s * 0.01, s * rr, 0, Math.PI * 2); g.stroke(); }
      g.fillStyle = '#b07a4f'; g.beginPath(); g.arc(cx + s * 0.01, cx - s * 0.01, s * 0.03, 0, Math.PI * 2); g.fill();
    });
    const logsOuter = mesh(BGU.mergeGeometries(outerGeos), vcToon());
    const logsInner = mesh(BGU.mergeGeometries(innerGeos), vcToon({ lights: roomLights }), interior);
    const caps = mesh(BGU.mergeGeometries(capGeos), new THREE.MeshToonNodeMaterial({ map: endGrainTex, gradientMap: ctx.toonGradient }));
    logsOuter.name = 'logs'; logsInner.name = 'logsInside'; caps.name = 'logEnds';

    // ------------------------------------------------------------------
    //  2) 石頭地基
    // ------------------------------------------------------------------
    box(X1 - X0 + 0.12, FLOOR + 0.04, Z1 - Z0 + 0.12, 0.05, toon(C.stoneBand), (X0 + X1) / 2, (FLOOR + 0.04) / 2 - 0.03, (Z0 + Z1) / 2);
    {
      const stoneGeo = new THREE.DodecahedronGeometry(1, 0);
      const n = 170;
      const stones = new THREE.InstancedMesh(stoneGeo, toon(0xffffff, { flat: true }), n);
      const cols = [0xa39a94, 0x948b86, 0xb0a7a0, 0x8a827e, 0xbab0a6].map((c) => new THREE.Color(c));
      const e = new THREE.Euler(), sc = new THREE.Vector3(), p = new THREE.Vector3();
      let i = 0;
      const sides = [
        { from: [X0 - 0.06, Z1 + 0.06], to: [X1 + 0.06, Z1 + 0.06], n: [0, 1] },
        { from: [X1 + 0.06, Z1 + 0.06], to: [X1 + 0.06, Z0 - 0.06], n: [1, 0] },
        { from: [X1 + 0.06, Z0 - 0.06], to: [X0 - 0.06, Z0 - 0.06], n: [0, -1] },
        { from: [X0 - 0.06, Z0 - 0.06], to: [X0 - 0.06, Z1 + 0.06], n: [-1, 0] },
      ];
      for (const sd of sides) {
        const len = Math.hypot(sd.to[0] - sd.from[0], sd.to[1] - sd.from[1]);
        for (let course = 0; course < 2; course++) {
          const cnt = Math.round(len / 0.24);
          for (let k = 0; k < cnt && i < n; k++) {
            const f = (k + 0.5 + (course ? 0.5 : 0) + (rnd() - 0.5) * 0.15) / cnt;
            if (f > 1) continue;
            p.set(sd.from[0] + (sd.to[0] - sd.from[0]) * f, 0.08 + course * 0.14 + (rnd() - 0.5) * 0.02, sd.from[1] + (sd.to[1] - sd.from[1]) * f);
            e.set((rnd() - 0.5) * 0.4, Math.atan2(sd.n[0], sd.n[1]) + (rnd() - 0.5) * 0.3, (rnd() - 0.5) * 0.4);
            sc.set(0.1 + rnd() * 0.035, 0.07 + rnd() * 0.02, 0.05);
            _m.compose(p, _q.setFromEuler(e), sc);
            stones.setMatrixAt(i, _m);
            stones.setColorAt(i, cols[Math.floor(rnd() * cols.length)]);
            i++;
          }
        }
      }
      stones.count = i;
      exterior.add(stones);
    }

    // ------------------------------------------------------------------
    //  3) 窗框 / 門框
    // ------------------------------------------------------------------
    const FW = 0.11; // 框寬
    /** 在某面牆的開口周圍做框。depthOut/depthIn：從牆中線往外 / 往內的深度 */
    function frameFor(w, o, opts = {}) {
      const top = Math.max(cutsTop.get(o) ?? o.y1 + 0.1, o.y1 + 0.1) + 0.02;
      const bot = Math.min(cutsBottom.get(o) ?? o.y0 - 0.08, o.y0 - 0.06) - 0.02;
      const dOut = opts.dOut ?? R + 0.06, dIn = opts.dIn ?? R + 0.03;
      const g = new THREE.Group();
      const mat = opts.mat || trimMat;
      const depth = dOut + dIn, zc = (dOut - dIn) / 2;
      const mid = (o.a0 + o.a1) / 2, wid = o.a1 - o.a0;
      const local = [];
      // 左右框
      local.push([FW, top - bot, depth, (o.a0 - FW / 2) - mid, (top + bot) / 2, zc]);
      local.push([FW, top - bot, depth, (o.a1 + FW / 2) - mid, (top + bot) / 2, zc]);
      // 上框（加一條小簷）
      local.push([wid + FW * 2 + 0.06, top - o.y1, depth, 0, (top + o.y1) / 2, zc]);
      local.push([wid + FW * 2 + 0.16, 0.06, dOut + 0.06, 0, top + 0.01, dOut / 2 + 0.03 - 0.01]);
      // 下框 / 窗台
      if (!opts.noSill) {
        const sIn = opts.sillIn ?? dIn, sOut = opts.sillOut ?? dOut + 0.08;
        local.push([wid + FW * 2 + 0.12, o.y0 - bot, sIn + sOut, 0, (o.y0 + bot) / 2, (sOut - sIn) / 2]);
      }
      for (const [bw, bh, bd, x, y, z] of local) {
        const m = new THREE.Mesh(roundedBox(bw, bh, bd, 0.025, 2), mat);
        m.position.set(x, y, z);
        g.add(m);
      }
      // 放到牆上（局部 x 沿牆、局部 z 朝外）
      if (w.alongX) g.position.set(mid, 0, w.line); else g.position.set(w.line, 0, mid);
      g.rotation.y = w.rotY;
      if (w.rotY === Math.PI) g.position.x = mid;
      exterior.add(g);
      // 背面牆 rotY=π 時，局部 x 反向；開口對稱所以沒差。側牆 rotY=±π/2 時局部 x 對應 -z / +z，也對稱。
      return { group: g, top, bot };
    }
    const [wFront, wBack, wEast] = walls;
    const winFrame = frameFor(wFront, win, { dOut: R + 0.07, dIn: R + 0.13, sillIn: R + 0.24, sillOut: R + 0.16 });
    const doorFrame = frameFor(wFront, door, { noSill: true, dOut: R + 0.06, dIn: R + 0.02 });
    frameFor(wEast, sideWin, { dIn: R - 0.01, sillIn: R - 0.01 });
    frameFor(wBack, backWin, { dIn: R - 0.01, sillIn: R - 0.01 });

    // 窗台內側的位置
    const SILL_Y = HL.sill.y, SILL_Z = HL.sill.z;

    // 前窗：十字窗櫺放在內側（窗台小東西在它前面，看得清清楚楚），沒有玻璃
    {
      const mz = Z1 - R - 0.2;   // ≈ -1.635
      const mat = trimMat;
      const v = new THREE.Mesh(roundedBox(0.05, win.y1 - win.y0, 0.05, 0.018, 2), mat);
      v.position.set(HL.window.x, (win.y0 + win.y1) / 2, mz);
      const h = new THREE.Mesh(roundedBox(win.a1 - win.a0, 0.05, 0.05, 0.018, 2), mat);
      h.position.set(HL.window.x, 1.56, mz);
      exterior.add(v, h);
    }

    // 側窗、後窗：關著的十字窗，毛玻璃透出暖光
    const innerWinTex = ctx.makeCanvasTexture(128, (g, s) => {
      g.fillStyle = '#c99566'; g.fillRect(0, 0, s, s);
      const m = s * 0.15;
      g.fillStyle = '#1f2c66'; g.fillRect(m, m, s - 2 * m, s - 2 * m);
      g.fillStyle = '#fff3d6';
      for (let i = 0; i < 7; i++) { g.beginPath(); g.arc(m + ((i * 37) % (s - 2 * m)), m + ((i * 23 + 9) % (s - 2 * m)), 1.4, 0, Math.PI * 2); g.fill(); }
      // 綁起來的小窗簾
      g.fillStyle = '#f2b6ae';
      for (const sgn of [-1, 1]) {
        const x0 = sgn < 0 ? m : s - m;

    // --- 毛絨白菜 ---
    function makeCabbage() {
      const g = new THREE.Group();
      const H = 0.3;
      // 奶白色身體（下半）
      const bodyPts = [];
      const prof = [[0, 0], [0.06, 0.004], [0.09, 0.02], [0.103, 0.055], [0.104, 0.1], [0.097, 0.15], [0.085, 0.19], [0.06, 0.22], [0.0, 0.235]];
      for (const [r, y] of prof) bodyPts.push(new THREE.Vector2(r, y));
      const body = new THREE.Mesh(new THREE.LatheGeometry(bodyPts, 28), itemMat(0xfbf3dc, { emi: 0.12 }));
      g.add(body);
      // 綠色皺皺葉子（上半）：自己做的參數曲面，下緣是波浪，頂端一圈小葉尖
      const nu = 48, nv = 14;
      const pos = [], col = [], idx = [];
      const yBotF = (ph) => 0.118 + 0.026 * Math.sin(ph * 5 + 0.6) + 0.006 * Math.sin(ph * 11);
      const yTpF = (ph) => 0.285 + 0.012 * Math.sin(ph * 7 + 0.3);
      const leafR = (ph, v) => {
        const bulge = Math.sin(Math.PI * Math.min(1, v * 1.15)) * 0.022;
        const r = 0.108 + bulge - (v > 0.7 ? (v - 0.7) / 0.3 * 0.05 : 0);
        return r * (1 + 0.06 * Math.sin(ph * 5 + 0.6 + v * 1.2) * (0.3 + v));
      };
      const cA = new THREE.Color(0xd4eeaa), cB = new THREE.Color(0xa2d77a), cc = new THREE.Color();
      for (let j = 0; j <= nv; j++) {
        const v = j / nv;
        for (let i = 0; i <= nu; i++) {
          const ph = (i / nu) * Math.PI * 2;
          const yBot = yBotF(ph), yTp = yTpF(ph);
          const y = yBot + (yTp - yBot) * v;
          // 半徑：貼著身體往上鼓起，再往中間收，加一點皺褶
          const r = leafR(ph, v);
          pos.push(Math.cos(ph) * r, y, Math.sin(ph) * r);
          cc.copy(cA).lerp(cB, Math.min(1, v * 1.1));
          col.push(cc.r, cc.g, cc.b);
        }
      }
      for (let j = 0; j < nv; j++) for (let i = 0; i < nu; i++) {
        const a = j * (nu + 1) + i, b = a + 1, c2 = a + nu + 1, d = c2 + 1;
        idx.push(a, c2, b, b, c2, d);
      }
      const lg = new THREE.BufferGeometry();
      lg.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      lg.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
      lg.setIndex(idx);
      lg.computeVertexNormals();
      const leaves = new THREE.Mesh(lg, itemMat(0xffffff, { vc: true, emi: 0.1, side: THREE.DoubleSide }));
      g.add(leaves);
      // 頂上的嫩心
      const heart = new THREE.Mesh(new THREE.SphereGeometry(0.06, 14, 10), itemMat(0xa8d97a, { emi: 0.1 }));
      heart.position.y = 0.272; heart.scale.set(1, 0.7, 1);
      g.add(heart);
      // 白色葉脈（縫線感）
      // 淡淡的葉脈（像縫上去的線）：貼在葉面上
      const veinMat = itemMat(0xeaf6d2, { emi: 0.12 });
      const veinGeo = new THREE.CapsuleGeometry(0.0045, 0.075, 3, 6);
      for (let k = 0; k < 6; k++) {
        const ph = (k / 6) * Math.PI * 2 + 0.75;
        const v = 0.42;
        const y = yBotF(ph) + (yTpF(ph) - yBotF(ph)) * v;
        const rr = leafR(ph, v) - 0.002;
        const vein = new THREE.Mesh(veinGeo, veinMat);
        vein.position.set(Math.cos(ph) * rr, y, Math.sin(ph) * rr);
        vein.quaternion.setFromAxisAngle(new THREE.Vector3(-Math.sin(ph), 0, Math.cos(ph)), 0.12);
        g.add(vein);
      }
      // 臉（在奶白色的地方）：繡上去的小黑眼睛、腮紅、小嘴
      const eyeMat = itemMat(0x2b1d1a);
      const blushMat = itemMat(PALETTE.blush, { emi: 0.15 });
      for (const sx of [-1, 1]) {
        const e = new THREE.Mesh(new THREE.SphereGeometry(0.013, 10, 8), eyeMat);
        e.position.set(sx * 0.034, 0.095, 0.1);
        e.scale.set(1, 1.25, 0.5);
        const b = new THREE.Mesh(new THREE.SphereGeometry(0.018, 10, 8), blushMat);
        b.position.set(sx * 0.062, 0.074, 0.087);
        b.scale.set(1.3, 0.75, 0.4);
        b.lookAt(sx * 0.62, 0.074, 0.87);
        g.add(e, b);
      }
      const mouth = new THREE.Mesh(new THREE.TorusGeometry(0.012, 0.0035, 5, 12, Math.PI), eyeMat);
      mouth.position.set(0, 0.078, 0.104);
      mouth.rotation.z = Math.PI;
      g.add(mouth);
      g.scale.setScalar(H / 0.3);
      return g;
    }

    // --- 彎月亮抱枕 ---
    function makeMoonPillow() {
      const g = new THREE.Group();
      const R1 = 0.15, c2x = 0.088, c2y = 0.035, R2 = 0.122;
      // 兩圓交點
      const d = Math.hypot(c2x, c2y), a = (R1 * R1 - R2 * R2 + d * d) / (2 * d), h = Math.sqrt(R1 * R1 - a * a);
      const bx = (a * c2x) / d, by = (a * c2y) / d;
      const I1 = [bx - (h * c2y) / d, by + (h * c2x) / d];   // 上交點
      const I2 = [bx + (h * c2y) / d, by - (h * c2x) / d];   // 下交點
      const pts = [];
      let t1 = Math.atan2(I1[1], I1[0]), t2 = Math.atan2(I2[1], I2[0]);
      if (t2 < t1) t2 += Math.PI * 2;
      const n = 40;
      for (let i = 0; i <= n; i++) { const t = t1 + (t2 - t1) * (i / n); pts.push([Math.cos(t) * R1, Math.sin(t) * R1]); }
      let u1 = Math.atan2(I2[1] - c2y, I2[0] - c2x), u2 = Math.atan2(I1[1] - c2y, I1[0] - c2x);
      if (u1 < u2) u1 += Math.PI * 2;       // 從下交點順時針（角度遞減）回到上交點，經過內圓左側
      for (let i = 1; i < n; i++) { const t = u1 + (u2 - u1) * (i / n); pts.push([c2x + Math.cos(t) * R2, c2y + Math.sin(t) * R2]); }
      const shape = shapeFrom(pts);
      const depth = 0.04;
      const geo = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: true, bevelThickness: 0.035, bevelSize: 0.03, bevelSegments: 5, curveSegments: 24 });
      geo.translate(0, 0, -depth / 2);
      geo.computeVertexNormals();
      const moonMat = itemMat(0xfff0b4, { emi: 0.04 });
      const body = new THREE.Mesh(geo, moonMat);
      const face = new THREE.Group();
      face.add(body);
      // 睡著的眼睛（兩條小弧線）、腮紅、小嘴
      const lineMat = itemMat(0x6b4a3a);
      const zf = depth / 2 + 0.034;
      for (const [x, y] of [[-0.118, 0.03], [-0.07, 0.034]]) {
        const eye = new THREE.Mesh(new THREE.TorusGeometry(0.014, 0.0038, 5, 12, Math.PI), lineMat);
        eye.position.set(x, y, zf);
        eye.rotation.z = Math.PI;      // 朝下彎的弧：睡著的樣子
        face.add(eye);
      }
      const blushMat = itemMat(PALETTE.blush, { emi: 0.15 });
      for (const [x, y] of [[-0.128, 0.0], [-0.05, 0.006]]) {
        const b = new THREE.Mesh(new THREE.SphereGeometry(0.014, 10, 8), blushMat);
        b.position.set(x, y, zf - 0.004);
        b.scale.set(1.4, 0.8, 0.35);
        face.add(b);
      }
      const mouth = new THREE.Mesh(new THREE.TorusGeometry(0.008, 0.003, 5, 10, Math.PI), lineMat);
      mouth.position.set(-0.092, 0.006, zf);
      mouth.rotation.z = Math.PI;
      face.add(mouth);
      // 上面那個角綁著一顆小星星
      const starPts = [];
      for (let i = 0; i < 10; i++) { const r = i % 2 ? 0.016 : 0.036; const t = Math.PI / 2 + (i / 10) * Math.PI * 2; starPts.push([Math.cos(t) * r, Math.sin(t) * r]); }
      const starGeo = new THREE.ExtrudeGeometry(shapeFrom(starPts), { depth: 0.012, bevelEnabled: true, bevelThickness: 0.008, bevelSize: 0.006, bevelSegments: 2 });
      const star = new THREE.Mesh(starGeo, itemMat(0xffd04a, { emi: 0.3 }));
      const tipU = [I1[0] + 0.012, I1[1] + 0.012];
      const thread = new THREE.Mesh(new THREE.CylinderGeometry(0.003, 0.003, 0.05, 4), lineMat);
      thread.position.set(tipU[0] + 0.012, tipU[1] - 0.025, 0.0);
      star.position.set(tipU[0] + 0.012, tipU[1] - 0.07, 0.0);
      star.rotation.z = 0.15;
      face.add(thread, star);
      face.rotation.z = -0.32;            // 稍微歪著，像靠著窗框打瞌睡
      g.add(face);
      // 讓它坐在窗台上
      face.updateMatrixWorld(true);
      const bb = new THREE.Box3().setFromObject(body);
      face.position.y = -bb.min.y;
      return g;
    }

        const bl2 = new THREE.Mesh(new THREE.SphereGeometry(0.016, 10, 8), itemMat(0xff8f9a, { emi: 0.15 }));
        bl2.position.set(sx * 0.074, 0.162, 0.082); bl2.scale.set(1.3, 0.8, 0.4);
        g.add(fl, bl, foot, bl2);
      }
      // 大大的笑
      const smile = new THREE.Mesh(new THREE.TorusGeometry(0.05, 0.0045, 6, 18, Math.PI * 0.7), itemMat(0x2a5a2a));
      smile.position.set(0, 0.182, 0.083);
      smile.rotation.z = Math.PI + Math.PI * 0.15;
      smile.rotation.x = 0.25;
      g.add(smile);
      // 亮亮的橡膠反光
      const glossMat = ctx.glow(0xffffff, 1.0, { cache: false });
      const gl1 = new THREE.Mesh(new THREE.SphereGeometry(1, 10, 8), glossMat);
      gl1.scale.set(0.016, 0.007, 0.006); gl1.position.set(-0.078, 0.2, 0.062); gl1.rotation.set(0, -0.6, 0.5);
      const gl2 = new THREE.Mesh(new THREE.SphereGeometry(1, 10, 8), glossMat);
      gl2.scale.set(0.012, 0.007, 0.006); gl2.position.set(-0.09, 0.128, 0.058); gl2.rotation.set(0, -0.7, 0.7);
      g.add(gl1, gl2);

    const items = HL.sill.items;
    const cab = makeCabbage(); cab.position.set(items.cabbage, SILL_TOP, SILL_Z); cab.rotation.set(0, 0.25, 0.06);
    const moon = makeMoonPillow(); moon.position.set(items.moonPillow, SILL_TOP, SILL_Z);
    const frog = makeFrog(); frog.position.set(items.frog, SILL_TOP, SILL_Z); frog.rotation.y = -0.3;
    sillGroup.add(cab, moon, frog);

    // ------------------------------------------------------------------
    //  11) 西側牆邊一小堆柴
    // ------------------------------------------------------------------
    {
      const wood = new THREE.Group();
      const rows = [[5, 0], [4, 1], [3, 2]];
      const r = 0.11;
      const sideG = [], capG = [];
      const cc = new THREE.Color();
      for (const [n, lvl] of rows) {
        for (let i = 0; i < n; i++) {
          const z = -4.1 + (i + lvl * 0.5) * r * 2.02;
          const y = r + lvl * r * 1.75;
          const len = 0.42 + rnd() * 0.06;
          cc.set(PALETTE.wood).lerp(C.logDark, rnd() * 0.4);
          const sg = logPiece(len, r, 0, Math.PI * 2, 10, cc);
          sg.translate(-4.82, y, z);
          sideG.push(sg);
          capG.push(endCap(r, new THREE.Vector3(-4.82 + len / 2, y, z), new THREE.Vector3(1, 0, 0)));
          capG.push(endCap(r, new THREE.Vector3(-4.82 - len / 2, y, z), new THREE.Vector3(-1, 0, 0)));
        }
      }
      wood.add(new THREE.Mesh(BGU.mergeGeometries(sideG), vcToon()));
      wood.add(new THREE.Mesh(BGU.mergeGeometries(capG), caps.material));
      exterior.add(wood);
    }

    // ------------------------------------------------------------------
    //  陰影設定
    // ------------------------------------------------------------------
    shadow(exterior);
    interior.traverse((o) => { if (o.isMesh) { o.castShadow = false; o.receiveShadow = false; } });
    sillGroup.traverse((o) => { if (o.isMesh) { o.castShadow = false; o.receiveShadow = false; } });
    glows.traverse((o) => { if (o.isMesh) { o.castShadow = false; o.receiveShadow = false; } });

    // ------------------------------------------------------------------
    //  對外：物件與鏡頭焦點
    // ------------------------------------------------------------------
    ctx.objects.house = house;
    ctx.objects.windowLight = innerLight;
    ctx.objects.windowOutLight = outLight;
    ctx.objects.sillItems = { cabbage: cab, moonPillow: moon, frog };
    ctx.anchors.house = new THREE.Vector3(HL.center[0], 1.4, Z1);
    ctx.anchors.door = new THREE.Vector3(HL.door.x, FLOOR + HL.door.height / 2, Z1);
    ctx.anchors.window = new THREE.Vector3(HL.window.x, (win.y0 + win.y1) / 2, Z1);
    ctx.anchors.sill = new THREE.Vector3(items.moonPillow, SILL_TOP + 0.14, SILL_Z);
    ctx.anchors.chimney = new THREE.Vector3(CH.x, CH.top + 0.1, CH.z);

    // ------------------------------------------------------------------
    //  動畫：暖光切換、微微的燭光閃動、煙
    // ------------------------------------------------------------------
    let level = 0;
    const cur = { c: LEVELS[0].c.clone(), k: LEVELS[0].k };
    const from = { c: cur.c.clone(), k: cur.k };
    let transStart = -1;
    ctx.events.on('window:warm', () => {
      from.c.copy(cur.c); from.k = cur.k;
      level = (level + 1) % LEVELS.length;
      transStart = ctx.time;
    });
    let rm = ctx.reducedMotion;
    ctx.events.on('reducedmotion', (v) => { rm = !!v; });

    const BASE_IN = innerLight.intensity, BASE_OUT = outLight.intensity, BASE_FILL = roomFill.intensity;
    const fillBase = new THREE.Color(0xffc89a), fillTmp = new THREE.Color();
    ctx.onUpdate((t, dt) => {
      // 暖度過渡（約 2 秒）
      if (transStart >= 0) {
        const p = ctx.clamp01((t - transStart) / 2.0);
        const e = EASE.inOutSine(p);
        const to = LEVELS[level];
        cur.c.copy(from.c).lerp(to.c, e);
        cur.k = from.k + (to.k - from.k) * e;
        if (p >= 1) transStart = -1;
      }
      // 燭光般的小閃動（減少動態時關掉）
      let fl = 1;
      if (!rm) fl = 1 + 0.022 * Math.sin(t * 7.1) + 0.016 * Math.sin(t * 12.7 + 1.3) + 0.012 * Math.sin(t * 3.3 + 0.4);
      warmU.value.copy(cur.c);
      warmK.value = cur.k * (0.6 + 0.4 * fl);
      innerLight.color.copy(cur.c);
      innerLight.intensity = BASE_IN * cur.k * fl;
      outLight.color.copy(cur.c);
      outLight.intensity = BASE_OUT * cur.k * fl;
      fillTmp.copy(fillBase).lerp(cur.c, 0.5);
      roomFill.color.copy(fillTmp);
      roomFill.intensity = BASE_FILL * (0.85 + 0.15 * cur.k);
      itemFill.intensity = 0.42 * (0.9 + 0.1 * cur.k);
      itemKey.color.copy(cur.c);
      itemKey.intensity = 1.15 * (0.85 + 0.15 * cur.k) * fl;

      // 煙：一團一團往上飄、慢慢變大變淡，被風往 +x 吹；每一輪的路線都有點不一樣
      const speed = rm ? 0.35 : 1;
      const LIFE = 8;
      for (const pf of puffs) {
        const life = (t * speed) / LIFE + pf.phase;
        const age = life % 1;
        const cyc = Math.floor(life);
        const h1 = Math.sin(cyc * 12.9898 + pf.seed * 78.233) * 43758.5453;
        const r1 = h1 - Math.floor(h1), r2 = (h1 * 1.37) - Math.floor(h1 * 1.37);
        const rise = age * 2.2;
        const drift = age * age * 1.5 + age * 0.15;
        pf.mesh.position.set(
          smokeOrigin.x + drift + Math.sin(age * 4 + r1 * 6) * 0.1 * age,
          smokeOrigin.y + rise,
          smokeOrigin.z + (r2 - 0.5) * 0.5 * age + Math.sin(age * 3 + r2 * 6) * 0.06,
        );
        const sc = 0.09 + age * 0.3 * (0.85 + r1 * 0.3);
        pf.mesh.scale.set(sc * 1.05, sc * 0.85, sc);
        pf.mesh.rotation.set(r1 * 6 + age * 0.6, r2 * 6 + age * 0.9, 0);
        const fadeIn = ctx.clamp01(age / 0.1), fadeOut = 1 - ctx.clamp01((age - 0.3) / 0.7);
        pf.mat.opacity = (rm ? 0.22 : 0.36) * fadeIn * fadeOut * fadeOut;
        pf.mesh.visible = pf.mat.opacity > 0.008;
      }
    });
  },
});

// ---------------------------------------------------------------- parts/15-porch.js
// ---- 門廊：兩階木台階、台階上的一枝玫瑰、窗下的花壇、褪色的塑膠小鏟子、屋簷下的紅燈籠 ----
PARTS.push({
  name: 'porch',
  order: 15,
  build(ctx) {
    const { THREE, TSL, LAYOUT, PALETTE, toon, shadow, roundedBox, scene } = ctx;
    const H = LAYOUT.house;
    const rnd = ctx.rand(1515);
    const DS = THREE.DoubleSide;

    const porch = new THREE.Group();
    porch.name = 'porch';
    scene.add(porch);
    ctx.objects.porch = porch;

    const lin = (hex) => new THREE.Color(hex); // 轉成線性色值（給頂點色用）
    const v3 = (x, y, z) => new THREE.Vector3(x, y, z);

    // 葉片幾何：從原點沿 +z 長出去，寬度沿 x，葉面朝 +y。
    // curl > 0 葉尖往上翹、< 0 往下垂；fold 讓中肋凹成淺 V；shape 控制最寬處的位置（越小越靠葉基）。
    function leafGeo(len, width, { curl = 0, fold = 0.35, segL = 7, segW = 2, shape = 0.8, round = 0.75 } = {}) {
      const pos = [], idx = [];
      const cols = segW * 2 + 1;
      for (let j = 0; j <= segL; j++) {
        const v = j / segL;
        const env = Math.pow(Math.max(0, Math.sin(Math.PI * Math.pow(v, shape))), round);
        for (let i = 0; i < cols; i++) {
          const s = (i / (cols - 1)) * 2 - 1;
          const x = s * width * 0.5 * env;
          const y = curl * v * v * len + fold * Math.abs(s) * env * width * 0.5;
          pos.push(x, y, v * len);
        }
      }
      for (let j = 0; j < segL; j++) {
        for (let i = 0; i < cols - 1; i++) {
          const a = j * cols + i, b = a + 1, c = a + cols, d = c + 1;
          idx.push(a, c, b, b, c, d);
        }
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      g.setIndex(idx);
      g.computeVertexNormals();
      return g;
    }

    // 把物件的 +z 對準 dir，+y 盡量靠近 up
    function aim(obj, dir, up = v3(0, 1, 0)) {
      obj.up.copy(up);
      obj.lookAt(obj.position.clone().add(dir));
      return obj;
    }

    // =====================================================================
    //  1. 木台階：兩階，厚實的木板踏面、稍深的踢面、踏面兩端各兩顆小釘子
    // =====================================================================
    const S = H.steps;
    const steps = new THREE.Group();
    steps.name = 'steps';
    steps.position.set(S.x, 0, 0);
    porch.add(steps);
    {
      const treadMat = toon(PALETTE.woodLight);
      const riserMats = [toon(PALETTE.wood), toon(0xa06c45)];
      const nailMat = toon(0x5a3d2c);
      const W = S.width;
      const zMid = -0.79;                 // 上階踏面的前緣（玫瑰橫放在上階）
      const topH = S.height, lowH = S.height / 2;
      const plankT = 0.07;
      const nailGeo = new THREE.SphereGeometry(0.014, 8, 5);
      nailGeo.scale(1, 0.45, 1);
      const addNails = (z, y) => {
        for (const sx of [-1, 1]) for (const dz of [-0.055, 0.055]) {
          const n = new THREE.Mesh(nailGeo, nailMat);
          n.position.set(sx * (W / 2 - 0.05), y, z + dz);
          steps.add(n);
        }
      };
      // 上階：兩片踏板
      const upperDepth = zMid - S.z0 + 0.01;
      const pd = (upperDepth - 0.012) / 2;
      for (let k = 0; k < 2; k++) {
        const plank = new THREE.Mesh(roundedBox(W + 0.06, plankT, pd, 0.03, 3), treadMat);
        const z = S.z0 + pd / 2 + k * (pd + 0.012) - 0.005;
        plank.position.set((rnd() - 0.5) * 0.012, topH - plankT / 2, z);
        plank.rotation.y = (rnd() - 0.5) * 0.012;
        steps.add(plank);
        addNails(z, topH);
      }
      // 上階踢面：兩條橫木疊起來
      const upBodyH = topH - plankT;
      const upBodyD = zMid - S.z0 - 0.03;
      for (let k = 0; k < 2; k++) {
        const b = new THREE.Mesh(roundedBox(W - 0.03, upBodyH / 2 - 0.004, upBodyD, 0.022, 2), riserMats[k]);
        b.position.set(0, upBodyH / 4 + k * upBodyH / 2, S.z0 + upBodyD / 2);
        steps.add(b);
      }
      // 下階：一片踏板 + 一條踢面
      const lowD = S.z1 - zMid + 0.012;
      const lowPlank = new THREE.Mesh(roundedBox(W + 0.06, plankT, lowD, 0.03, 3), treadMat);
      const lowZ = zMid - 0.012 + lowD / 2;
      lowPlank.position.set(0.004, lowH - plankT / 2, lowZ);
      lowPlank.rotation.y = 0.008;
      steps.add(lowPlank);
      addNails(lowZ, lowH);
      const lowBodyD = lowD - 0.04;
      const lb = new THREE.Mesh(roundedBox(W - 0.03, lowH - plankT, lowBodyD, 0.02, 2), riserMats[1]);
      lb.position.set(0, (lowH - plankT) / 2, zMid - 0.01 + lowBodyD / 2);
      steps.add(lb);
      // 兩側的深色側板（讓台階更厚實）
      const sideShape = new THREE.Shape();
      sideShape.moveTo(0, 0);
      sideShape.lineTo(S.z1 - S.z0 - 0.04, 0);
      sideShape.lineTo(S.z1 - S.z0 - 0.04, lowH - plankT);
      sideShape.lineTo(zMid - S.z0 - 0.02, lowH - plankT);
      sideShape.lineTo(zMid - S.z0 - 0.02, topH - plankT);
      sideShape.lineTo(0, topH - plankT);
      sideShape.closePath();
      const sideGeo = new THREE.ExtrudeGeometry(sideShape, { depth: 0.05, bevelEnabled: true, bevelThickness: 0.012, bevelSize: 0.012, bevelSegments: 2 });
      for (const sx of [-1, 1]) {
        const sm = new THREE.Mesh(sideGeo, toon(PALETTE.woodDark));
        sm.rotation.y = -Math.PI / 2;            // shape 的 x → 世界 +z，擠出方向 → 世界 -x
        sm.position.set(sx > 0 ? W / 2 - 0.02 : -W / 2 + 0.07, 0.001, S.z0);
        steps.add(sm);
      }
      shadow(steps);
    }
    ctx.anchors.steps = v3(S.x, S.height, (S.z0 + S.z1) / 2);

    // =====================================================================
    //  2. 玫瑰：一枝長梗紅玫瑰，斜斜地橫放在上階
    // =====================================================================
    const rose = new THREE.Group();
    rose.name = 'rose';
    porch.add(rose);
    {
      // ---- 花瓣：一片片圓柱面上的弧形殼，越外圈越張開、邊緣往外翻 ----
      const cDeep = lin(0x820a10), cMid = lin(0xdc2a36), cEdge = lin(0xff7a6a); // PALETTE.rose 往暖一點偏，月光下才不會變桃紅
      function petalGeo({ r0, h, span, open, roll, dark = 1, segU = 8, segV = 7 }) {
        const pos = [], col = [], idx = [];
        const c = new THREE.Color();
        for (let j = 0; j <= segV; j++) {
          const v = j / segV;
          const env = v < 0.55 ? 0.62 + 0.38 * Math.sin((v / 0.55) * Math.PI / 2) : Math.max(0.1, Math.sqrt(Math.max(0, 1 - ((v - 0.55) / 0.45) ** 2)));
          for (let i = 0; i <= segU; i++) {
            const s = (i / segU) * 2 - 1;
            const phi = s * span * 0.5 * env;
            const R = r0 + v * h * Math.sin(open) + roll * h * (0.7 * v ** 3 + 0.55 * v * v * s * s);
            const y = v * h * Math.cos(open) - roll * h * 0.35 * v ** 3;
            pos.push(Math.cos(phi) * R, y, Math.sin(phi) * R);
            // 花瓣底部深紅、中間玫瑰紅、邊緣淡一點
            c.copy(cDeep).lerp(cMid, Math.min(1, v / 0.55));
            const edge = THREE.MathUtils.smoothstep(Math.max(v, Math.abs(s) * v * 1.1), 0.72, 1.0);
            c.lerp(cEdge, edge * 0.85);
            c.multiplyScalar(dark);
            col.push(c.r, c.g, c.b);
          }
        }
        for (let j = 0; j < segV; j++) for (let i = 0; i < segU; i++) {
          const a = j * (segU + 1) + i, b = a + 1, cc = a + segU + 1, d = cc + 1;
          idx.push(a, cc, b, b, cc, d);
        }
        const g = new THREE.BufferGeometry();
        g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
        g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
        g.setIndex(idx);
        g.computeVertexNormals();
        return g;
      }
      const rings = [
        { n: 3, r0: 0.004, h: 0.052, span: 3.4, open: 0.06, roll: 0.0, dark: 0.72, rot: 0.0, y: 0.012 },
        { n: 3, r0: 0.010, h: 0.058, span: 3.0, open: 0.16, roll: 0.05, dark: 0.82, rot: 1.05, y: 0.008 },
        { n: 4, r0: 0.016, h: 0.064, span: 2.5, open: 0.34, roll: 0.14, dark: 0.92, rot: 0.4, y: 0.004 },
        { n: 5, r0: 0.022, h: 0.068, span: 2.05, open: 0.52, roll: 0.3, dark: 1.0, rot: 0.95, y: 0.0 },
        { n: 5, r0: 0.026, h: 0.068, span: 1.8, open: 0.82, roll: 0.42, dark: 1.0, rot: 0.32, y: -0.004 },
      ];
      const petalGeos = [];
      for (const r of rings) {
        for (let k = 0; k < r.n; k++) {
          const g = petalGeo({ ...r, h: r.h * (0.94 + rnd() * 0.12) });
          g.rotateY(r.rot + (k / r.n) * Math.PI * 2 + (rnd() - 0.5) * 0.25);
          g.translate(0, r.y, 0);
          petalGeos.push(g);
        }
      }
      const petalMat = toon(0xffffff, { side: DS, cache: false, emissive: 0x2a0306, emissiveIntensity: 1 }); // 一點點自發光，暗處也看得出紅
      petalMat.vertexColors = true;
      const head = new THREE.Group();
      head.add(new THREE.Mesh(ctx.BufferGeometryUtils.mergeGeometries(petalGeos), petalMat));
      // 花心的小花苞
      const bud = new THREE.Mesh(new THREE.SphereGeometry(0.016, 10, 8), toon(0x8e1222));
      bud.scale.set(1, 1.7, 1);
      bud.position.y = 0.03;
      head.add(bud);

      // ---- 花萼與花托 ----
      const greenDark = toon(0x2f6a35, { side: DS, flat: true });
      const green = toon(0x4c8a3f, { side: DS, flat: true });
      const stemMat = toon(0x3f7a38);
      const hip = new THREE.Mesh(new THREE.SphereGeometry(0.02, 10, 8), stemMat);
      hip.scale.set(1, 0.9, 1);
      hip.position.y = -0.006;
      head.add(hip);
      const sepalGeo = leafGeo(0.06, 0.018, { curl: -0.45, fold: 0.2, segL: 5, segW: 1, shape: 0.6 });
      for (let k = 0; k < 5; k++) {
        const a = (k / 5) * Math.PI * 2 + 0.3;
        const sp = new THREE.Mesh(sepalGeo, greenDark);
        sp.position.set(Math.cos(a) * 0.012, 0.0, Math.sin(a) * 0.012);
        // 沿著花托往外、稍微往下翻
        aim(sp, v3(Math.cos(a), -0.15, Math.sin(a)).normalize(), v3(0, 1, 0));
        head.add(sp);
      }

      // ---- 花梗（在 head 的座標裡往 -y 長）----
      const L = 0.36;
      const stemCurve = new THREE.CatmullRomCurve3([
        v3(0, -0.01, 0), v3(0.003, -0.09, 0.002), v3(-0.002, -0.19, -0.002), v3(0.002, -0.28, 0.001), v3(0, -L, 0),
      ]);
      const stem = new THREE.Mesh(new THREE.TubeGeometry(stemCurve, 24, 0.0105, 7), stemMat);
      // 切口：梗尾一個小圓蓋
      const cut = new THREE.Mesh(new THREE.CircleGeometry(0.0105, 7), toon(0x7fae62));
      cut.position.set(0, -L, 0);
      cut.rotation.x = Math.PI / 2;
      // 刺
      const thornGeo = new THREE.ConeGeometry(0.006, 0.02, 5);
      const thornMat = toon(0x6b5a2e);
      const thorns = new THREE.Group();
      for (const [y, a] of [[-0.075, 0.6], [-0.165, 2.6], [-0.235, 4.4], [-0.31, 1.4]]) {
        const th = new THREE.Mesh(thornGeo, thornMat);
        th.position.set(Math.cos(a) * 0.012, y, Math.sin(a) * 0.012);
        aim(th, v3(Math.cos(a), -0.6, Math.sin(a)).normalize());
        th.rotateX(Math.PI / 2); // cone 的尖端在 +y，轉到 +z
        thorns.add(th);
      }
      // 葉子：兩組（各一片頂葉 + 兩片小側葉），平平地往兩側伸，葉面朝上（head 座標的 +z）
      const leafBig = leafGeo(0.085, 0.05, { curl: -0.08, fold: 0.3, segL: 7, segW: 2, shape: 0.85 });
      const leafSmall = leafGeo(0.055, 0.032, { curl: -0.06, fold: 0.3, segL: 6, segW: 2, shape: 0.85 });
      const leaves = new THREE.Group();
      const petioleMat = stemMat;
      for (const [y, side] of [[-0.135, 1], [-0.245, -1]]) {
        const base = v3(side * 0.008, y, 0);
        // 葉柄：往側面、朝花的方向斜出
        const dir = v3(side * 0.8, 0.55, -0.05).normalize();
        const pLen = 0.07;
        const tip = base.clone().addScaledVector(dir, pLen);
        const pet = new THREE.Mesh(new THREE.TubeGeometry(new THREE.LineCurve3(base, tip), 2, 0.0045, 5), petioleMat);
        leaves.add(pet);
        const top = new THREE.Mesh(leafBig, side > 0 ? green : greenDark);
        top.position.copy(tip);
        aim(top, dir.clone().add(v3(0, 0, side > 0 ? -0.34 : -0.2)).normalize(), v3(0, 0, 1)); // 葉尖垂向台階
        leaves.add(top);
        for (const s2 of [-1, 1]) {
          const lp = base.clone().addScaledVector(dir, pLen * 0.55);
          const sl = new THREE.Mesh(leafSmall, green);
          sl.position.copy(lp);
          const ld = dir.clone().applyAxisAngle(v3(0, 0, 1), s2 * 0.95).add(v3(0, 0, side > 0 ? -0.3 : -0.18)).normalize();
          aim(sl, ld, v3(0, 0, 1));
          leaves.add(sl);
        }
      }

      // ---- 組起來：花頭軸 = 局部 +y；梗往 -y；葉面朝局部 +z ----
      const roseLocal = new THREE.Group();
      roseLocal.add(head, stem, cut, thorns, leaves);
      // 花頭稍微往上抬一點，讓花面看得到
      head.rotation.x = 0.06;
      const scale = 1.25;  // 誇張一點的大小（全長約 0.5）
      roseLocal.scale.setScalar(scale);

      // 放倒：花頭朝向 D（水平斜方向、稍微往上），局部 +z 變成世界的上方。
      // 花頭最低的花瓣壓在台階上、梗尾碰到台階 → 反覆調幾次 tilt 與花頭高度。
      const yaw = 0.34;                                     // 與 +x 軸的夾角（斜放）
      const dirH = v3(Math.cos(yaw), 0, Math.sin(yaw));     // 花頭朝 +x、+z 一點（面向門前）
      const [rx, ry, rz] = H.rose;
      const stepY = S.height;
      const place = (tilt, headY) => {
        const D = dirH.clone().multiplyScalar(Math.cos(tilt)).add(v3(0, Math.sin(tilt), 0)).normalize();
        const X = new THREE.Vector3().crossVectors(D, v3(0, 1, 0)).normalize();
        const Z = new THREE.Vector3().crossVectors(X, D).normalize();
        roseLocal.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(X, D, Z));
        roseLocal.position.set(rx, headY, rz).addScaledVector(dirH, 0.17);
        rose.updateMatrixWorld(true);
      };
      rose.add(roseLocal);
      let tilt = 0.18, headY = ry + 0.08;
      const box = new THREE.Box3();
      for (let i = 0; i < 4; i++) {
        place(tilt, headY);
        box.setFromObject(head, true);
        headY += stepY - 0.006 - box.min.y;               // 外圈花瓣微微壓扁在台階上
        tilt = Math.asin(Math.min(0.5, Math.max(0.02, (headY - stepY - 0.0105 * scale) / (L * scale))));
      }
      place(tilt, headY);
      shadow(rose);
      ctx.anchors.rose = head.getWorldPosition(new THREE.Vector3()).lerp(v3(rx, ry, rz), 0.35);
    }

    // =====================================================================
    //  3. 花壇：木板框、深色的土、幾朵粉嫩的鬱金香和小雛菊
    // =====================================================================
    const F = H.flowerbed;
    const bed = new THREE.Group();
    bed.name = 'flowerbed';
    porch.add(bed);
    const bw = F.x1 - F.x0, bd = F.z1 - F.z0;
    const bcx = (F.x0 + F.x1) / 2, bcz = (F.z0 + F.z1) / 2;
    const soilY = F.height - 0.03;   // 土面（四周略低於框頂）
    {
      const T = 0.07;                        // 木板厚度
      const plankH = (F.height - 0.006) / 2;  // 兩條橫木疊起來
      const plankMats = [toon(PALETTE.wood), toon(PALETTE.woodLight), toon(0xa06c45)];
      const frame = new THREE.Group();
      let mi = 0;
      for (let k = 0; k < 2; k++) {
        const y = plankH / 2 + k * (plankH + 0.006);
        // 前後（沿 x）
        for (const z of [F.z0 + T / 2, F.z1 - T / 2]) {
          const p = new THREE.Mesh(roundedBox(bw - 0.04, plankH, T, 0.025, 2), plankMats[mi++ % 3]);
          p.position.set(bcx + (rnd() - 0.5) * 0.01, y, z);
          frame.add(p);
        }
        // 左右（沿 z）
        for (const x of [F.x0 + T / 2, F.x1 - T / 2]) {
          const p = new THREE.Mesh(roundedBox(T, plankH, bd - 0.04, 0.025, 2), plankMats[mi++ % 3]);
          p.position.set(x, y, bcz + (rnd() - 0.5) * 0.01);
          frame.add(p);
        }
      }
      // 四角的小方柱，頂端圓圓的、稍微高出來
      const postH = F.height + 0.02;
      const postGeo = roundedBox(0.1, postH, 0.1, 0.04, 3);
      const postMat = toon(PALETTE.woodDark);
      for (const x of [F.x0 + 0.045, F.x1 - 0.045]) for (const z of [F.z0 + 0.045, F.z1 - 0.045]) {
        const post = new THREE.Mesh(postGeo, postMat);
        post.position.set(x, postH / 2, z);
        frame.add(post);
      }
      shadow(frame);
      bed.add(frame);

      // 土：凹凸的低多邊形面
      const iw = bw - 2 * T + 0.02, id = bd - 2 * T + 0.02;
      const soilGeo = new THREE.PlaneGeometry(iw, id, 18, 7);
      soilGeo.rotateX(-Math.PI / 2);
      const sp = soilGeo.attributes.position;
      const soilCols = [];
      const cA = lin(0x5e3d2a), cB = lin(0x70492f), cC = lin(0x4a3022);
      const tmpC = new THREE.Color();
      for (let i = 0; i < sp.count; i++) {
        const x = sp.getX(i), z = sp.getZ(i);
        const edge = Math.abs(x) > iw / 2 - 0.01 || Math.abs(z) > id / 2 - 0.01;
        const lump = edge ? 0 : 0.014 * Math.sin(x * 23 + z * 7) * Math.cos(z * 19 - x * 5) + (rnd() - 0.5) * 0.012;
        sp.setY(i, lump + (edge ? -0.006 : 0.004));
        const k = rnd();
        tmpC.copy(cA).lerp(k < 0.5 ? cB : cC, Math.abs(k - 0.5) * 1.4);
        soilCols.push(tmpC.r, tmpC.g, tmpC.b);
      }
      soilGeo.setAttribute('color', new THREE.Float32BufferAttribute(soilCols, 3));
      soilGeo.computeVertexNormals();
      const soilMat = toon(0xffffff, { flat: true, cache: false });
      soilMat.vertexColors = true;
      const soil = new THREE.Mesh(soilGeo, soilMat);
      soil.position.set(bcx, soilY, bcz);
      soil.receiveShadow = true;
      bed.add(soil);
      // 幾顆小石子
      const pebMat = toon(0x9a9088, { flat: true });
      for (const [x, z, s] of [[-1.62, -0.6, 0.022], [-1.05, -0.58, 0.018], [-1.98, -1.12, 0.02], [-0.78, -0.62, 0.016]]) {
        const pb = new THREE.Mesh(new THREE.DodecahedronGeometry(s, 0), pebMat);
        pb.position.set(x, soilY + s * 0.4, z);
        pb.scale.y = 0.6;
        pb.rotation.set(rnd() * 3, rnd() * 3, rnd() * 3);
        bed.add(pb);
      }

      // ---- 花 ----
      const stemMat = toon(0x4f8f45);
      const leafMat = toon(0x5a9c4c, { side: DS, flat: true });
      const leafMat2 = toon(0x3f7d42, { side: DS, flat: true });

      // 鬱金香的花杯：車床旋轉成蛋形杯子，杯口三個尖
      function tulipCup(r, h, tips = 3, tipH = 0.18) {
        const pts = [];
        const n = 8;
        for (let i = 0; i <= n; i++) {
          const t = i / n;
          const rr = r * Math.pow(Math.sin(Math.min(1, t * 1.1) * Math.PI * 0.62 + 0.05), 1.0) * (1 - 0.18 * t * t);
          pts.push(new THREE.Vector2(Math.max(0.001, rr), t * h));
        }
        const g = new THREE.LatheGeometry(pts, 15);
        const p = g.attributes.position;
        for (let i = 0; i < p.count; i++) {
          const y = p.getY(i);
          const k = THREE.MathUtils.smoothstep(y / h, 0.55, 1.0);
          const a = Math.atan2(p.getZ(i), p.getX(i));
          p.setY(i, y + k * h * tipH * Math.cos(tips * a));
        }
        g.computeVertexNormals();
        return g;
      }
      function tulip(x, z, h, hex, lean = [0, 0]) {
        const g = new THREE.Group();
        g.position.set(x, soilY, z);
        const top = v3(lean[0], h, lean[1]);
        const curve = new THREE.QuadraticBezierCurve3(v3(0, 0, 0), v3(lean[0] * 0.2, h * 0.5, lean[1] * 0.2), top);
        g.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 6, 0.015, 6), stemMat));
        const petal = toon(hex, { side: DS });
        const inner = new THREE.Mesh(tulipCup(0.062, 0.125, 3, 0.2), petal);
        const outer = new THREE.Mesh(tulipCup(0.074, 0.11, 3, 0.22), petal);
        outer.rotation.y = Math.PI / 3;
        const headG = new THREE.Group();
        headG.add(inner, outer);
        headG.position.copy(top).add(v3(0, -0.012, 0));
        headG.rotation.set(lean[1] * 1.4, rnd() * 3, -lean[0] * 1.4);
        g.add(headG);
        // 兩片長葉子，從土裡往外彎
        const blade = leafGeo(h * 0.66, 0.085, { curl: -0.28, fold: 0.45, segL: 7, segW: 1, shape: 0.55, round: 0.6 });
        for (let k = 0; k < 2; k++) {
          const a = rnd() * 6.28 + k * Math.PI;
          const lf = new THREE.Mesh(blade, k ? leafMat : leafMat2);
          lf.position.set(Math.cos(a) * 0.012, 0.0, Math.sin(a) * 0.012);
          aim(lf, v3(Math.cos(a) * 0.45, 1, Math.sin(a) * 0.45).normalize(), v3(-Math.cos(a), 0.2, -Math.sin(a)));
          g.add(lf);
        }
        bed.add(g);
        return g;
      }
      // 小雛菊：白色花瓣一圈 + 黃色圓心，花面朝上、往前（+z）傾
      const daisyPetalGeo = (() => {
        const list = [];
        const N = 11;
        for (let i = 0; i < N; i++) {
          const pg = new THREE.SphereGeometry(1, 7, 4);
          pg.scale(0.042, 0.009, 0.0165);
          pg.translate(0.048, 0, 0);
          pg.rotateZ(-0.12); // 花瓣尖端微微往上翹
          pg.rotateY((i / N) * Math.PI * 2);
          list.push(pg);
        }
        return ctx.BufferGeometryUtils.mergeGeometries(list);
      })();
      const daisyCenterGeo = new THREE.SphereGeometry(0.027, 12, 7);
      daisyCenterGeo.scale(1, 0.55, 1);
      const daisyCenterMat = toon(0xffc94a);
      function daisy(x, z, h, hex, face = 0.45) {
        const g = new THREE.Group();
        g.position.set(x, soilY, z);
        const top = v3(0.01, h, 0.015);
        const curve = new THREE.QuadraticBezierCurve3(v3(0, 0, 0), v3(-0.01, h * 0.5, 0), top);
        g.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 6, 0.011, 6), stemMat));
        const headG = new THREE.Group();
        headG.add(new THREE.Mesh(daisyPetalGeo, toon(hex)));
        const c = new THREE.Mesh(daisyCenterGeo, daisyCenterMat);
        c.position.y = 0.006;
        headG.add(c);
        headG.position.copy(top);
        headG.rotation.set(face, rnd() * 3, (rnd() - 0.5) * 0.3);
        headG.scale.setScalar(1.15);
        g.add(headG);
        // 底部的小葉片
        const small = leafGeo(0.09, 0.045, { curl: -0.3, fold: 0.35, segL: 5, segW: 1, shape: 0.8 });
        for (let k = 0; k < 3; k++) {
          const a = rnd() * 0.5 + (k / 3) * Math.PI * 2;
          const lf = new THREE.Mesh(small, leafMat);
          lf.position.set(0, 0.004, 0);
          aim(lf, v3(Math.cos(a), 0.55, Math.sin(a)).normalize());
          g.add(lf);
        }
        bed.add(g);
        return g;
      }
      // 低矮的一叢圓葉子
      function leafClump(x, z, s = 1) {
        const g = new THREE.Group();
        g.position.set(x, soilY, z);
        const lg = leafGeo(0.09 * s, 0.06 * s, { curl: -0.35, fold: 0.4, segL: 6, segW: 2, shape: 0.9 });
        const n = 5;
        for (let k = 0; k < n; k++) {
          const a = (k / n) * Math.PI * 2 + rnd() * 0.5;
          const lf = new THREE.Mesh(lg, k % 2 ? leafMat : leafMat2);
          aim(lf, v3(Math.cos(a), 0.75 + rnd() * 0.3, Math.sin(a)).normalize());
          g.add(lf);
        }
        bed.add(g);
      }

      tulip(-1.93, -0.98, 0.3, 0xffa9c2, [0.02, 0.03]);       // 粉紅
      daisy(-1.72, -0.7, 0.19, 0xfffaf0, 0.5);                 // 白
      tulip(-1.47, -1.05, 0.36, 0xfff2dc, [-0.01, 0.02]);      // 奶油白
      leafClump(-1.28, -0.74, 1.3);
      daisy(-1.12, -1.0, 0.26, 0xfff0a0, 0.42);                // 奶油黃
      tulip(-0.88, -0.8, 0.29, 0xe6b8ee, [0.03, 0.02]);        // 淡紫粉
      daisy(-0.68, -1.08, 0.22, 0xfffaf0, 0.5);                // 白
      leafClump(-1.98, -0.66, 1.1);
      leafClump(-0.96, -1.15, 1.0);
      bed.traverse((o) => { if (o.isMesh && o !== soil) { o.castShadow = true; o.receiveShadow = true; } });
    }
    ctx.anchors.flowerbed = v3(bcx, F.height + 0.12, bcz);

    // =====================================================================
    //  4. 小鏟子：曬到褪色的紅色塑膠沙鏟，斜插在花壇右前角
    // =====================================================================
    const shovel = new THREE.Group();
    shovel.name = 'shovel';
    porch.add(shovel);
    {
      // 局部座標：原點 = 插進土裡的那一點，+y 沿著鏟柄往上，鏟面凹的那側朝 +z
      const parts = [];
      // 鏟面：圓肩、尖圓頭，擠出後帶圓角，再彎成淺淺的勺子
      const bs = new THREE.Shape();
      const top = 0.11, wHalf = 0.07, tip = -0.06;
      bs.moveTo(0, top);
      bs.lineTo(-wHalf + 0.016, top);
      bs.quadraticCurveTo(-wHalf, top, -wHalf, top - 0.016);
      bs.bezierCurveTo(-wHalf - 0.002, 0.0, -0.05, -0.055, 0, tip);
      bs.bezierCurveTo(0.05, -0.055, wHalf + 0.002, 0.0, wHalf, top - 0.016);
      bs.quadraticCurveTo(wHalf, top, wHalf - 0.016, top);
      bs.closePath();
      const blade = new THREE.ExtrudeGeometry(bs, { depth: 0.008, bevelEnabled: true, bevelThickness: 0.006, bevelSize: 0.006, bevelSegments: 2, curveSegments: 10 });
      blade.translate(0, 0, -0.004);
      {
        const p = blade.attributes.position;
        for (let i = 0; i < p.count; i++) {
          const x = p.getX(i), y = p.getY(i);
          // 兩側翹起（勺子形），往尖端也稍微彎
          p.setZ(i, p.getZ(i) + 3.2 * x * x + 0.35 * (y - top) * (y - top));
        }
        blade.deleteAttribute('uv');
        blade.computeVertexNormals();
      }
      parts.push(blade);
      // 鏟頸：從鏟面收到鏟柄
      const neck = new THREE.CylinderGeometry(0.018, 0.034, 0.045, 12);
      neck.scale(1, 1, 0.55);
      neck.translate(0, top + 0.018, 0.0);
      parts.push(neck);
      // 鏟柄
      const shaftLen = 0.16;
      const shaft = new THREE.CylinderGeometry(0.0165, 0.0175, shaftLen, 12);
      shaft.translate(0, top + 0.04 + shaftLen / 2, 0);
      parts.push(shaft);
      // D 形握把：圓角三角形的環 + 上面一根胖胖的握桿
      const hy = top + 0.04 + shaftLen - 0.008;
      const loop = new THREE.CatmullRomCurve3([
        v3(0, hy, 0), v3(0.03, hy + 0.04, 0), v3(0.05, hy + 0.085, 0), v3(0.04, hy + 0.1, 0),
        v3(0, hy + 0.103, 0), v3(-0.04, hy + 0.1, 0), v3(-0.05, hy + 0.085, 0), v3(-0.03, hy + 0.04, 0),
      ], true, 'centripetal');
      parts.push(new THREE.TubeGeometry(loop, 56, 0.0125, 8, true));
      const grip = new THREE.CapsuleGeometry(0.0175, 0.065, 4, 12);
      grip.rotateZ(Math.PI / 2);
      grip.translate(0, hy + 0.1, 0);
      parts.push(grip);
      const merged = ctx.BufferGeometryUtils.mergeGeometries(parts.map((g) => {
        const gg = g.index ? g.toNonIndexed() : g;
        for (const k of Object.keys(gg.attributes)) if (k !== 'position' && k !== 'normal') gg.deleteAttribute(k);
        return gg;
      }));

      // 褪色：大塊的淡斑 + 越往上越白 + 細細的刮痕 + 靠近土的地方沾一點泥
      const { positionLocal: p, mx_noise_float: noise, smoothstep, mix, color, vec3, float } = TSL;
      const nA = noise(p.mul(11.0)).mul(0.5).add(0.5);
      const nB = noise(p.mul(vec3(140.0, 26.0, 140.0)).add(vec3(3.1, 1.7, 0.4))).mul(0.5).add(0.5);
      const sun = smoothstep(0.0, 0.34, p.y);
      const fade = smoothstep(0.5, 0.85, nA).mul(0.28).add(sun.mul(0.3)).add(smoothstep(0.76, 0.86, nB).mul(0.3)).add(0.08).clamp(0.0, 0.7);
      const faded = mix(color(PALETTE.shovel), color(0xf7d9cd), fade);
      const dirt = float(1.0).sub(smoothstep(0.0, 0.045, p.y)).mul(smoothstep(0.25, 0.6, nA.add(0.15)));
      const shovelMat = toon(0xffffff, { cache: false });
      shovelMat.colorNode = mix(faded, color(0x6e4a36), dirt.mul(0.75));
      const mesh = new THREE.Mesh(merged, shovelMat);
      shovel.add(mesh);

      // 插進一小坨土堆裡：往外（+x、稍微 +z）斜，鏟面朝前；鏟面露出大半，從花壇外看得到
      const [sx, sy, sz] = H.shovel;
      const MOUND = 0.03;                   // 土堆比土面高一點
      shovel.position.set(sx, sy + MOUND, sz);
      const lean = v3(1.0, 0, 0.22).normalize();
      const axis = new THREE.Vector3().crossVectors(v3(0, 1, 0), lean).normalize();
      const qYaw = new THREE.Quaternion().setFromAxisAngle(v3(0, 1, 0), 0.35);
      const qTilt = new THREE.Quaternion().setFromAxisAngle(axis, 0.5);
      shovel.quaternion.copy(qTilt).multiply(qYaw);
      // 小孩堆起來的一小坨土（土面 y ≈ 0.28），周圍幾顆翻起來的土塊
      const clodMat = toon(0x5a3a28, { flat: true });
      const mound = new THREE.Mesh(new THREE.IcosahedronGeometry(1, 1), clodMat);
      mound.scale.set(0.12, 0.065, 0.095);
      mound.position.set(sx - 0.015, soilY - 0.002, sz - 0.012);
      mound.receiveShadow = true;
      porch.add(mound);
      for (let k = 0; k < 4; k++) {
        const a = k * 1.7 + 0.4;
        const c = new THREE.Mesh(new THREE.DodecahedronGeometry(0.018 + rnd() * 0.01, 0), clodMat);
        c.position.set(sx + Math.cos(a) * 0.11, soilY + 0.006, sz + Math.sin(a) * 0.08);
        c.scale.y = 0.55;
        c.rotation.set(rnd() * 3, rnd() * 3, rnd() * 3);
        porch.add(c);
      }
      shadow(shovel);
    }
    shovel.updateMatrixWorld(true);
    ctx.anchors.shovel = shovel.localToWorld(v3(0, 0.16, 0));   // 鏟柄中段

    // =====================================================================
    //  5. 紅燈籠：掛在屋簷下，裡面透出暖紅的光，輕輕地擺
    // =====================================================================
    const hook = v3(...H.lanternHook);
    const lantern = new THREE.Group();     // 擺動的支點 = 掛鉤
    lantern.name = 'lantern';
    lantern.position.copy(hook);
    porch.add(lantern);
    ctx.objects.lantern = lantern;
    const BODY_Y = -0.47;                   // 燈籠本體中心（相對掛鉤）
    const RX = 0.26, RY = 0.225;
    const DEPTH_K = 0.86;                   // 前後稍微扁一點：掛鉤離牆角的圓木頭只有 0.2 多，免得擦到
    const uGlow = TSL.uniform(1.0);
    const uHalo = TSL.uniform(1.0);
    const LIGHT_I = 0.6;
    let light, halo, body, tassel;
    {
      // 燈籠的五金與流蘇：不吃自己那盞點光（離得太近會整個被照白），只吃月光與天光，再帶一點暖暖的自發光
      const L0 = ctx.lights;
      const ownLights = L0 ? TSL.lights([L0.hemi, L0.ambient, L0.moon].filter(Boolean)) : null;
      const hw = (hex, emissive, ei = 0.35) => {
        const m = toon(hex, { cache: false, emissive, emissiveIntensity: ei });
        if (ownLights) m.lightsNode = ownLights;
        return m;
      };
      const gold = hw(0xe8b54e, 0x7a3a10, 0.55);
      const goldDark = hw(0xb98232, 0x5a2a0c, 0.45);
      const cordMat = hw(0x9a2a24, 0x4a0c08, 0.5);
      // 屋簷下的小掛鉤（不跟著擺）
      const hookPlate = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.012, 12), toon(0x4a3a36));
      hookPlate.position.copy(hook).add(v3(0, -0.006, 0));
      const hookEye = new THREE.Mesh(new THREE.TorusGeometry(0.018, 0.006, 6, 14), toon(0x3b302e));
      hookEye.position.copy(hook).add(v3(0, -0.03, 0));
      porch.add(hookPlate, hookEye);

      // 繩子
      const cordTop = -0.035, cordBot = BODY_Y + RY + 0.04;
      const cord = new THREE.Mesh(new THREE.CylinderGeometry(0.0075, 0.0075, cordTop - cordBot, 6), cordMat);
