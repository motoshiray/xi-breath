      let hs = -1;
      if (heartSeq) { heartSeq.t += dt; hs = heartSeq.t; if (hs > 4.4) { heartSeq = null; hs = -1; } }
      const hold = hs >= 0 ? bump(hs, -0.01, 0.35, 3.3, 4.0) : 0;     // 停下來
      const faceCam = hs >= 0 ? bump(hs, 0, 0.6, 3.1, 3.9) : 0;      // 轉向鏡頭
      const puff = hs >= 0 ? (hs < 0.75 ? 0.13 * EASE.inOutSine(clamp01((hs - 0.15) / 0.6)) : 0.13 * (1 - EASE.outCubic(clamp01((hs - 0.75) / 0.28))) - 0.04 * bump(hs, 0.75, 0.9, 1.0, 1.4)) : 0;
      const happy = hs >= 0 && hs > 0.45 && hs < 3.0;
      if (heartSeq && !heartSeq.spawned && hs >= 0.75) { heartSeq.spawned = true; heartSeq.heart = startHeart(); }

      // ---- 走路 ----
      const rateTarget = (1 - hold) * rmF;
      rate += (rateTarget - rate) * Math.min(1, dt * 4);
      tau += dt * rate;
      const st = travel(tau);
      pointAt(st.s, posO);
      pointAt(st.s + PUSH_D, posS);
      const ds = lastS === null ? 0 : st.s - lastS;
      lastS = st.s;
      const sp = dt > 0 ? clamp01(Math.abs(ds) / dt / (AVG_V * 1.6 * rmF)) : 0;
      speedS += (sp - speedS) * Math.min(1, dt * 5);
      const m = clamp01(speedS * 1.4);
      const push = st.moving ? Math.max(0, Math.sin(st.phase)) : 0;

      // 朝向：平常朝石頭，吹愛心時轉向鏡頭
      const yawStone = Math.atan2(posS.x - posO.x, posS.z - posO.z);
      const yawCam = Math.atan2(camera.position.x - posO.x, camera.position.z - posO.z);
      const yawTarget = yawStone + wrapA(yawCam - yawStone) * faceCam * 0.85;
      if (!yawInit) { yaw = yawTarget; yawInit = true; }
      yaw += wrapA(yawTarget - yaw) * Math.min(1, dt * 3.5);
      posO.y = bottomY(posO.x, posO.z);
      root.position.copy(posO);
      root.rotation.y = yaw;

      // 停下來休息時，偷偷轉頭看一下鏡頭
      const restLook = st.moving ? 0 : EASE.smooth(clamp01((st.restT - 0.6) / 1.2)) * (1 - faceCam);
      const camLocal = wrapA(yawCam - yaw);
      const htTarget = Math.max(-0.75, Math.min(0.75, camLocal)) * 0.7 * restLook
        + Math.sin(t * 0.37) * 0.12 * (1 - m) * (1 - faceCam) * rmF;
      headTurn += (htTarget - headTurn) * Math.min(1, dt * 2.2);

      // ---- 身體：呼吸、推的時候前傾、吹愛心時鼓起來 ----
      const breathe = Math.sin(t * 1.7 * rmF) * 0.022;
      const leanTarget = m * (0.13 + 0.07 * push) - 0.08 * bump(hs, 0.15, 0.55, 0.75, 1.1);
      lean += (leanTarget - lean) * Math.min(1, dt * 6);
      mantlePivot.rotation.set(lean, headTurn, 0);
      const sy = 1 + breathe - 0.05 * push * m;
      const sxz = 1 - breathe * 0.6 + 0.03 * push * m;
      mantlePivot.scale.set(sxz * (1 + puff), sy * (1 + puff * 0.85), sxz * (1 + puff));
      mantlePivot.position.y = MP + 0.008 * push * m;
      blushU.value = 0.35 + (happy ? 0.45 : 0) + puff * 2.5;

      // ---- 腳：休息時輕輕地波動，推的時候一下一下地划 ----
      for (let j = 0; j < 8; j++) {
        const L = legs[j];
        const ia = 1 - m;
        let lift = (0.04 + 0.06 * (0.5 + 0.5 * Math.sin(t * 1.3 * rmF - j * 0.8 + L.ph))) * rmF;
        let sweep = 0.07 * Math.sin(t * 0.9 * rmF + j * 1.7) * rmF;
        let curl = 0.5 + 0.5 * Math.sin(t * 1.05 * rmF + j * 2.1 + L.ph);
        let stretch = 0;
        lift *= ia; sweep *= ia; curl *= ia;
        if (m > 0.001) {
          if (L.front) {
            // 前面兩條腳抱著石頭
            lift += m * (0.16 + 0.05 * push);
            curl += m * (0.55 + 0.25 * push);
            sweep += m * -L.side * 0.06;
          } else {
            const p = Math.sin(st.phase - Math.abs(L.alpha) * 0.9);
            sweep += m * L.side * 0.2 * p * rmF;
            lift += m * Math.max(0, -p) * 0.22 * rmF;
            curl += m * Math.max(0, -p) * 0.9;
            stretch += m * Math.max(0, p) * 0.7;
          }
        }
        // 吹愛心時：腳尖開心地捲起來
        if (hs >= 0) { const hp = bump(hs, 0.35, 0.8, 2.6, 3.3); curl = curl * (1 - hp) + hp * (0.85 + 0.15 * Math.sin(hs * 5 + j)); lift = lift * (1 - hp) + hp * (0.1 + 0.05 * Math.sin(hs * 4 + j * 1.3)); }
        L.pivot.rotation.set(0, L.alpha - Math.PI / 2 + L.yj + sweep, lift);
        L.mesh.morphTargetInfluences[0] = clamp01(curl);
        L.mesh.morphTargetInfluences[1] = clamp01(stretch);
      }

      // ---- 眼睛：眨眼、開心瞇眼 ----
      blinkT -= dt;
      if (blinkT <= 0 && blinkAge < 0 && !happy) { blinkAge = 0; blinkT = 2.8 + rnd() * 3.5; }
      let eyeY = 1;
      if (blinkAge >= 0) { blinkAge += dt; const b = blinkAge / 0.17; eyeY = b < 1 ? 1 - Math.sin(b * Math.PI) * 0.92 : 1; if (b >= 1) blinkAge = -1; }
      for (const e of eyes) {
        e.bean.visible = !happy;
        e.arc.visible = happy;
        e.bean.scale.y = eyeY;
      }

      // ---- 嘴：吹泡泡時嘟起來 ----
      let pucker = 0;
      if (hs >= 0) pucker = Math.max(pucker, bump(hs, 0.45, 0.7, 1.05, 1.35));
      // 普通泡泡的節奏
      if (!heartSeq) {
        nextBubble -= dt;
        if (nextBubble <= 0 && !bubbleSeq) { bubbleSeq = { t: 0, done: false }; nextBubble = 8 + rnd() * 7; }
      }
      if (bubbleSeq) {
        bubbleSeq.t += dt;
        pucker = Math.max(pucker, bump(bubbleSeq.t, 0, 0.3, 0.45, 0.75));
        if (!bubbleSeq.done && bubbleSeq.t >= 0.38) {
          bubbleSeq.done = true;
          root.updateMatrixWorld(true);
          mouthTip.getWorldPosition(tmpV);
          spawnBubble(tmpV, 0.03 + rnd() * 0.008, true);
          ctx.events.emit('octopus:bubble');
          const n = rnd() < 0.6 ? 2 : 1;
          for (let i = 0; i < n; i++) pendingSmall.push({ at: 0.22 + i * 0.2, r: 0.014 + rnd() * 0.006 });
        }
        if (bubbleSeq.t > 0.8) bubbleSeq = null;
      }
      if (pendingSmall.length) {
        for (const p of pendingSmall) p.at -= dt;
        const due = pendingSmall.filter((p) => p.at <= 0);
        if (due.length) {
          root.updateMatrixWorld(true);
          mouthTip.getWorldPosition(tmpV);
          for (const p of due) spawnBubble(tmpV, p.r, false);
          pendingSmall = pendingSmall.filter((p) => p.at > 0);
        }
      }
      mouthInner.scale.set(1 + pucker * 0.3, 1 + pucker * 0.3, 1 + pucker * 1.6);
      mouthInner.position.z = pucker * 0.008;

      // ---- 石頭：跟著路徑滾（轉動和移動一致）----
      const sBottom = bottomY(posS.x, posS.z);
      stone.position.set(posS.x, sBottom + SR - 0.004, posS.z);
      if (!stoneInit) { lastStone.copy(stone.position); stoneInit = true; }
      const dx = stone.position.x - lastStone.x, dz = stone.position.z - lastStone.z;
      const dist = Math.hypot(dx, dz);
      if (dist > 1e-6 && dist < 0.5) {
        axis.set(dz / dist, 0, -dx / dist);
        qInc.setFromAxisAngle(axis, dist / SR);
        stone.quaternion.premultiply(qInc);
      }
      lastStone.copy(stone.position);
      stoneBlob.position.set(posS.x, sBottom + 0.004, posS.z);

      // ---- 泡泡上升 ----
      for (const b of bubbles) {
        if (!b.active) continue;
        b.age += dt;
        const grow = Math.min(1, b.age / 0.25);
        b.v += dt * 0.012;
        b.y += b.v * dt * rmF;
        const sw = b.sway * rmF;
        const fwd = 0.06 * (1 - Math.exp(-b.age * 2.5));     // 先往前飄一點，離開臉再往上
        const x = b.x0 + Math.sin(b.age * 4.2 + b.ph) * sw + b.dx * b.age + b.fx * fwd;
        const z = b.z0 + Math.cos(b.age * 3.6 + b.ph) * sw + b.dz * b.age + b.fz * fwd;
        const r = b.r * (0.4 + 0.6 * EASE.outCubic(grow)) * (1 + 0.15 * clamp01((b.y - BOTTOM) / 0.45));
        const wob = Math.sin(b.age * 9 + b.ph) * 0.08 * rmF;
        b.mesh.position.set(x, b.y, z);
        b.mesh.scale.set(r * (1 + wob), r * (1 - wob), r * (1 + wob * 0.5));
        if (b.y >= WATER - r * 0.6) {
          b.active = false;
          b.mesh.visible = false;
          if (b.big) { spawnRing(x, z, 0.17, 1.0); sparkle(x, z, 2, 0.06, false); pondRipple(x, z, 0.55); }
          else spawnRing(x, z, 0.08, 0.7);
        }
      }

      // ---- 愛心 ----
      for (const h of hearts) {
        if (!h.active) continue;
        h.age += dt;
        const g = h.group;
        if (h.state === 'grow') {
          // 從嘴巴吹出來、慢慢鼓大，同時飄到臉的旁邊（不擋住臉）
          root.updateMatrixWorld(true);
          mouthTip.getWorldPosition(tmpV);
          const u = clamp01(h.age / 0.6);
          tmpV2.set(1, 0, 0).applyQuaternion(camera.quaternion).setY(0).normalize();
          const e = EASE.inOutSine(u);
          g.position.copy(tmpV).addScaledVector(tmpV2, 0.27 * e * h.side);
          g.position.y += 0.08 * e;
          tmpV2.copy(camera.position).sub(tmpV).setY(0).normalize();
          g.position.addScaledVector(tmpV2, 0.09 * e);          // 也往鏡頭這邊挪一點，不會陷進頭裡
          h.scale = HEART_S * Math.max(0.05, outBack(u));
          if (u >= 1) { h.state = 'rise'; h.x0 = g.position.x; h.z0 = g.position.z; h.y = g.position.y; h.rt = 0; }
        } else if (h.state === 'rise') {
          h.rt += dt;
          h.y += dt * (0.085 + 0.045 * clamp01(h.rt / 1.2)) * (rm ? 0.8 : 1);
          g.position.set(h.x0 + Math.sin(h.rt * 1.7) * 0.025 * rmF, h.y, h.z0 + Math.sin(h.rt * 1.3 + 1) * 0.012 * rmF);
          h.scale = HEART_S;
          if (h.y >= WATER + 0.035) {
            h.state = 'pop'; h.pt = 0;
            spawnRing(g.position.x, g.position.z, 0.32, 1.3);
            pondRipple(g.position.x, g.position.z, 1.0);
            sparkle(g.position.x, g.position.z, 6, 0.16, true);
          }
        } else if (h.state === 'pop') {
          h.pt += dt;
          const u = clamp01(h.pt / 0.22);
          h.scale = HEART_S * (1 + 0.35 * EASE.outCubic(u));
          h.fade.value = 1 - u;
          h.hiMat.opacity = 0.85 * (1 - u);
          if (u >= 1) { h.active = false; g.visible = false; }
        }
        // 面向鏡頭，左右輕輕搖、軟軟地變形
        const wob = h.state === 'pop' ? 0 : Math.sin(h.age * 2.3) * 0.13 * rmF;
        const sq = h.state === 'pop' ? 0 : Math.sin(h.age * 3.1) * 0.045 * rmF;
        g.quaternion.copy(camera.quaternion);
        g.rotateZ(wob);
        g.scale.set(h.scale * (1 + sq), h.scale * (1 - sq), h.scale);
      }

      // ---- 水紋 ----
      for (const g of rings) {
        if (!g.active) continue;
        g.age += dt;
        const u = clamp01(g.age / g.life);
        const r = 0.02 + g.r1 * EASE.outCubic(u);
        g.mesh.scale.setScalar(r);
        g.mesh.material.opacity = 0.5 * (1 - u) * (1 - u);
        if (u >= 1) { g.active = false; g.mesh.visible = false; }
      }

      // ---- 閃光、小愛心（只有淡入淡出，不閃爍）----
      for (const s of sprites) {
        if (!s.active) continue;
        s.age += dt;
        const u = clamp01(s.age / s.life);
        s.vel.y -= dt * (s.kind === 'heart' ? 0.02 : 0.25);
        s.sp.position.addScaledVector(s.vel, dt);
        if (s.kind === 'heart') {
          s.sp.position.x += Math.cos(s.age * 2.6 + s.ph) * 0.03 * dt * rmF;
          s.mat.opacity = Math.min(1, s.age / 0.2) * (1 - EASE.smooth(clamp01((u - 0.55) / 0.45)));
          s.sp.scale.setScalar(s.size * (0.6 + 0.4 * EASE.outCubic(Math.min(1, s.age / 0.35))));
          s.mat.rotation = Math.sin(s.age * 2.2 + s.ph) * 0.25 * rmF;
        } else {
          s.mat.opacity = Math.min(1, s.age / 0.08) * (1 - u);
          s.sp.scale.setScalar(s.size * (1 - 0.5 * u));
          s.mat.rotation = s.ph + s.age * 0.6;
        }
        if (u >= 1) { s.active = false; s.sp.visible = false; }
      }

      // ---- 給鏡頭的錨點：身體中心 ----
      anchor.set(posO.x, posO.y + BC, posO.z);
    });

    function startHeart() {
      const h = hearts.find((x) => !x.active);
      if (!h) return null;
      // 愛心飄到臉的哪一邊：避開石頭那一側
      tmpV2.set(1, 0, 0).applyQuaternion(camera.quaternion);
      const side = (stone.position.x - root.position.x) * tmpV2.x + (stone.position.z - root.position.z) * tmpV2.z > 0.02 ? -1 : 1;
      Object.assign(h, { active: true, age: 0, state: 'grow', scale: 0.01, side });
      h.fade.value = 1;
      h.hiMat.opacity = 0.85;
      h.group.visible = true;
      return h;
    }
  },
});

// ---------------------------------------------------------------- parts/30-pavilion.js
// ---- 亭子：池塘東邊的六角小亭（石台基、木地板、朱紅柱子、青瓦翹角屋頂、一盞紙燈、朝池塘的長凳）----
PARTS.push({
  name: 'pavilion',
  order: 30,
  build(ctx) {
    const { THREE, TSL, LAYOUT, PALETTE, toon, shadow, roundedBox, scene, BufferGeometryUtils } = ctx;
    const P = LAYOUT.pavilion;
    const R = P.radius;                        // 柱子六角形的外接圓半徑（1.35）
    const FLOOR = P.floorY;                    // 地板頂面（0.28）
    const C30 = Math.cos(Math.PI / 6), T30 = Math.tan(Math.PI / 6);
    const APO = R * C30;                       // 柱子六角形的邊心距 ≈ 1.169
    const rnd = ctx.rand(3030);

    // 本地座標：整個亭子轉到「本地 +x 指向朝池塘那條邊的中點」。
    // 本地方位角 φ = atan2(z, x)：邊的中點在 φ = k·60°，柱子在 30° + k·60°。
    // φ = 0 朝池塘（不加欄杆、放長凳），φ = -60° 是入口（台階），其餘四邊有矮欄杆。
    const group = new THREE.Group();
    group.name = 'pavilion';
    group.position.set(P.center[0], 0, P.center[1]);
    group.rotation.y = -P.pondEdgeAngle;
    scene.add(group);
    group.updateMatrixWorld(true);

    const DEG = Math.PI / 180;
    const EDGE_ENTRY = -60 * DEG;            // 入口那條邊（朝池塘的邊是 φ = 0）
    // 物件慣例：幾何的 +x = 朝外（邊的法線），+z = 沿著邊。rotY = -φ 就能對齊到方位角 φ 的那條邊。
    const edgeXZ = (phi, a, u) => [a * Math.cos(phi) - u * Math.sin(phi), a * Math.sin(phi) + u * Math.cos(phi)];

    // ---- 材質 ----
    const M = {
      stone: toon(0xc9bfae), stoneDark: toon(0xaaa092),
      plank: [toon(0xc48f5f), toon(0xb47d51), toon(0xd09e6c)],
      rim: toon(PALETTE.woodDark),
      lacquer: toon(0xa95f4e), lacquerDark: toon(0x80463c),
      gold: toon(0xdcae5c),
      bed: toon(0x264a4a), tile: toon(0x437a72), tileEnd: toon(0x6aa497), ridge: toon(0x2c5450),
      ceiling: toon(0x99694b), rafter: toon(0x6e4934),
      seat: toon(PALETTE.woodLight), benchLeg: toon(PALETTE.wood),
      tuftMat: toon(PALETTE.grassLight),
    };

    // ---- 幾何收集：同一個材質的零件合併成一個 mesh，減少 draw call ----
    const buckets = new Map();
    const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler(), _s = new THREE.Vector3(), _p = new THREE.Vector3();
    function put(mat, geo, x = 0, y = 0, z = 0, ry = 0, rx = 0, rz = 0, sx = 1, sy = 1, sz = 1) {
      _m.compose(_p.set(x, y, z), _q.setFromEuler(_e.set(rx, ry, rz, 'YXZ')), _s.set(sx, sy, sz));
      const g = geo.clone().applyMatrix4(_m);
      if (!buckets.has(mat)) buckets.set(mat, []);
      buckets.get(mat).push(g);
    }
    function flush(parent) {
      for (const [mat, list] of buckets) {
        const anyNonIndexed = list.some((g) => !g.index);
        const clean = list.map((g) => {
          let h = anyNonIndexed && g.index ? g.toNonIndexed() : g;
          for (const k of Object.keys(h.attributes)) if (!['position', 'normal', 'uv'].includes(k)) h.deleteAttribute(k);
          if (!h.attributes.uv) h.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(h.attributes.position.count * 2), 2));
          h.morphAttributes = {};
          return h;
        });
        const merged = BufferGeometryUtils.mergeGeometries(clean, false);
        const mesh = new THREE.Mesh(merged, mat);
        parent.add(mesh);
      }
      buckets.clear();
    }

    // 圓角六角形（頂點在 30° + k·60°），給台基用
    function roundedHexShape(r, cr) {
      const s = new THREE.Shape();
      const V = (k) => { const a = Math.PI / 6 + (k % 6) * Math.PI / 3; return new THREE.Vector2(Math.cos(a) * r, Math.sin(a) * r); };
      for (let k = 0; k < 6; k++) {
        const v = V(k), vp = V(k + 5), vn = V(k + 1);
        const a = v.clone().add(vp.clone().sub(v).setLength(cr));
        const b = v.clone().add(vn.clone().sub(v).setLength(cr));
        if (k === 0) s.moveTo(a.x, a.y); else s.lineTo(a.x, a.y);
        s.quadraticCurveTo(v.x, v.y, b.x, b.y);
      }
      s.closePath();
      return s;
    }

    // =====================================================================
    //  1. 石台基 + 木地板
    // =====================================================================
    {
      const plinth = new THREE.ExtrudeGeometry(roundedHexShape(1.6, 0.2), {
        depth: 0.1, bevelEnabled: true, bevelThickness: 0.05, bevelSize: 0.06, bevelSegments: 2, curveSegments: 4,
      });
      plinth.rotateX(-Math.PI / 2);
      plinth.translate(0, 0.02, 0);              // y：-0.03 .. 0.17
      put(M.stone, plinth);
    }
    const DECK_APO = 1.38, RIM_W = 0.15;
    {
      // 地板外框：六根深色木樑，頂面比木板高一點點（0.30），像一圈小門檻
      const rimGeo = roundedBox(RIM_W, 0.13, 2 * DECK_APO * T30, 0.03, 2);
      for (let k = 0; k < 6; k++) {
        const phi = k * 60 * DEG;
        const [x, z] = edgeXZ(phi, DECK_APO - RIM_W / 2, 0);
        put(M.rim, rimGeo, x, 0.235, z, -phi);
      }
      // 木板：平行於朝池塘那條邊（沿本地 z），兩端藏進外框
      const inner = DECK_APO - RIM_W, mid = DECK_APO - RIM_W / 2;
      const N = 11, pitch = (2 * inner) / N;
      for (let i = 0; i < N; i++) {
        const x = -inner + pitch * (i + 0.5);
        const half = (mid - Math.abs(x) * 0.5) / C30;
        const g = roundedBox(pitch - 0.014, 0.11, 2 * half, 0.025, 2);
        put(M.plank[Math.floor(rnd() * 3)], g, x, FLOOR - 0.055, 0);
      }
    }

    // =====================================================================
    //  2. 入口台階（φ = -60°，朝小路）
    // =====================================================================
    {
      const s1 = roundedBox(0.32, 0.21, 0.92, 0.045, 2);
      const s2 = roundedBox(0.3, 0.115, 0.82, 0.04, 2);
      let [x, z] = edgeXZ(EDGE_ENTRY, 1.56, 0);
      put(M.stone, s1, x, 0.085, z, -EDGE_ENTRY);
      [x, z] = edgeXZ(EDGE_ENTRY, 1.82, 0);
      put(M.stoneDark, s2, x, 0.035, z, -EDGE_ENTRY);
    }

    // =====================================================================
    //  3. 柱子、柱礎、額枋、雀替、斗
    // =====================================================================
    const POST_R0 = 0.112, POST_R1 = 0.124;
    const LINTEL_Y0 = 1.86, LINTEL_Y1 = 2.04;
    {
      const baseGeo = new THREE.CylinderGeometry(0.16, 0.18, 0.09, 18);
      const postGeo = new THREE.CylinderGeometry(POST_R0, POST_R1, LINTEL_Y1 + 0.02 - 0.34, 18);
      const block1 = roundedBox(0.25, 0.1, 0.25, 0.03, 2);
      const block2 = roundedBox(0.31, 0.11, 0.31, 0.035, 2);
      for (let k = 0; k < 6; k++) {
        const a = (30 + 60 * k) * DEG;
        const x = Math.cos(a) * R, z = Math.sin(a) * R;
        put(M.stone, baseGeo, x, FLOOR + 0.045, z);
        put(M.lacquer, postGeo, x, 0.34 + (LINTEL_Y1 + 0.02 - 0.34) / 2, z);
        put(M.lacquerDark, block1, x, LINTEL_Y1 + 0.05, z, -a);
        put(M.gold, block2, x, LINTEL_Y1 + 0.155, z, -a);
      }
      // 額枋：柱子之間的橫樑，正中間頂著一塊小金斗
      const lintel = roundedBox(0.13, LINTEL_Y1 - LINTEL_Y0, R - 2 * POST_R0 + 0.02, 0.035, 2);
      const midBlock = roundedBox(0.13, 0.1, 0.17, 0.025, 2);
      for (let k = 0; k < 6; k++) {
        const phi = k * 60 * DEG;
        let [x, z] = edgeXZ(phi, APO, 0);
        put(M.lacquer, lintel, x, (LINTEL_Y0 + LINTEL_Y1) / 2, z, -phi);
        put(M.gold, midBlock, x, LINTEL_Y1 + 0.05, z, -phi);
      }
      // 雀替：柱頭兩側的小雲紋托架（金色）
      const br = new THREE.Shape();
      const bs = 0.8;
      br.moveTo(0, 0);
      br.lineTo(0.34 * bs, 0);
      br.bezierCurveTo(0.26 * bs, -0.015 * bs, 0.2 * bs, -0.07 * bs, 0.15 * bs, -0.075 * bs);
      br.bezierCurveTo(0.09 * bs, -0.08 * bs, 0.07 * bs, -0.13 * bs, 0.04 * bs, -0.2 * bs);
      br.lineTo(0, -0.22 * bs);
      br.lineTo(0, 0);
      const brGeo = new THREE.ExtrudeGeometry(br, { depth: 0.045, bevelEnabled: true, bevelThickness: 0.012, bevelSize: 0.012, bevelSegments: 1, curveSegments: 8 });
      brGeo.translate(0, 0, -0.0225);
      const brA = brGeo.clone().rotateY(-Math.PI / 2);   // u → +z
      const brB = brGeo.clone().rotateY(Math.PI / 2);    // u → -z
      for (let k = 0; k < 6; k++) {
        const phi = k * 60 * DEG;
        const u0 = R / 2 - POST_R0 * 0.6;
        let [x, z] = edgeXZ(phi, APO, -u0);
        put(M.gold, brA, x, LINTEL_Y0 + 0.005, z, -phi);
        [x, z] = edgeXZ(phi, APO, u0);
        put(M.gold, brB, x, LINTEL_Y0 + 0.005, z, -phi);
      }
    }

    // =====================================================================
    //  4. 矮欄杆（朝池塘與入口兩邊不加）
    // =====================================================================
    {
      const span = R - 2 * POST_R0 + 0.03;
      const topRail = roundedBox(0.1, 0.075, span, 0.032, 2);
      const lowRail = roundedBox(0.065, 0.05, span, 0.022, 2);
      const baluster = roundedBox(0.055, 0.3, 0.055, 0.018, 1);
      for (const deg of [60, 120, 180, 240]) {
        const phi = deg * DEG;
        let [x, z] = edgeXZ(phi, APO, 0);
        put(M.lacquer, topRail, x, FLOOR + 0.5, z, -phi);
        put(M.lacquerDark, lowRail, x, FLOOR + 0.12, z, -phi);
        for (let i = 0; i < 5; i++) {
          const u = (i - 2) * 0.21;
          [x, z] = edgeXZ(phi, APO, u);
          put(M.lacquerDark, baluster, x, FLOOR + 0.3, z, -phi);
        }
      }
    }

    // =====================================================================
    //  5. 長凳：朝池塘那條邊的內側，人坐在上面，腳從前緣垂下去
    // =====================================================================
    const benchLocal = group.worldToLocal(new THREE.Vector3(P.bench.center[0], P.bench.seatY, P.bench.center[1]));
    {
      const B = P.bench;
      const seat = roundedBox(B.depth, 0.08, B.length, 0.035, 2);
      put(M.seat, seat, benchLocal.x, B.seatY - 0.04, benchLocal.z);
      const legH = B.seatY - 0.08 - FLOOR;
      const leg = roundedBox(B.depth - 0.1, legH, 0.08, 0.02, 2);
      for (const s of [-1, 1]) put(M.benchLeg, leg, benchLocal.x - 0.03, FLOOR + legH / 2, benchLocal.z + s * (B.length / 2 - 0.13));
      const bar = roundedBox(0.05, 0.05, B.length - 0.3, 0.018, 1);
      put(M.benchLeg, bar, benchLocal.x - 0.06, FLOOR + 0.1, benchLocal.z);
    }

    // =====================================================================
    //  6. 屋頂：六片微微下凹的曲面、翹角、筒瓦、垂脊、寶頂；底下看得到椽子
    // =====================================================================
    const ROOF = { D: 1.7, eaveY: 2.2, apexY: 2.92, lift: 0.28, flare: 0.1, thick0: 0.24, thick1: 0.12, prof: 1.8 };
    // 第 k 片（法線方位角 k·60°）上的點：s = 0（頂）.. 1（簷口），c = -1 .. 1（兩條垂脊之間）
    function roofPoint(k, s, c, out, under = false) {
      const phi = k * Math.PI / 3;
      const nx = Math.cos(phi), nz = Math.sin(phi), tx = -Math.sin(phi), tz = Math.cos(phi);
      const d = s * ROOF.D, w = c * d * T30;
      const sc = 1 + ROOF.flare * s * s * c * c;          // 角落在平面上微微往外撇
      let y = ROOF.apexY - (ROOF.apexY - ROOF.eaveY) * (1 - Math.pow(Math.max(0, 1 - s), ROOF.prof))
        + ROOF.lift * s * s * s * Math.pow(Math.abs(c), 2.5);   // 翹角
      if (s > 1) y -= (s - 1) * 0.3;
      if (under) y -= ROOF.thick0 * (1 - Math.min(1, s)) + ROOF.thick1 * Math.min(1, s);
      return out.set((d * nx + w * tx) * sc, y, (d * nz + w * tz) * sc);
    }
    // 用 (s, c) 網格做一片曲面；wantUp 決定法線朝上或朝下
    function roofSheet(k, ns, nc, under, wantUp) {
      const pos = [], idx = [];
      const v = new THREE.Vector3();
      for (let i = 0; i <= ns; i++) {
        const s = Math.pow(i / ns, 0.85);
        for (let j = 0; j <= nc; j++) {
          roofPoint(k, s, -1 + (2 * j) / nc, v, under);
          pos.push(v.x, v.y, v.z);
        }
      }
      const row = nc + 1;
      for (let i = 0; i < ns; i++) for (let j = 0; j < nc; j++) {
        const a = i * row + j, b = a + 1, c = a + row, d = c + 1;
        idx.push(a, c, b, b, c, d);
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      g.setIndex(idx);
      g.computeVertexNormals();
      // 檢查方向（取中間一點的法線）
      const ny = g.attributes.normal.getY(Math.floor(ns / 2) * row + Math.floor(nc / 2));
      if ((ny > 0) !== wantUp) {
        for (let t = 0; t < idx.length; t += 3) { const tmp = idx[t + 1]; idx[t + 1] = idx[t + 2]; idx[t + 2] = tmp; }
        g.setIndex(idx);
        g.computeVertexNormals();
      }
      g.setAttribute('uv', new THREE.Float32BufferAttribute(new Float32Array((pos.length / 3) * 2), 2));
      return g;
    }
    // 簷口的厚度邊
    function eaveBand(k, nc) {
      const pos = [], idx = [];
      const a = new THREE.Vector3(), b = new THREE.Vector3();
      for (let j = 0; j <= nc; j++) {
        const c = -1 + (2 * j) / nc;
        roofPoint(k, 1, c, a, false); roofPoint(k, 1, c, b, true);
        pos.push(a.x, a.y, a.z, b.x, b.y, b.z);
      }
      for (let j = 0; j < nc; j++) { const i = j * 2; idx.push(i, i + 1, i + 2, i + 2, i + 1, i + 3); }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      g.setIndex(idx);
      g.computeVertexNormals();
      // 法線要朝外
      const phi = k * Math.PI / 3;
      const n = g.attributes.normal;
      const mid = nc; // 中間附近
      if (n.getX(mid) * Math.cos(phi) + n.getZ(mid) * Math.sin(phi) < 0) {
        for (let t = 0; t < idx.length; t += 3) { const tmp = idx[t + 1]; idx[t + 1] = idx[t + 2]; idx[t + 2] = tmp; }
        g.setIndex(idx); g.computeVertexNormals();
      }
      g.setAttribute('uv', new THREE.Float32BufferAttribute(new Float32Array((pos.length / 3) * 2), 2));
      return g;
    }
    {
      for (let k = 0; k < 6; k++) {
        put(M.bed, roofSheet(k, 18, 22, false, true));
        put(M.ceiling, roofSheet(k, 14, 16, true, false));
        put(M.ceiling, eaveBand(k, 22));
      }
      // 筒瓦：每片上一排排平行於法線的半圓管，簷口端一顆圓圓的瓦當
      const v = new THREE.Vector3();
      const capGeo = new THREE.SphereGeometry(0.084, 12, 9);
      const TILE_R = 0.066, SP = 0.2;
      for (let k = 0; k < 6; k++) {
        for (let j = -4; j <= 4; j++) {
          const w = j * SP;
          const dEnd = ROOF.D * 1.012;
          const dStart = Math.max(Math.abs(w) / T30 + 0.05, 0.28);
          if (dEnd - dStart < 0.1) continue;
          const pts = [];
          const n = 9;
          for (let m = 0; m <= n; m++) {
            const d = dStart + (dEnd - dStart) * (m / n);
            const s = d / ROOF.D, c = w / (d * T30);
            roofPoint(k, s, c, v, false);
            v.y += 0.03;
            pts.push(v.clone());
          }
          const tube = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 12, TILE_R, 7, false);
          put(M.tile, tube);
          const e = pts[pts.length - 1];
          put(M.tileEnd, capGeo, e.x, e.y - 0.005, e.z);
        }
      }
      // 垂脊：沿著六條稜線，到簷角往上翹成一個小鉤
      const tipGeo = new THREE.SphereGeometry(0.085, 12, 10);
      for (let h = 0; h < 6; h++) {
        const pts = [];
        for (let m = 0; m <= 12; m++) {
          const s = 0.05 + 0.95 * (m / 12);
          roofPoint(h, s, 1, v, false);
          v.y += 0.07;
          pts.push(v.clone());
        }
        const a = (30 + 60 * h) * DEG;
        const last = pts[pts.length - 1];
        const out1 = new THREE.Vector3(Math.cos(a), 0, Math.sin(a));
        pts.push(last.clone().addScaledVector(out1, 0.08).add(new THREE.Vector3(0, 0.045, 0)));
        pts.push(last.clone().addScaledVector(out1, 0.13).add(new THREE.Vector3(0, 0.11, 0)));
        const tube = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 28, 0.072, 8, false);
        put(M.ridge, tube);
        const tip = pts[pts.length - 1];
        put(M.tileEnd, tipGeo, tip.x, tip.y + 0.01, tip.z);
      }
      // 寶頂
      put(M.ridge, new THREE.CylinderGeometry(0.17, 0.25, 0.14, 12), 0, ROOF.apexY + 0.03, 0);
      put(M.gold, new THREE.CylinderGeometry(0.1, 0.15, 0.07, 12), 0, ROOF.apexY + 0.13, 0);
      put(M.gold, new THREE.SphereGeometry(0.135, 16, 12), 0, ROOF.apexY + 0.27, 0);
      put(M.gold, new THREE.SphereGeometry(0.065, 12, 10), 0, ROOF.apexY + 0.44, 0);
      put(M.gold, new THREE.ConeGeometry(0.03, 0.12, 10), 0, ROOF.apexY + 0.54, 0);

      // 椽子：屋頂底下放射狀的圓木，從亭子裡往上看很溫暖
      for (let k = 0; k < 6; k++) {
        for (const c of [1, -0.5, 0, 0.5]) {
          const pts = [];
          const s0 = c === 1 ? 0.06 : 0.14;
          for (let m = 0; m <= 8; m++) {
            const s = s0 + (0.985 - s0) * (m / 8);
            roofPoint(k, s, c, v, true);
            v.y -= c === 1 ? 0.035 : 0.02;
            pts.push(v.clone());
          }
          put(M.rafter, new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 10, c === 1 ? 0.04 : 0.024, 6, false));
        }
      }
      // 中央垂下的雷公柱（燈從這裡吊下來）
      const underApex = ROOF.apexY - ROOF.thick0;
      put(M.lacquerDark, new THREE.CylinderGeometry(0.065, 0.065, 0.26, 12), 0, underApex - 0.1, 0);
      put(M.gold, new THREE.SphereGeometry(0.075, 12, 10), 0, underApex - 0.23, 0);
    }

    // =====================================================================
    //  7. 匾額：入口上方「待月亭」
    // =====================================================================
    let plaqueTex = null;
    {
      const cv = document.createElement('canvas');
      cv.width = 512; cv.height = 192;
      const g = cv.getContext('2d');
      const draw = () => {
        g.clearRect(0, 0, cv.width, cv.height);
        g.fillStyle = '#25424b'; g.fillRect(0, 0, cv.width, cv.height);
        g.strokeStyle = '#e9c071'; g.lineWidth = 8;
        g.strokeRect(18, 18, cv.width - 36, cv.height - 36);
        g.fillStyle = '#f2cf86';
        g.font = '400 112px "LXGW WenKai TC", "Klee One", "Noto Serif TC", "Songti TC", "WenQuanYi Zen Hei", serif';
        g.textAlign = 'center'; g.textBaseline = 'middle';
        g.fillText('待月亭', cv.width / 2, cv.height / 2 + 6);
      };
      draw();
      plaqueTex = new THREE.CanvasTexture(cv);
      plaqueTex.colorSpace = THREE.SRGBColorSpace;
      plaqueTex.anisotropy = 4;
      // 網頁字型（霞鶩文楷）晚一點才到：載入完成時重畫一次
      const redraw = () => { draw(); plaqueTex.needsUpdate = true; };
      try {
        const fonts = document.fonts;
        if (fonts) {
          fonts.ready?.then(redraw, () => {});
          fonts.addEventListener?.('loadingdone', redraw);
          fonts.load?.('112px "LXGW WenKai TC"', '待月亭').then(redraw, () => {});
        }
      } catch (e) { /* 沒有 FontFace API 就用後備字型 */ }

      const frameGeo = roundedBox(0.05, 0.25, 0.62, 0.02, 2);
      const [x, z] = edgeXZ(EDGE_ENTRY, APO + 0.09, 0);
      put(M.gold, frameGeo, x, (LINTEL_Y0 + LINTEL_Y1) / 2 - 0.02, z, -EDGE_ENTRY);
      const plaqueMat = new THREE.MeshToonNodeMaterial({ map: plaqueTex, gradientMap: ctx.toonGradient });
      const plaque = new THREE.Mesh(new THREE.PlaneGeometry(0.56, 0.2), plaqueMat);
      const [px, pz] = edgeXZ(EDGE_ENTRY, APO + 0.117, 0);
      plaque.position.set(px, (LINTEL_Y0 + LINTEL_Y1) / 2 - 0.02, pz);
      plaque.rotation.y = Math.PI / 2 - EDGE_ENTRY;
      group.add(plaque);
    }

    // =====================================================================
    //  9. 台基腳邊的小草叢和幾朵小花（島的草叢避開了亭子周圍，這裡補一點，讓亭子「長」在草地上）
    // =====================================================================
    {
      const tuft = new THREE.ConeGeometry(0.055, 0.26, 4);
      tuft.translate(0, 0.13, 0);
      const bud = new THREE.IcosahedronGeometry(0.055, 0);
      bud.translate(0, 0.16, 0);
      const budMats = [toon(0xfff1c9), toon(0xffb6c8), toon(0xc9b6ff)];
      const PC = LAYOUT.pond.center;
      const w = new THREE.Vector3();
      let placed = 0;
      for (let i = 0; i < 60 && placed < 22; i++) {
        const phi = (rnd() * 2 - 1) * Math.PI;
        const deg = phi / DEG;
        if (Math.abs(deg) < 42) continue;                         // 朝池塘那邊留空
        if (Math.abs(deg + 60) < 26) continue;                    // 入口台階
        const r = 1.72 + rnd() * 0.3;
        const x = Math.cos(phi) * r, z = Math.sin(phi) * r;
        w.set(x, 0, z).applyMatrix4(group.matrixWorld);
        if (Math.hypot(w.x, w.z) > LAYOUT.island.radius - 0.55) continue;   // 別掉出島外
        if (((w.x - PC[0]) / (LAYOUT.pond.rx + 0.4)) ** 2 + ((w.z - PC[1]) / (LAYOUT.pond.rz + 0.4)) ** 2 < 1) continue;
        const n = 2 + Math.floor(rnd() * 2);
        for (let j = 0; j < n; j++) {
          const s = 0.75 + rnd() * 0.6;
          put(M.tuftMat, tuft, x + (rnd() - 0.5) * 0.18, 0, z + (rnd() - 0.5) * 0.18, rnd() * 3, (rnd() - 0.5) * 0.4, (rnd() - 0.5) * 0.4, s, s, s);
        }
        if (rnd() < 0.35) put(budMats[placed % 3], bud, x + 0.08, 0, z - 0.05, rnd() * 3);
        placed++;
      }
    }

    flush(group);
    shadow(group);

    // =====================================================================
    //  8. 紙燈：從屋頂正中央吊下來，微微晃；一盞很暗的暖色點光
    // =====================================================================
    const underApex = ROOF.apexY - ROOF.thick0;
    const pivot = new THREE.Group();
    pivot.position.set(0, underApex - 0.3, 0);
    group.add(pivot);
    const lamp = new THREE.Group();
    const LAMP_DROP = 0.66;
    lamp.position.y = -LAMP_DROP;                 // 燈身中心約在 y ≈ 1.72（比額枋低，從外面看得到）
    pivot.add(lamp);
    const uLamp = TSL.uniform(1.0);
    const lampColor = new THREE.Color(0xffc985);
    const lampMat = new THREE.MeshBasicNodeMaterial();
    lampMat.colorNode = TSL.vec3(lampColor.r, lampColor.g, lampColor.b).mul(uLamp.mul(1.05));
    {
      // 燈上的小零件緊貼著點光，用無光照材質，免得被照到過曝
      const unlit = (c) => { const m = new THREE.MeshBasicNodeMaterial(); m.color = new THREE.Color(c); return m; };
      const woodMat = unlit(0x3b2619), ribMat = unlit(0x9a6a40), tasselMat = unlit(0xa8352c), beadMat = unlit(0xc8963f);
      // 吊繩
      const cord = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, LAMP_DROP - 0.14, 6), woodMat);
      cord.position.y = -(LAMP_DROP - 0.14) / 2;
      pivot.add(cord);
      // 燈身：圓鼓鼓的紙燈籠
      const prof = [[0.045, -0.125], [0.09, -0.112], [0.122, -0.08], [0.138, -0.035], [0.14, 0], [0.138, 0.035], [0.122, 0.08], [0.09, 0.112], [0.045, 0.125]]
        .map(([r, y]) => new THREE.Vector2(r, y));
      const body = new THREE.Mesh(new THREE.LatheGeometry(prof, 20), lampMat);
      lamp.add(body);
      // 竹骨（橫向細圈）
      for (const y of [-0.08, -0.035, 0.0, 0.035, 0.08]) {
        const r = y === 0 ? 0.14 : (Math.abs(y) < 0.05 ? 0.138 : 0.122);
        const rib = new THREE.Mesh(new THREE.TorusGeometry(r + 0.002, 0.0045, 4, 28), ribMat);
        rib.rotation.x = Math.PI / 2;
        rib.position.y = y;
        lamp.add(rib);
      }
      // 上下木蓋、流蘇
      const capT = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.062, 0.035, 14), woodMat);
      capT.position.y = 0.135;
      const capB = new THREE.Mesh(new THREE.CylinderGeometry(0.062, 0.05, 0.035, 14), woodMat);
      capB.position.y = -0.135;
      const bead = new THREE.Mesh(new THREE.SphereGeometry(0.02, 10, 8), beadMat);
      bead.position.y = -0.17;
      const tassel = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.026, 0.1, 10), tasselMat);
      tassel.position.y = -0.235;
      lamp.add(capT, capB, bead, tassel);
      // 柔光暈
      const haloMat = new THREE.SpriteNodeMaterial({ map: ctx.glowTexture, color: 0xffb46a, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });
      haloMat.opacityNode = TSL.float(0.17).mul(uLamp);
      const halo = new THREE.Sprite(haloMat);
      halo.scale.setScalar(0.85);
      lamp.add(halo);
      shadow(lamp, false, false);
    }
    const light = new THREE.PointLight(0xffb469, 2.4, 3.6, 2);
    light.castShadow = false;
    lamp.add(light);
    const baseLight = light.intensity;

    // ---- 對外公開 ----
    ctx.objects.pavilion = group;
    ctx.objects.pavilionLamp = lamp;
    ctx.objects.pavilionLight = light;
    ctx.anchors.pavilion = new THREE.Vector3(P.center[0], 1.4, P.center[1]);
    ctx.anchors.bench = new THREE.Vector3(P.bench.center[0], P.bench.seatY, P.bench.center[1]);
    const lampWorld = new THREE.Vector3();
    lamp.getWorldPosition(lampWorld);
    ctx.anchors.pavilionLamp = lampWorld.clone();

    // ---- 動畫：紙燈慢慢晃，光很輕地呼吸（減少動態效果時：幾乎不晃、不閃）----
    ctx.onUpdate((t) => {
      const rm = ctx.reducedMotion;
      const amp = rm ? 0.25 : 1;
      const sp = rm ? 0.6 : 1;
      pivot.rotation.z = amp * (0.035 * Math.sin(t * 1.55 * sp) + 0.014 * Math.sin(t * 0.61 * sp + 1.3));
      pivot.rotation.x = amp * (0.022 * Math.sin(t * 1.21 * sp + 0.7) + 0.01 * Math.sin(t * 0.43 * sp + 2.1));
      const flick = rm ? 1 : 1 + 0.035 * Math.sin(t * 2.3) * Math.sin(t * 0.97 + 1.1) + 0.015 * Math.sin(t * 7.1);
      uLamp.value = flick;
      light.intensity = baseLight * flick;
      lamp.getWorldPosition(ctx.anchors.pavilionLamp);
    });
  },
});

// ---------------------------------------------------------------- parts/35-person.js
// ---- 人：坐在亭子長凳上、面朝池塘、安安靜靜等著的小小人（黑色長直髮）----
//  局部座標：原點 = 長凳座面上屁股坐的那一點，+z = 臉朝的方向（池塘），+y 向上。
//  層級：root → chest（呼吸）→ 手臂；root → 大腿 → 小腿（晃腳）；root → neck（轉頭／歪頭）→ head → 臉、頭髮、後面的長髮
PARTS.push({
  name: 'person',
  order: 35,
  build(ctx) {
    const { THREE, LAYOUT, PALETTE, EASE, clamp01, toon, shadow, scene } = ctx;
    const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
    const rnd = ctx.rand(3535);
    const smooth = (a, b, x) => EASE.smooth(clamp01((x - a) / (b - a)));
    const lerp = (a, b, k) => a + (b - a) * k;

    // ---- 顏色：奶油色毛衣、霧藍色百褶裙、白襪子、莓果色小皮鞋 ----
    const COL = {
      skin: PALETTE.skin, blush: PALETTE.blush, hair: PALETTE.hair,
      sweater: 0xe8d4b2, rib: 0xd8bf98, skirt: 0x7f9bd6,
      sock: 0xf7f2ea, shoe: 0x9a3f4c, sole: 0x5e2a33,
      eye: 0x16121b, mouth: 0x9a4a4f, hairShine: 0x3b4466, clip: 0xff8c3a,
    };
    const M = {
      skin: toon(COL.skin, { emissive: 0xffb08a, emissiveIntensity: 0.13 }),
      blush: toon(COL.blush, { emissive: COL.blush, emissiveIntensity: 0.14 }),
      hair: toon(COL.hair, { side: THREE.DoubleSide, cache: false }),
      hairLock: toon(COL.hair, { cache: false }),
      hairShine: toon(COL.hairShine, { emissive: COL.hairShine, emissiveIntensity: 0.25 }),
      sweater: toon(COL.sweater),
      rib: toon(COL.rib),
      skirt: toon(COL.skirt, { side: THREE.DoubleSide }),
      sock: toon(COL.sock),
      shoe: toon(COL.shoe),
      sole: toon(COL.sole),
      eye: toon(COL.eye),
      shine: ctx.glow(0xffffff, 0.92),
      mouth: toon(COL.mouth),
      clip: toon(COL.clip, { emissive: COL.clip, emissiveIntensity: 0.15 }),
    };
    // 黑髮在夜裡會糊成一團：加一圈淡淡的藍色邊光（菲涅耳），頭髮的輪廓和一束一束的層次才看得出來
    {
      const { float, vec3, dot, max, normalView, positionViewDirection } = ctx.TSL;
      const fres = float(1).sub(max(dot(normalView, positionViewDirection), 0)).pow(3.2);
      const sheen = vec3(0.04, 0.062, 0.15).mul(fres).add(vec3(0.004, 0.005, 0.012));
      M.hair.emissiveNode = sheen;
      M.hairLock.emissiveNode = sheen;
    }
    // 毛衣身體：直條的羅紋針織（顏色深淺交錯一點點）
    M.knit = toon(COL.sweater, { cache: false });
    {
      const { vec3, sin, atan, smoothstep, positionGeometry } = ctx.TSL;
      const c = new THREE.Color(COL.sweater);
      const rib = smoothstep(0.25, 0.75, sin(atan(positionGeometry.x, positionGeometry.z).mul(30)).mul(0.5).add(0.5));
      M.knit.colorNode = vec3(c.r, c.g, c.b).mul(rib.mul(-0.075).add(1));
    }

    // ---------------------------------------------------------------------
    //  幾何小工具
    // ---------------------------------------------------------------------
    // 橢球
    const ellipsoid = (rx, ry, rz, ws = 24, hs = 16) => new THREE.SphereGeometry(1, ws, hs).scale(rx, ry, rz);

    /**
     * 沿著曲線掃出的扁圓管（髮束、袖子用），尾端收成圓頭，起點用平面封口（通常藏在別的東西裡）。
     * opts: w(s) 半寬, t(s) 半厚, side(P, out) 給一個大概的「寬」方向, sq 截面方圓程度(2 = 橢圓)
     */
    function sweep(points, { w, t, side, segs = 26, tipSegs = 6, radial = 16, sq = 2, tipLen = 0.5 }) {
      const curve = new THREE.CatmullRomCurve3(points, false, 'centripetal');
      const len = curve.getLength();
      const tipS = 1 - Math.min(0.45, (w(1) * tipLen) / len);
      const samples = [];
      for (let i = 0; i <= segs; i++) samples.push([(i / segs) * tipS, 1]);
      for (let i = 1; i <= tipSegs; i++) {
        const a = (i / tipSegs) * Math.PI / 2;
        samples.push([tipS + (1 - tipS) * Math.sin(a), Math.cos(a)]);
      }
      const pos = [];
      const P = new THREE.Vector3(), T = new THREE.Vector3(), L = new THREE.Vector3(), N = new THREE.Vector3();
      const pw = 2 / sq;
      const ring = (s, f) => {
        curve.getPointAt(s, P); curve.getTangentAt(s, T);
        side(P, L, s);
        N.crossVectors(T, L).normalize(); L.crossVectors(N, T).normalize();
        const hw = w(s) * f, ht = t(s) * f;
        for (let j = 0; j < radial; j++) {
          const u = (j / radial) * Math.PI * 2;
          const cu = Math.cos(u), su = Math.sin(u);
          const cx = Math.sign(cu) * Math.pow(Math.abs(cu), pw), cy = Math.sign(su) * Math.pow(Math.abs(su), pw);
          pos.push(P.x + L.x * hw * cx + N.x * ht * cy, P.y + L.y * hw * cx + N.y * ht * cy, P.z + L.z * hw * cx + N.z * ht * cy);
        }
      };
      for (const [s, f] of samples) ring(s, f);
      const rings = samples.length;
      const idx = [];
      for (let i = 0; i < rings - 1; i++) {
        for (let j = 0; j < radial; j++) {
          const a = i * radial + j, b = i * radial + ((j + 1) % radial);
          const c = (i + 1) * radial + j, d = (i + 1) * radial + ((j + 1) % radial);
          idx.push(a, b, c, b, d, c);
        }
      }
      // 起點封口
      curve.getPointAt(0, P);
      const ci = pos.length / 3;
      pos.push(P.x, P.y, P.z);
      for (let j = 0; j < radial; j++) idx.push(ci, (j + 1) % radial, j);
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      g.setIndex(idx);
      g.computeVertexNormals();
      return g;
    }

    /** 參數化的旋轉體：fn(φ, k) → [r, y, zScale]，φ 從正前方（+z）起算，k 沿輪廓 0..1 */
    function latheParam(nA, nK, fn) {
      const pos = [], idx = [];
      for (let i = 0; i <= nA; i++) {
        const phi = (i / nA) * Math.PI * 2;
        for (let j = 0; j <= nK; j++) {
          const [r, y, zs = 1, zo = 0] = fn(phi, j / nK);
          pos.push(r * Math.sin(phi), y, r * Math.cos(phi) * zs + zo);
        }
      }
      for (let i = 0; i < nA; i++) {
        for (let j = 0; j < nK; j++) {
          const a = i * (nK + 1) + j, b = (i + 1) * (nK + 1) + j;
          idx.push(a, a + 1, b, b, a + 1, b + 1);
        }
      }
      let g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      g.setIndex(idx);
      g = ctx.BufferGeometryUtils.mergeVertices(g, 1e-5); // 接縫與極點合併，法線才會平滑
      g.computeVertexNormals();
      return g;
    }

    // ---------------------------------------------------------------------
    //  根節點：放在座位上，轉向池塘
    // ---------------------------------------------------------------------
    const [seatX, seatY, seatZ] = LAYOUT.person.seat;
    const [faceX, faceZ] = LAYOUT.person.facing;
    const root = new THREE.Group();
    root.name = 'person';
    root.position.set(seatX, seatY, seatZ);
    root.rotation.y = Math.atan2(faceX - seatX, faceZ - seatZ);
    scene.add(root);
    ctx.objects.person = root;

    // ---------------------------------------------------------------------
    //  裙子：坐著攤在長凳上的百褶裙，前面蓋在大腿上
    // ---------------------------------------------------------------------
    const skirtGeo = latheParam(96, 16, (phi, k) => {
      const front = Math.pow(Math.max(0, Math.cos(phi)), 1.6);
      const waistR = 0.118, waistY = 0.185;
      const hemR = 0.19 + 0.03 * front;
      const hemY = 0.014 + 0.062 * front;
      let r, y;
      if (k <= 0.86) {
        const q = k / 0.86;
        r = lerp(waistR, hemR, Math.sin(q * Math.PI / 2) ** 0.85);
        y = lerp(waistY, hemY, q ** 1.3);
      } else {
        // 裙襬往內收一點，看起來有厚度
        const q = (k - 0.86) / 0.14;
        r = hemR * (1 - 0.12 * q);
        y = hemY - 0.012 * Math.sin(q * Math.PI / 2);
      }
      const pleat = 1 + 0.03 * Math.sin(phi * 16) * smooth(0.15, 0.8, k); // 柔軟的百褶
      return [r * pleat, y, 1 + 0.22 * front, -0.015];
    });
    const skirt = new THREE.Mesh(skirtGeo, M.skirt);
    root.add(skirt);

    // ---------------------------------------------------------------------
    //  腿：大腿平放在凳子上，小腿從膝蓋垂下來（膝蓋是晃腳的樞紐）
    // ---------------------------------------------------------------------
    const legs = [];
    const thighGeo = new THREE.CapsuleGeometry(0.05, 0.22, 6, 16).rotateX(Math.PI / 2);
    const shinGeo = new THREE.CapsuleGeometry(0.038, 0.1, 6, 14).translate(0, -0.06, 0);
    const sockGeo = new THREE.CylinderGeometry(0.043, 0.041, 0.05, 16).translate(0, -0.12, 0);
    const sockCuffGeo = new THREE.TorusGeometry(0.041, 0.011, 8, 20).rotateX(Math.PI / 2).translate(0, -0.095, 0);
    const shoeGeo = ellipsoid(0.05, 0.036, 0.074).translate(0, -0.158, 0.022);
    const soleGeo = ellipsoid(0.052, 0.014, 0.076, 20, 8).translate(0, -0.185, 0.022);
    for (const side of [1, -1]) {
      const x = 0.058 * side;
      const thigh = new THREE.Mesh(thighGeo, M.skin);
      thigh.position.set(x, 0.05, 0.085);
      root.add(thigh);
      const knee = new THREE.Group();
      knee.position.set(x, 0.05, 0.205);
      root.add(knee);
      const shin = new THREE.Mesh(shinGeo, M.skin);
      const sock = new THREE.Mesh(sockGeo, M.sock);
      const cuff = new THREE.Mesh(sockCuffGeo, M.sock);
      const shoe = new THREE.Mesh(shoeGeo, M.shoe);
      const sole = new THREE.Mesh(soleGeo, M.sole);
      knee.add(shin, sock, cuff, shoe, sole);
      legs.push({ knee, side });
    }

    // ---------------------------------------------------------------------
    //  上半身：毛衣（會呼吸）＋ 手臂 ＋ 手放在腿上
    // ---------------------------------------------------------------------
    const chest = new THREE.Group();
    chest.position.set(0, 0.14, -0.012);
    root.add(chest);
    const torsoProfile = [
      [0.0, 0.125], [0.118, 0.125], [0.138, 0.14], [0.142, 0.175], [0.138, 0.23], [0.13, 0.29],
      [0.118, 0.34], [0.1, 0.38], [0.074, 0.412], [0.048, 0.43], [0.0, 0.436],
    ].map(([r, y]) => new THREE.Vector2(r, y - 0.14));
    const torsoGeo = new THREE.LatheGeometry(torsoProfile, 48);
    torsoGeo.scale(1.12, 1, 0.92);
    torsoGeo.computeVertexNormals();
    const torso = new THREE.Mesh(torsoGeo, M.knit);
    chest.add(torso);
    // 毛衣下襬的羅紋
    const hemGeo = new THREE.TorusGeometry(0.136, 0.02, 10, 48).rotateX(Math.PI / 2).scale(1.12, 1, 0.92);
    const hem = new THREE.Mesh(hemGeo, M.knit);
    hem.position.y = 0.0;
    chest.add(hem);
    // 高領的羅紋
    const collarGeo = new THREE.TorusGeometry(0.048, 0.02, 10, 32).rotateX(Math.PI / 2).scale(1.05, 1.05, 1);
    const collar = new THREE.Mesh(collarGeo, M.knit);
    collar.position.y = 0.28;
    chest.add(collar);
    // 胸口一顆小小的橙色鈕扣（呼應橙蛸）
    const button = new THREE.Mesh(ellipsoid(0.014, 0.014, 0.008, 12, 8), M.clip);
    button.position.set(0, 0.175, 0.112);
    button.rotation.x = -0.25;
    chest.add(button);

    // 手臂：肩 → 肘 → 腕，手輕輕放在腿上
    const sleeveW = (s) => lerp(0.046, 0.04, s);
    for (const side of [1, -1]) {
      const sx = side;
      const pts = [V3(0.09 * sx, 0.235, -0.012), V3(0.138 * sx, 0.18, 0.0), V3(0.172 * sx, 0.1, 0.045), V3(0.112 * sx, 0.04, 0.115), V3(0.086 * sx, 0.03, 0.15)];
      const sleeveGeo = sweep(pts, {
        w: sleeveW, t: sleeveW, radial: 16, segs: 22, tipSegs: 4, tipLen: 0.6,
        side: (P, out) => out.set(0, 1, 0),
      });
      const sleeve = new THREE.Mesh(sleeveGeo, M.sweater);
      chest.add(sleeve);
      // 圓圓的肩膀（讓袖子和身體接得順）
      const shoulder = new THREE.Mesh(ellipsoid(0.05, 0.046, 0.05, 18, 12), M.sweater);
      shoulder.position.set(0.104 * sx, 0.222, -0.01);
      chest.add(shoulder);
      // 袖口羅紋 + 手
      const wrist = pts[4];
      const dir = pts[4].clone().sub(pts[3]).normalize();
      const cuff = new THREE.Mesh(new THREE.TorusGeometry(0.031, 0.017, 10, 22), M.rib);
      cuff.position.copy(wrist).addScaledVector(dir, -0.022);
      cuff.quaternion.setFromUnitVectors(V3(0, 0, 1), dir);
      chest.add(cuff);
      const hand = new THREE.Mesh(ellipsoid(0.036, 0.03, 0.04, 18, 12), M.skin);
      hand.position.copy(wrist).addScaledVector(dir, 0.026);
      hand.position.y -= 0.004;
      hand.rotation.y = -0.35 * sx;
      chest.add(hand);
      // 小小的大拇指
      const thumb = new THREE.Mesh(ellipsoid(0.013, 0.011, 0.016, 10, 8), M.skin);
      thumb.position.copy(hand.position).add(V3(-0.026 * sx, 0.012, 0.004));
      chest.add(thumb);
    }

    // ---------------------------------------------------------------------
    //  頭：大大的圓頭，豆豆眼、腮紅、小嘴；黑色長直髮
    // ---------------------------------------------------------------------
    const HR = 0.22;                        // 頭半徑
    const neck = new THREE.Group();          // 轉頭、歪頭的樞紐（脖子）
    neck.position.set(0, 0.42, -0.012);
    neck.rotation.order = 'YXZ';
    root.add(neck);
    const neckMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.042, 0.046, 0.12, 14).translate(0, 0.04, 0), M.skin);
    neck.add(neckMesh);
    const head = new THREE.Group();
    head.position.set(0, 0.215, 0.012);      // 頭中心：世界 y ≈ 1.27
    head.scale.set(1.05, 0.97, 1.0);         // 稍微扁一點、寬一點，比較像動森
    neck.add(head);

    const skull = new THREE.Mesh(new THREE.SphereGeometry(HR, 48, 36), M.skin);
    head.add(skull);

    // 在頭的球面上放東西：theta 從頭頂量起，phi 從正前方往她的左手邊（+x）量起
    const onHead = (mesh, theta, phi, out = 0) => {
      const n = V3(Math.sin(theta) * Math.sin(phi), Math.cos(theta), Math.sin(theta) * Math.cos(phi));
      mesh.position.copy(n).multiplyScalar(HR + out);
      mesh.quaternion.setFromUnitVectors(V3(0, 0, 1), n);
      head.add(mesh);
      return mesh;
    };

    // 豆豆眼（直立的小橢圓）＋ 一點點高光；眨眼時把 y 壓扁
    const EYE_T = 1.74, EYE_P = 0.37;
    const eyes = [];
    const eyeGeo = ellipsoid(0.02, 0.029, 0.011, 20, 14);
    const shineGeo = ellipsoid(0.0072, 0.0072, 0.003, 12, 8);
    const shine2Geo = ellipsoid(0.0036, 0.0036, 0.002, 8, 6);
    const happyGeo = new THREE.TorusGeometry(0.02, 0.0052, 6, 18, Math.PI); // ^ 形狀的開心眼
    const lashGeo = new THREE.CapsuleGeometry(0.0042, 0.012, 3, 8).rotateZ(Math.PI / 2).scale(1, 1, 0.6);
    for (const side of [1, -1]) {
      const eye = new THREE.Group();
      onHead(eye, EYE_T, EYE_P * side, -0.002);
      const ball = new THREE.Mesh(eyeGeo, M.eye);
      const s1 = new THREE.Mesh(shineGeo, M.shine);
      s1.position.set(0.0075, 0.011, 0.008);
      const s2 = new THREE.Mesh(shine2Geo, M.shine);
      s2.position.set(-0.006, -0.012, 0.0085);
      // 眼角一根小小的睫毛（往外翹）
      const lash = new THREE.Mesh(lashGeo, M.eye);
      lash.position.set(0.019 * side, 0.02, 0.003);
      lash.rotation.z = 0.75 * side;
      eye.add(ball, s1, s2, lash);
      const happy = new THREE.Mesh(happyGeo, M.eye);
      happy.visible = false;
      happy.position.set(0, -0.006, 0.006);
      eye.add(happy);
      eyes.push({ eye, open: [ball, s1, s2, lash], happy });
    }
    // 腮紅（橫的扁橢圓）
    for (const side of [1, -1]) {
      const b = new THREE.Mesh(ellipsoid(0.034, 0.018, 0.008, 20, 10), M.blush);
      onHead(b, 1.93, 0.6 * side, -0.003);
    }
    // 小小的微笑
    const mouth = new THREE.Mesh(new THREE.TorusGeometry(0.0125, 0.0034, 6, 16, Math.PI).rotateZ(Math.PI), M.mouth);
    onHead(mouth, 1.94, 0.02, -0.0005);
    // 開心時的嘴：小小的 D 形張嘴＋粉紅舌頭
    const happyMouth = new THREE.Group();
    happyMouth.add(new THREE.Mesh(new THREE.CircleGeometry(0.0165, 20, Math.PI, Math.PI), M.mouth));
    const tongue = new THREE.Mesh(new THREE.CircleGeometry(0.0085, 14, Math.PI, Math.PI).scale(1, 0.75, 1), M.blush);
    tongue.position.set(0, -0.0085, 0.0004);
    happyMouth.add(tongue);
    onHead(happyMouth, 1.915, 0.02, 0.0012);
    happyMouth.visible = false;

    // ---- 頭髮：一頂帽子形的頭髮（含瀏海的圓弧髮尾）----
    const wrapA = (p) => Math.atan2(Math.sin(p), Math.cos(p));       // → -π..π
    const BANG_W = 0.34, BANG_OFF = 0.07;
    function hairline(phi) {
      const p = wrapA(phi), a = Math.abs(p);
      let base;
      if (a < 0.82) base = 1.57;
      else if (a < 1.26) base = lerp(1.57, 2.62, EASE.smooth((a - 0.82) / 0.44));  // 兩側蓋住耳朵、一路到下巴
      else base = lerp(2.62, 2.72, EASE.smooth((a - 1.26) / (Math.PI - 1.26)));
      // 瀏海：一片一片圓圓的髮尾，中間的縫稍微偏一邊
      const u = (p + BANG_OFF) / BANG_W + 0.5;
      const f = u - Math.floor(u);
      const drop = 1 - (2 * f - 1) ** 2;
      const fade = 1 - smooth(0.62, 0.95, a);
      return base - 0.15 * (1 - Math.sqrt(drop)) * fade;
    }
    const HAIR_R = 0.236;
    const capGeo = (() => {
      const nP = 192, nT = 44;
      const pos = [], idx = [];
      for (let i = 0; i <= nP; i++) {
        const phi = (i / nP) * Math.PI * 2 + Math.PI;   // 接縫放在後腦勺
        const tMax = hairline(phi);
        const back = Math.max(0, -Math.cos(phi));
        for (let j = 0; j <= nT; j++) {
          const k = j / nT;
          const th = tMax * (1 - (1 - k) ** 1.5);
          let r = HAIR_R + 0.007 * back * Math.sin(th) + 0.006 * Math.cos(th);
          // 髮尾往內收進皮膚裡：看起來是一整塊厚厚圓圓的頭髮
          const tuck = 1 - smooth(0, 0.13, tMax - th);
          r = lerp(r, HR - 0.002, tuck);
          pos.push(r * Math.sin(th) * Math.sin(phi), r * Math.cos(th), r * Math.sin(th) * Math.cos(phi));
        }
      }
      for (let i = 0; i < nP; i++) {
        for (let j = 0; j < nT; j++) {
          const a = i * (nT + 1) + j, b = (i + 1) * (nT + 1) + j;
          idx.push(a, a + 1, b, b, a + 1, b + 1);
        }
      }
      let g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      g.setIndex(idx);
      g = ctx.BufferGeometryUtils.mergeVertices(g, 1e-5);
      g.computeVertexNormals();
      return g;
    })();
    const cap = new THREE.Mesh(capGeo, M.hair);
    head.add(cap);

    // 頭頂的一圈「天使光環」髮光（淡淡的藍）
    const shineBand = (() => {
      const nP = 120, nT = 4, phi0 = -1.35, phi1 = 1.35;
      const pos = [], idx = [];
      for (let i = 0; i <= nP; i++) {
        const phi = lerp(phi0, phi1, i / nP);
        const zig = 0.05 * Math.abs(((i % 8) / 4) - 1);        // 鋸齒邊
        const edge = smooth(0, 0.2, (i / nP)) * smooth(0, 0.2, 1 - i / nP);
        const t0 = 0.56 - 0.03 * edge, t1 = 0.56 + (0.05 + zig) * edge;
        for (let j = 0; j <= nT; j++) {
          const th = lerp(t0, t1, j / nT);
          const r = HAIR_R + 0.006 * Math.cos(th) + 0.0016;
          pos.push(r * Math.sin(th) * Math.sin(phi), r * Math.cos(th), r * Math.sin(th) * Math.cos(phi));
        }
      }
      for (let i = 0; i < nP; i++) for (let j = 0; j < nT; j++) {
        const a = i * (nT + 1) + j, b = (i + 1) * (nT + 1) + j;
        idx.push(a, a + 1, b, b, a + 1, b + 1);
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      g.setIndex(idx);
      g.computeVertexNormals();
      return new THREE.Mesh(g, M.hairShine);
    })();
    head.add(shineBand);

    // 小小的橙色髮夾（左邊瀏海上，兩根交叉成 ×）
    const clip = new THREE.Group();
    const clipGeo = new THREE.CapsuleGeometry(0.0095, 0.04, 4, 10).rotateZ(Math.PI / 2);
    for (const r of [0.62, -0.62]) {
      const bar = new THREE.Mesh(clipGeo, M.clip);
      bar.rotation.z = r;
      clip.add(bar);
    }
    onHead(clip, 1.2, 0.66, 0.02);

    // ---- 臉兩側垂下來的髮束（公主切的鬢髮）----
    const sideOf = (P, out) => {
      // 寬的方向 ≈ 水平、和「從頭軸往外」垂直
      out.set(-P.z, 0, P.x);
      if (out.lengthSq() < 1e-6) out.set(1, 0, 0);
      return out.normalize();
    };
    for (const side of [1, -1]) {
      const a = 1.12 * side;                 // 從正前方往旁邊 64°
      const d = V3(Math.sin(a), 0, Math.cos(a));
      const pts = [
        d.clone().multiplyScalar(0.17).setY(0.07),
        d.clone().multiplyScalar(0.224).setY(-0.02),
        V3(0.19 * side, -0.13, 0.1),
        V3(0.168 * side, -0.215, 0.104),
      ];
      const geo = sweep(pts, {
        w: (s) => lerp(0.056, 0.04, s), t: (s) => lerp(0.017, 0.012, s), sq: 2.6, tipLen: 0.9,
        side: sideOf,
      });
      head.add(new THREE.Mesh(geo, M.hairLock));
    }

    // ---- 後面的長直髮：幾束從後腦勺垂到腰（每束各自跟著風輕輕晃）----
    const locks = [];
    const LOCK_B = [-84, -56, -28, 0, 28, 56, 84];
    LOCK_B.forEach((deg, i) => {
      const b = (deg * Math.PI) / 180;
      const sb = Math.sin(b), cb = Math.cos(b);
      // 頭後方的方向（β = 0 是正後方）
      const dir = V3(sb, 0, -cb);
      const pivot = dir.clone().multiplyScalar(0.226).setY(-0.075);
      const below = 1 - cb;                    // 越旁邊越往前收
      const len = 0.47 - 0.04 * below + (i % 2 ? -0.018 : 0);   // 髮尾長短交錯一點點
      const ptsW = [
        dir.clone().multiplyScalar(0.15).setY(0.09),
        pivot.clone(),
        V3(sb * 0.192, -0.24, -0.2 + below * 0.085),
        V3(sb * 0.162, -0.36, -0.184 + below * 0.072),
        V3(sb * 0.146, -len, -0.172 + below * 0.06),
      ];
      const geo = sweep(ptsW.map((p) => p.clone().sub(pivot)), {
        w: (s) => lerp(0.062, 0.045, s) * (Math.abs(deg) > 70 ? 0.85 : 1),
        t: (s) => lerp(0.03, 0.022, s),
        sq: 2.4, tipLen: 0.55, segs: 30,
        side: (P, out) => sideOf(P.clone().add(pivot), out),
      });
      const piv = new THREE.Group();
      piv.position.copy(pivot);
      const m = new THREE.Mesh(geo, M.hairLock);
      piv.add(m);
      head.add(piv);
      locks.push({ piv, phase: i * 0.7 + rnd() * 0.5, side: sb });
    });

    shadow(root);
    // 毛衣不接收陰影：近景時頭的影子落在胸口會變成一塊髒髒的灰
    chest.traverse((o) => { if (o.isMesh) o.receiveShadow = false; });
    happyMouth.traverse((o) => { o.castShadow = false; });
    // 臉上的小東西不必投影
    for (const e of eyes) e.eye.traverse((o) => { o.castShadow = false; });
    mouth.castShadow = false;
    shineBand.castShadow = false;

    // ---------------------------------------------------------------------
    //  錨點
    // ---------------------------------------------------------------------
    root.updateMatrixWorld(true);
    const headWorld = new THREE.Vector3();
    head.getWorldPosition(headWorld);
    ctx.anchors.person = headWorld;
    const rootInv = root.matrixWorld.clone().invert();

    // ---------------------------------------------------------------------
    //  動畫：呼吸、偶爾晃腳、慢慢眨眼、偶爾歪頭看章魚、看流星
    // ---------------------------------------------------------------------
    const st = {
      yaw: 0, pitch: 0.1, roll: 0,
      nextBlink: 1.5 + rnd() * 2, blinkT: -1, doubleBlink: false,
      nextSwing: 3 + rnd() * 4, swingStart: -99, swingDur: 4, swingAmp: 0.3, swingFreq: 0.8,
      nextTilt: 5 + rnd() * 5, tiltStart: -99, tiltDur: 3, tiltDir: 1,
      happyStart: -99, happyDur: 2.4,
      lookUpStart: -99, lookUpDur: 0, lookUpYaw: 0, lookUpPitch: 0,
      noticeStart: -99, noticeDur: 1, noticeDir: 1, lean: 0,
    };
    const tmp = new THREE.Vector3();

    function startSwing(t, lively) {
      st.swingStart = t;
      st.swingDur = lively ? 2.6 : 3.2 + rnd() * 1.6;
      st.swingAmp = (lively ? 0.42 : 0.26 + rnd() * 0.1) * (ctx.reducedMotion ? 0.45 : 1);
      st.swingFreq = (lively ? 1.0 : 0.72 + rnd() * 0.15) * (ctx.reducedMotion ? 0.6 : 1);
      st.nextSwing = t + st.swingDur + 6 + rnd() * 6;
    }

    // 橙蛸吐愛心泡泡：過一下下，開心地瞇眼、歪頭、晃晃腳
    ctx.events.on('octopus:heart', () => {
      const t = ctx.time;
      st.happyStart = t + 1.1;
      st.tiltStart = t + 0.9; st.tiltDur = 3.2; st.tiltDir = rnd() < 0.5 ? 1 : -1;
      st.nextTilt = t + 10;
      if (t - st.swingStart > st.swingDur) { st.swingStart = -99; st.nextSwing = t + 1.4; st.livelyNext = true; }
    });
    // 流星：只在天上的，抬頭看天空；映在水裡的，就往前探一點、歪著頭看水面（看完慢慢眨一下眼）
    ctx.events.on('meteor', (d) => {
      const dur = (d && d.duration) || 1.5;
      if (d && d.reflect) {
        st.noticeStart = ctx.time + 0.2;
        st.noticeDur = dur + 2.2;
        st.noticeDir = rnd() < 0.5 ? 1 : -1;
        st.nextBlink = Math.max(st.nextBlink, st.noticeStart + st.noticeDur - 0.4);
        return;
      }
      st.lookUpStart = ctx.time + 0.25;
      st.lookUpDur = dur + 1.6;
      st.lookUpYaw = 0;
      if (d && d.start && d.end) {
        const mid = tmp.set((d.start.x + d.end.x) / 2, (d.start.y + d.end.y) / 2, (d.start.z + d.end.z) / 2).applyMatrix4(rootInv);
        st.lookUpYaw = THREE.MathUtils.clamp(Math.atan2(mid.x, mid.z), -0.45, 0.45);
      }
      st.lookUpPitch = -0.28;
    });

    ctx.onUpdate((t, dt) => {
      const rm = ctx.reducedMotion;

      // ---- 呼吸 ----
      const bp = rm ? 5.6 : 4.4;
      const br = Math.sin((t / bp) * Math.PI * 2);
      chest.scale.set(1 + 0.008 * br, 1 + 0.018 * br, 1 + 0.01 * br);
      neck.position.y = 0.42 + 0.005 * br;

      // ---- 晃腳 ----
      if (t > st.nextSwing && t - st.swingStart > st.swingDur) { startSwing(t, st.livelyNext); st.livelyNext = false; }
      const sk = (t - st.swingStart) / st.swingDur;
      const env = sk >= 0 && sk <= 1 ? Math.sin(Math.PI * sk) ** 1.5 : 0;
      for (const L of legs) {
        const ph = (t - st.swingStart) * st.swingFreq * Math.PI * 2 + (L.side > 0 ? 0 : Math.PI);
        const idle = 0.02 * Math.sin(t * 0.5 + L.side);
        L.knee.rotation.x = -(0.12 + idle + env * st.swingAmp * (0.5 - 0.5 * Math.cos(ph)));
      }

      // ---- 眨眼 ----
      let open = 1;
      if (t > st.nextBlink) { st.blinkT = t; st.doubleBlink = rnd() < 0.22; st.nextBlink = t + (rm ? 4 : 2.6) + rnd() * 4; }
      const bt = t - st.blinkT;
      const bd = 0.17;
      if (bt >= 0 && bt < bd) open = 1 - Math.sin((bt / bd) * Math.PI) * 0.92;
      else if (st.doubleBlink && bt >= bd + 0.12 && bt < bd * 2 + 0.12) open = 1 - Math.sin(((bt - bd - 0.12) / bd) * Math.PI) * 0.92;
      const hk = (t - st.happyStart) / st.happyDur;
      const happy = hk >= 0 && hk <= 1;
      for (const e of eyes) {
        e.eye.scale.y = happy ? 1 : open;
        for (const o of e.open) o.visible = !happy;
        e.open[1].visible = e.open[2].visible = !happy && open > 0.45;   // 閉眼時高光收起來
        e.happy.visible = happy;
      }
      mouth.visible = !happy;
      happyMouth.visible = happy;

      // ---- 頭：看著章魚（慢慢跟），偶爾歪頭，流星時抬頭 ----
      let yawT = 0.06, pitchT = 0.11;
      const oct = ctx.anchors.octopus;
      if (oct) {
        tmp.copy(oct).applyMatrix4(rootInv);
        yawT = THREE.MathUtils.clamp(Math.atan2(tmp.x, tmp.z), -0.34, 0.34) * 0.85;
        pitchT = 0.1 + 0.05 * clamp01((1.9 - Math.hypot(tmp.x, tmp.z) * 0.5));
      }
      if (t > st.nextTilt && t - st.tiltStart > st.tiltDur) {
        st.tiltStart = t; st.tiltDur = 2.6 + rnd() * 2; st.tiltDir = rnd() < 0.5 ? 1 : -1; st.nextTilt = t + st.tiltDur + 7 + rnd() * 7;
      }
      const tk = (t - st.tiltStart) / st.tiltDur;
      const tiltEnv = tk >= 0 && tk <= 1 ? EASE.inOutSine(Math.min(1, Math.min(tk, 1 - tk) * 3.2)) : 0;
      let rollT = tiltEnv * 0.13 * st.tiltDir;
      yawT += tiltEnv * 0.05 * st.tiltDir;
      const lk = (t - st.lookUpStart) / st.lookUpDur;
      if (lk >= 0 && lk <= 1) {
        const le = EASE.inOutSine(Math.min(1, Math.min(lk, 1 - lk) * 4));
        yawT = lerp(yawT, st.lookUpYaw, le);
        pitchT = lerp(pitchT, st.lookUpPitch, le);
        rollT *= 1 - le;
      }
      if (happy) rollT += 0.04 * st.tiltDir;
      // 水面上滑過流星的倒影：身體往前探一點，頭歪一歪
      const nk = (t - st.noticeStart) / st.noticeDur;
      let leanT = 0;
      if (nk >= 0 && nk <= 1) {
        const ne = EASE.inOutSine(Math.min(1, Math.min(nk, 1 - nk) * 3.5));
        leanT = 0.07 * ne;
        pitchT += 0.08 * ne;
        rollT = lerp(rollT, 0.1 * st.noticeDir, ne);
      }
      const rate = 1 - Math.exp(-dt * (rm ? 1.0 : 1.6));
      st.yaw += (yawT - st.yaw) * rate;
      st.pitch += (pitchT - st.pitch) * rate;
      st.roll += (rollT - st.roll) * rate;
      st.lean += (leanT - st.lean) * rate;
      chest.rotation.x = st.lean;
      neck.position.z = -0.012 + Math.sin(st.lean) * 0.28;
      neck.rotation.set(st.pitch + st.lean + 0.008 * br, st.yaw, st.roll);

      // ---- 長髮被晚風吹得輕輕晃 ----
      const amp = rm ? 0.3 : 1;
      for (const L of locks) {
        const w = Math.sin(t * 0.9 + L.phase) * 0.6 + Math.sin(t * 0.37 + L.phase * 1.7) * 0.4;
        L.piv.rotation.x = (0.022 + 0.022 * w) * amp;              // 只往後飄，不會穿進背裡
        L.piv.rotation.z = 0.014 * Math.sin(t * 0.55 + L.phase) * amp;
      }

      head.getWorldPosition(headWorld);
    });
  },
});

// ---------------------------------------------------------------- parts/40-sky.js
// ---- 天空：夜空穹頂、星星、滿月、流星雨、遠處的雲，還有院子裡的螢火蟲 ----
// 穹頂／星星／月亮放在「跟著鏡頭走」的一層裡（等於無限遠，方向永遠一致，和月光、池塘的月影對得上）。
// 流星在世界座標裡飛，但起點依照當下的鏡頭挑：挑一條畫面上看得見、沒有被島擋住的路線。
PARTS.push({
  name: 'sky',
  order: 40,
  build(ctx) {
    const { THREE, TSL, LAYOUT, PALETTE, scene, camera } = ctx;
    const {
      uniform, vec2, vec3, float, uv, texture, positionLocal, positionWorld, normalize, dot, max, pow, mix,
      smoothstep, sin, abs, exp, floor, oneMinus, instancedBufferAttribute, instancedDynamicBufferAttribute,
      screenCoordinate, interleavedGradientNoise, normalWorldGeometry, cameraPosition, distance,
    } = TSL;
    const TAU = Math.PI * 2;
    const rnd = ctx.rand(4040);
    const lin = (hex) => new THREE.Color(hex);                         // sRGB 十六進位 → 線性
    const col3 = (hex, k = 1) => { const c = lin(hex); return vec3(c.r * k, c.g * k, c.b * k); };
    const smooth = (a, b, x) => { const t = ctx.clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };
    // 「螢幕上想看到的顏色」→ 要輸出的線性值：反推 Neutral 色調映射暗部會扣掉最小通道的那一段，
    // 不然深藍會被吃成純藍、一點紫都不剩。只適用於暗色（天空、雲）。
    const EXPO = (ctx.renderer && ctx.renderer.toneMappingExposure) || 1.1;
    const disp = (hex) => {
      const d = lin(hex);
      const dm = Math.min(d.r, d.g, d.b);
      let off;
      if (dm < 0.04) { const m = Math.sqrt(dm / 6.25); off = m - dm; } else off = 0.04;
      return vec3((d.r + off) / EXPO, (d.g + off) / EXPO, (d.b + off) / EXPO);
    };

    const sky = new THREE.Group();
    sky.name = 'sky';
    scene.add(sky);
    ctx.objects.sky = sky;

    // 跟著鏡頭位置走的一層（不轉）：穹頂、星星、月亮
    const far = new THREE.Group();
    far.name = 'sky-far';
    sky.add(far);

    const uTime = uniform(0);                                          // 天空自己的時鐘（減少動態時走慢）
    const uTwinkle = uniform(ctx.reducedMotion ? 0 : 1);               // 星星閃爍的幅度（減少動態時 = 0）
    const moonDir = new THREE.Vector3(...LAYOUT.moon).normalize();
    const uMoonDir = uniform(moonDir.clone());

    scene.background = new THREE.Color(0x0c1640);

    // =====================================================================
    //  1. 穹頂：天頂深藏青 → 中段 → 地平線附近的藍紫光帶 → 下方再暗下去（讓漂浮的島跳出來）
    // =====================================================================
    const DOME_R = 300;
    const domeMat = new THREE.MeshBasicNodeMaterial({ side: THREE.BackSide, depthWrite: false });
    domeMat.fog = false;
    {
      const dir = normalize(positionLocal);
      const h = dir.y;
      // 顏色都是「螢幕上的樣子」
      const cTop = disp(PALETTE.skyTop), cMid = disp(PALETTE.skyMid), cHor = disp(0x2c3878);
      const cLow = disp(0x18225a), cDeep = disp(0x0b0f30);
      // 地平線以上：光帶 → 中段 → 天頂
      const upper = mix(mix(cHor, cMid, smoothstep(0.02, 0.34, h)), cTop, smoothstep(0.3, 0.9, h));
      // 地平線以下：光帶慢慢沉到深藍
      const hb = h.negate();
      const lower = mix(mix(cHor, cLow, smoothstep(0.02, 0.36, hb)), cDeep, smoothstep(0.34, 0.9, hb));
      let c = mix(lower, upper, smoothstep(-0.04, 0.04, h));
      // 貼著地平線一圈淡淡的薰衣草色霧光
      const hz = h.add(0.03);
      c = c.add(col3(0x8a7fc8).mul(exp(hz.mul(hz).mul(-60)).mul(0.02)));
      // 月亮那一側的柔光（偏一點冷，和藍天融在一起，不會變灰）
      const md = max(dot(dir, uMoonDir), 0);
      c = c.add(col3(0xdfe2ff).mul(pow(md, 120).mul(0.07).add(pow(md, 14).mul(0.022))));
      // 很細的抖色，避免暗部漸層出現色階
      const n = interleavedGradientNoise(screenCoordinate.xy).sub(0.5);
      c = c.add(pow(c, vec3(0.55)).mul(n.mul(0.012)));
      domeMat.colorNode = c;
    }
    const dome = new THREE.Mesh(new THREE.SphereGeometry(DOME_R, 64, 40), domeMat);
    dome.renderOrder = -10;
    dome.frustumCulled = false;
    far.add(dome);

    // =====================================================================
    //  2. 星星：一個 instanced sprite（一次畫完），亮星用小十字星芒
    // =====================================================================
    const dotTex = ctx.makeCanvasTexture(64, (g, s) => {
      const gr = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
      gr.addColorStop(0, 'rgba(255,255,255,1)');
      gr.addColorStop(0.22, 'rgba(255,255,255,0.8)');
      gr.addColorStop(0.5, 'rgba(255,255,255,0.16)');
      gr.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = gr; g.fillRect(0, 0, s, s);
    });
    const sparkTex = ctx.makeCanvasTexture(128, (g, s) => {
      const c = s / 2;
      const gr = g.createRadialGradient(c, c, 0, c, c, c * 0.42);
      gr.addColorStop(0, 'rgba(255,255,255,1)');
      gr.addColorStop(0.25, 'rgba(255,255,255,0.75)');
      gr.addColorStop(0.6, 'rgba(255,255,255,0.14)');
      gr.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = gr; g.fillRect(0, 0, s, s);
      g.globalCompositeOperation = 'lighter';
      // 四道細細的星芒（長的上下左右，短的斜角）
      const ray = (ang, len, w, a) => {
        g.save(); g.translate(c, c); g.rotate(ang);
        const rg = g.createRadialGradient(0, 0, 0, 0, 0, len);
        rg.addColorStop(0, `rgba(255,255,255,${a})`);
        rg.addColorStop(0.35, `rgba(255,255,255,${a * 0.35})`);
        rg.addColorStop(1, 'rgba(255,255,255,0)');
        g.fillStyle = rg;
        g.beginPath(); g.moveTo(-len, 0); g.lineTo(0, -w); g.lineTo(len, 0); g.lineTo(0, w); g.closePath(); g.fill();
        g.restore();
      };
      ray(0, c * 0.98, 2.6, 0.95); ray(Math.PI / 2, c * 0.98, 2.6, 0.95);
      ray(Math.PI / 4, c * 0.42, 1.6, 0.5); ray(-Math.PI / 4, c * 0.42, 1.6, 0.5);
    });

    const STAR_R = 280;
    const STAR_TINTS = [[PALETTE.star, 0.58], [0xfff0d4, 0.2], [0xc4d2ff, 0.13], [0xffd8ea, 0.09]];
    const pickTint = () => { let r = rnd(); for (const [c, w] of STAR_TINTS) { if ((r -= w) <= 0) return lin(c); } return lin(PALETTE.star); };
    // 方向：大部分落在鏡頭常看的那一圈（仰角 -42°..+34°），其餘散在整個天球
    function starDir(out) {
      for (let guard = 0; guard < 40; guard++) {
        const y = rnd() < 0.72 ? -0.67 + rnd() * 1.23 : -0.95 + rnd() * 1.93;
        // 地平線光帶附近稀一點
        const band = Math.abs(y + 0.02);
        if (band < 0.07 && rnd() < 0.55) continue;
        const a = rnd() * TAU, r = Math.sqrt(1 - y * y);
        return out.set(Math.cos(a) * r, y, Math.sin(a) * r);
      }
      return out.set(0, 1, 0);
    }
    function makeStarLayer(count, tex, kind) {
      const STRIDE = 12;
      const data = new Float32Array(count * STRIDE);
      const d = new THREE.Vector3();
      for (let i = 0; i < count; i++) {
        starDir(d);
        // 避開月亮本身
        if (d.dot(moonDir) > 0.993) starDir(d);
        const tint = pickTint();
        let size, bright, amp, speed;
        if (kind === 'spark') {
          size = 5.2 + rnd() * 3.2; bright = 1.25 + rnd() * 0.55; amp = 0.35 + rnd() * 0.25; speed = 0.9 + rnd() * 1.2;
        } else {
          const p = Math.pow(rnd(), 2.2);                            // 大多數是小小暗暗的
          size = 1.3 + p * 2.4; bright = 0.32 + p * 0.85 + rnd() * 0.12; amp = 0.15 + rnd() * 0.45; speed = 0.7 + rnd() * 2.4;
        }
        // 靠近地平線光帶的星星淡一點
        bright *= 0.45 + 0.55 * smooth(0.0, 0.16, Math.abs(d.y + 0.02));
        const o = i * STRIDE;
        data[o] = d.x * STAR_R; data[o + 1] = d.y * STAR_R; data[o + 2] = d.z * STAR_R; data[o + 3] = size;
        data[o + 4] = tint.r; data[o + 5] = tint.g; data[o + 6] = tint.b; data[o + 7] = bright;

      _up.setFromMatrixColumn(camera.matrixWorld, 1);
      _fwd.setFromMatrixColumn(camera.matrixWorld, 2).negate();
      // 離輻射點越遠的方向走（決定往左還是往右）
      const t = _fwd.clone().multiplyScalar(_fwd.dot(radiant)).sub(radiant);
      const baseSide = t.dot(_right) >= 0 ? 1 : -1;
      const aspect = camera.aspect || 1.6;
      let best = null, bestScore = -1;
      for (let k = 0; k < 16; k++) {
        // 每隔一個候選貼著畫面上緣、斜度小：鏡頭往下看、天空只剩上面一條的時候用得到
        const hug = k % 2 === 1;
        const side = r() < 0.8 ? baseSide : -baseSide;
        const q = r();
        const ang = (hug ? 7 + r() * 13 : q < 0.7 ? 18 + r() * 20 : q < 0.92 ? 38 + r() * 14 : 52 + r() * 10) * Math.PI / 180;
        const L = hug ? 0.75 + r() * 0.5 : 0.55 + r() * 0.45;         // 以畫面高度的一半為單位
        const xm = (r() - 0.5) * (hug ? 0.8 : 1.1);
        const ym = hug ? 0.8 + r() * 0.16 : 0.22 + r() * 0.68;
        const dx = side * Math.cos(ang) * L / aspect, dy = -Math.sin(ang) * L;
        const D = 72 + r() * 40;
        ndcToWorld(xm - dx / 2, ym - dy / 2, D, _a);
        ndcToWorld(xm + dx / 2, ym + dy / 2, D, _b);
        const s = visibility(_a, _b) + r() * 0.05;
        if (s > bestScore) { bestScore = s; best = [_a.clone(), _b.clone()]; }
        if (s >= 0.95) break;
      }
      out.start.copy(best[0]); out.end.copy(best[1]);
      return bestScore;
    }
    // 會映在池子裡的流星：從鏡頭看過去，落在「池子後上方」那一片天（倒影剛好落進池子）
    function planReflect(out, r) {
      const C = camera.position;
      const P = new THREE.Vector3(LAYOUT.pond.center[0], LAYOUT.pond.waterY, LAYOUT.pond.center[1]);
      let bx = P.x - C.x, bz = P.z - C.z;
      const hd = Math.hypot(bx, bz) || 1;
      bx /= hd; bz /= hd;
      if (hd < 0.5) { bx = -0.35; bz = -0.94; }
      const el = Math.min(0.6, Math.max(0.28, Math.atan2(C.y - P.y, hd))) + (r() - 0.5) * 0.06;
      const D = 88 + r() * 14;
      const az = (r() - 0.5) * 0.16;                                  // 方位稍微偏一點
      const ca = Math.cos(az), sa = Math.sin(az);
      const fx = bx * ca - bz * sa, fz = bx * sa + bz * ca;
      const M = new THREE.Vector3(C.x + fx * Math.cos(el) * D, C.y + Math.sin(el) * D, C.z + fz * Math.cos(el) * D);
      const side = r() < 0.5 ? 1 : -1;
      const ang = (28 + r() * 14) * Math.PI / 180;
      const dir = new THREE.Vector3(-fz * side * Math.cos(ang), -Math.sin(ang), fx * side * Math.cos(ang)).normalize();
      const L = 26 + r() * 8;
      out.start.copy(M).addScaledVector(dir, -L / 2);
      out.end.copy(M).addScaledVector(dir, L / 2);
    }

    const mr = ctx.rand(9090);
    const plan = { start: new THREE.Vector3(), end: new THREE.Vector3() };
    function launch(reflect, opts = {}) {
      let score = 1;
      if (reflect) planReflect(plan, mr);
      else score = planInView(plan, mr);
      if (!opts.force && score < 0.35) return null;                   // 看不見就先不放（免得只有聲音）
      // 池子裡找一顆空的；都在飛的話，借最早的那顆
      const m = pool.find((x) => !x.active) || pool.reduce((a, b) => (a.t0 < b.t0 ? a : b));
      m.start.copy(plan.start); m.end.copy(plan.end);
      const rm = ctx.reducedMotion;
      m.reflect = !!reflect;
      m.dir.subVectors(m.end, m.start);
      m.len = m.dir.length();
      m.dir.divideScalar(m.len);
      m.dur = (0.9 + mr() * 0.9) * (rm ? 1.6 : 1);
      if (reflect) m.dur = Math.max(m.dur, rm ? 2.2 : 1.4);
      m.fade = 0.35 + mr() * 0.25;
      m.tail = 0.42 + mr() * 0.18;
      const dist = m.start.distanceTo(camera.position);
      const k = dist / 90;                                             // 遠近不同，畫面上看起來差不多粗
      m.width = (0.34 + mr() * 0.14) * k;
      m.headSize = (2.3 + mr() * 0.8) * k;
      m.flare = mr() < 0.45 ? 0.3 + mr() * 0.4 : 0;               // 偶爾中途亮一下（不要太刺眼）
      m.t0 = ctx.time;
      m.active = true;
      m.ribbon.visible = m.head.visible = true;
      m.uFade.value = 0; m.uHead.value = 0;
      ctx.events.emit('meteor', { reflect: m.reflect, duration: m.dur, start: m.start.clone(), end: m.end.clone() });
      return m;
    }

    const _s = new THREE.Vector3(), _h = new THREE.Vector3(), _tl = new THREE.Vector3(), _toCam = new THREE.Vector3();
    function updateMeteor(m, t) {
      const el = t - m.t0;
      const k = el / m.dur;
      if (k > 1 + m.fade / m.dur) {
        m.active = false;
        m.ribbon.visible = m.head.visible = false;
        return;
      }
      const kh = Math.min(1, k);
      const kp = kh * (1.12 - 0.12 * kh);                             // 稍微減速
      _h.copy(m.start).addScaledVector(m.dir, m.len * kp);
      // 頭：淡入 → 亮 → 燒完；有的中途閃一下
      let headEnv = smooth(0, 0.1, k) * (1 - smooth(0.72, 1.0, k));
      headEnv *= 1 + m.flare * Math.exp(-(((k - 0.62) / 0.07) ** 2));
      // 尾巴：一開始慢慢拉長，頭燒完以後縮一點、慢慢散掉
      const after = k > 1 ? (el - m.dur) / m.fade : 0;
      const tailEnv = smooth(0, 0.12, k) * (1 - smooth(0, 1, after));
      let kt = Math.max(0, kp - m.tail * Math.min(1, k / 0.4));
      if (after > 0) kt += (kp - kt) * 0.45 * after;
      _tl.copy(m.start).addScaledVector(m.dir, m.len * kt);
      // 寬度方向：垂直於路線、也垂直於視線
      _toCam.subVectors(camera.position, _h);
      _s.crossVectors(m.dir, _toCam).normalize();
      const arr = m.pa.array;
      for (let i = 0; i <= MET_SEG; i++) {
        const u = i / MET_SEG;
        _p.lerpVectors(_tl, _h, u);
        const w = m.width * Math.pow(u, 0.75) * (0.6 + 0.4 * tailEnv);
        const o = i * 6;
        arr[o] = _p.x - _s.x * w; arr[o + 1] = _p.y - _s.y * w; arr[o + 2] = _p.z - _s.z * w;
        arr[o + 3] = _p.x + _s.x * w; arr[o + 4] = _p.y + _s.y * w; arr[o + 5] = _p.z + _s.z * w;
      }
      m.pa.needsUpdate = true;
      m.uFade.value = tailEnv;
      m.uHead.value = headEnv;
      m.head.position.copy(_h);
      m.head.scale.setScalar(m.headSize * (0.55 + 0.45 * Math.min(1, headEnv)));
    }

    // ---- 排程：自己會一顆接一顆地掉；導演要的時候馬上放一顆 ----
    const interval = () => (ctx.reducedMotion ? 10 + mr() * 6 : 3.5 + mr() * 4.5);
    let nextMeteor = 2.2 + mr() * 2;
    let pairAt = -1;
    ctx.events.on('meteor:request', (d) => {
      const reflect = !!(d && d.reflect);
      launch(reflect, { force: true });
      nextMeteor = Math.max(nextMeteor, ctx.time + 2.8);
    });
    ctx.objects.meteors = { group: meteors, launch: (reflect = false) => launch(reflect, { force: true }) };

    // =====================================================================
    //  6. 螢火蟲：50 顆黃綠色的小光點，在院子裡慢慢飄（避開小屋、亭子、雞窩……）
    // =====================================================================
    const FF_N = 50;
    const FF = LAYOUT.fireflies;
    const ff = [];
    {
      const fr = ctx.rand(5151);
      const H = LAYOUT.house;
      const boxes = [[H.eave.x0 - 0.1, H.eave.x1 + 0.1, -5.0, -0.4]];   // 小屋 + 屋簷 + 台階 + 花壇
      const circles = [
        [LAYOUT.pavilion.center[0], LAYOUT.pavilion.center[1], 1.95],
        [LAYOUT.coop.center[0], LAYOUT.coop.center[1], 1.35],
        [LAYOUT.hive.center[0], LAYOUT.hive.center[1], 0.9],
        [LAYOUT.tapir.center[0], LAYOUT.tapir.center[1], 1.55],
        ...LAYOUT.trees.map(([x, z, s]) => [x, z, 1.15 * s]),
      ];
      const clearance = (x, z) => {
        let d = Infinity;
        for (const [x0, x1, z0, z1] of boxes) {
          const dx = Math.max(x0 - x, 0, x - x1), dz = Math.max(z0 - z, 0, z - z1);
          const inside = x > x0 && x < x1 && z > z0 && z < z1;
          d = Math.min(d, inside ? -1 : Math.hypot(dx, dz));
        }
        for (const [cx, cz, r] of circles) d = Math.min(d, Math.hypot(x - cx, z - cz) - r);
        return d;
      };
      let guard = 0;
      while (ff.length < FF_N && guard++ < 20000) {
        const a = fr() * TAU, rr = Math.sqrt(fr()) * (FF.radius - 0.6);
        const hx = Math.cos(a) * rr, hz = Math.sin(a) * rr;
        const A = 0.45 + fr() * 0.75;                                  // 水平漂移的範圍
        if (rr + A > FF.radius - 0.15) continue;
        if (clearance(hx, hz) < A + 0.2) continue;
        if (hz < -1.5 && fr() < 0.45) continue;                       // 屋後少一點、院子和池邊多一點
        const Ay = 0.2 + fr() * 0.35;
        const hy = FF.yMin + Ay + 0.05 + fr() * (FF.yMax - FF.yMin - 2 * Ay - 0.1);
        ff.push({
          hx, hy, hz, A, Ay,
          w: [0.13 + fr() * 0.17, 0.31 + fr() * 0.25, 0.11 + fr() * 0.15, 0.27 + fr() * 0.22, 0.17 + fr() * 0.2, 0.45 + fr() * 0.3],
          p: Array.from({ length: 6 }, () => fr() * TAU),
          per: 2.6 + fr() * 3.6, pph: fr() * TAU, base: 0.06 + fr() * 0.12, sharp: 2.2 + fr() * 2.6,
        });
      }
    }
    const ffData = new Float32Array(FF_N * 4);
    const ffBuf = new THREE.InstancedInterleavedBuffer(ffData, 4);
    const ffAttr = instancedDynamicBufferAttribute(ffBuf, 'vec4', 4, 0);   // xyz + 亮度
    const ffCol = col3(PALETTE.firefly);
    const ffCoreMat = new THREE.SpriteNodeMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });
    ffCoreMat.fog = false;
    ffCoreMat.positionNode = ffAttr.xyz;
    // 離鏡頭遠的時候不要縮成看不見：畫面上至少保留幾個像素
    const ffDist = distance(ffAttr.xyz, cameraPosition);
    ffCoreMat.scaleNode = vec2(1, 1).mul(max(ffAttr.w.mul(0.022).add(0.05), ffDist.mul(0.0032)));
    ffCoreMat.colorNode = mix(ffCol, vec3(1, 1, 0.85), 0.45).mul(ffAttr.w.mul(1.0).add(0.22));
    ffCoreMat.opacityNode = texture(ctx.glowTexture).a;
