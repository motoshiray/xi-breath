    const makeImpulse = (ac, sec, R) => { const ch = []; drain(impulseJob(ac.sampleRate, sec, R, ch)); return toBuffer(ac, ch, ac.sampleRate); };

    // 在瀏覽器空閒的時候一小塊一小塊地做；finish() = 還沒做完就馬上做完
    const ric = (fn, timeout) => (window.requestIdleCallback ? window.requestIdleCallback(fn, { timeout }) : setTimeout(() => fn({ timeRemaining: () => 6, didTimeout: true }), 40));
    function idleRun(job) {
      let finished = false;
      const slice = (dl) => {
        if (finished) return;
        const t0 = performance.now(), budget = clamp(dl.timeRemaining(), 1.5, 6);
        while (performance.now() - t0 < budget) { if (job.next().done) { finished = true; return; } }
        ric(slice, 300);
      };
      ric(slice, 300);
      return { finish() { if (!finished) { drain(job); finished = true; } } };
    }

    // ---------------------------------------------------------------- 輸出端
    // master（淡入）→ fader（stop/resume 用）→ 壓縮器（安全限幅）→ out（音量）→ 喇叭。很便宜，點擊當下就建好
    function makeOutput(ac, volume = 1) {
      const master = ac.createGain(); master.gain.value = 0;
      const fader = ac.createGain();
      const limiter = ac.createDynamicsCompressor();
      limiter.threshold.value = -3; limiter.knee.value = 3; limiter.ratio.value = 20; limiter.attack.value = 0.002; limiter.release.value = 0.25;
      const out = ac.createGain(); out.gain.value = volume;
      master.connect(fader); fader.connect(limiter); limiter.connect(out); out.connect(ac.destination);
      return { master, fader, limiter, out };
    }

    // ---------------------------------------------------------------- 引擎（吃任何 BaseAudioContext）
    /**
     * opt: { seed, startAt, musicDelay, volume, mute: ['music'|'amb'|'fx'], deferReverb,
     *        output（makeOutput 建好的輸出端）, prebuilt: { noise, impulse: { rate, ch: [Float32Array×2] } } }
     * 回傳 E：{ ac, master, schedule(until), play(kind, o), fadeIn(sec, at), setVolume(v), gust(t, k), loadReverb() }
     */
    function createEngine(ac, opt = {}) {
      const sr = ac.sampleRate;
      const seed = opt.seed ?? 7;
      const R = ctx.rand((seed * 31 + 5) >>> 0);
      const t0 = opt.startAt ?? ac.currentTime;
      const mute = new Set(opt.mute || []);
      const pre = opt.prebuilt || {};
      const E = { ac, t0, seed, stats: { notes: 0, loops: 0, events: {} } };

      // ---- 小工具 ----
      const gain = (v = 1) => { const g = ac.createGain(); g.gain.value = v; return g; };
      const biquad = (type, f, q = 0.7, db = 0) => { const b = ac.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; b.gain.value = db; return b; };
      const panner = (p) => { if (!ac.createStereoPanner) return gain(1); const n = ac.createStereoPanner(); n.pan.value = clamp(p, -1, 1); return n; };
      const osc = (f, type = 'sine') => { const o = ac.createOscillator(); o.type = type; o.frequency.value = f; return o; };
      const cleanup = (src, ...nodes) => { src.onended = () => { try { src.disconnect(); for (const n of nodes) n.disconnect(); } catch (e) { /* 已斷開 */ } }; };
      // 某個聲源結束以後，順便把「整串共用的」節點也拆掉（接在原本的 onended 後面）
      const alsoOnEnd = (src, ...nodes) => { const prev = src.onended; src.onended = () => { if (prev) prev(); for (const n of nodes) { try { n.disconnect(); } catch (e) { /* */ } } }; };
      const cents = (c) => Math.pow(2, c / 1200);
      // 低頻振盪（給風用）。頻率都互不成倍數，所以不需要真的相位；phase 只決定一開始往上還是往下
      // （不用 PeriodicWave：每建一個瀏覽器都要算一組波表，很花時間）
      function lfo(freq, depth, target, phase = 0, at = t0) {
        const o = osc(freq);
        const g = gain(Math.cos(phase) >= 0 ? depth : -depth); o.connect(g); g.connect(target); o.start(at);
        return o;
      }

      // ---- 總線：各聲部 → master → …；另外一條送殘響 ----
      const { master, out } = opt.output || makeOutput(ac, opt.volume ?? 1);

      // 殘響的脈衝響應：有預先算好的就直接用（取樣率差不多時直接沿用那些取樣，殘響長度只差幾 %），沒有就現算。
      // 設定 ConvolverNode.buffer 會在主執行緒做 FFT，即時播放時挪到空閒的時候再做（deferReverb）
      const reverb = ac.createConvolver();
      const revR = ctx.rand((seed * 131 + 9) >>> 0);
      E.loadReverb = () => {
        if (reverb.buffer) return;
        const p = pre.impulse;
        reverb.buffer = p && p.ch && p.ch.length === 2 && Math.abs(p.rate / sr - 1) < 0.12 ? toBuffer(ac, p.ch, sr) : makeImpulse(ac, 3.0, revR);
      };
      if (!opt.deferReverb) E.loadReverb();
      const revIn = gain(1), revHP = biquad('highpass', 150, 0.6), revOut = gain(0.9);
      revIn.connect(revHP); revHP.connect(reverb); reverb.connect(revOut); revOut.connect(master);

      function bus(name, dry, send) {
        const g = gain(mute.has(name) ? 0 : 1), d = gain(dry), s = gain(send);
        g.connect(d); d.connect(master); g.connect(s); s.connect(revIn);
        return g;
      }
      const musicBus = bus('music', 0.74, 0.42);
      const lowBus = bus('music', 0.9, 0.18);
      const ambBus = bus('amb', 1, 0.14);
      const fxBus = bus('fx', 0.85, 0.6);

      // 八音盒的「盒子」：一點木頭共鳴、把太尖的高頻收一收
      const musicIn = gain(1);
      const body = biquad('peaking', 1150, 0.8, 2.0), shelf = biquad('highshelf', 5200, 0.7, -5);
      musicIn.connect(body); body.connect(shelf); shelf.connect(musicBus);
      const lowIn = gain(1), lowLP = biquad('lowpass', 520, 0.5);
      lowIn.connect(lowLP); lowLP.connect(lowBus);

      E.master = master; E.out = out; E.buses = { music: musicBus, amb: ambBus, fx: fxBus, reverb: revIn };

      E.fadeIn = (sec = 3, at = ac.currentTime) => {
        const curve = new Float32Array(48);
        for (let i = 0; i < curve.length; i++) { const k = i / (curve.length - 1); curve[i] = k * k * (3 - 2 * k); }
        master.gain.cancelScheduledValues(at);
        master.gain.setValueCurveAtTime(curve, at, sec);
      };
      E.setVolume = (v, sec = 0.4) => { out.gain.setTargetAtTime(clamp(v, 0, 1.5), ac.currentTime, sec / 3); };

      // ======================================================== 八音盒的一個音
      // 幾個稍微不諧和的正弦泛音，幾乎瞬間起音，指數衰減（越高的泛音越快消失）
      const PARTIALS = [ // [頻率倍數, 音量, 衰減倍數]
        [1, 1, 1], [1.0017, 0.14, 0.75], [2.006, 0.3, 0.52], [3.017, 0.11, 0.3], [4.23, 0.07, 0.18], [5.94, 0.03, 0.1], [8.87, 0.022, 0.035],
      ];
      const clickBuf = makeNoise(ac, 0.08, R, false);
      function tick(t, level, dest) {                                 // 撥片碰到音梳的「喀」，非常小聲
        const s = ac.createBufferSource(); s.buffer = clickBuf;
        const f = biquad('bandpass', 2600 + R() * 1400, 1.3);
        const g = ac.createGain();
        g.gain.setValueAtTime(level, t); g.gain.setTargetAtTime(0, t + 0.0005, 0.0022);
        s.connect(f); f.connect(g); g.connect(dest);
        s.start(t, R() * 0.05, 0.016);
        cleanup(s, f, g);
      }
      // o.lite：伴奏音（本來就很輕）省掉最高的三個泛音、尾巴也早一點停；力度很輕的音也省掉那個「拍頻」泛音 —— 聽不出差別，振盪器少兩三成
      function pluck(t, midi, vel, o = {}) {
        const f0 = hz(midi) * cents((R() - 0.5) * 7);
        const pan = o.pan ?? clamp((midi - 79) / 30, -0.4, 0.4) + (R() - 0.5) * 0.08;
        const p = panner(pan); p.connect(o.dest || musicIn);
        const amp = (o.gain ?? 0.2) * vel * Math.pow(Math.min(1, 587 / f0), 0.3);  // 高音耳朵比較敏感，收一點
        const tau1 = clamp(1.7 * Math.sqrt(587 / f0), 0.5, 2.6) * (o.decay ?? 1);
        const bright = 0.65 + 0.55 * vel;
        let lastStop = 0, lastOsc = null;
        for (let k = 0; k < PARTIALS.length; k++) {
          if ((k === 1 && vel < 0.3) || (o.lite && k >= 4)) continue;
          const [r, a, d] = PARTIALS[k];
          const f = f0 * r * (r > 1.01 ? cents((R() - 0.5) * 4) : 1);
          if (f > sr * 0.4) continue;
          const oo = osc(f), g = ac.createGain();
          const aa = amp * a * (r > 1.01 ? bright : 1);
          g.gain.setValueAtTime(0, t);
          g.gain.linearRampToValueAtTime(aa, t + 0.002);
          g.gain.setTargetAtTime(0, t + 0.002, tau1 * d);
          oo.connect(g); g.connect(p);
          const stop = t + 0.01 + tau1 * d * (o.lite ? 4 : 5);        // 5 個時間常數 ≈ -43 dB（伴奏 4 個 ≈ -35 dB，絕對音量約 -60 dBFS），都在背景底下
          oo.start(t); oo.stop(stop);
          cleanup(oo, g);
          if (stop > lastStop) { lastStop = stop; lastOsc = oo; }
        }
        if (lastOsc) alsoOnEnd(lastOsc, p);
        if (o.tick) tick(t, o.tick * vel, p);
        return { osc: lastOsc, stop: lastStop };
      }
      // 很輕的低音：像隔著毛毯的大提琴撥弦
      function lowNote(t, midi, vel) {
        const f = hz(midi);
        const o1 = osc(f), o2 = osc(f * 2.003), g2 = gain(0.22), g = ac.createGain();
        const a = 0.042 * vel, att = 0.08;
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(a, t + att); g.gain.setTargetAtTime(0, t + att, 1.05);
        o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(lowIn);
        const stop = t + att + 5.6;
        o1.start(t); o2.start(t); o1.stop(stop); o2.stop(stop);
        cleanup(o1, g); cleanup(o2, g2);
      }
      function playNote(n, t) {
        E.stats.notes++;
        if (n.kind === 'low') return lowNote(t, n.midi, n.vel);
        if (n.kind === 'acc') return pluck(t, n.midi, n.vel, { gain: 0.2, decay: 0.85, lite: true });
        return pluck(t, n.midi, n.vel, { gain: 0.2, tick: n.kind === 'mel' ? 0.012 : 0 });
      }

      // ---- 八音盒的排程（一輪一輪地排，排到 until 為止）----
      const music = (() => {
        let loop = -1, queue = [], prevQueue = [], qi = 0, nextLoopAt = t0 + (opt.musicDelay ?? 2.4);
        return {
          schedule(until) {
            const now = ac.currentTime;
            for (let guard = 0; guard < 4000; guard++) {
              if (qi >= queue.length) {
                if (nextLoopAt > until) return;
                loop++; E.stats.loops = loop + 1;
                const L = composeLoop(loop, seed);
                const at = nextLoopAt;
                prevQueue = queue;
                queue = L.notes.map((n) => ({ ...n, t: n.t + at }));
                qi = 0;
                nextLoopAt = at + L.length + L.pause;
                continue;
              }
              const n = queue[qi];
              if (n.t > until) return;
              // 主執行緒卡住太久（例如分頁剛切回來）：剩下的音整段往後挪，旋律不會被吃掉
              if (n.t < now - 0.06) {
                const shift = now + 0.04 - n.t;
                for (let k = qi; k < queue.length; k++) queue[k].t += shift;
                nextLoopAt += shift;
                continue;
              }
              qi++;
              playNote(n, Math.max(n.t, now));
            }
          },
          /** 在 t 附近正在響（或馬上要響）的八音盒音（低音除外）→ 給流星挑一個不會被蓋住的音 */
          busy(t, back = 1.6, ahead = 0.4) {
            const res = [];
            for (const q of [prevQueue, queue]) for (const n of q) { if (n.t > t + ahead) break; if (n.t >= t - back && n.kind !== 'low') res.push(n.midi); }
            return res;
          },
        };
      })();

      // ======================================================== 風
      const wind = (() => {
        const noise = pre.noise && pre.noise.ch ? toBuffer(ac, pre.noise.ch, pre.noise.rate) : makeNoise(ac, WIND_SEC, R, true);
        const dur = noise.duration;
        // 三層各自從同一段雜訊的不同位置開始播（互不相關，疊起來不會互相抵消出梳狀的縫），
        // 而且各用不同的速度、速度本身還慢慢地飄 → 每一層的循環長度都不一樣、也不固定，聽不出「幾秒重來一次」。
        // 雜訊的音高差個 ±3% 耳朵完全聽不出來。
        const layer = (offset, rate, mods) => {
          const s = ac.createBufferSource(); s.buffer = noise; s.loop = true; s.playbackRate.value = rate;
          for (const [f, depth, ph] of mods) lfo(f, depth, s.playbackRate, ph);
          s.start(t0, offset % dur); return s;
        };
        const hp = biquad('highpass', 70, 0.5);
        const lp = biquad('lowpass', 380, 0.4);                       // 低低的風身
        const bp = biquad('bandpass', 800, 1.1);                      // 呼——的那一層
        const bp2 = biquad('bandpass', 1500, 3);                      // 偶爾一點細細的哨音
        const gBody = gain(0.2), gWhoo = gain(0.78), gWhistle = gain(0.07);
        const level = gain(0.11), soft = biquad('lowpass', 2400, 0.5), gust = gain(1), pan = panner(0);
        layer(0, 0.913, [[0.017, 0.02, 0.5]]).connect(hp); hp.connect(lp); lp.connect(gBody); gBody.connect(level);
        layer(2.71, 1, [[0.0213, 0.026, 1.9], [0.057, 0.011, 0.2]]).connect(bp); bp.connect(gWhoo); gWhoo.connect(level);
        layer(5.37, 1.087, [[0.033, 0.02, 2.8]]).connect(bp2); bp2.connect(gWhistle); gWhistle.connect(level);
        level.connect(soft); soft.connect(gust); gust.connect(pan); pan.connect(ambBus);
        // 慢慢飄的低頻振盪（頻率互不成倍數，聽起來不會有規律）
        lfo(0.031, 170, bp.frequency, 0.4); lfo(0.077, 90, bp.frequency, 2.1);
        lfo(0.053, 70, lp.frequency, 1.3);
        lfo(0.047, 260, bp2.frequency, 0.9);
        lfo(0.029, 0.07, gWhistle.gain, 4.0);                         // 哨音大部分時候幾乎沒有
        lfo(0.043, 0.028, level.gain, 0.2); lfo(0.0137, 0.024, level.gain, 2.7);
        if (pan.pan) { lfo(0.019, 0.42, pan.pan, 1.0); lfo(0.061, 0.12, pan.pan, 0.3); }
        let nextGust = t0 + 9 + R() * 8;
        let busyUntil = 0;
        // quick = 事件帶來的一陣風（燈籠被推）：起得快、跟著畫面一起到，然後慢慢散掉；會蓋過正在吹的普通陣風
        function gustAt(t, k = 1, quick = false) {
          if (!quick && t < busyUntil) return;
          const up = quick ? 0.42 : 1.6 + R() * 1.4, hold = quick ? 0.5 : 0.6 + R() * 1.2, down = quick ? 2.4 + R() * 0.8 : 2.4 + R() * 2;
          if (quick) { gust.gain.cancelScheduledValues(t); bp.frequency.cancelScheduledValues(t); }
          gust.gain.setTargetAtTime(1 + 0.9 * k, t, up / 3);
          gust.gain.setTargetAtTime(1, t + up + hold, down / 3);
          bp.frequency.setTargetAtTime(800 + 320 * k, t, up / 3);
          bp.frequency.setTargetAtTime(800, t + up + hold, down / 3);
          busyUntil = t + up + hold + down;
        }
        return {
          gust: gustAt,
          schedule(until) {

      })();
      E.gust = wind.gust;

      // ======================================================== 蟲鳴
      const insects = (() => {
        const lp = biquad('lowpass', 8000, 0.5); lp.connect(ambBus);
        const farSend = gain(mute.has('amb') ? 0 : 0.35); farSend.connect(revIn); // 遠一點的蟲：多送一點殘響（測試靜音環境聲時也一起關）
        const CRICKETS = [
          { f: 4620, pan: -0.62, amp: 0.011, gap: [2.4, 6.5], n: [2, 5], pulses: 3, sp: 0.42 },
          { f: 4240, pan: 0.66, amp: 0.0075, gap: [3.2, 8.5], n: [2, 4], pulses: 4, sp: 0.5 },
          { f: 5080, pan: 0.18, amp: 0.0042, gap: [4.5, 11], n: [3, 6], pulses: 3, sp: 0.36 },
        ];
        for (const c of CRICKETS) c.next = t0 + 1.2 + R() * 4;
        function chirps(c, t) {
          const n = c.n[0] + Math.floor(R() * (c.n[1] - c.n[0] + 1));
          const sp = c.sp * (0.92 + R() * 0.16);
          const f = c.f * cents((R() - 0.5) * 30);
          const o = osc(f), g = ac.createGain(), p = panner(c.pan + (R() - 0.5) * 0.1);
          g.gain.setValueAtTime(0, t);
          for (let k = 0; k < n; k++) {
            const env = c.amp * (0.65 + 0.35 * Math.sin((Math.PI * (k + 0.5)) / n)) * (0.85 + R() * 0.3);
            for (let q = 0; q < c.pulses; q++) {
              const ts = t + k * sp + q * 0.025;
              g.gain.setValueAtTime(0, ts);
              g.gain.linearRampToValueAtTime(env, ts + 0.005);
              g.gain.linearRampToValueAtTime(0, ts + 0.018);
              o.frequency.setValueAtTime(f * 1.006, ts);
              o.frequency.linearRampToValueAtTime(f * 0.996, ts + 0.018);
            }
          }
          o.connect(g); g.connect(p); p.connect(lp); p.connect(farSend);
          const end = t + n * sp + 0.1;
          o.start(t); o.stop(end);
          cleanup(o, g, p);
          return end - t;
        }
        // 遠處的樹蛙／蟲子，偶爾一串「嚕嚕嚕——」
        let nextTrill = t0 + 8 + R() * 10;
        function trill(t) {
          const dur = 1.3 + R() * 1.4, f = 2700 + R() * 450;
          const o = osc(f), am = gain(0.5), amL = osc(21 + R() * 6), amD = gain(0.5), env = ac.createGain();
          const p = panner((R() < 0.5 ? -1 : 1) * (0.5 + R() * 0.3)), tl = biquad('lowpass', 3600, 0.5);
          amL.connect(amD); amD.connect(am.gain);
          o.frequency.setValueAtTime(f, t); o.frequency.linearRampToValueAtTime(f * 0.985, t + dur);
          const a = 0.0034 * (0.8 + R() * 0.4);
          env.gain.setValueAtTime(0, t); env.gain.linearRampToValueAtTime(a, t + 0.45); env.gain.setValueAtTime(a, t + dur - 0.55); env.gain.linearRampToValueAtTime(0, t + dur);
          o.connect(am); am.connect(env); env.connect(tl); tl.connect(p); p.connect(lp); p.connect(farSend);
          o.start(t); amL.start(t); o.stop(t + dur + 0.05); amL.stop(t + dur + 0.05);
          cleanup(o, am, env, tl, p); cleanup(amL, amD);

        }
        return {
          schedule(until) {
            const now = ac.currentTime;
            for (const c of CRICKETS) {
              if (c.next < now) c.next = now + 0.5 + R();
              while (c.next < until) { const d = chirps(c, c.next); c.next += d + c.gap[0] + R() * (c.gap[1] - c.gap[0]); }
            }
            if (nextTrill < now) nextTrill = now + 3;
            while (nextTrill < until) { const d = trill(nextTrill); nextTrill += d + 16 + R() * 20; }
          },
        };
      })();

      E.schedule = (until) => { music.schedule(until); wind.schedule(until); insects.schedule(until); };

      // ======================================================== 事件音效
      // 風鈴：燈籠被風推了一下 → 4–7 根金屬管，五聲音階，很長的閃爍尾巴
      const CHIME = ['D6', 'E6', 'F#6', 'A6', 'B6', 'D7', 'E7'].map(midiOf);
      const MODES = [[1, 1, 2.9], [1.0012, 0.5, 2.6], [2.756, 0.32, 1.2], [5.404, 0.13, 0.5], [8.933, 0.05, 0.22]]; // 自由兩端的管子
      function chimeBar(t, midi, vel, pan, dest) {
        const f0 = hz(midi) * cents((R() - 0.5) * 10);
        const p = panner(pan); p.connect(dest);
        const amp = 0.056 * vel * Math.pow(Math.min(1, 1175 / f0), 0.35);
        let lastOsc = null, lastStop = 0;
        for (const [r, a, d] of MODES) {
          const f = f0 * r;
          if (f > sr * 0.4) continue;
          const o = osc(f), g = ac.createGain();
          g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(amp * a, t + 0.0015); g.gain.setTargetAtTime(0, t + 0.0015, d);
          o.connect(g); g.connect(p);

          o.start(t); o.stop(stop); cleanup(o, g);
          if (stop > lastStop) { lastStop = stop; lastOsc = o; }
        }
        if (lastOsc) alsoOnEnd(lastOsc, p);
        tick(t, amp * 0.5, p);
        return { osc: lastOsc, stop: lastStop };
      }
      function chime(t, o) {
        const g = gain(o.gain ?? 1), p = panner(o.pan ?? 0);
        g.connect(p); p.connect(fxBus);
        const n = 4 + Math.floor(R() * 4);
        // 每根管子只敲一次（音高不重複 → 尾巴疊起來不會同相變很大聲）；敲越多根，每根越輕
        const order = CHIME.map((m) => [R(), m]).sort((x, y) => x[0] - y[0]).map((x) => x[1]);
        const each = Math.sqrt(4 / n);
        let tt = t + 0.1, last = null;
        for (let i = 0; i < n; i++) {
          const b = chimeBar(tt, order[i], (0.55 + R() * 0.45) * (i === 0 ? 1 : 0.85) * each, (R() - 0.5) * 0.7, g);

        }
        if (last) alsoOnEnd(last.osc, g, p);                         // 最後一根響完，外層的音量和聲像也拆掉
        wind.gust(t, 0.7, true);                                      // 燈籠動，是因為有一陣風：跟著擺動一起到
      }

      // 流星：一個很輕的高音 + 一點閃爍 + 回聲
      const TWINKLE = ['A6', 'B6', 'D7', 'E7', 'F#7'].map(midiOf);
      const twIn = gain(1);
      const dA = ac.createDelay(1.5), dB = ac.createDelay(1.5);
      dA.delayTime.value = 0.31; dB.delayTime.value = 0.31;
      const fbLP = biquad('lowpass', 3600, 0.4), fbG = gain(0.4), merge = ac.createChannelMerger(2), echo = gain(0.5);
      twIn.connect(fxBus);
      twIn.connect(dA); dA.connect(dB); dB.connect(fbLP); fbLP.connect(fbG); fbG.connect(dA);
      dA.connect(merge, 0, 0); dB.connect(merge, 0, 1); merge.connect(echo); echo.connect(fxBus);
      function twinkleTone(t, midi, amp, pan, tau = 0.5) {
        const f = hz(midi) * cents((R() - 0.5) * 12);
        const o = osc(f), o2 = osc(f * 2.004), g2 = gain(0.12), g = ac.createGain(), p = panner(clamp(pan, -1, 1));
        const vib = osc(5.5 + R() * 1.5), vibD = gain(f * 0.0035);

        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(amp, t + 0.012); g.gain.setTargetAtTime(0, t + 0.012, tau);
        o.connect(g); o2.connect(g2); g2.connect(g); g.connect(p); p.connect(twIn);
        const stop = t + 0.02 + tau * 6;
        for (const x of [o, o2, vib]) { x.start(t); x.stop(stop); }
        cleanup(o, g, p); cleanup(o2, g2); cleanup(vib, vibD);
      }
      // 挑一個不會和正在響的八音盒音（或它們的泛音）撞在一起的高音，才不會被蓋住
      const OVERTONES = [[0, 1], [12.05, 0.8], [19.11, 0.45], [24.96, 0.3]]; // 八音盒泛音 1×、2.006×、3.017×、4.23×（半音）
      let lastTw = -1;
      function pickTwinkle(t) {
        const busy = music.busy(t);
        let best = TWINKLE[0], bestS = Infinity;
        for (const m of TWINKLE) {
          let s = R() * 0.35 + (m === lastTw ? 0.5 : 0);
          for (const b of busy) for (const [iv, w] of OVERTONES) { const d = Math.abs(m - (b + iv)); if (d < 0.7) s += w; else if (d < 2.6) s += w * 0.3; }
          if (s < bestS) { bestS = s; best = m; }
        }
        lastTw = best;
        return best;
      }
      function twinkle(t, o) {
        const m = pickTwinkle(t);
        const amp = 0.03 * (o.gain ?? 1) * (0.85 + R() * 0.3);
        twinkleTone(t, m, amp, o.pan ?? 0);
        if (o.bright) twinkleTone(t + 0.12, step(m, -2), amp * 0.6, (o.pan ?? 0) - 0.2);
      }

      // 泡泡：正弦往上滑的「啵」
      function bloop(t, f1, f2, amp, dest, glide = 0.07) {
        const o = osc(f1), g = ac.createGain();
        o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + glide);
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(amp, t + 0.006); g.gain.setTargetAtTime(0, t + 0.025, 0.032);

        o.start(t); o.stop(t + 0.3); cleanup(o, g);

      }
      // 水裡的聲音：一點低通 + 依位置的音量、聲像。done(最後一個聲源) → 它結束時整串一起拆掉
      function waterOut(o, cutoff) {
        const g = gain(o.gain ?? 1), lp = biquad('lowpass', cutoff, 0.6), p = panner(o.pan ?? 0);
        g.connect(lp); lp.connect(p); p.connect(fxBus);
        return { g, done: (src) => alsoOnEnd(src, g, lp, p) };
      }
      // 橙蛸吹愛心 ①：愛心從嘴巴鼓出來的那一刻，圓圓的兩個「啵」
      function heartRelease(t, o) {
        const w = waterOut(o, 2600);
        bloop(t, 240, 660, 0.14, w.g);
        w.done(bloop(t + 0.15, 340, 900, 0.075, w.g, 0.06));
      }
      // 橙蛸吹愛心 ②：愛心浮到水面破掉 → 輕輕的「噗」+ 一個小小的高音 + 兩顆小星星（跟著飄上來的小星星和小愛心）
      function heartPop(t, o) {
        const k = o.gain ?? 1;
        const w = waterOut(o, 4600);
        w.done(bloop(t, 760, 1900, 0.07, w.g, 0.03));

        const pan = clamp((o.pan ?? 0) * 0.8, -1, 1);

        twinkleTone(t + 0.17, step(m, 2), 0.011 * (0.5 + 0.5 * k), pan + 0.15, 0.3);
        twinkleTone(t + 0.31, step(m, 4), 0.008 * (0.5 + 0.5 * k), pan - 0.12, 0.26);
      }
      // 離線測試／備案用：整段愛心（鼓出來 + 約 3 秒後在水面破掉）
      function heart(t, o) { heartRelease(t, o); heartPop(t + (o.popAfter ?? 2.95), o); }

      // 普通的小泡泡：小小的「噗」，後面跟一兩個更小的。音高放在伴奏（400–1200 Hz）上面，才不會被蓋住
      const PLIPS = [[950, 2300, 0.052, 0.035], [1250, 2700, 0.022, 0.03], [1450, 3100, 0.016, 0.03]]; // [起, 終, 音量, 滑音秒數]
      function plip(t, o, i) {
        const [f1, f2, amp, gl] = PLIPS[i];
        const w = waterOut(o, 4200);
        w.done(bloop(t, f1, f2, amp, w.g, gl));
      }
      function blip(t, o) {
        const n = Number.isFinite(o.followers) ? o.followers : R() < 0.6 ? 2 : 1;
        plip(t, o, 0);
        for (let i = 0; i < Math.min(2, n); i++) plip(t + 0.22 + i * 0.2, o, i + 1);
      }
      function blipFollower(t, o) { plip(t, o, clamp(o.i ?? 0, 0, 1) + 1); }

      const FX = { chime, twinkle, heart, heartRelease, heartPop, blip, blipFollower };
      E.play = (kind, o = {}) => {
        const fn = FX[kind];
        if (!fn) return;
        const t = Math.max(o.at ?? ac.currentTime + 0.02, ac.currentTime + 0.005);
        E.stats.events[kind] = (E.stats.events[kind] || 0) + 1;
        fn(t, o);
      };
      return E;
    }

    // ---------------------------------------------------------------- 離線測試用
    const lab = {
      createEngine, composeLoop, nameOf, makeNoise, makeImpulse, makeOutput,
      /** 第 loop 輪的音（名稱、秒數、種類），給測試印出來看 */
      compose(loop, seed = 1) { return composeLoop(loop, seed).notes.map((n) => ({ t: +n.t.toFixed(3), beat: n.beat, name: nameOf(n.midi), midi: n.midi, kind: n.kind, vel: +n.vel.toFixed(2) })); },
      loopInfo(loop, seed = 1) { const L = composeLoop(loop, seed); return { length: L.length, pause: L.pause, bpm: L.bpm }; },
      /** 用同一套函式離線算出 seconds 秒的混音。events: [[秒, 名稱, 參數]] */
      async renderOffline(seconds = 45, opt = {}) {
        const sr = opt.sampleRate || 44100;
        const oac = new OfflineAudioContext(2, Math.ceil(seconds * sr), sr);
        const E = createEngine(oac, { seed: opt.seed ?? 1, startAt: 0, mute: opt.mute, musicDelay: opt.musicDelay });
        E.fadeIn(3, 0);
        E.schedule(seconds);
        for (const [t, kind, o] of opt.events || []) E.play(kind, { ...(o || {}), at: t });
        const buf = await oac.startRendering();
        return { buffer: buf, stats: E.stats };
      },
    };
    ctx.objects.audioLab = lab;

    // ---------------------------------------------------------------- 進門前：先在空閒時間把風的雜訊和殘響算好
    const pre = { noise: [], impulse: [] };
    const preJobs = [idleRun(noiseJob(GEN_SR, WIND_SEC, ctx.rand(9001), true, pre.noise)), idleRun(impulseJob(GEN_SR, 3.0, ctx.rand(9002), pre.impulse))];

    // ---------------------------------------------------------------- 即時播放
    let ac = null, output = null, engine = null, timer = 0, stopped = false;
    const LOOKAHEAD = 0.25;
    const tmpV = new THREE.Vector3(), tmpR = new THREE.Vector3();
    // 聲音從哪裡來：依鏡頭位置算左右和遠近
    function spatial(pos, ref = 5, min = 0.3) {
      const cam = ctx.camera;
      if (!cam || !pos) return { gain: 1, pan: 0 };
      tmpV.copy(pos).sub(cam.position);
      const d = tmpV.length() || 1;
      tmpR.setFromMatrixColumn(cam.matrixWorld, 0);
      return { gain: clamp(Math.pow(ref / Math.max(d, ref), 0.8), min, 1), pan: clamp((tmpV.dot(tmpR) / d) * 0.85, -0.75, 0.75) };
    }
    const lanternPos = () => ctx.anchors.lantern || new THREE.Vector3(LAYOUT.house.lanternHook[0], 2.15, LAYOUT.house.lanternHook[2]);
    const octoPos = () => ctx.anchors.octopus || new THREE.Vector3(LAYOUT.pond.center[0], -0.45, LAYOUT.pond.center[1]);
    const playAt = (kind, pos, ref, min, extra) => { if (engine && !stopped) engine.play(kind, { ...spatial(pos, ref, min), ...extra }); };

    // 往前排 ~0.25 秒；如果主執行緒偶爾卡一下（計時器隔太久才來），就自動多排一點，之後再慢慢縮回來
    function startTimer() {
      if (timer || !engine) return;
      let lookahead = LOOKAHEAD, lastTick = performance.now();
      const tick = () => {
        const nowMs = performance.now(), gap = (nowMs - lastTick) / 1000;
        lastTick = nowMs;
        lookahead = clamp(Math.max(lookahead * 0.998, gap * 1.6), LOOKAHEAD, 0.8);
        if (ac.state === 'running') engine.schedule(ac.currentTime + lookahead);
      };
      tick();
      timer = setInterval(tick, 25);
    }
    // 慢慢收掉聲音、暫停 AudioContext（之後 resume() 可以再接著放）
    function stop(sec = 1) {
      if (!ac || stopped) return;
      stopped = true;
      const g = output.fader.gain, now = ac.currentTime;
      g.cancelScheduledValues(now); g.setTargetAtTime(0, now, Math.max(0.05, sec) / 4);
      setTimeout(() => { if (!stopped) return; clearInterval(timer); timer = 0; ac.suspend().catch(() => {}); }, sec * 1000 + 120);
    }
    function resume(sec = 1.5) {
      if (!ac || !stopped) return;
      stopped = false;
      ac.resume().catch(() => {});
      const g = output.fader.gain, now = ac.currentTime;
      g.cancelScheduledValues(now); g.setTargetAtTime(1, now, Math.max(0.05, sec) / 4);
      startTimer();
    }

    function startAudio() {
      if (ac) { if (!stopped && ac.state !== 'running') ac.resume().catch(() => {}); return; }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      // AudioContext 一定要在點擊的同步呼叫裡建立、resume
      try { ac = new AC({ latencyHint: 'playback' }); } catch (e) { try { ac = new AC(); } catch (e2) { return; } }
      if (ac.state !== 'running') ac.resume().catch(() => {});
      output = makeOutput(ac);                                        // 輸出端很便宜：點擊當下就建好，ctx.audio.master 馬上可以用
      ctx.audio = {
        ac, master: output.master, out: output.out, engine: null, lab,
        play: (kind, o) => engine && !stopped && engine.play(kind, o),
        setVolume: (v, sec = 0.4) => output.out.gain.setTargetAtTime(clamp(v, 0, 1.5), ac.currentTime, sec / 3),
        stop, resume,
      };
      // 其他的（節點、排程）挪到點擊之後的下一個工作；雜訊和殘響大多已經在進門前算好了
      setTimeout(() => {
        for (const j of preJobs) j.finish();
        engine = createEngine(ac, {
          seed: (Math.random() * 1e9) >>> 0, deferReverb: true, output,
          prebuilt: { noise: { rate: GEN_SR, ch: pre.noise }, impulse: { rate: GEN_SR, ch: pre.impulse } },
        });
        pre.noise = null;                                             // 已經複製進 AudioBuffer 了
        engine.fadeIn(3);
        ctx.audio.engine = engine;
        startTimer();
        // 第一個音在 2.4 秒才響：殘響（主執行緒上的 FFT）等瀏覽器空下來再裝，最晚 1.2 秒
        ric(() => { engine.loadReverb(); pre.impulse = null; }, 1200);
      }, 0);
    }
    ctx.events.on('enter:audio', startAudio);

    // 分頁藏起來就暫停，回來再繼續
    document.addEventListener('visibilitychange', () => {
      if (!ac || stopped) return;
      if (document.hidden) ac.suspend().catch(() => {});
      else ac.resume().catch(() => {});
    });

    // ---------------------------------------------------------------- 事件 → 音效
    ctx.events.on('lantern:flash', () => playAt('chime', lanternPos(), 5, 0.4));

    // 流星：每一顆看得見的都有聲音。導演叫的（開場那幾顆、倒映在池子裡的）是「主角」：亮一點、兩個音；
    // 普通的如果離上一顆太近，就輕輕的。
    // sky 部件在 meteor:request 裡就同步發出 meteor（它比 audio 先註冊），所以等這一串事件都跑完（microtask）再決定。
    const micro = typeof queueMicrotask === 'function' ? queueMicrotask : (f) => Promise.resolve().then(f);
    let requests = [];                                                // 導演叫流星的時間（ctx.time）
    let lastTwinkle = -10;
    ctx.events.on('meteor:request', () => { requests.push(ctx.time); });
    ctx.events.on('meteor', (d) => {
      if (!engine || stopped) return;
      const reflect = !!(d && d.reflect);
      const mid = d && d.start && d.end ? new THREE.Vector3().copy(d.start).add(d.end).multiplyScalar(0.5) : null;
      micro(() => {
        if (!engine) return;
        requests = requests.filter((x) => ctx.time - x < 0.6);
        const featured = reflect || requests.length > 0;
        if (requests.length) requests.shift();
        const now = engine.ac.currentTime;
        const soft = !featured && now - lastTwinkle < 2.4;
        if (!soft) lastTwinkle = now;
        const s = mid ? spatial(mid, 1000, 1) : { pan: 0 };
        engine.play('twinkle', { pan: s.pan * 0.8, gain: featured ? 1.1 : soft ? 0.55 : 1, bright: featured });
      });
    });

    // ---- 橙蛸：聲音要和畫面上的愛心、泡泡對齊 ----
    // 1) 章魚部件如果發 'octopus:heart:release' / 'octopus:heart:pop'（建議的約定），就直接用；
    // 2) 不然就看著章魚部件的特效群組（'octopus-fx'）：愛心（Group）一出現 → 兩個「啵」；浮到水面 → 破掉的聲音；
    //    新的小泡泡出現在水裡 → 跟在後面的小「噗」（數量、時間都和畫面一樣）；
    // 3) 連特效群組都找不到：照章魚部件的時間軸（0.75 秒吹出、約 3.7 秒破掉）用同一個每幀的 dt 數。
    const waterY = LAYOUT.pond.waterY;
    const HEART_POP_Y = 0.035 - 1e-4;                                 // 章魚部件：愛心中心高過水面 0.035 就破掉
    let octoFx;                                                      // undefined = 還沒找；null = 沒有
    const fxSeen = new Map();
    let heartByEvents = false, heartClock = null;
    let bubbleAt = -1, bubbleSkip = false, bubbleUntil = -1, followers = 0;

    ctx.events.on('octopus:heart:release', (d) => { heartByEvents = true; heartClock = null; playAt('heartRelease', (d && d.position) || octoPos(), 4.5, 0.3); });
    ctx.events.on('octopus:heart:pop', (d) => { heartByEvents = true; heartClock = null; playAt('heartPop', (d && d.position) || octoPos(), 4.5, 0.3); });
    ctx.events.on('octopus:heart', () => {
      if (heartByEvents || octoFx) return;
      if (heartClock && heartClock.t < 2.8) return;                   // 和章魚部件一樣：正在吹就不重來
      heartClock = { t: 0, rel: false, pop: false };
    });
    ctx.events.on('octopus:bubble', (d) => {
      if (!engine || stopped) return;
      const s = spatial(octoPos(), 4, 0.22);
      if (d && Number.isFinite(d.followers)) { bubbleUntil = -1; engine.play('blip', { ...s, followers: d.followers }); return; }
      if (octoFx) {                                                   // 後面的小泡泡等畫面上真的出現再響
        engine.play('blip', { ...s, followers: 0 });
        bubbleAt = ctx.time; bubbleSkip = true; bubbleUntil = ctx.time + 1.0; followers = 0;
        return;
      }
      engine.play('blip', s);
    });

    function watchOctopusFx() {
      for (const c of octoFx.children) {
        let s = fxSeen.get(c);
        if (!s) { fxSeen.set(c, { vis: c.visible, popped: c.visible }); continue; }
        const appeared = c.visible && !s.vis;
        s.vis = c.visible;
        if (!c.visible) { s.popped = false; continue; }
        if (c.isGroup) {                                              // 愛心
          if (heartByEvents) continue;
          if (appeared) playAt('heartRelease', c.position, 4.5, 0.3);
          if (!s.popped && c.position.y >= waterY + HEART_POP_Y) { s.popped = true; playAt('heartPop', c.position, 4.5, 0.3); }
        } else if (appeared && c.isMesh && c.position.y < waterY - 0.02) { // 水裡新出現的泡泡（水紋圈在水面上，不算）
          if (bubbleSkip && ctx.time === bubbleAt) { bubbleSkip = false; continue; } // 這一顆就是 octopus:bubble 那顆，已經響過
          if (ctx.time <= bubbleUntil && followers < 2) playAt('blipFollower', c.position, 4, 0.22, { i: followers++ });
        }
      }
    }

    // 章魚部件（order 25）的每幀更新排在這裡之前 → 同一幀就看得到它剛剛做的事
    ctx.onUpdate((t, dt) => {
      if (octoFx === undefined) octoFx = ctx.scene.getObjectByName('octopus-fx') || null;
      if (octoFx) watchOctopusFx();
      if (heartClock && !octoFx && !heartByEvents) {
        heartClock.t += dt;
        if (!heartClock.rel && heartClock.t >= 0.75) { heartClock.rel = true; playAt('heartRelease', octoPos(), 4.5, 0.3); }
        if (!heartClock.pop && heartClock.t >= 3.7) { heartClock.pop = true; playAt('heartPop', octoPos(), 4.5, 0.3); }
        if (heartClock.t > 4.4) heartClock = null;
      }
    });
  },
});

// ---------------------------------------------------------------- parts/90-director.js
// ---- 導演：鏡頭、字幕、自動的小場面 ----
// 進門前：遠遠地慢慢繞島。進門後：繞島一圈 → 一處一處介紹 → 停在亭子和池塘之間，慢慢呼吸。
PARTS.push({
  name: 'director',
  order: 90,
  build(ctx) {
    const { THREE, LAYOUT, EASE, camera } = ctx;
    const V = (x, y, z) => new THREE.Vector3(x, y, z);
    const A = (name, fallback) => () => (ctx.anchors[name] ? ctx.anchors[name].clone() : fallback.clone());
    const H = LAYOUT.house;

    // 減少動態效果：整條時間軸放慢、漂移變小
    const slow = () => (ctx.reducedMotion ? 1.45 : 1);

    // ---- 機位 ----
    // 每個鏡頭：pos/target 可以是 Vector3 或回傳 Vector3 的函式（在鏡頭開始時取值；track=true 的目標會一直跟著錨點）
    const coopDir = (() => { const r = LAYOUT.coop.rotationY; return V(Math.sin(r), 0, Math.cos(r)); })();
    const coopC = V(LAYOUT.coop.center[0], 0, LAYOUT.coop.center[1]);
    const tapirC = V(LAYOUT.tapir.center[0], 0, LAYOUT.tapir.center[1]);
    const tapirFwd = (() => { const r = LAYOUT.tapir.rotationY; return V(Math.sin(r), 0, Math.cos(r)); })();
    const tapirCam = tapirC.clone().add(tapirFwd.clone().applyAxisAngle(V(0, 1, 0), 0.95).multiplyScalar(3.1)).setY(1.35);

    const SHOTS = [
      { id: 'moon', hold: 6.5, move: 4.5, fov: 50,
        pos: V(0.5, 1.5, 7.0), target: V(0.5, 4.6, -2.5),
        caption: '天上一輪滿月，流星一顆接一顆。', events: [[0.6, 'meteor:request', { reflect: false }], [3.4, 'meteor:request', { reflect: false }]] },
      { id: 'house', hold: 6.0, move: 4.5, fov: 38,
        pos: V(2.6, 3.3, 5.6), target: V(-2.3, 1.7, -2.6),
        caption: '一間木頭小屋，窗裡亮著暖暖的燈。', events: [[3.0, 'window:warm']] },
      { id: 'lantern', hold: 5.5, move: 3.2, fov: 36,
        pos: V(-2.3, 1.75, 2.55), target: A('lantern', V(-4.3, 2.15, -0.88)), track: true,
        caption: '屋簷下掛著一盞紅燈籠，被風輕輕推著。', events: [[2.2, 'lantern:flash']] },
      { id: 'rose', hold: 5.0, move: 3.0, fov: 32,
        pos: V(-2.05, 1.35, 1.0), target: A('rose', V(...H.rose)),
        caption: '門口的台階上，放著一枝玫瑰。' },
      { id: 'shovel', hold: 5.0, move: 3.0, fov: 32,
        pos: V(0.55, 1.0, 0.65), target: A('shovel', V(-0.55, 0.4, -0.65)),
        caption: '花壇邊，插著一把褪了色的紅色塑膠小鏟子。' },
      { id: 'sill', hold: 6.0, move: 3.0, fov: 30,
        pos: V(-1.2, 1.55, 1.25), target: A('sill', V(-1.2, 1.15, -1.5)),
        caption: '窗台上：毛絨白菜、彎月亮抱枕、橡皮小青蛙。', events: [[3.2, 'window:warm']] },
      { id: 'coop', hold: 5.5, move: 4.0, fov: 34,
        pos: () => A('chickens', coopC.clone().setY(0.35))().add(coopDir.clone().multiplyScalar(2.5)).setY(1.25),
        target: A('chickens', coopC.clone().setY(0.35)),
        caption: '雞窩裡睡著兩隻雞，小章魚和小狐狸。' },
      { id: 'hive', hold: 6.0, move: 4.0, fov: 32,
        pos: V(-2.15, 1.3, 8.0), target: A('hive', V(-2.4, 0.7, 5.7)),
        caption: '蜂箱裡住著八隻蜜蜂，有一隻是櫻粉色的。' },
      { id: 'yard', hold: 5.0, move: 4.0, fov: 40,
        pos: V(1.2, 3.6, 7.6), target: V(0.4, 0.9, -1.2),
        caption: '螢火蟲在院子裡，慢慢地飄。' },
      { id: 'tapir', hold: 6.5, move: 5.0, fov: 34,
        pos: tapirCam, target: A('tapir', tapirC.clone().setY(0.5)),
        caption: '膽小純情男大，一隻尾巴尖是白色的霧脊貘。' },
      { id: 'pavilion', hold: 6.0, move: 5.0, fov: 36,
        pos: V(2.5, 2.2, 3.0), target: V(5.5, 1.15, 3.8),
        caption: '池邊的小亭子裡，有人坐著。' },
      { id: 'pond', hold: 8.0, move: 3.5, fov: 34,
        pos: V(2.1, 2.7, 5.2), target: A('octopus', V(2.3, -0.5, 2.3)), track: true,
        caption: '池底住著橙蛸，正慢慢推著一塊小石頭。', events: [[2.3, 'octopus:heart']] },
      { id: 'rest', hold: Infinity, move: 5.5, fov: 44,
        pos: V(-0.3, 1.9, 5.7), target: V(3.3, 0.85, 2.7),
        caption: '等一會兒。', captionFor: 7, events: [[4.0, 'meteor:request', { reflect: true }]] },
    ];

    // 開場：繞島一圈（從進門那一刻的角度開始，慢慢靠近）
    const OPEN = { dur: 22, r0: 30, r1: 21, h0: 12.5, h1: 8.5 };
    const OPEN_CAPTIONS = [[4, 16, '夜裡，有一座小小的島，漂在天上。']];
    const OPEN_EVENTS = [[11.0, 'meteor:request', { reflect: false }]];

    // ---- 預先排好時間軸 ----
    function layout() {
      let t = OPEN.dur;
      for (const s of SHOTS) { s.t0 = t; s.t1 = t + s.move; s.t2 = s.hold === Infinity ? Infinity : s.t1 + s.hold; t = s.t2; }
    }
    layout();
    ctx.director = { SHOTS, OPEN, timeline: () => SHOTS.map((s) => ({ id: s.id, moveStart: s.t0, holdStart: s.t1, holdEnd: s.t2 })) };

    // ---- 小工具 ----
    const val = (v) => (typeof v === 'function' ? v() : v.clone());
    let idleAngle = 0.6;
    let openAngle0 = 0.6;
    const orbitPose = (angle, r, h) => ({ pos: V(Math.sin(angle) * r, h, Math.cos(angle) * r), target: V(0, 0.2, 0) });

    // 呼吸式漂移：很慢的幾個正弦疊在一起
    function breathe(t, amp) {
      const a = amp * (ctx.reducedMotion ? 0.45 : 1);
      return V(
        Math.sin(t * 0.21) * 0.6 + Math.sin(t * 0.083 + 1.3) * 0.4,
        Math.sin(t * 0.17 + 0.7) * 0.5 + Math.sin(t * 0.061) * 0.3,
        Math.sin(t * 0.13 + 2.1) * 0.5,
      ).multiplyScalar(a);
    }

    // 鏡頭在兩個機位之間：位置沿著一條往上拱的弧線走，目標點平滑移動
    const cur = { pos: camera.position.clone(), target: V(0, 0.2, 0), fov: camera.fov };
    let from = null;          // 當前移動的起點 { pos, target, fov }
    let shotIndex = -2;       // -2 = 進門前，-1 = 開場繞島，0.. = 鏡頭
    let shotPos = null, shotTarget = null;
    let lastStory = -1;
    let captionOff = 0;

    function startShot(i) {
      shotIndex = i;
      from = { pos: cur.pos.clone(), target: cur.target.clone(), fov: cur.fov };
      const s = SHOTS[i];
      shotPos = val(s.pos);
      shotTarget = val(s.target);
    }

    function fire(name, data) { ctx.events.emit(name, data); }

    ctx.events.on('enter', () => { openAngle0 = idleAngle; shotIndex = -1; });

    ctx.onUpdate((t, dt) => {
      if (ctx.storyTime < 0) {
        // 進門前：在遮罩後面，遠遠地、慢慢地繞
        idleAngle += dt * (ctx.reducedMotion ? 0.02 : 0.045);
        const p = orbitPose(idleAngle, 32, 13);
        cur.pos.copy(p.pos); cur.target.copy(p.target); cur.fov = 38;
      } else {
        const st = ctx.storyTime / slow();
        const prev = lastStory;
        lastStory = st;
        const crossed = (time) => prev < time && st >= time;

        if (st < OPEN.dur) {
          // 開場繞島一圈
          const k = st / OPEN.dur;
          const e = EASE.inOutSine(k);
          const ang = openAngle0 + e * Math.PI * 2;
          const r = OPEN.r0 + (OPEN.r1 - OPEN.r0) * e;
          const h = OPEN.h0 + (OPEN.h1 - OPEN.h0) * e;
          const p = orbitPose(ang, r, h);
          cur.pos.copy(p.pos); cur.target.copy(p.target).setY(0.2 + 0.6 * e); cur.fov = 38;
          for (const [a, b, text] of OPEN_CAPTIONS) {
            if (crossed(a) || (prev < 0 && st >= a && st < b)) ctx.caption.show(text);
            if (crossed(b)) ctx.caption.hide();
          }
          for (const [at, name, data] of OPEN_EVENTS) if (crossed(at)) fire(name, data);
          shotIndex = -1;
        } else {
          // 找到現在在哪個鏡頭
          let i = SHOTS.findIndex((s) => st >= s.t0 && st < s.t2);
          if (i < 0) i = SHOTS.length - 1;
          if (i !== shotIndex) {
            // 如果是從 ?t= 跳進來，直接把起點設在上一個鏡頭的機位
            if (shotIndex < -1 || Math.abs(i - shotIndex) > 1) {
              const pi = i - 1;
              if (pi >= 0) { cur.pos.copy(val(SHOTS[pi].pos)); cur.target.copy(val(SHOTS[pi].target)); cur.fov = SHOTS[pi].fov; }
            }
            startShot(i);
          }
          const s = SHOTS[i];
          if (s.track) {
            const live = val(s.target);
            shotTarget.lerp(live, 1 - Math.exp(-dt * 1.5));
          }
          const local = st - s.t0;
          if (local < s.move) {
            const k = EASE.inOutCubic(local / s.move);
            const kt = EASE.inOutSine(Math.min(1, local / (s.move * 0.92)));
            const dist = from.pos.distanceTo(shotPos);
            const lift = Math.sin(Math.PI * k) * Math.min(2.2, dist * 0.18);
            cur.pos.lerpVectors(from.pos, shotPos, k); cur.pos.y += lift;
            cur.target.lerpVectors(from.target, shotTarget, kt);
            cur.fov = from.fov + (s.fov - from.fov) * k;
          } else {
            cur.pos.copy(shotPos);
            cur.target.copy(shotTarget);
            cur.fov = s.fov;
          }
          // 停留時的呼吸漂移（越接近停留越明顯）
          const settle = EASE.smooth(ctx.clamp01((local - s.move * 0.6) / (s.move * 0.6)));
          const amp = s.id === 'rest' ? 0.16 : 0.06;
          cur.pos.add(breathe(t, amp * settle));
          cur.target.add(breathe(t + 40, amp * 0.35 * settle));

          // 字幕
          const capAt = s.t0 + s.move * 0.55;
          if (crossed(capAt) || (prev < capAt && st >= capAt)) { ctx.caption.show(s.caption); captionOff = s.captionFor ? capAt + s.captionFor : (s.t2 - 0.8); }
          if (crossed(captionOff)) ctx.caption.hide();
          // 鏡頭裡的事件
          for (const [at, name, data] of s.events || []) if (crossed(s.t1 + at)) fire(name, data);
        }
      }
      camera.position.copy(cur.pos);
      if (Math.abs(camera.fov - cur.fov) > 1e-3) { camera.fov = cur.fov; camera.updateProjectionMatrix(); }
      camera.lookAt(cur.target);
    });

    // ---- 停在最後的機位以後：偶爾的小場面 ----
    const restRand = ctx.rand(2024);
    let nextAmbient = -1;
    const AMBIENT = [
      ['octopus:heart', null, 3],
      ['lantern:flash', null, 2],
      ['meteor:request', { reflect: true }, 2],
      ['window:warm', null, 1],
    ];
    const pickAmbient = () => {
      const total = AMBIENT.reduce((a, x) => a + x[2], 0);
      let r = restRand() * total;
      for (const a of AMBIENT) { if ((r -= a[2]) <= 0) return a; }
      return AMBIENT[0];
    };
    ctx.onUpdate(() => {
      const rest = SHOTS[SHOTS.length - 1];
      const st = ctx.storyTime / slow();
      if (ctx.storyTime < 0 || st < rest.t1 + 12) return;
      if (nextAmbient < 0) nextAmbient = st + 8;
      if (st >= nextAmbient) {
        const [name, data] = pickAmbient();
        fire(name, data);
        nextAmbient = st + 22 + restRand() * 18;
      }
    });
  },
});

// ---------------------------------------------------------------- main.js
// ============================================================================
//  開機：載入 three、建立渲染器（WebGPU → 自動回退 WebGL2）、組裝所有部件、跑動畫
// ============================================================================

async function boot() {
  const hint = document.getElementById('hint');
  const btn = document.getElementById('enter');
  const entry = document.getElementById('entry');

  let mods;
  try {
    const [THREE, TSL, rb, bgu, bloomMod] = await Promise.all([
      import('three/webgpu'),
      import('three/tsl'),
      import('three/addons/geometries/RoundedBoxGeometry.js'),
      import('three/addons/utils/BufferGeometryUtils.js'),
      import('three/addons/tsl/display/BloomNode.js'),
    ]);
    mods = { THREE, TSL, RoundedBoxGeometry: rb.RoundedBoxGeometry, BufferGeometryUtils: bgu, bloom: bloomMod.bloom };
  } catch (e) {
    console.error(e);
    window.__showFallback('燈還沒點起來', '沒辦法從 cdn.jsdelivr.net 載入 three.js。<br>確認網路以後，重新整理一下試試。', String(e && e.message || e));
    return;
  }

  const { THREE, TSL } = mods;
  const canvas = document.getElementById('stage');

  // ---- 渲染器 ----
  let renderer;
  try {
    const forceWebGL = PARAMS.has('webgl');
    renderer = new THREE.WebGPURenderer({ canvas, antialias: true, forceWebGL, powerPreference: 'high-performance' });
    await renderer.init();
  } catch (e) {
    console.error(e);
    window.__showFallback('燈暫時點不亮', '這個瀏覽器不支援 WebGPU，也沒辦法使用 WebGL2。<br>換一個新一點的 Chrome、Edge 或 Safari 再來看看吧。', String(e && e.message || e));
    return;
  }
  const isWebGPU = !renderer.backend.isWebGLBackend;
  console.info('[等一會兒] backend:', isWebGPU ? 'WebGPU' : 'WebGL2');

  const maxDpr = Number(PARAMS.get('dpr')) || 2;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, maxDpr));
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  renderer.toneMapping = THREE.NeutralToneMapping;
  renderer.toneMappingExposure = 1.1;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  // ---- 場景與相機 ----
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(PALETTE.skyMid);
  scene.fog = new THREE.Fog(PALETTE.skyMid, 38, 120);

  const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.05, 600);
  camera.position.set(0, 9, 26);
  camera.lookAt(0, 0.5, 0);

  const ctx = createContext(mods);
  Object.assign(ctx, { scene, camera, renderer, isWebGPU, canvas });

  // ---- 基礎光：月光（帶陰影）+ 天空半球光 ----
  const hemi = new THREE.HemisphereLight(0x8a9ce0, 0x3d4a3c, 1.9);
  scene.add(hemi);
  const ambient = new THREE.AmbientLight(0x4a5590, 0.55);
  scene.add(ambient);
  const moonDir = new THREE.Vector3(...LAYOUT.moon).normalize();
  const moonLight = new THREE.DirectionalLight(0xc4d0ff, 1.9);
  moonLight.position.copy(moonDir).multiplyScalar(30);
  moonLight.target.position.set(0, 0, 0);
  moonLight.castShadow = true;
  moonLight.shadow.mapSize.set(2048, 2048);
  const sc = moonLight.shadow.camera;
  sc.left = -11; sc.right = 11; sc.top = 11; sc.bottom = -11; sc.near = 5; sc.far = 70;
  moonLight.shadow.bias = -0.0006;
  moonLight.shadow.normalBias = 0.02;
  moonLight.shadow.radius = 3;
  scene.add(moonLight, moonLight.target);
  ctx.lights = { hemi, ambient, moon: moonLight };

  // ---- 後製：柔和的輝光，不要過曝 ----
  const pipeline = new THREE.RenderPipeline(renderer);
  const scenePass = TSL.pass(scene, camera);
  const sceneColor = scenePass.getTextureNode('output');
  const bloomPass = mods.bloom(sceneColor, 0.55, 0.45, 0.82);
  pipeline.outputNode = sceneColor.add(bloomPass);
  ctx.bloom = bloomPass; // 可調：bloom.strength.value / radius.value / threshold.value
  ctx.pipeline = pipeline;

  // ---- 字幕 ----
  const capEl = document.getElementById('caption');
  let capTimer = 0;
  ctx.caption = {
    show(text) {
      clearTimeout(capTimer);
      if (capEl.classList.contains('show') && capEl.textContent !== text) {
        capEl.classList.remove('show');
        capTimer = setTimeout(() => { capEl.textContent = text; capEl.classList.add('show'); }, 700);
      } else { capEl.textContent = text; capEl.classList.add('show'); }
    },
    hide() { clearTimeout(capTimer); capEl.classList.remove('show'); },
  };

  // ---- 組裝部件 ----
  PARTS.sort((a, b) => (a.order ?? 50) - (b.order ?? 50));
  for (const part of PARTS) {
    try { await part.build(ctx); }
    catch (e) { console.error(`[part ${part.name}]`, e); }
  }

  // ---- 尺寸 ----
  function onResize() {
    const w = window.innerWidth, h = window.innerHeight;
    camera.aspect = w / h; camera.updateProjectionMatrix();
    renderer.setSize(w, h, false);
  }
  window.addEventListener('resize', onResize);

  // ---- 減少動態效果（可即時切換）----
  const rmq = matchMedia('(prefers-reduced-motion: reduce)');
  rmq.addEventListener?.('change', (e) => { ctx.reducedMotion = e.matches || PARAMS.has('rm'); ctx.events.emit('reducedmotion', ctx.reducedMotion); });

  // ---- 進門 ----
  // 測試用參數：?auto=1 直接進門（不放聲音），?t=秒數 從故事的某一秒開始，?hold=1 讓故事時間停住（鏡頭定格，其他照常動）
  const startOffset = Number(PARAMS.get('t')) || 0;
  const hold = PARAMS.has('hold');
  let storyStart = -1;
  function enter(withSound) {
    if (ctx.entered) return;
    ctx.entered = true;
    storyStart = ctx.time - startOffset;
    if (withSound) ctx.events.emit('enter:audio'); // 必須在點擊的同步呼叫裡建立 AudioContext
    ctx.events.emit('enter');
    entry.classList.add('gone');
  }
  btn.addEventListener('click', (e) => { e.stopPropagation(); enter(true); });
  entry.addEventListener('click', () => enter(true));
  window.addEventListener('keydown', (e) => { if (!ctx.entered && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); enter(true); } });

  // 測試用：?cam=x,y,z,tx,ty,tz 固定機位（會蓋過導演），?fov=數字
  const camOverride = PARAMS.get('cam') ? PARAMS.get('cam').split(',').map(Number) : null;
  if (PARAMS.get('fov')) { camera.fov = Number(PARAMS.get('fov')); camera.updateProjectionMatrix(); }

  // ---- 動畫迴圈 ----
  let last = performance.now();
  let frames = 0;
  renderer.setAnimationLoop(() => {
    const now = performance.now();
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    ctx.time += dt;
    if (ctx.entered) {
      if (hold) ctx.storyTime = startOffset;
      else ctx.storyTime = ctx.time - storyStart;
    }
    for (const fn of ctx.updaters) {
      try { fn(ctx.time, dt, ctx); } catch (e) { console.error('[update]', e); }
    }
    if (camOverride) { camera.position.set(camOverride[0], camOverride[1], camOverride[2]); camera.lookAt(camOverride[3], camOverride[4], camOverride[5]); }
    pipeline.render();
    frames++;
    window.__frames = frames;
  });

  window.__sceneReady = true;
  clearTimeout(window.__bootTimer);
  window.__ctx = ctx;
  hint.textContent = ctx.reducedMotion ? '已依照系統設定減少動態效果 · 記得打開聲音' : '記得打開聲音';
  btn.disabled = false;
  if (PARAMS.has('auto')) enter(false);
}

boot().catch((e) => {
  console.error(e);
  window.__showFallback('燈暫時點不亮', '出了一點小意外，重新整理一下試試。', String(e && e.message || e));
});

</script>
</body>
</html>
