      cord.position.y = (cordTop + cordBot) / 2;
      lantern.add(cord);
      const knot = new THREE.Mesh(new THREE.SphereGeometry(0.016, 10, 8), cordMat);
      knot.position.y = cordTop - 0.012;
      lantern.add(knot);

      // 燈籠本體：扁圓的車床體，表面一瓣一瓣微微鼓起（燈籠骨架的凹線）
      const N_RIB = 12;
      const prof = [];
      const NP = 22;
      for (let i = 0; i <= NP; i++) {
        const t = i / NP;                  // 0 底 → 1 頂
        const yy = (t * 2 - 1);
        const r = Math.pow(Math.max(0, 1 - Math.pow(Math.abs(yy), 2.4)), 1 / 2.4);
        prof.push(new THREE.Vector2(Math.max(0.36, r) * RX, yy * RY * 0.98));
      }
      const bodyGeo = new THREE.LatheGeometry(prof, N_RIB * 6);
      {
        const p = bodyGeo.attributes.position;
        for (let i = 0; i < p.count; i++) {
          const x = p.getX(i), z = p.getZ(i), y = p.getY(i);
          const a = Math.atan2(z, x);
          const crease = Math.pow(Math.abs(Math.cos((a * N_RIB) / 2)), 0.6); // 1 在瓣中間、0 在骨架
          const k = 1 - 0.045 * (1 - crease) * (1 - Math.pow(Math.abs(y / RY), 2));
          p.setX(i, x * k); p.setZ(i, z * k);
        }
        bodyGeo.computeVertexNormals();
      }
      const { uv, fract, abs, smoothstep, mix, vec3, dot, normalView, positionViewDirection, pow, float, clamp } = TSL;
      const facing = clamp(dot(normalView, positionViewDirection), 0.0, 1.0);
      const center = pow(facing, 1.6);
      const ribD = abs(fract(uv().x.mul(N_RIB).add(0.5)).sub(0.5));          // 到最近骨架的距離
      const rib = float(1.0).sub(smoothstep(0.0, 0.045, ribD));
      const pole = smoothstep(0.62, 0.95, abs(uv().y.mul(2.0).sub(1.0)));     // 靠近上下口比較暗
      const edgeCol = vec3(0.3, 0.012, 0.012);   // 輪廓：深紅
      const midCol = vec3(0.82, 0.05, 0.03);     // 紙面：正紅
      const hotCol = vec3(1.75, 0.6, 0.1);       // 中心：透出來的暖橘燭光（會微微 bloom）
      const waist = float(1.0).sub(pow(abs(uv().y.mul(2.0).sub(1.0)), 2.0).mul(0.6)); // 腰部比較亮
      let col = mix(edgeCol, midCol, smoothstep(0.05, 0.6, facing));
      col = mix(col, hotCol, pow(center, 2.2).mul(waist).mul(0.85));
      col = col.mul(float(1.0).sub(rib.mul(0.5))).mul(float(1.0).sub(pole.mul(0.45)));
      const bodyMat = new THREE.MeshBasicNodeMaterial();
      bodyMat.colorNode = col.mul(uGlow);
      body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = BODY_Y;
      body.scale.z = DEPTH_K;
      body.castShadow = true;
      lantern.add(body);

      // 上下的金色蓋子
      const capR = RX * 0.4;
      const capTop = new THREE.Mesh(new THREE.CylinderGeometry(capR * 0.82, capR * 1.02, 0.05, 20), gold);
      capTop.position.y = BODY_Y + RY - 0.005;
      const ringTop = new THREE.Mesh(new THREE.TorusGeometry(capR * 0.88, 0.008, 6, 24), goldDark);
      ringTop.rotation.x = Math.PI / 2;
      ringTop.position.y = BODY_Y + RY + 0.022;
      const knobTop = new THREE.Mesh(new THREE.SphereGeometry(0.022, 10, 8), goldDark);
      knobTop.position.y = BODY_Y + RY + 0.03;
      const capBot = new THREE.Mesh(new THREE.CylinderGeometry(capR * 1.02, capR * 0.82, 0.05, 20), gold);
      capBot.position.y = BODY_Y - RY + 0.005;
      const ringBot = ringTop.clone();
      ringBot.position.y = BODY_Y - RY - 0.022;
      for (const m of [capTop, ringTop, capBot, ringBot]) m.scale.z = m === ringTop || m === ringBot ? 1 : DEPTH_K;
      ringTop.scale.y = ringBot.scale.y = DEPTH_K; // torus 轉了 90°，局部 y = 世界 z
      lantern.add(capTop, ringTop, knobTop, capBot, ringBot);

      // 流蘇：金色小珠 + 紅色結 + 一束有溝紋的穗（自己有一點慢半拍的擺動）
      tassel = new THREE.Group();
      tassel.position.y = BODY_Y - RY - 0.03;
      lantern.add(tassel);
      const bead = new THREE.Mesh(new THREE.SphereGeometry(0.022, 10, 8), gold);
      bead.position.y = -0.02;
      const tKnot = new THREE.Mesh(new THREE.SphereGeometry(0.026, 10, 8), hw(PALETTE.lanternRed, 0x6a1008, 0.6));
      tKnot.scale.set(1, 0.8, 1);
      tKnot.position.y = -0.055;
      const tprof = [];
      for (let i = 0; i <= 10; i++) {
        const t = i / 10;
        const r = t < 0.15 ? 0.016 + t * 0.08 : 0.028 + 0.016 * Math.pow((t - 0.15) / 0.85, 0.7);
        tprof.push(new THREE.Vector2(t > 0.97 ? r * 0.75 : r, -t * 0.19));
      }
      tprof.reverse();
      const tgeo = new THREE.LatheGeometry(tprof, 28);
      {
        const p = tgeo.attributes.position;
        for (let i = 0; i < p.count; i++) {
          const a = Math.atan2(p.getZ(i), p.getX(i));
          const k = 1 - 0.14 * (0.5 + 0.5 * Math.cos(a * 14)) * THREE.MathUtils.smoothstep(-p.getY(i), 0.03, 0.08);
          p.setX(i, p.getX(i) * k); p.setZ(i, p.getZ(i) * k);
        }
        tgeo.computeVertexNormals();
      }
      const strands = new THREE.Mesh(tgeo, hw(0xc42c36, 0x7a1410, 0.7));
      strands.position.y = -0.07;
      const band = new THREE.Mesh(new THREE.TorusGeometry(0.024, 0.006, 6, 18), gold);
      band.rotation.x = Math.PI / 2;
      band.position.y = -0.095;
      tassel.add(bead, tKnot, strands, band);
      lantern.traverse((o) => { if (o.isMesh && o !== body) { o.castShadow = true; o.receiveShadow = true; } });

      // 一盞暖紅的點光（照一點牆和台階）
      light = new THREE.PointLight(PALETTE.lanternGlow, LIGHT_I, 4.2, 1.35);
      light.position.set(0, BODY_Y - 0.04, 0.1);
      lantern.add(light);

      // 柔光暈（放在燈籠前面一點，面向鏡頭）
      const haloMat = new THREE.SpriteNodeMaterial();
      // 比共用的 glowTexture 更柔、更快淡掉的光暈貼圖
      const haloTex = ctx.makeCanvasTexture(128, (g, s) => {
        const gr = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
        gr.addColorStop(0, 'rgba(255,255,255,1)');
        gr.addColorStop(0.2, 'rgba(255,255,255,0.55)');
        gr.addColorStop(0.4, 'rgba(255,255,255,0.14)');
        gr.addColorStop(0.65, 'rgba(255,255,255,0.03)');
        gr.addColorStop(1, 'rgba(255,255,255,0)');
        g.fillStyle = gr; g.fillRect(0, 0, s, s);
      });
      haloMat.colorNode = TSL.vec4(TSL.vec3(1.0, 0.52, 0.16).mul(uHalo).mul(0.22), TSL.texture(haloTex).a); // 偏橘，疊在藍色夜空上才不會變紫
      haloMat.transparent = true;
      haloMat.depthWrite = false;
      haloMat.blending = THREE.AdditiveBlending;
      halo = new THREE.Sprite(haloMat);
      halo.scale.set(1.0, 1.0, 1);
      halo.renderOrder = 2;
      porch.add(halo);
    }
    ctx.anchors.lantern = v3().copy(hook).add(v3(0, BODY_Y, 0));

    // ---- 擺動、微微閃爍、lantern:flash ----
    const SWING_PERIOD = 3.5;
    let flashAt = -100;
    let kickAt = -100;
    ctx.events.on('lantern:flash', () => { flashAt = ctx.time; kickAt = ctx.time; });
    let tasselA = 0, tasselV = 0, prevSwing = 0, prevSwingV = 0;
    const tmp = new THREE.Vector3();
    const camDir = new THREE.Vector3();
    ctx.onUpdate((t, dt) => {
      const rm = ctx.reducedMotion;
      const w = (Math.PI * 2) / (rm ? 5.0 : SWING_PERIOD);
      const amp = THREE.MathUtils.degToRad(rm ? 1.4 : 3.8);
      // 主擺動（平行於牆）+ 很慢的風
      const wind = 0.78 + 0.22 * Math.sin(t * 0.21 + 0.7) + 0.12 * Math.sin(t * 0.093 + 2.1);
      let swing = amp * wind * Math.sin(w * t) + amp * 0.18 * Math.sin(t * 0.37 + 1.3);
      // 閃光時輕輕推一下
      const kt = t - kickAt;
      if (kt >= 0 && kt < 8) swing += THREE.MathUtils.degToRad(rm ? 1.0 : 3.2) * Math.exp(-kt / 1.8) * Math.sin(w * kt);
      lantern.rotation.z = swing;
      lantern.rotation.x = amp * 0.28 * Math.sin(w * 0.73 * t + 1.1); // 前後很小

      // 流蘇：軟的，想一直朝下垂（抵消一半燈籠的傾斜），被擺動帶著慢半拍（阻尼彈簧）
      const sv = dt > 0 ? (swing - prevSwing) / dt : 0;
      const sa = dt > 0 ? (sv - prevSwingV) / dt : 0;
      prevSwing = swing; prevSwingV = sv;
      if (dt > 0) {
        const k = 60, c = 7;
        const rest = -swing * 0.5;
        tasselV += (-k * (tasselA - rest) - c * tasselV - Math.max(-3, Math.min(3, sa)) * 0.9) * dt;
        tasselA += tasselV * dt;
        tasselA = Math.max(-0.35, Math.min(0.35, tasselA));
      }
      tassel.rotation.z = rm ? tasselA * 0.5 : tasselA;

      // 亮度：微弱的燭火閃爍（減少動態時關掉）+ 閃光
      const flick = rm ? 0 : 0.035 * Math.sin(t * 11.3) + 0.025 * Math.sin(t * 7.1 + 1.3) + 0.02 * Math.sin(t * 17.9 + 0.4);
      const ft = (t - flashAt) / 1.2;
      const flash = ft >= 0 && ft <= 1 ? Math.pow(Math.sin(Math.PI * ft), 1.6) : 0;
      uGlow.value = 1.0 + flick + flash * 0.42;
      uHalo.value = 1.0 + flick * 1.5 + flash * 1.1;
      light.intensity = LIGHT_I * (1 + flick * 1.4 + flash * 1.3);

      // 錨點 + 光暈位置（光暈放在燈籠中心、稍微靠鏡頭，燈籠本體會擋住中間，只留一圈柔光）
      body.getWorldPosition(tmp);
      ctx.anchors.lantern.copy(tmp);
      camDir.copy(ctx.camera.position).sub(tmp).normalize();
      halo.position.copy(tmp).addScaledVector(camDir, 0.06);
    });
  },
});

// ---------------------------------------------------------------- parts/20-pond.js
// ---- 池塘：沙底與小石頭、水草、圓石圈、香蒲、睡蓮、半透明水面（漣漪、月光倒影、閃光）、流星倒影 ----
PARTS.push({
  name: 'pond',
  order: 20,
  build(ctx) {
    const { THREE, TSL, LAYOUT, PALETTE, toon, shadow, scene } = ctx;
    const {
      Fn, uniform, float, vec2, vec3, vec4, sin, abs, pow, mix, smoothstep, clamp, length, normalize,
      exp, floor, fract, dot, atan, step, oneMinus, positionWorld, cameraPosition, hash, uv, texture,
    } = TSL;

    const P = LAYOUT.pond;
    const [CX, CZ] = P.center;
    const WY = P.waterY;                 // 水面 y = -0.1
    const BY = -0.55;                    // 池底平坦處（章魚走在這裡）
    // 島的洞是 ExtrudeGeometry 挖的：倒角讓洞壁往內縮 0.22（直壁在 y -0.18 .. -0.78）
    const WALL_RX = P.rx - 0.22, WALL_RZ = P.rz - 0.22;
    // 水面那一層（y = -0.1，還在倒角裡）的岸線
    const SHORE_RX = P.rx - 0.2, SHORE_RZ = P.rz - 0.2;
    const rnd = ctx.rand(20251);
    const TAU = Math.PI * 2;

    const group = new THREE.Group();
    group.name = 'pond';
    scene.add(group);

    const col = (hex) => new THREE.Color(hex);
    const v3 = (c) => vec3(c.r, c.g, c.b);
    // 池中座標：角度 a（xz 平面，0 = +x 東，π/2 = +z 南），相對半徑 rho
    const at = (a, rho, rx, rz) => [CX + Math.cos(a) * rho * rx, CZ + Math.sin(a) * rho * rz];
    const rhoOf = (x, z, rx, rz) => Math.hypot((x - CX) / rx, (z - CZ) / rz);

    // 池子自己的時鐘（減少動態時走慢一點；都是 uniform，不會重編譯）
    const uT = uniform(0);    // 水紋、光紋
    const uTw = uniform(0);   // 閃光（減少動態時幾乎停住）
    const uNow = uniform(0);  // 真實秒數（漣漪圈）

    // =====================================================================
    //  池底：中間平坦 y = -0.55，外圈像碗一樣翹起來，一路翹進坑壁裡（不留縫）
    // =====================================================================
    function bottomY(rho) {
      if (rho <= 0.78) return BY;
      if (rho <= 1.0) return BY + 0.42 * Math.pow((rho - 0.78) / 0.22, 1.8); // 到坑壁時 y = -0.13（水面下）
      return Math.min(-0.13 + (rho - 1.0) * 0.6, -0.06);                     // 再往外藏進岸和坑壁裡
    }
    {
      const RINGS = [0, 0.16, 0.32, 0.46, 0.58, 0.68, 0.75, 0.79, 0.83, 0.87, 0.9, 0.93, 0.96, 0.99, 1.02, 1.05, 1.09];
      const SEG = 112;
      const pos = [], cols = [], idx = [];
      const sand = col(0xd8c08f), sandDark = col(0xb89e74), sandPink = col(0xd4b28e), moss = col(0x8a9a62), c = new THREE.Color();
      const deepTint = col(0x9ed8ee), tmpTint = new THREE.Color(); // 水越深，沙子越偏青（水的顏色）
      for (let r = 0; r < RINGS.length; r++) {
        const rho = RINGS[r];
        for (let i = 0; i < SEG; i++) {
          const a = (i / SEG) * TAU;
          const x = Math.cos(a) * rho * WALL_RX, z = Math.sin(a) * rho * WALL_RZ;
          pos.push(x, bottomY(rho), z);
          // 沙子：淡淡的深淺斑，靠岸邊帶一點青苔色
          const n = 0.5 + 0.5 * Math.sin(x * 3.3 + z * 1.6) * Math.sin(z * 2.7 - x * 1.1);
          const m = 0.5 + 0.5 * Math.sin(x * 1.3 - z * 2.1 + 1.7);
          c.copy(sand).lerp(sandDark, n * 0.55).lerp(sandPink, m * 0.25);
          c.lerp(moss, THREE.MathUtils.smoothstep(rho, 0.84, 0.98) * 0.6);
          const deep = THREE.MathUtils.clamp((WY - bottomY(rho)) / 0.45, 0, 1);
          c.multiply(tmpTint.setRGB(1, 1, 1).lerp(deepTint, deep * 0.85));
          cols.push(c.r, c.g, c.b);
          if (r > 0) {
            const a0 = (r - 1) * SEG + i, a1 = (r - 1) * SEG + ((i + 1) % SEG);
            const b0 = r * SEG + i, b1 = r * SEG + ((i + 1) % SEG);
            idx.push(a0, a1, b0, a1, b1, b0); // 法線朝上
          }
        }
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
      geo.setIndex(idx);
      geo.computeVertexNormals();
      const mat = toon(0xffffff, { cache: false });
      mat.vertexColors = true;
      // 水底光紋（caustics）：兩組扭動的正弦波相乘，接近零的地方亮成柔柔的網
      const p = positionWorld.xz.mul(3.6);
      const wa = sin(p.x.add(sin(p.y.mul(1.3).add(uT.mul(0.6))).mul(1.2)).add(uT.mul(0.4)));
      const wb = sin(p.y.mul(1.15).add(sin(p.x.mul(0.9).sub(uT.mul(0.5))).mul(1.3)).sub(uT.mul(0.3)));
      const net = smoothstep(0.93, 1.0, oneMinus(abs(wa.mul(wb))));
      const lp = positionWorld.xz.sub(vec2(CX, CZ)).div(vec2(WALL_RX, WALL_RZ));
      const fade = oneMinus(smoothstep(0.82, 0.98, length(lp)));
      mat.emissiveNode = v3(col(0xa8ecff)).mul(net.mul(fade).mul(0.055));
      const bottom = new THREE.Mesh(geo, mat);
      bottom.position.set(CX, 0, CZ);
      bottom.receiveShadow = true;
      group.add(bottom);
    }

    // ---- 岸：蓋住島挖洞留下的土色倒角——草地圓圓地彎下去，到水邊變成一小圈濕沙 ----
    {
      // [從洞口往內縮的距離 b, 高度 y]；島的倒角在 b = 0.11 / 0.19 / 0.22 時深 0.024 / 0.09 / 0.18，這裡一律高出它約 0.015–0.02
      // 第三個數：0 = 草色，1 = 濕沙色
      const prof = [[-0.06, -0.014, 0], [-0.004, 0.007, 0], [0.05, 0.004, 0], [0.1, -0.006, 0.08], [0.145, -0.03, 0.5], [0.175, -0.056, 0.88], [0.195, -0.085, 1], [0.207, -0.12, 1], [0.212, -0.14, 1]];
      const SEG = 128;
      const pos = [], cols = [], idx = [];
      const grass = col(PALETTE.grass), wet = col(0x968a5e), wet2 = col(0x7f7556), c = new THREE.Color();
      for (let k = 0; k < prof.length; k++) {
        const [b, y, m] = prof[k];
        for (let i = 0; i < SEG; i++) {
          const a = (i / SEG) * TAU;
          const x = Math.cos(a) * (P.rx - b), z = Math.sin(a) * (P.rz - b);
          pos.push(x, y, z);
          const n = 0.5 + 0.5 * Math.sin(a * 9 + 1.3) * Math.sin(a * 4 - 0.4);
          c.copy(wet).lerp(wet2, n * 0.6);
          c.lerp(grass, 1 - m);
          cols.push(c.r, c.g, c.b);
          if (k > 0) {
            const a0 = (k - 1) * SEG + i, a1 = (k - 1) * SEG + ((i + 1) % SEG);
            const b0 = k * SEG + i, b1 = k * SEG + ((i + 1) % SEG);
            idx.push(a0, b0, a1, a1, b0, b1); // 由外往內排的環，法線朝上
          }
        }
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
      geo.setIndex(idx);
      geo.computeVertexNormals();
      const mat = toon(0xffffff, { cache: false });
      mat.vertexColors = true;
      const bank = new THREE.Mesh(geo, mat);
      bank.position.set(CX, 0, CZ);
      bank.receiveShadow = true;
      group.add(bank);
    }

    // ---- 圓滾滾的石頭幾何（合併頂點後輕微變形 → 平滑法線）----
    function lumpGeo(seed, detail = 2, amp = 0.1, flatBottom = -0.38) {
      const r = ctx.rand(seed);
      let g = new THREE.IcosahedronGeometry(1, detail);
      g.deleteAttribute('normal');
      g.deleteAttribute('uv');
      g = ctx.BufferGeometryUtils.mergeVertices(g);
      const p = g.attributes.position;
      const k1 = r() * 6, k2 = r() * 6, k3 = r() * 6;
      for (let i = 0; i < p.count; i++) {
        let x = p.getX(i), y = p.getY(i), z = p.getZ(i);
        const n = 1 + amp * Math.sin(x * 2.1 + k1) * Math.sin(y * 2.4 + k2) + amp * 0.7 * Math.sin(z * 3.1 + k3 + x);
        x *= n; y *= n; z *= n;
        if (y < flatBottom) y = flatBottom + (y - flatBottom) * 0.3; // 底部壓平，好坐在地上
        p.setXYZ(i, x, y, z);
      }
      g.computeVertexNormals();
      return g;
    }

    // ---- 池底的小圓石（InstancedMesh），只在外圈，中間留給橙蛸 ----
    {
      const geo = lumpGeo(11, 1, 0.08, -0.5);
      const N = 34;
      const mesh = new THREE.InstancedMesh(geo, toon(0xffffff), N);
      const pal = [0xc9c2b8, 0xe0d4bc, 0xa9b2bd, 0xd9c7a8, 0xc99a78, 0xb5c2a8, 0xf0e6d6];
      const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), v = new THREE.Vector3(), s = new THREE.Vector3();
      for (let i = 0; i < N; i++) {
        const a = rnd() * TAU;
        const rho = 0.64 + Math.pow(rnd(), 1.4) * 0.26;
        const [x, z] = at(a, rho, WALL_RX, WALL_RZ);
        const r = 0.035 + rnd() * 0.05;
        v.set(x, bottomY(rho) + r * 0.3, z);
        e.set((rnd() - 0.5) * 0.3, rnd() * TAU, (rnd() - 0.5) * 0.3);
        q.setFromEuler(e);
        s.set(r * (1.1 + rnd() * 0.4), r * 0.62, r);
        m4.compose(v, q, s);
        mesh.setMatrixAt(i, m4);
        mesh.setColorAt(i, col(pal[i % pal.length]));
      }
      mesh.receiveShadow = true;
      group.add(mesh);
    }

    // ---- 毛茸茸的綠藻球（marimo），兩三顆躲在池邊 ----
    const marimoGeo = lumpGeo(31, 2, 0.05, -0.8);
    const marimoMat = toon(0x4f9e4c);
    for (const [a, rho, r] of [[1.98, 0.71, 0.085], [2.12, 0.75, 0.055], [0.3, 0.72, 0.07]]) {
      const [x, z] = at(a, rho, WALL_RX, WALL_RZ);
      const m = new THREE.Mesh(marimoGeo, marimoMat);
      m.position.set(x, bottomY(rho) + r * 0.85, z);
      m.scale.setScalar(r);
      m.rotation.set(rnd() * 3, rnd() * 3, 0);
      m.receiveShadow = true;
      group.add(m);
    }

    // ---- 細長葉片幾何（香蒲葉、水草）：底寬頂尖，往 +z 彎 ----
    function bladeGeo(h, w, bend, segs = 7) {
      const pos = [], idx = [];
      for (let i = 0; i <= segs; i++) {
        const v = i / segs;
        const hw = w * 0.5 * Math.pow(1 - v, 0.75) + 0.002;
        const off = bend * v * v;
        pos.push(-hw, h * v, off, hw, h * v, off);
        if (i < segs) { const k = i * 2; idx.push(k, k + 1, k + 2, k + 1, k + 3, k + 2); }
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      g.setIndex(idx);
      g.computeVertexNormals();
      return g;
    }

    const swayers = []; // { obj, base: Euler-ish, amp, freq, ph }
    function addSway(obj, amp, freq) {
      swayers.push({ obj, rx: obj.rotation.x, rz: obj.rotation.z, amp, freq, ph: rnd() * TAU });
    }

    // ---- 水草：池邊兩叢，在水裡輕輕擺 ----
    {
      const mats = [toon(0x45a676, { side: THREE.DoubleSide }), toon(0x6cc08a, { side: THREE.DoubleSide })];
      for (const [ca, crho] of [[2.62, 0.86], [6.02, 0.85]]) {
        for (let i = 0; i < 7; i++) {
          const a = ca + (rnd() - 0.5) * 0.22;
          const rho = crho + (rnd() - 0.5) * 0.05;
          const [x, z] = at(a, rho, WALL_RX, WALL_RZ);
          const by = bottomY(rho) - 0.01;
          const h = Math.min(0.2 + rnd() * 0.18, WY - 0.05 - by);
          const blade = new THREE.Mesh(bladeGeo(h, 0.045 + rnd() * 0.02, 0.04 + rnd() * 0.05, 6), mats[i % 2]);
          blade.position.set(x, by, z);
          blade.rotation.set((rnd() - 0.5) * 0.3, rnd() * TAU, (rnd() - 0.5) * 0.3);
          group.add(blade);
          addSway(blade, 0.12, 0.7 + rnd() * 0.4);
        }
      }
    }

    // =====================================================================
    //  池邊圓石圈：大小不一、有缺口；主鏡頭那一側低矮稀疏，亭子和小路旁讓開
    // =====================================================================
    {
      const geos = [lumpGeo(1), lumpGeo(2), lumpGeo(3), lumpGeo(4), lumpGeo(5, 2, 0.14)];
      const mats = [toon(0xcbc2b8), toon(0xe0d0b0), toon(0xb3aaa1), toon(0xb2bac4), toon(0xd6c9b8)];
      // 島上小路的踏腳石（00-island 裡的座標），石頭別壓上去
      const pathStones = [[-0.55, 1.8], [0.4, 4.6], [1.4, 4.8], [2.5, 4.95], [3.5, 5.05], [4.45, 5.3]];
      const PV = LAYOUT.pavilion;
      const blocked = (x, z, r) =>
        Math.hypot(x - PV.center[0], z - PV.center[1]) < PV.radius + 0.55 + r ||
        pathStones.some(([px, pz]) => Math.hypot(x - px, z - pz) < 0.42 + r);
      // 有些大石頭頂上蓋一小塊青苔（另一個亂數，不打亂石頭的擺法）
      const mossRnd = ctx.rand(77);
      const mossGeo = lumpGeo(6, 2, 0.12);
      const mossMat = toon(0x7fb35e);
      const placeRock = (x, z, y, size, flat = 0.72) => {
        const k = Math.floor(rnd() * geos.length);
        const m = new THREE.Mesh(geos[k], mats[Math.floor(rnd() * mats.length)]);
        m.position.set(x, y, z);
        m.scale.set(size * (1.0 + rnd() * 0.3), size * (flat + rnd() * 0.12), size * (0.9 + rnd() * 0.25));
        m.rotation.set((rnd() - 0.5) * 0.25, rnd() * TAU, (rnd() - 0.5) * 0.25);
        if (size > 0.2 && mossRnd() < 0.4) {
          const moss = new THREE.Mesh(mossGeo, mossMat);
          moss.position.set((mossRnd() - 0.5) * 0.3, 0.66, (mossRnd() - 0.5) * 0.3);
          moss.scale.set(0.66, 0.34, 0.6);
          moss.rotation.set((mossRnd() - 0.5) * 0.4, mossRnd() * TAU, (mossRnd() - 0.5) * 0.4);
          m.add(moss);
        }
        shadow(m);
        group.add(m);
        return m;
      };
      let a = 0.05;
      while (a < TAU - 0.12) {
        const deg = (a * 180) / Math.PI;
        const nearSide = deg > 45 && deg < 100;   // 主鏡頭（東南方低機位）那一側
        const reedSide = deg > 250 && deg < 305;  // 香蒲那一側
        let size = 0.16 + rnd() * 0.17;
        if (nearSide) size *= 0.55;
        const skip = (nearSide && rnd() < 0.45) || (reedSide && rnd() < 0.55) || rnd() < 0.1;
        const wet = !nearSide && rnd() < 0.3;     // 一部分石頭半泡在水裡
        const rho = wet ? 0.975 + rnd() * 0.02 : 1.02 + rnd() * 0.05;
        const [x, z] = at(a, rho, P.rx, P.rz);
        if (!skip && !blocked(x, z, size)) {
          placeRock(x, z, wet ? -0.05 : -size * 0.1, size);
          // 偶爾在外側配一顆小的
          if (rnd() < 0.35) {
            const a2 = a + (rnd() - 0.5) * 0.12;
            const [x2, z2] = at(a2, 1.1 + rnd() * 0.06, P.rx, P.rz);
            const s2 = size * (0.4 + rnd() * 0.2);
            if (!blocked(x2, z2, s2)) placeRock(x2, z2, -s2 * 0.15, s2, 0.62);
          }
        }
        a += (size * 2.1) / 2.15 + 0.02 + rnd() * 0.1;
      }
    }

    // =====================================================================
    //  香蒲：北岸一小叢（主鏡頭往池子看過去時在後面）
    // =====================================================================
    {
      const stemMat = toon(0x6e9c50);
      const headMat = toon(0x7a4a2c);
      const leafMats = [toon(0x5f9f55, { side: THREE.DoubleSide }), toon(0x79b65f, { side: THREE.DoubleSide }), toon(0x4f8a4a, { side: THREE.DoubleSide })];
      const stemGeo = new THREE.CylinderGeometry(0.011, 0.017, 1, 6);
      stemGeo.translate(0, 0.5, 0);
      const headGeo = new THREE.CapsuleGeometry(0.05, 0.17, 4, 10);
      const tipGeo = new THREE.CylinderGeometry(0.003, 0.007, 0.1, 5);
      const baseOf = (x, z) => {
        // 岸上 → 草面 0；水裡（岸線內）→ 池底
        const rt = rhoOf(x, z, P.rx, P.rz);
        if (rt >= 1.0) return 0;
        return bottomY(rhoOf(x, z, WALL_RX, WALL_RZ)) - 0.02;
      };
      const spots = [];
      // 香蒲（有咖啡色的棒）：幾根在岸上，幾根站在淺水裡
      const cattails = [[4.62, 1.06], [4.78, 0.9], [4.88, 1.14], [4.98, 0.96], [4.7, 0.86], [4.55, 1.12]];
      cattails.forEach(([a, rho], i) => {
        const inWater = rho < 0.95;
        const [x, z] = inWater ? at(a, rho, WALL_RX, WALL_RZ) : at(a, rho, P.rx, P.rz);
        const by = baseOf(x, z);
        const h = (0.95 + rnd() * 0.45) - by * 0.6;
        const g = new THREE.Group();
        g.position.set(x, by, z);
        const stem = new THREE.Mesh(stemGeo, stemMat);
        stem.scale.set(1, h, 1);
        const head = new THREE.Mesh(headGeo, headMat);
        head.position.y = h - 0.16;
        const tip = new THREE.Mesh(tipGeo, stemMat);
        tip.position.y = h + 0.02;
        g.add(stem, head, tip);
        g.rotation.set((rnd() - 0.5) * 0.22, rnd() * TAU, (rnd() - 0.5) * 0.22);
        shadow(g, false, true);
        group.add(g);
        addSway(g, 0.035, 0.45 + rnd() * 0.25);
        spots.push([x, z]);
      });
      // 葉子：長長的，往外彎
      for (let i = 0; i < 14; i++) {
        const a = 4.5 + rnd() * 0.58;
        const rho = 0.9 + rnd() * 0.24;
        const inWater = rho < 0.95;
        const [x, z] = inWater ? at(a, rho, WALL_RX, WALL_RZ) : at(a, rho, P.rx, P.rz);
        const by = baseOf(x, z);
        const h = 0.55 + rnd() * 0.5 - by * 0.5;
        const leaf = new THREE.Mesh(bladeGeo(h, 0.06 + rnd() * 0.025, 0.12 + rnd() * 0.22, 8), leafMats[i % 3]);
        leaf.position.set(x, by, z);
        // 葉子彎向外（遠離池心）或隨機
        const out = Math.atan2(x - CX, z - CZ);
        leaf.rotation.set(0, (rnd() < 0.6 ? out : rnd() * TAU) + (rnd() - 0.5) * 0.9, 0);
        shadow(leaf, false, true);
        group.add(leaf);
        addSway(leaf, 0.05, 0.5 + rnd() * 0.3);
      }
    }

    // =====================================================================
    //  睡蓮葉 + 粉白小花
    // =====================================================================
    const padTex = ctx.makeCanvasTexture(256, (g, s) => {
      const c = s / 2;
      g.fillStyle = '#4f8f47';
      g.fillRect(0, 0, s, s);
      const gr = g.createRadialGradient(c, c, 4, c, c, c);
      gr.addColorStop(0, '#9ad677');
      gr.addColorStop(0.55, '#79bd62');
      gr.addColorStop(0.92, '#62a653');
      gr.addColorStop(1, '#4f8f47');
      g.fillStyle = gr;
      g.beginPath(); g.arc(c, c, c, 0, TAU); g.fill();
      // 葉脈
      g.strokeStyle = 'rgba(190,236,150,0.55)';
      g.lineWidth = 3;
      g.lineCap = 'round';
      for (let i = 0; i < 11; i++) {
        const a = 0.35 + (i / 10) * (TAU - 0.7);
        g.beginPath();
        g.moveTo(c, c);
        g.lineTo(c + Math.cos(a) * c * 0.86, c - Math.sin(a) * c * 0.86);
        g.stroke();
      }
      // 外緣一圈深一點
      g.strokeStyle = 'rgba(52,104,52,0.7)';
      g.lineWidth = 7;
      g.beginPath(); g.arc(c, c, c - 5, 0, TAU); g.stroke();
    });
    padTex.repeat.set(0.5, 0.5);
    padTex.offset.set(0.5, 0.5);
    const padMat = toon(0xffffff, { cache: false });
    padMat.map = padTex;
    const padGeo = (() => {
      const notch = 0.5;
      const s = new THREE.Shape();
      s.moveTo(0, 0);
      s.lineTo(Math.cos(notch / 2) * 0.98, Math.sin(notch / 2) * 0.98);
      s.absarc(0, 0, 1, notch / 2, TAU - notch / 2, false);
      s.lineTo(0, 0);
      const g = new THREE.ExtrudeGeometry(s, { depth: 0.04, bevelEnabled: true, bevelThickness: 0.035, bevelSize: 0.035, bevelSegments: 2, curveSegments: 36 });
      g.rotateX(-Math.PI / 2);
      g.translate(0, 0.035, 0); // 底面 y = 0
      return g;
    })();

    function makeFlower() {
      const f = new THREE.Group();
      const petalGeo = new THREE.SphereGeometry(1, 12, 8);
      petalGeo.translate(0, 0, 1);
      const rings = [
        { n: 8, len: 0.14, w: 0.055, tilt: 0.32, color: 0xffa8c6, off: 0 },
        { n: 7, len: 0.12, w: 0.05, tilt: 0.72, color: 0xffd6e4, off: 0.4 },
        { n: 5, len: 0.085, w: 0.04, tilt: 1.08, color: 0xfff6f8, off: 0.2 },
      ];
      for (const R of rings) {
        const m = toon(R.color, { emissive: R.color, emissiveIntensity: 0.16 });
        for (let i = 0; i < R.n; i++) {
          const pivot = new THREE.Group();
          pivot.rotation.y = (i / R.n) * TAU + R.off;
          const petal = new THREE.Mesh(petalGeo, m);
          petal.scale.set(R.w, R.w * 0.42, R.len / 2);
          petal.rotation.x = -R.tilt;
          pivot.add(petal);
          f.add(pivot);
        }
      }
      const core = new THREE.Mesh(new THREE.SphereGeometry(0.046, 12, 8), toon(0xffd25a, { emissive: 0xffc23a, emissiveIntensity: 0.4 }));
      core.position.y = 0.05;
      core.scale.y = 0.7;
      f.add(core);
      shadow(f, true, false);
      return f;
    }

    const pads = [];
    {
      // [角度, 相對半徑(岸線), 葉子半徑, 花?]
      const list = [[3.5, 0.7, 0.3, true], [3.98, 0.73, 0.2, false], [2.1, 0.74, 0.25, false], [5.75, 0.7, 0.32, true]];
      for (const [a, rho, r, flower] of list) {
        const [x, z] = at(a, rho, SHORE_RX, SHORE_RZ);
        const pad = new THREE.Group();
        const leaf = new THREE.Mesh(padGeo, padMat);
        leaf.scale.set(r, r * 0.6, r);
        leaf.castShadow = true;
        leaf.receiveShadow = true;
        pad.add(leaf);
        if (flower) {
          const f = makeFlower();
          f.position.set(-r * 0.25, r * 0.6 * 0.11, r * 0.1);
          f.scale.setScalar(1.05);
          pad.add(f);
        }
        pad.position.set(x, WY - 0.012, z);
        pad.rotation.y = rnd() * TAU;
        group.add(pad);
        pads.push({ pad, y0: pad.position.y, ry: pad.rotation.y, ph: rnd() * TAU });
      }
      // 一顆含苞的小花苞
      const bud = new THREE.Mesh(new THREE.SphereGeometry(1, 12, 10), toon(0xffbcd2, { emissive: 0xffbcd2, emissiveIntensity: 0.1 }));
      bud.scale.set(0.045, 0.075, 0.045);
      bud.position.set(0.05, 0.05, -0.04);
      pads[2].pad.add(bud);
    }

    // =====================================================================
    //  水面：半透明、會動的漣漪線、岸邊亮帶、假的月光倒影、閃光、漣漪圈、流星倒影的光暈
    // =====================================================================
    const moonDir = new THREE.Vector3(...LAYOUT.moon).normalize();
    const uMoonC = uniform(new THREE.Vector2(CX + 0.8, CZ + 0.2));
    const uMoonD = uniform(new THREE.Vector2(0.3, 0.95).normalize());
    const uMoonI = uniform(1);
    const uMet = uniform(new THREE.Vector3(0, 0, 0));              // 流星倒影頭部 (x, z, 亮度)
    const uRip = [0, 1, 2, 3].map(() => uniform(new THREE.Vector4(0, 0, -99, 0))); // 漣漪圈 (x, z, 開始時間, 強度)

    const deepC = v3(col(0x174a72)), midC = v3(col(PALETTE.water)), shoreC = v3(col(0x5eb9c8));
    const lineC = v3(col(0xaee9f3)), foamC = v3(col(0xe8f8ff)), moonC = v3(col(PALETTE.moon)), metC = v3(col(0xe2ecff));

    const waterShade = Fn(() => {
      const pw = positionWorld;
      const lp = pw.xz.sub(vec2(CX, CZ)).toVar();
      const e = lp.div(vec2(SHORE_RX, SHORE_RZ));
      const rho = length(e).toVar();
      const ang = atan(e.y, e.x);
      const t = uT;
      // 假 Fresnel：越斜著看越不透明
      const V = normalize(cameraPosition.sub(pw));
      const fres = pow(oneMinus(clamp(V.y, 0.0, 1.0)), 2.0);
      // 底色：中間深一點，靠岸淺一點
      const c = mix(deepC, midC, smoothstep(0.15, 0.95, rho)).toVar();
      // 岸邊柔亮帶 + 一圈細白浪線，邊緣輕輕起伏
      const wob = sin(ang.mul(6.0).add(t.mul(0.8))).mul(0.012).add(sin(ang.mul(11.0).sub(t.mul(0.55))).mul(0.007));
      const rim = smoothstep(0.74, 0.98, rho.add(wob)).toVar();
      c.assign(mix(c, shoreC, rim.mul(0.62)));
      const foamD = rho.sub(0.925).add(wob.mul(1.6)).add(sin(t.mul(0.9)).mul(0.008));
      const foam = oneMinus(smoothstep(0.0, 0.026, abs(foamD)));
      // 漣漪線：扭動的細亮線，斷斷續續
      const q = lp.mul(2.6);
      const w1 = sin(q.x.mul(1.2).add(sin(q.y.mul(1.6).add(t.mul(0.5))).mul(1.3)).add(t.mul(0.32)));
      const w2 = sin(q.y.mul(1.7).add(sin(q.x.mul(1.1).sub(t.mul(0.4))).mul(1.1)).sub(t.mul(0.26)));
      const lines = oneMinus(smoothstep(0.0, 0.1, abs(w1.add(w2.mul(0.7)))));
      const dash = smoothstep(0.35, 0.85, sin(q.x.mul(0.8).sub(q.y.mul(1.1)).add(t.mul(0.35))).mul(0.5).add(0.5));
      const ripple = lines.mul(dash).mul(oneMinus(rim.mul(0.6)));
      // 月光倒影：沿著「月 → 水 → 相機」方向拉長的一片柔光，被波紋切成一條條
      const dm = pw.xz.sub(uMoonC);
      const along = dot(dm, uMoonD);
      const across = dot(dm, vec2(uMoonD.y.negate(), uMoonD.x));
      const g = exp(along.mul(along).div(-0.3).add(across.mul(across).div(-0.02))).toVar();
      const shim = sin(along.mul(42.0).add(t.mul(1.3)).add(sin(across.mul(18.0).add(t.mul(0.8))).mul(1.1))).mul(0.5).add(0.5);
      const moon = g.mul(mix(0.62, 1.0, shim)).mul(oneMinus(smoothstep(0.8, 0.97, rho))).mul(uMoonI);
      // 閃光：格子裡隨機的小亮點，靠近月光倒影的地方多一點
      const sg = pw.xz.mul(4.2).add(500.0);
      const cell = floor(sg);
      const h = hash(cell.x.mul(157.0).add(cell.y.mul(311.0)));
      const h2 = hash(cell.x.mul(71.0).add(cell.y.mul(23.0)).add(13.0));
      const f = fract(sg).sub(0.5).sub(vec2(h2, fract(h2.mul(17.0))).sub(0.5).mul(0.6));
      const star = oneMinus(smoothstep(0.0, 0.075, length(f)));
      const tw = pow(sin(uTw.mul(h.mul(1.6).add(0.9)).add(h.mul(50.0))).mul(0.5).add(0.5), 8.0);
      const near = clamp(g.mul(2.5).add(0.18), 0.0, 1.0);
      const sp = star.mul(tw).mul(step(0.55, h)).mul(near).mul(oneMinus(rim));
      // 漣漪圈
      const rings = float(0).toVar();
      for (const u of uRip) {
        const d = length(pw.xz.sub(u.xy));
        const age = uNow.sub(u.z);
        const rad = age.mul(0.28).add(0.02);
        const life = oneMinus(smoothstep(0.0, 2.6, age)).mul(step(0.0, age)).mul(u.w);
        const k1 = d.sub(rad).div(0.03);
        const k2 = d.sub(rad.mul(0.6)).div(0.024);
        rings.addAssign(exp(k1.mul(k1).negate()).add(exp(k2.mul(k2).negate()).mul(0.55)).mul(life));
      }
      // 流星倒影頭部照亮的一小片水
      const dmet = length(pw.xz.sub(uMet.xy));
      const pool = exp(dmet.mul(dmet).div(-0.05)).mul(uMet.z);

      const outC = c
        .add(foamC.mul(foam.mul(0.22)))
        .add(lineC.mul(ripple.mul(0.13)))
        .add(lineC.mul(rings.mul(0.32)))
        .add(moonC.mul(moon.mul(0.55)))
        .add(foamC.mul(sp.mul(2.0)))
        .add(metC.mul(pool.mul(0.5)));
      const alpha = mix(0.38, 0.62, fres)
        .add(rim.mul(0.16)).add(foam.mul(0.22)).add(ripple.mul(0.08)).add(rings.mul(0.18))
        .add(moon.mul(0.24)).add(sp.mul(0.5)).add(pool.mul(0.25));
      return vec4(outC, clamp(alpha, 0.0, 0.93));
    });

    const waterGeo = new THREE.CircleGeometry(1, 128);
    waterGeo.rotateX(-Math.PI / 2);
    waterGeo.scale(SHORE_RX + 0.07, 1, SHORE_RZ + 0.07); // 邊緣多伸進倒角裡一點，不露縫
    const waterMat = new THREE.MeshBasicNodeMaterial({ transparent: true, depthWrite: false });
    waterMat.colorNode = waterShade();
    const water = new THREE.Mesh(waterGeo, waterMat);
    water.name = 'pondWater';
    water.position.set(CX, WY, CZ);
    // 透明物件裡最先畫水：水面上的螢火蟲、泡泡等之後畫，不會被水蓋暗
    water.renderOrder = -1;
    group.add(water);

    // 漣漪圈 API（其他部件也可以用：ctx.objects.pond.ripple(x, z, 強度)）
    let ripIdx = 0;
    function ripple(x, z, strength = 1) {
      const u = uRip[ripIdx++ % uRip.length];
      u.value.set(x, z, ctx.time, strength);
    }

    // =====================================================================
    //  流星倒影：水面上一道細細的亮痕（頭亮、尾巴漸淡、隨波紋微微扭）
    // =====================================================================
    const STREAK_N = 36;
    const headC = col(0xf4f8ff), tailC = col(0x9fc4ff);
    function makeStreak() {
      const n = STREAK_N;
      const posArr = new Float32Array((n + 1) * 2 * 3);
      const uvArr = new Float32Array((n + 1) * 2 * 2);
      const idx = [];
      for (let i = 0; i <= n; i++) {
        uvArr.set([i / n, 0, i / n, 1], i * 4);
        if (i < n) { const k = i * 2; idx.push(k, k + 2, k + 1, k + 1, k + 2, k + 3); }
      }
      const geo = new THREE.BufferGeometry();
      const pa = new THREE.BufferAttribute(posArr, 3);
      pa.setUsage(THREE.DynamicDrawUsage);
      geo.setAttribute('position', pa);
      geo.setAttribute('uv', new THREE.BufferAttribute(uvArr, 2));
      geo.setIndex(idx);
      const uFade = uniform(0);
      const mat = new THREE.MeshBasicNodeMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide });
      const u = uv().x, vv = uv().y;
      const across = oneMinus(abs(vv.mul(2.0).sub(1.0)));
      mat.colorNode = mix(v3(tailC), v3(headC), pow(u, 2.0)).mul(1.8);
      mat.opacityNode = pow(u, 1.4).mul(smoothstep(0.0, 0.9, across)).mul(uFade);
      const mesh = new THREE.Mesh(geo, mat);
      mesh.frustumCulled = false;
      mesh.visible = false;
      mesh.renderOrder = 1;
      // 頭：一顆面向鏡頭的柔光
      const uHead = uniform(0);
      const hm = new THREE.SpriteNodeMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });
      hm.colorNode = v3(headC).mul(1.45);
      hm.opacityNode = texture(ctx.glowTexture).a.mul(uHead);
      const head = new THREE.Sprite(hm);
      head.visible = false;
      head.renderOrder = 1;
      head.scale.set(0.27, 0.18, 1);
      group.add(mesh, head);
      return { mesh, head, pa, uFade, uHead, active: false, t0: 0, dur: 1.5, A: new THREE.Vector2(), B: new THREE.Vector2(), ph: 0 };
    }
    const streaks = [makeStreak(), makeStreak()];

    // 天空中的點對水面鏡射，從相機看過去落在水面哪裡（xz）
    const mirrorHit = (cam, S, out) => {
      const sy = 2 * WY - S.y;
      const dy = sy - cam.y;
      if (cam.y <= WY + 0.05 || dy >= -1e-4) return null;
      const k = (WY - cam.y) / dy;
      return out.set(cam.x + (S.x - cam.x) * k, cam.z + (S.z - cam.z) * k);
    };
    // 直線 m + s·d 和岸線縮小到 R 的橢圓的交點（s 的兩個解）
    const chord = (m, d, R) => {
      const mx = (m.x - CX) / SHORE_RX, mz = (m.y - CZ) / SHORE_RZ;
      const dx = d.x / SHORE_RX, dz = d.y / SHORE_RZ;
      const A = dx * dx + dz * dz, B = 2 * (mx * dx + mz * dz), Cc = mx * mx + mz * mz - R * R;
      const disc = Math.max(0, B * B - 4 * A * Cc);
      return [(-B - Math.sqrt(disc)) / (2 * A), (-B + Math.sqrt(disc)) / (2 * A)];
    };
    const _ws = new THREE.Vector2(), _we = new THREE.Vector2(), _d = new THREE.Vector2(), _m = new THREE.Vector2();
    const _c = new THREE.Vector2(), _fwd = new THREE.Vector3();
    // 把水面上的點拉進岸線橢圓的 R 倍以內
    const clampIn = (v, R) => {
      const ex = (v.x - CX) / SHORE_RX, ez = (v.y - CZ) / SHORE_RZ, er = Math.hypot(ex, ez);
      if (er > R) v.set(CX + (ex * R) / er * SHORE_RX, CZ + (ez * R) / er * SHORE_RZ);
      return v;
    };
    function startReflection(data) {
      const s = streaks.find((x) => !x.active) || streaks[0];
      const cam = ctx.camera.position;
      const okS = data && data.start && mirrorHit(cam, data.start, _ws);
      const okE = data && data.end && mirrorHit(cam, data.end, _we);
      if (okS && okE && _we.distanceTo(_ws) > 1e-3) {
        _d.subVectors(_we, _ws).normalize();
        _m.addVectors(_ws, _we).multiplyScalar(0.5);
      } else {
        _d.set(-0.78, -0.62).normalize();
        _m.set(CX + 0.3, CZ + 0.25);
      }
      // 中點拉回池子中間一帶（倒影是「假的」，但方向跟天上的流星對得上），
      // 再往鏡頭畫面正中央看到的那片水靠一點，讓倒影一定落在畫面裡
      clampIn(_m, 0.35);
      ctx.camera.getWorldDirection(_fwd);
      if (_fwd.y < -0.05) {
        const k = (WY - cam.y) / _fwd.y;
        clampIn(_c.set(cam.x + _fwd.x * k, cam.z + _fwd.z * k), 0.42);
        _m.lerp(_c, 0.55);
      }
      const [s0, s1] = chord(_m, _d, 0.84);
      s.A.copy(_m).addScaledVector(_d, s0);
      s.B.copy(_m).addScaledVector(_d, s1);
      s.dur = Math.max(0.5, (data && data.duration) || 1.5);
      s.t0 = ctx.time;
      s.ph = rnd() * TAU;
      s.active = true;
      s.mesh.visible = s.head.visible = true;
    }
    ctx.events.on('meteor', (d) => { if (d && d.reflect) startReflection(d); });

    const _p = new THREE.Vector2();
    function updateStreak(s, t) {
      const el = t - s.t0;
      const D = s.dur;
      const FADE = 0.5;
      if (el > D + FADE) {
        s.active = false;
        s.mesh.visible = s.head.visible = false;
        return 0;
      }
      const k = Math.min(1, el / D);
      const kh = 1 - Math.pow(1 - k, 1.25);                     // 頭的位置（稍微減速）
      const out = el > D ? 1 - (el - D) / FADE : 1;              // 收尾淡出
      const tailLen = 0.55 * Math.min(1, el / (D * 0.35)) * (0.35 + 0.65 * out);
      const k0 = Math.max(0, kh - tailLen);
      const len = s.A.distanceTo(s.B);
      const dx = (s.B.x - s.A.x) / len, dz = (s.B.y - s.A.y) / len;
      const rm = ctx.reducedMotion;
      const amp = rm ? 0.008 : 0.028;
      const arr = s.pa.array;
      for (let i = 0; i <= STREAK_N; i++) {
        const u = i / STREAK_N;
        const kk = k0 + (kh - k0) * u;
        _p.copy(s.A).lerp(s.B, kk);
        const wob = amp * Math.sin(kk * len * 7 - el * (rm ? 2 : 8) + s.ph) * (0.25 + 0.75 * u)
          + amp * 0.5 * Math.sin(kk * len * 17 + el * (rm ? 1.5 : 5.5) + s.ph * 2);
        const w = (0.008 + 0.05 * Math.pow(u, 1.6)) * (1 + 0.18 * Math.sin(kk * 40 + el * 6));
        const cx = _p.x - dz * wob, cz = _p.y + dx * wob;
        const y = WY + 0.006;
        arr.set([cx - dz * w, y, cz + dx * w, cx + dz * w, y, cz - dx * w], i * 6);
      }
      s.pa.needsUpdate = true;
      const fadeIn = Math.min(1, el / 0.15);
      s.uFade.value = fadeIn * out;
      _p.copy(s.A).lerp(s.B, kh);
      s.head.position.set(_p.x, WY + 0.03, _p.y);
      s.uHead.value = fadeIn * out * out;
      uMet.value.set(_p.x, _p.y, 0.9 * fadeIn * out);
      return 1;
    }

    // =====================================================================
    //  每幀
    // =====================================================================
    let nextRip = 2.5 + rnd() * 3;
    const camXZ = new THREE.Vector2();
    ctx.onUpdate((t, dt) => {
      const rm = ctx.reducedMotion;
      uT.value += dt * (rm ? 0.45 : 1);
      uTw.value += dt * (rm ? 0.06 : 1);
      uNow.value = t;

      // 月光倒影的位置：真實反射點拉回池子裡（ρ ≤ 0.5），朝相機方向拉長
      const cp = ctx.camera.position;
      if (cp.y > WY + 0.05 && moonDir.y > 0.01) {
        const s = (cp.y - WY) / moonDir.y;
        const wx = cp.x + s * moonDir.x, wz = cp.z + s * moonDir.z;   // 真正的反射點
        let ex = (wx - CX) / SHORE_RX, ez = (wz - CZ) / SHORE_RZ;
        const er = Math.hypot(ex, ez);
        if (er > 0.5) { ex *= 0.5 / er; ez *= 0.5 / er; }
        const mx = CX + ex * SHORE_RX, mz = CZ + ez * SHORE_RZ;
        uMoonC.value.set(mx, mz);
        camXZ.set(cp.x - mx, cp.z - mz);
        if (camXZ.lengthSq() > 1e-4) uMoonD.value.copy(camXZ.normalize());
        // 從正上方往下看時倒影淡一點
        const elev = (cp.y - WY) / Math.max(0.1, Math.hypot(cp.x - mx, cp.z - mz));
        // 背對月亮（反射點在相機背後）時也淡一點
        const toPond = Math.hypot(CX - cp.x, CZ - cp.z), toW = Math.hypot(wx - cp.x, wz - cp.z);
        const facing = toPond > 1e-3 && toW > 1e-3 ? ((CX - cp.x) * (wx - cp.x) + (CZ - cp.z) * (wz - cp.z)) / (toPond * toW) : 1;
        uMoonI.value = (1 - 0.45 * THREE.MathUtils.smoothstep(elev, 0.6, 2.5)) * (0.45 + 0.55 * THREE.MathUtils.smoothstep(facing, -0.3, 0.3));
      }

      // 偶爾有一圈小漣漪（像水黽點了一下水）
      if (t > nextRip) {
        nextRip = t + (rm ? 9 : 5) + rnd() * 6;
        const a = rnd() * TAU, rho = 0.45 + rnd() * 0.38;
        const [x, z] = at(a, rho, SHORE_RX, SHORE_RZ);
        ripple(x, z, 0.75);
      }

      // 睡蓮葉輕輕浮、慢慢轉
      const bob = rm ? 0.4 : 1;
      for (const p of pads) {
        p.pad.position.y = p.y0 + Math.sin(t * 0.9 + p.ph) * 0.004 * bob;
        p.pad.rotation.y = p.ry + Math.sin(t * 0.13 + p.ph) * 0.12 * bob;
        p.pad.rotation.x = Math.sin(t * 0.7 + p.ph * 2) * 0.012 * bob;
      }
      // 香蒲、水草擺動
      const sw = rm ? 0.35 : 1;
      for (const s of swayers) {
        s.obj.rotation.x = s.rx + Math.sin(t * s.freq + s.ph) * s.amp * sw;
        s.obj.rotation.z = s.rz + Math.sin(t * s.freq * 0.8 + s.ph * 1.7) * s.amp * 0.6 * sw;
      }

      // 流星倒影
      let lit = 0;
      for (const s of streaks) if (s.active) lit += updateStreak(s, t);
      if (!lit) uMet.value.z = 0;
    });

    ctx.objects.pond = { water, waterY: WY, bottomY: BY, group, ripple, bottomAt: (x, z) => bottomY(rhoOf(x, z, WALL_RX, WALL_RZ)) };
    ctx.anchors.pond = new THREE.Vector3(CX, WY, CZ);
  },
});

// ---------------------------------------------------------------- parts/25-octopus.js
// ---- 橙蛸：住在池底的小章魚。圓滾滾的橘色身體、八條捲捲的短腳，慢慢推著一顆小石頭繞圈，偶爾吐泡泡 ----
PARTS.push({
  name: 'octopus',
  order: 25,
  build(ctx) {
    const { THREE, TSL, LAYOUT, PALETTE, EASE, clamp01, toon, glow, scene, camera } = ctx;
    const P = LAYOUT.pond;
    const BOTTOM = -0.55;          // 池底（池塘部件保證中間是平的）
    const WATER = P.waterY;        // 水面 -0.1
    const rnd = ctx.rand(2525);
    const TAU = Math.PI * 2;
    const V3 = THREE.Vector3;

    // ------------------------------------------------------------------
    //  尺寸（本地座標：腳底 y = 0，臉朝 +z）
    // ------------------------------------------------------------------
    const RH = 0.2;      // 身體水平半徑
    const RU = 0.185;    // 上半身高度
    const RD = 0.15;     // 下半身高度
    const BC = 0.19;     // 身體中心離地高度
    const MP = 0.1;      // 身體的轉軸（腳根附近），前傾、轉頭都繞這裡
    const SR = 0.12;     // 石頭半徑
    const PUSH_D = 0.35; // 章魚中心到石頭中心的距離（沿路徑）

    const root = new THREE.Group();
    root.name = 'octopus';
    scene.add(root);
    const fx = new THREE.Group();   // 泡泡、愛心、水紋、閃光：世界座標
    fx.name = 'octopus-fx';
    scene.add(fx);

    const { color, vec3, float, mix, smoothstep, normalize, positionLocal, normalView, positionViewDirection, dot, abs, max, uniform, vertexColor } = TSL;
    const lin = (hex) => new THREE.Color(hex);

    // ------------------------------------------------------------------
    //  身體：上大下小的蛋形，肚子淺色、背上幾顆淡淡的斑點
    // ------------------------------------------------------------------
    const bodyPoint = (d, out) => {
      const w = 1 - 0.16 * Math.pow(Math.max(0, -d.y), 1.6);
      return out.set(d.x * RH * w, d.y * (d.y >= 0 ? RU : RD), d.z * RH * w);
    };
    const bodyNormal = (p) => {
      const ry = p.y >= 0 ? RU : RD;
      return new V3(p.x / (RH * RH), p.y / (ry * ry), p.z / (RH * RH)).normalize();
    };
    const bodyGeo = new THREE.SphereGeometry(1, 48, 36);
    {
      const pos = bodyGeo.attributes.position, d = new V3(), o = new V3();
      for (let i = 0; i < pos.count; i++) {
        d.fromBufferAttribute(pos, i).normalize();
        bodyPoint(d, o);
        pos.setXYZ(i, o.x, o.y, o.z);
      }
      bodyGeo.computeVertexNormals();
    }
    const bodyMat = toon(PALETTE.octopus, { cache: false });
    const warmU = uniform(0.6);       // 自發光比例：在藍色夜光和水色下保持飽和的橘
    {
      const nL = normalize(positionLocal);
      const SPOTS = [[0.2, 0.75, -0.6, 0.16], [-0.45, 0.55, -0.7, 0.12], [0.62, 0.42, -0.35, 0.11], [-0.18, 0.93, -0.12, 0.1],
        [-0.72, 0.4, -0.2, 0.09], [0.35, 0.82, 0.3, 0.075], [0.05, 0.35, -0.95, 0.1]];
      let spot = float(0);
      for (const [x, y, z, r] of SPOTS) {
        const dv = new V3(x, y, z).normalize();
        const c = Math.cos(r);
        spot = max(spot, smoothstep(c - 0.012, c + 0.006, dot(nL, vec3(dv.x, dv.y, dv.z))));
      }
      const belly = smoothstep(0.18, 0.72, nL.y.negate());
      const col = mix(mix(color(0xff7a16), color(0xffaa4c), spot.mul(0.6)), color(0xffbb85), belly);
      bodyMat.colorNode = col;
      // 軟軟的高光（跟著鏡頭的方向），像一顆有光澤的軟糖玩具
      const gloss = smoothstep(0.8, 0.94, dot(normalView, normalize(vec3(-0.35, 0.62, 0.7)))).mul(0.32);
      bodyMat.emissiveNode = col.mul(warmU).add(vec3(1.0, 0.86, 0.72).mul(gloss));
    }

    const mantlePivot = new THREE.Group();     // 前傾、轉頭、鼓氣
    mantlePivot.position.y = MP;
    mantlePivot.rotation.order = 'YXZ';
    root.add(mantlePivot);
    const mantle = new THREE.Group();
    mantle.position.y = BC - MP;
    mantlePivot.add(mantle);
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    mantle.add(body);

    // 貼在身體表面的小零件：沿著表面法線擺
    const zAxis = new V3(0, 0, 1);
    const onSurface = (dir, lift = 0) => {
      const g = new THREE.Group();
      const p = bodyPoint(new V3(...dir).normalize(), new V3());
      const n = bodyNormal(p);
      g.position.copy(p).addScaledVector(n, lift);
      g.quaternion.setFromUnitVectors(zAxis, n);
      mantle.add(g);
      return g;
    };

    // ---- 眼睛：黑亮的豆豆眼 + 兩顆白色高光；開心時換成 ^ ^ ----
    const eyeMat = toon(0x1c1626);
    const hiMat = glow(0xffffff, 1.05);
    const eyeGeo = new THREE.SphereGeometry(1, 18, 14);
    const hiGeo = new THREE.SphereGeometry(1, 10, 8);
    const arcGeo = new THREE.TorusGeometry(0.023, 0.0068, 6, 16, Math.PI);
    const eyes = [];
    for (const sx of [-1, 1]) {
      const g = onSurface([0.36 * sx, 0.1, 0.93], -0.004);
      const bean = new THREE.Group();
      g.add(bean);
      const ball = new THREE.Mesh(eyeGeo, eyeMat);
      ball.scale.set(0.029, 0.04, 0.02);
      bean.add(ball);
      const h1 = new THREE.Mesh(hiGeo, hiMat);
      h1.scale.setScalar(0.0105);
      h1.position.set(0.009 * sx, 0.016, 0.016);
      const h2 = new THREE.Mesh(hiGeo, hiMat);
      h2.scale.setScalar(0.005);
      h2.position.set(-0.008 * sx, -0.013, 0.017);
      bean.add(h1, h2);
      const arc = new THREE.Mesh(arcGeo, eyeMat);   // ∩ 形的瞇眼
      arc.position.set(0, -0.008, 0.014);
      arc.scale.set(1, 0.9, 1.3);
      arc.visible = false;
      g.add(arc);
      eyes.push({ bean, arc });
    }

    // ---- 腮紅 ----
    const blushMat = toon(PALETTE.blush, { cache: false });
    const blushU = uniform(0.35);
    blushMat.emissiveNode = color(0xff7f95).mul(blushU);
    const blushGeo = new THREE.SphereGeometry(1, 16, 10);
    for (const sx of [-1, 1]) {
      const g = onSurface([0.66 * sx, -0.12, 0.74], -0.002);
      const b = new THREE.Mesh(blushGeo, blushMat);
      b.scale.set(0.034, 0.019, 0.007);
      g.add(b);
    }

    // ---- 嘴：嘟起來的小圓嘴（吹泡泡用）----
    const mouth = onSurface([0, -0.3, 0.95], -0.004);
    const mouthInner = new THREE.Group();
    mouth.add(mouthInner);
    const lip = new THREE.Mesh(new THREE.TorusGeometry(0.0165, 0.0085, 8, 18), toon(0xf26a2c));
    lip.position.z = 0.006;
    const hole = new THREE.Mesh(new THREE.CircleGeometry(0.0125, 16), toon(0x5a1f22));
    hole.position.z = 0.004;
    mouthInner.add(lip, hole);
    const mouthTip = new THREE.Object3D();      // 泡泡出生的位置
    mouthTip.position.z = 0.04;
    mouth.add(mouthTip);

    // ------------------------------------------------------------------
    //  腳：八條會捲起來的短腳（自己生成的漸細管子 + 吸盤），用 morph 做「捲緊」「伸直」
    // ------------------------------------------------------------------
    const LEG = { len: 0.31, th0: -1.0, r0: 0.06, tipK: 0.45, bow: 0.03, NS: 30, NR: 12, CAP: 5 };
    const legOrange = lin(0xff7a16), legBelly = lin(0xffa766), sucker = lin(0xffd2b0);
    function legData(curl) {
      const { len, th0, r0, tipK, NS, NR, CAP } = LEG;
      const s1 = 0.38, s2 = 0.55;
      const theta = (u) => th0 * (1 - EASE.smooth(clamp01(u / s1))) + curl * Math.pow(clamp01((u - s2) / (1 - s2)), 1.6);
      // 沿著弧長積分出中心線
      const SUB = 12, pts = [], ths = [];
      let x = 0, y = 0;
      pts.push(new V3(0, 0, 0)); ths.push(theta(0));
      for (let i = 1; i <= NS; i++) {
        for (let k = 0; k < SUB; k++) {
          const u = (i - 1 + (k + 0.5) / SUB) / NS, th = theta(u);
          x += Math.cos(th) * len / NS / SUB; y += Math.sin(th) * len / NS / SUB;
        }
        pts.push(new V3(x, y, LEG.bow * Math.sin(Math.PI * Math.pow(i / NS, 1.3)))); ths.push(theta(i / NS));   // 稍微往旁邊彎，從上面看像小風車
      }
      const rad = (u) => r0 * (1 - (1 - tipK) * Math.pow(u, 0.9));
      const pos = [], nor = [], col = [], idx = [];
      const B = new V3(0, 0, 1);
      const pushRing = (c, T, N, r, nT) => {   // nT：法線往切線方向偏（端點圓頭用）
        for (let j = 0; j < NR; j++) {
          const a = (j / NR) * TAU, ca = Math.cos(a), sa = Math.sin(a);
          const off = new V3().addScaledVector(N, ca).addScaledVector(B, sa);
          pos.push(c.x + off.x * r, c.y + off.y * r, c.z + off.z * r);
          const n = off.clone().multiplyScalar(Math.sqrt(1 - nT * nT)).addScaledVector(T, nT).normalize();
          nor.push(n.x, n.y, n.z);
          const f = EASE.smooth(clamp01((ca - 0.1) / 0.65));
          const cc = legOrange.clone().lerp(legBelly, f);
          col.push(cc.r, cc.g, cc.b);
        }
      };
      const frame = (i) => {
        const th = ths[i];
